<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaTeX 与论文排版</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none}.sidebar.open #nav{display:block}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:16px}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>LaTeX 与论文排版</h1>
    <div class="sub">从装环境到排出一份合规的竞赛论文</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div class="sub" id="progress-label">进度 0%</div>
    <input id="q" type="search" placeholder="搜索章节 / 概念 / 术语 / 全文…">
    <nav id="nav"></nav>
  </aside>
  <main class="main">
    <div class="topbar"><button id="theme-btn">🌙 深色</button></div>
    <div id="view" class="page"></div>
  </main>
</div>
<script>
const DATA = {"manifest": {"slug": "latex", "title": "LaTeX 与论文排版", "subtitle": "从装环境到排出一份合规的竞赛论文", "book": {"title": "LaTeX 入门", "author": "刘海洋", "source": ["LaTeX入门(刘海洋) .pdf"]}, "audience": "没接触过 LaTeX 的本科生", "goal": "能独立排版一份含公式、图表、文献的中文论文", "learningPath": [{"step": "01", "title": "跑通第一份 PDF", "chapterIds": ["ch01"], "checkpoint": "xelatex 编译成功，中文不乱码"}, {"step": "02", "title": "排中文版式", "chapterIds": ["ch02"], "checkpoint": "字号、边距、页眉三项都改过一次"}, {"step": "03", "title": "写公式", "chapterIds": ["ch03"], "checkpoint": "能用 align 与 cases 各排一段"}, {"step": "04", "title": "放图表", "chapterIds": ["ch04"], "checkpoint": "三线表与子图都能正确显示图注"}, {"step": "05", "title": "做引用与文献", "chapterIds": ["ch05"], "checkpoint": "文献编号出现，无 [?]"}, {"step": "06", "title": "套论文模板", "chapterIds": ["ch06"], "checkpoint": "四级编号 1.1.1.1 正确，摘要独立成页"}], "chapters": [{"id": "ch01", "title": "第 1 章：环境与第一次编译", "file": "chapters/ch01-setup.md", "difficulty": 1}, {"id": "ch02", "title": "第 2 章：中文文档与版式", "file": "chapters/ch02-chinese-layout.md", "difficulty": 2}, {"id": "ch03", "title": "第 3 章：数学公式", "file": "chapters/ch03-math-formulas.md", "difficulty": 2}, {"id": "ch04", "title": "第 4 章：图表与浮动体", "file": "chapters/ch04-figures-tables.md", "difficulty": 2}, {"id": "ch05", "title": "第 5 章：目录、交叉引用与参考文献", "file": "chapters/ch05-automation.md", "difficulty": 2}, {"id": "ch06", "title": "第 6 章：数模论文模板实战", "file": "chapters/ch06-paper-template.md", "difficulty": 2}], "concepts": [], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "glossary": [{"term": "TeX 发行版", "def": "把编译器、宏包、字体打包的整体，如 TeX Live", "chapterId": "ch01"}, {"term": "xelatex", "def": "原生支持 UTF-8 与系统字体的编译引擎，中文首选", "chapterId": "ch01"}, {"term": "ctex 文档类", "def": "专为中文设计的文档类，自动处理字体与间距", "chapterId": "ch01"}, {"term": "aux 文件", "def": "编译时记录标签与页码的中间文件，目录与引用靠它", "chapterId": "ch01"}, {"term": "zihao", "def": "ctex 的字号参数，-4 表示小四", "chapterId": "ch02"}, {"term": "secnumdepth", "def": "控制标题编号到第几级的计数器", "chapterId": "ch02"}, {"term": d": "q0202", "chapterId": "ch02", "type": "single", "question": "页眉重复出现两遍，最可能的原因是？", "options": ["没有 \\fancyhf{}", "没有加载 ctex", "编译次数不够", "字号设置错误"], "answer": 0, "explain": "默认页眉未清空，新设置叠加上去就会重复。"}, {"id": "q0203", "chapterId": "ch02", "type": "blank", "question": "要让「10」与「mm」不被断行分开，应写成 `10~mm`，其中 `~` 表示________空格。", "options": [], "answer": "不断行", "explain": "`~` 在 LaTeX 中是不断行空格，保证两个词始终在同一行。"}, {"id": "q0301", "chapterId": "ch03", "type": "single", "question": "需要多行对齐并统一编号，应使用？", "options": ["equation", "align", "\\[ \\]", "cases"], "answer": 1, "explain": "align 提供对齐点与逐行编号，equation 只适合单行公式。"}, {"id": "q0302", "chapterId": "ch03", "type": "single", "question": "文本中写「准确率 95%」正确的是？", "options": ["95%", "95\\%", "95$\\%$", "95 percent"], "answer": 1, "explain": "% 是注释符，必须转义为 \\%。"}, {"id": "q0303", "chapterId": "ch03", "type": "blank", "question": "分段函数用________环境，矩阵用 pmatrix 或 bmatrix。", "options": [], "answer": "cases", "explain": "cases 左侧一个大括号、右侧两列条件，是标准写法。"}, {"id": "q0401", "chapterId": "ch04", "type": "single", "question": "图注要显示在图下方，`\\caption` 应放在？", "options": ["`\\includegraphics` 之前", "`\\includegraphics` 之后", "`\\label` 之前", "figure 环境之外"], "answer": 1, "explain": "caption 的位置决定图注上下，放后面才在图下。"}, {"id": "q0402", "chapterId": "ch04", "type": "single", "question": "三线表需要加载哪个宏包？", "options": ["graphicx", "booktabs", "hyperref", "listings"], "answer": 1, "explain": "booktabs 提供 \\toprule、\\midrule、\\bottomrule。"}, {"id": "q0403", "chapterId": "ch04", "type": "blank", "question": "让图片按正文宽度八成显示，应写 `width=________\\linewidth`。", "options": [], "answer": "0.8", "explain": "用相对宽度而不是绝对厘米，换版式时不用逐张改。"}, {"id": "q0501", "chapterId": "ch05", "type": "single", "question": "`\\ref{fig:risk}` 输出的是什么？", "options": ["图的文件名", "图的编号", "图的标题", "图的页码"], "answer": 1, "explain": "ref 输出编号，页码用 pageref，标题不会被引用。"}, {"id": "q0502", "chapterId": "ch05", "type": "single", "question": "文献列表显示 `[?]`，最先检查？", "options": ["图片路径", "是否跑了 bibtex、cite key 是否匹配", "字号设置", "页边距"], "answer": 1, "explain": "`[?]` 表示引用键找不到对应条目，先查编译链与 key。"}, {"id": "q0503", "chapterId": "ch05", "type": "blank", "question": "国标顺序编码制的宏包是________。", "options": [], "answer": "gbt7714", "explain": "gbt7714 提供符合 GB/T 7714 的样式，配合 BibTeX 或 biblatex 使用。"}, {"id": "q0601", "chapterId": "ch06", "type": "single", "question": "要让四级标题带编号，除设置 number 外还必须？", "options": ["改 tocdepth", "把 secnumdepth 调到 4 以上", "加载 hyperref", "用 appendix"], "answer": 1, "explain": "编号深度由 secnumdepth 控制，默认只到 3 级。"}, {"id": "q0602", "chapterId": "ch06", "type": "single", "question": "摘要页后的正文要重新从第 1 页编号，应该？", "options": ["直接 \\setcounter{page}{1}", "用 \\pagenumbering{arabic} 重置", "改 fancyhdr", "重新编译"], "answer": 1, "explain": "pagenumbering 会重置页码计数器，setcounter 只改数值不重置样式。"}, {"id": "q0603", "chapterId": "ch06", "type": "blank", "question": "代码附录应使用________环境，配合 listings 宏包。", "options": [], "answer": "lstlisting", "explain": "lstlisting 支持语法高亮、行号、自动换行，是排代码的标准环境。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "中文文档该用哪个编译引擎？", "back": "xelatex，配合 ctexart / ctexrep / ctexbook 文档类", "tags": ["编译"]}, {"id": "f02", "chapterId": "ch01", "front": "为什么目录是空的？", "back": "只编译了一遍，aux 文件还没生成目录信息，至少跑两遍", "tags": ["编译", "排错"]}, {"id": "f03", "chapterId": "ch01", "front": "TeX Live 缺宏包怎么装？", "back": "`tlmgr install 包名`", "tags": ["编译", "环境"]}, {"id": "f04", "chapterId": "ch02", "front": "控制标题编号到第几级的是哪个计数器？", "back": "secnumdepth；目录深度是 tocdepth，两者分开设", "tags": ["版式", "编号"]}, {"id": "f05", "chapterId": "ch02", "front": "页眉重复两遍的原因？", "back": "没有先 `\\fancyhf{}` 清空默认设置", "tags": ["版式", "fancyhdr"]}, {"id": "f06", "chapterId": "ch02", "front": "中文与英文之间怎么加空隙？", "back": "手写 `\\ ` 或设 `\\xeCJKsetup{CJKspace=true}`", "tags": ["版式", "中文"]}, {"id": "f07", "chapterId": "ch03", "front": "行内公式与行间公式的写法？", "back": "行内 `$...$`；行间 `\\[...\\]`；带编号 `\\begin{equation}...\\end{equation}`", "tags": ["公式"]}, {"id": "f08", "chapterId": "ch03", "front": "多行对齐带编号用哪个环境？", "back": "align；不要编号用 align*", "tags": ["公式"]}, {"id": "f09", "chapterId": "ch03", "front": "分段函数用哪个环境？", "back": "cases", "tags": ["公式"]}, {"id": "f10", "chapterId": "ch03", "front": "文本里的百分号怎么打？", "back": "`\\%`，未转义会被当注释吞掉整行", "tags": ["公式", "排错"]}, {"id": "f11", "chapterId": "ch04", "front": "图注在图下、表注在表上，caption 分别放哪？", "back": "图注放 `\\includegraphics` 之后，表注放 `\\begin{tabular}` 之前", "tags": ["图表"]}, {"id": "f12", "chapterId": "ch04", "front": "三线表用哪个宏包？", "back": "booktabs，配 \\toprule \\midrule \\bottomrule", "tags": ["图表"]}, {"id": "f13", "chapterId": "ch04", "front": "浮动体位置参数 htbp 各表示什么？", "back": "here 此处、top 页顶、bottom 页底、page 单独一页", "tags": ["图表", "浮动体"]}, {"id": "f14", "chapterId": "ch04", "front": "label 应该放在 caption 前还是后？", "back": "之后，否则引用编号会指错", "tags": ["图表", "引用"]}, {"id": "f15", "chapterId": "ch05", "front": "文献显示 [?] 怎么排查？", "back": "先查是否跑了 bibtex、cite key 是否与 bib 完全一致", "tags": ["文献"]}, {"id": "f16", "chapterId": "ch05", "front": "国标参考文献样式用哪个宏包？", "back": "gbt7714", "tags": ["文献"]}, {"id": "f17", "chapterId": "ch05", "front": "带文献的完整编译链？", "back": "xelatex → bibtex → xelatex → xelatex", "tags": ["文献", "编译"]}, {"id": "f18", "chapterId": "ch06", "front": "四级标题 6.3.2.1 需要什么设置？", "back": "secnumdepth 设为 4 以上，并给 paragraph 配 number", "tags": ["编号"]}, {"id": "f19", "chapterId": "ch06", "front": "摘要页后正文重新从第 1 页编号？", "back": "`\\pagenumbering{arabic}` 重置页码计数器", "tags": ["模板"]}, {"id": "f20", "chapterId": "ch06", "front": "代码附录用什么环境？", "back": "lstlisting，配 listings 宏包", "tags": ["模板", "代码"]}], "companion": "latex学习伴侣.html"}, "pages": {"ch01": {"html": "<h1>第 1 章：环境与第一次编译<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：起步册第 4 章 | <strong>原书定位<\/strong>：第 1 章 p1–49\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n在本地或 Overleaf 上把一份中文文档编译成 PDF；\n<\/li><li>\n说清 xelatex、ctex、编译三遍各自解决什么问题；\n<\/li><li>\n看懂最常见的三类报错并自己修。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>LaTeX 不是排版软件，它是一套「你写源码、它排版面」的工具；第一次跑通比读十页介绍有用。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：发行版与编辑器（难度：基础）<\/h3>\n<p><strong>TeX 发行版<\/strong>：把编译器、宏包、字体打包在一起的整体。Windows 用 TeX Live 或 MiKTeX，macOS 用 MacTeX，Linux 用 TeX Live。<\/p>\n<p><strong>编辑器<\/strong>：写源码的工具，VS Code + LaTeX Workshop 最常用，TeXstudio 传统但功能全。<\/p>\n<p><strong>Overleaf<\/strong>：在线编辑器，免安装，中文支持已内置，适合比赛时多人协作——但免费版编译有时长限制。<\/p>\n<h3>概念 2：中文要考 xelatex（难度：基础）<\/h3>\n<p>老教程里的 pdflatex 加 CJK 宏包已经过时。现在中文文档的标准做法是：<\/p>\n<ul><li>\n编译器用 <code>xelatex<\/code>；\n<\/li><li>\n文档类用 <code>ctexart<\/code>（文章）、<code>ctexrep<\/code>（报告）、<code>ctexbook<\/code>（书）；\n<\/li><li>\n字体用系统字体，ctex 会自动调用。\n<\/ul>\n<h3>概念 3：最小可编译文档（难度：基础）<\/h3>\n<pre class=\"lang-latex\"><code>\\documentclass[UTF8,a4paper,12pt]{ctexart}\n\\usepackage{amsmath,amssymb}\n\\usepackage{graphicx}\n\\usepackage{geometry}\n\\geometry{margin=2.5cm}\n\n\\title{第一次编译}\n\\author{你的名字}\n\\date{\\today}\n\n\\begin{document}\n\\maketitle\n\\tableofcontents\n\n\\section{引言}\n这是一个最小的中文文档，公式：$E = mc^2$。\n\n\\end{document}<\/code><\/pre>\n<p>保存为 <code>main.tex<\/code>，命令行跑 <code>xelatex main.tex<\/code> 两到三遍，得到 <code>main.pdf<\/code>。<\/p>\n<h3>概念 4：为什么要编译两三遍（难度：进阶）<\/h3>\n<p>第一遍生成 <code>.aux<\/code> 文件记录标签与页码；第二遍读 <code>.aux<\/code> 把交叉引用和目录填进去；有参考文献时还要跑 BibTeX，再跑两遍。<\/p>\n<p>只用一遍，目录会空、引用会显示 <code>??<\/code>。这不是 bug，是机制。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[main.tex] --&gt; B[xelatex 第一遍]\n    B --&gt; C[生成 aux 记录标签]\n    C --&gt; D[xelatex 第二遍]\n    D --&gt; E[目录与引用填入]\n    E --&gt; F[main.pdf]\n    F --&gt;|有参考文献| G[bibtex 再跑两遍]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：箭头是单向的，但实际编译是循环：改一次源码，就要重跑整条链。VS Code 的 latexmk 会自动判断该跑几遍。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：LaTeX 像点菜，你写菜单，厨房按标准出菜；Word 像自己下厨，边炒边调味。失效边界：菜单写错一个字，整道菜可能出不来；Word 里改一个字最多是那一页变丑。\n<\/li><li>\n<strong>实例（可动手）<\/strong>：把上面例子里的 <code>ctexart<\/code> 改成 <code>article<\/code>，再用 xelatex 编译，中文会变成空白或方框。这说明中文支持来自文档类，不是来自编译器。改回来即可恢复。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为报错行号就是出错行——实际上 LaTeX 的报错常滞后几行，要看第一个 <code>!<\/code> 号的位置，往前找。\n<\/li><li>\n别以为缺宏包要手动装——实际上 TeX Live 缺包可用 <code>tlmgr install 包名<\/code>，Overleaf 换文档类或改用内置宏包更快。\n<\/li><li>\n别以为 PDF 出来就算成功——实际上要检查目录、引用、公式编号、图片位置四项。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】编译中文文档应使用哪个引擎？<\/h3>\n<ul><li>\nA. pdflatex\n<\/li><li>\nB. xelatex\n<\/li><li>\nC. latex\n<\/li><li>\nD. bibtex\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：xelatex 原生支持 UTF-8 与系统字体，配合 ctex 文档类处理中文最稳。<\/p>\n<\/ul>\n<h3>Q2 【单选】目录为空最可能的原因是？<\/h3>\n<ul><li>\nA. 没有写 \\tableofcontents\n<\/li><li>\nB. 只编译了一遍，aux 未生成\n<\/li><li>\nC. 文档类不支持目录\n<\/li><li>\nD. 缺少 hyperref\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：目录内容来自 aux 文件，需要至少两遍编译。<\/p>\n<\/ul>\n<h3>Q3 【填空】TeX Live 缺宏包时，安装命令是 <code>tlmgr ________ 包名<\/code>。<\/h3>\n<p><strong>答案<\/strong>：install <strong>解析<\/strong>：tlmgr 是 TeX Live 的包管理器，install 后重启编辑器即可识别。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n中文三件套：xelatex + ctex 文档类 + UTF-8。\n<\/li><li>\n编译至少两遍，有文献要加 bibtex。\n<\/li><li>\n报错看第一个 <code>!<\/code>，往前找几行。\n<\/ul>", "kind": "chapter", "title": "第 1 章：环境与第一次编译"}, "ch02": {"html": "<h1>第 2 章：中文文档与版式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1 章 | <strong>原书定位<\/strong>：第 2 章 p50–156\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用 geometry 改页边距，用 ctexset 改标题格式与缩进；\n<\/li><li>\n设置三级以上标题编号，并让编号出现在目录里；\n<\/li><li>\n排出一份三页以内、行距与字号都合规的中文文档。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>中文排版的所有调节都落在两处：文档类参数（管全局）和局部命令（管一处），改错了位置就是白改。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：页面与字号（难度：基础）<\/h3>\n<pre class=\"lang-latex\"><code>\\documentclass[UTF8,a4paper,zihao=-4]{ctexart}  % -4 号字，约 12pt\n\\usepackage{geometry}\n\\geometry{top=2.5cm,bottom=2.5cm,left=3cm,right=2.5cm}<\/code><\/pre>\n<p><code>zihao<\/code> 是 ctex 专有的字号参数，<code>-4<\/code> 表示小四。比赛论文常用小四正文、五号图表注。<\/p>\n<p>行距用 <code>\\linespread{1.3}<\/code> 放大到 1.3 倍。注意它必须在 <code>\\begin{document}<\/code> 之前生效。<\/p>\n<h3>概念 2：标题格式与编号深度（难度：进阶）<\/h3>\n<pre class=\"lang-latex\"><code>\\ctexset{\n  section = {format = \\Large\\bfseries\\centering},\n  subsection = {format = \\large\\bfseries},\n  subsubsection = {format = \\normalsize\\bfseries, number = \\arabic{subsubsection}}\n}\n\\setcounter{secnumdepth}{4}   % 编号到第四级\n\\setcounter{tocdepth}{3}      % 目录到第三级<\/code><\/pre>\n<p><code>secnumdepth<\/code> 决定编号到几级，<code>tocdepth<\/code> 决定目录显示到几级。两者要分开设，只设一个会出现「正文有编号、目录没有」或反过来。<\/p>\n<p>如果要求 <code>\\paragraph<\/code> 也带编号，需要 <code>\\setcounter{secnumdepth}{5}<\/code>，并给 paragraph 配 format。<\/p>\n<h3>概念 3：中英文混排（难度：基础）<\/h3>\n<ul><li>\n中文与英文之间，ctex 默认不加空格，需要手写 <code>中文\\ English<\/code> 或在导言区设 <code>\\xeCJKsetup{CJKspace=true}<\/code> 自动加空隙。\n<\/li><li>\n英文单词不要手动断行，LaTeX 自己会断。\n<\/li><li>\n数字与单位之间用不断行空格 <code>~<\/code>：<code>10~mm<\/code>，避免「10」在行末、「mm」在行首。\n<\/ul>\n<h3>概念 4：页眉页脚（难度：进阶）<\/h3>\n<pre class=\"lang-latex\"><code>\\usepackage{fancyhdr}\n\\pagestyle{fancy}\n\\fancyhf{}\n\\fancyhead[C]{数学建模论文}\n\\fancyfoot[C]{\\thepage}\n\\renewcommand{\\headrulewidth}{0.4pt}<\/code><\/pre>\n<p><code>\\fancyhf{}<\/code> 先清空默认设置，否则页眉会重复出现两遍。这是最常见的排版怪象来源。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[文档类参数] --&gt; B[字号 纸张]\n    A --&gt; C[标题格式]\n    D[局部命令] --&gt; E[某段落间距]\n    D --&gt; F[某个标题加星]\n    B --&gt; G[编译]\n    C --&gt; G\n    E --&gt; G\n    F --&gt; G\n    G --&gt; H[检查目录与页码]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边两条管全局，右边两条管局部。改全局参数会影响全文，改完必须重新检查每一页。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：文档类参数像房子的层高与墙厚，局部命令像某个房间贴的壁纸。失效边界：层高一改，所有房间的家具都要重摆，所以全局参数要一开始定好。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：A4 纸宽 21 cm，左右边距 3 cm 与 2.5 cm，正文宽 15.5 cm。小四字号约 12 pt，一行约 36 个汉字。若把左右边距都改成 2 cm，正文宽 17 cm，每行约 40 字，页数会减少约一成。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为改字号能直接改行距——实际上字号与行距是两套参数，需要分别设。\n<\/li><li>\n别以为 secnumdepth 改了目录就会跟着变——实际上目录深度由 tocdepth 控制。\n<\/li><li>\n别以为 fancyhdr 会自动清空默认页眉——实际上不清空就会出现双页眉。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】要让第四级标题也带编号，应设置？<\/h3>\n<ul><li>\nA. \\setcounter{tocdepth}{4}\n<\/li><li>\nB. \\setcounter{secnumdepth}{4}\n<\/li><li>\nC. \\linespread{1.3}\n<\/li><li>\nD. \\pagestyle{fancy}\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：secnumdepth 控制编号深度，tocdepth 只控制目录显示。<\/p>\n<\/ul>\n<h3>Q2 【单选】页眉重复出现两遍，最可能的原因是？<\/h3>\n<ul><li>\nA. 没有 \\fancyhf{}\n<\/li><li>\nB. 没有加载 ctex\n<\/li><li>\nC. 编译次数不够\n<\/li><li>\nD. 字号设置错误\n<p><strong>答案<\/strong>：A <strong>解析<\/strong>：默认页眉未清空，新设置叠加上去就会重复。<\/p>\n<\/ul>\n<h3>Q3 【填空】要让「10」与「mm」不被断行分开，应写成 <code>10~mm<\/code>，其中 <code>~<\/code> 表示________空格。<\/h3>\n<p><strong>答案<\/strong>：不断行 <strong>解析<\/strong>：<code>~<\/code> 在 LaTeX 中是不断行空格，保证两个词始终在同一行。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n全局参数在导言区定，局部调整用命令。\n<\/li><li>\n编号深度与目录深度是两个开关。\n<\/li><li>\nfancyhdr 先清空再设置。\n<\/ul>", "kind": "chapter", "title": "第 2 章：中文文档与版式"}, "ch03": {"html": "<h1>第 3 章：数学公式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 2 章 | <strong>原书定位<\/strong>：第 4 章 p221–300\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n正确区分行内公式与行间公式，并按需编号；\n<\/li><li>\n用 align 排多行推导，用 cases 排分段函数，用 matrix 排矩阵；\n<\/li><li>\n修掉公式里最常见的四类报错。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>公式排版只有两个决定：放不放进独立行，给不给编号；其余都是符号命令的查表工作。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：两种模式（难度：基础）<\/h3>\n<ul><li>\n行内：<code>$E=mc^2$<\/code>，跟文字一起走，不编号。\n<\/li><li>\n行间：<code>\\[ E=mc^2 \\]<\/code>，单独成行，不编号。\n<\/li><li>\n行间带编号：<code>\\begin{equation} ... \\end{equation}<\/code>，自动编号，可用 <code>\\label<\/code> 引用。\n<\/ul>\n<p>经验规则：短式子、句中提到用行内；需要推导、需要被引用用行间带编号。<\/p>\n<h3>概念 2：多行推导（难度：进阶）<\/h3>\n<pre class=\"lang-latex\"><code>\\begin{align}\n  z &amp;= 4x_1 + 3x_2 \\label{eq:obj}\\\\\n  \\text{s.t.}\\quad &amp; 2x_1 + x_2 \\le 10 \\\\\n  &amp; x_1 + x_2 \\le 8\n\\end{align}<\/code><\/pre>\n<p><code>&amp;<\/code> 是对齐点，<code>\\\\<\/code> 换行。每个 <code>&amp;<\/code> 都要成对出现，只写一个会导致「Misplaced alignment tab」报错。<\/p>\n<p>不需要编号时用 <code>align*<\/code>。只想给某一行编号，用 <code>\\notag<\/code> 把其余行去掉编号。<\/p>\n<h3>概念 3：常见结构（难度：进阶）<\/h3>\n<p>分段函数：<\/p>\n<pre class=\"lang-latex\"><code>f(x) = \\begin{cases}\n  x^2, &amp; x \\ge 0,\\\\\n  -x,  &amp; x &lt; 0.\n\\end{cases}<\/code><\/pre>\n<p>矩阵：<\/p>\n<pre class=\"lang-latex\"><code>A = \\begin{pmatrix}\n  2 &amp; 1 \\\\\n  1 &amp; 1\n\\end{pmatrix}, \\quad\nb = \\begin{pmatrix} 10 \\\\ 8 \\end{pmatrix}<\/code><\/pre>\n<p><code>pmatrix<\/code> 用圆括号，<code>bmatrix<\/code> 用方括号，<code>vmatrix<\/code> 用竖线表示行列式。<\/p>\n<h3>概念 4：四类高频报错（难度：基础）<\/h3>\n<ol><li>\n<strong><code>&amp;<\/code> 位置错<\/strong>：在 equation 环境里用 <code>&amp;<\/code> 会报错，应该用 align。\n<\/li><li>\n<strong>下划线未转义<\/strong>：文本里的 <code>file_name<\/code> 要写成 <code>file\\_name<\/code>，公式里才用 <code>_<\/code> 表示下标。\n<\/li><li>\n<strong><code>%<\/code> 未转义<\/strong>：文本里的百分号写成 <code>\\%<\/code>，否则后面整行被当注释吞掉。\n<\/li><li>\n<strong>缺 <code>$<\/code><\/strong>：行间公式用了 <code>\\[<\/code> 却没写 <code>\\]<\/code>，后面全部内容被当成公式。\n<\/ol>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[要排的式子] --&gt; B{是否独立成行}\n    B --&gt;|否| C[行内 $...$]\n    B --&gt;|是| D{是否要编号或引用}\n    D --&gt;|否| E[方括号 或 align*]\n    D --&gt;|是| F[equation 或 align]\n    F --&gt; G[加 label 供 ref 引用]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：两个判断决定环境选择。选错环境，编号或对齐就会出问题。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：行内公式像句中的括号补充，行间公式像单独列出的算式。失效边界：太长的式子塞进行内，会把行距撑开、版面变丑，这时必须改成行间。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：把 KKT 条件排成对齐形式：\n<\/ul>\n<pre class=\"lang-latex\"><code>\\begin{align}\n  \\nabla f + \\sum_{i=1}^{m}\\lambda_i \\nabla g_i &amp;= 0,\\\\\n  \\lambda_i g_i &amp;= 0,\\\\\n  \\lambda_i &amp;\\ge 0.\n\\end{align}<\/code><\/pre>\n<p>三行共用一组编号，对齐点在等号前，这是论文里推导的标准写法。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为公式里的空格会影响排版——实际上数学模式忽略空格，间距由符号类别决定，要手动调就用 <code>\\,<\/code>、<code>\\quad<\/code>。\n<\/li><li>\n别以为 <code>\\text{}<\/code> 可以随便用——实际上它需要 amsmath，且中文要放在 <code>\\text{中文}<\/code> 里配合 ctex 才正常。\n<\/li><li>\n别以为编号会自动更新——实际上编号依赖 aux，改完要重编译两遍。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】需要多行对齐并统一编号，应使用？<\/h3>\n<ul><li>\nA. equation\n<\/li><li>\nB. align\n<\/li><li>\nC. \\[ \\]\n<\/li><li>\nD. cases\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：align 提供对齐点与逐行编号，equation 只适合单行公式。<\/p>\n<\/ul>\n<h3>Q2 【单选】文本中写「准确率 95%」正确的是？<\/h3>\n<ul><li>\nA. 95%\n<\/li><li>\nB. 95\\%\n<\/li><li>\nC. 95$\\%$\n<\/li><li>\nD. 95 percent\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：% 是注释符，必须转义为 \\%。<\/p>\n<\/ul>\n<h3>Q3 【填空】分段函数用________环境，矩阵用 pmatrix 或 bmatrix。<\/h3>\n<p><strong>答案<\/strong>：cases <strong>解析<\/strong>：cases 左侧一个大括号、右侧两列条件，是标准写法。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n行内不编号，行间按需编号，引用要配 label。\n<\/li><li>\n对齐点 <code>&amp;<\/code> 必须成对，换行用 <code>\\\\<\/code>。\n<\/li><li>\n% _ # &amp; 在文本里都要转义。\n<\/ul>", "kind": "chapter", "title": "第 3 章：数学公式"}, "ch04": {"html": "<h1>第 4 章：图表与浮动体<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 2 章 | <strong>原书定位<\/strong>：第 5 章插图、第 6 章表格\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n插入一张宽度合适、图注在图下的图片；\n<\/li><li>\n用 booktabs 排出规范三线表，并解决列宽溢出；\n<\/li><li>\n说清 figure 为什么「跑到下一页」，以及怎么控制。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>图表不是插进去就完事，位置、宽度、图注、正文引用四件事都要交代，缺一件评委会扣格式分。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：插图（难度：基础）<\/h3>\n<pre class=\"lang-latex\"><code>\\usepackage{graphicx}\n\\begin{figure}[htbp]\n  \\centering\n  \\includegraphics[width=0.8\\linewidth]{figs/result.png}\n  \\caption{不同风险水平下的收益曲线}\n  \\label{fig:risk}\n\\end{figure}<\/code><\/pre>\n<ul><li>\n<code>[htbp]<\/code> 是位置偏好：这里、页顶、页底、单独一页。LaTeX 会就近安排，不保证。\n<\/li><li>\n<code>width=0.8\\linewidth<\/code> 按正文宽度比例缩放，比写死厘米更稳。\n<\/li><li>\n<code>\\caption<\/code> 放 <code>\\includegraphics<\/code> 之后，图注才会在图下方。\n<\/li><li>\n<code>\\label<\/code> 放 caption 之后，否则引用会指向错误的编号。\n<\/ul>\n<h3>概念 2：浮动体为什么乱跑（难度：进阶）<\/h3>\n<p>LaTeX 把 figure 当作浮动体，按版面规则排队。图太多、太大、太靠近页底，就会被推到下一页甚至文末。<\/p>\n<p>三个应对：<\/p>\n<ol><li>\n加 <code>[htbp]<\/code> 给更多选择；\n<\/li><li>\n用 <code>\\usepackage{float}<\/code> 加 <code>[H]<\/code> 强制在此处；\n<\/li><li>\n调整图片宽度，别让一张图高过一页的 70%。\n<\/ol>\n<p><code>[H]<\/code> 的代价是可能留下大片空白，正式投稿不推荐，课设可以用。<\/p>\n<h3>概念 3：三线表（难度：基础）<\/h3>\n<pre class=\"lang-latex\"><code>\\usepackage{booktabs}\n\\begin{table}[htbp]\n  \\centering\n  \\caption{三种方案的评价结果}\n  \\label{tab:score}\n  \\begin{tabular}{lccc}\n    \\toprule\n    方案 &amp; 成本 &amp; 质量 &amp; 综合得分 \\\\\n    \\midrule\n    S1 &amp; 0.90 &amp; 0.50 &amp; 0.685 \\\\\n    S2 &amp; 0.70 &amp; 0.80 &amp; 0.685 \\\\\n    S3 &amp; 0.60 &amp; 0.90 &amp; 0.730 \\\\\n    \\bottomrule\n  \\end{tabular}\n\\end{table}<\/code><\/pre>\n<p>三线表只有顶线、表头线、底线，没有竖线。<code>lccc<\/code> 是列对齐：左对齐一列、居中三列。表格过宽时用 <code>tabularx<\/code> 的 <code>X<\/code> 列自动换行。<\/p>\n<h3>概念 4：子图（难度：进阶）<\/h3>\n<pre class=\"lang-latex\"><code>\\usepackage{subcaption}\n\\begin{figure}[htbp]\n  \\centering\n  \\begin{subfigure}{0.45\\linewidth}\n    \\includegraphics[width=\\linewidth]{a.png}\n    \\caption{去噪前}\n  \\end{subfigure}\\hfill\n  \\begin{subfigure}{0.45\\linewidth}\n    \\includegraphics[width=\\linewidth]{b.png}\n    \\caption{去噪后}\n  \\end{subfigure}\n  \\caption{均值滤波效果对比}\n\\end{figure}<\/code><\/pre>\n<p>子图编号变成 (a)、(b)，正文用 <code>\\ref{fig:...}<\/code> 引用总编号。两张图之间用 <code>\\hfill<\/code> 撑开，别用空格硬凑。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[图片文件] --&gt; B[设宽度]\n    B --&gt; C[放进 figure]\n    C --&gt; D[caption 在图下]\n    D --&gt; E[label 加引用]\n    E --&gt; F{位置不对}\n    F --&gt;|是| G[加 htbp 或 H]\n    F --&gt;|否| H[编译检查]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：顺序不能乱，label 一定要在 caption 之后，否则引用编号会错位。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：浮动体像排队的乘客，LaTeX 是调度员，它按规则安排你上哪班车，不是你说了算。失效边界：调度员可以被 <code>[H]<\/code> 强行插队，但后果是车厢留空。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：正文宽 15.5 cm，一张 3000×2000 像素的图，按 0.8 倍正文宽插入，显示宽度 12.4 cm、高度 8.27 cm。若按原尺寸插入，宽度 3000 px 直接溢出页面，这是「图跑到页面外」最常见的原因。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为写了 <code>[h]<\/code> 就一定在原位——实际上空间不够时 LaTeX 会忽略。\n<\/li><li>\n别以为表格竖线越多越清楚——实际上三线表最易读，竖线是排版陋习。\n<\/li><li>\n别以为图片放进同目录就能显示——实际上路径要相对主文件，子目录要写 <code>figs/a.png<\/code>。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】图注要显示在图下方，<code>\\caption<\/code> 应放在？<\/h3>\n<ul><li>\nA. <code>\\includegraphics<\/code> 之前\n<\/li><li>\nB. <code>\\includegraphics<\/code> 之后\n<\/li><li>\nC. <code>\\label<\/code> 之前\n<\/li><li>\nD. figure 环境之外\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：caption 的位置决定图注上下，放后面才在图下。<\/p>\n<\/ul>\n<h3>Q2 【单选】三线表需要加载哪个宏包？<\/h3>\n<ul><li>\nA. graphicx\n<\/li><li>\nB. booktabs\n<\/li><li>\nC. hyperref\n<\/li><li>\nD. listings\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：booktabs 提供 \\toprule、\\midrule、\\bottomrule。<\/p>\n<\/ul>\n<h3>Q3 【填空】让图片按正文宽度八成显示，应写 <code>width=________\\linewidth<\/code>。<\/h3>\n<p><strong>答案<\/strong>：0.8 <strong>解析<\/strong>：用相对宽度而不是绝对厘米，换版式时不用逐张改。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n图注在图下、表注在表上，label 紧跟 caption。\n<\/li><li>\n宽度用相对值，别超一页七成。\n<\/li><li>\n表格用三线表，宽了换 tabularx。\n<\/ul>", "kind": "chapter", "title": "第 4 章：图表与浮动体"}, "ch05": {"html": "<h1>第 5 章：目录、交叉引用与参考文献<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 3、4 章 | <strong>原书定位<\/strong>：第 3 章 p157–219\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n让目录、图表目录、公式编号全部自动生成；\n<\/li><li>\n用 label/ref 管理交叉引用，改章节顺序不用手动改编号；\n<\/li><li>\n用 BibTeX 或 biblatex 生成符合国标的参考文献。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>自动化的意义只有一个：内容改了，编号自己跟着变；手写的编号迟早会错。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：目录与图表目录（难度：基础）<\/h3>\n<pre class=\"lang-latex\"><code>\\tableofcontents\n\\listoffigures\n\\listoftables<\/code><\/pre>\n<p>三者都读 aux 文件，所以要编译两遍。只想让某级标题进目录，用 <code>\\section*{}<\/code> 加 <code>\\addcontentsline<\/code>，或用 <code>\\setcounter{tocdepth}{2}<\/code>。<\/p>\n<h3>概念 2：交叉引用（难度：基础）<\/h3>\n<pre class=\"lang-latex\"><code>\\section{模型建立}\\label{sec:model}\n如图~\\ref{fig:risk} 所示，第~\\ref{sec:model} 节给出了目标函数。<\/code><\/pre>\n<ul><li>\n<code>\\ref<\/code> 给编号，<code>\\pageref<\/code> 给页码，<code>\\eqref<\/code> 给带括号的公式编号。\n<\/li><li>\nlabel 命名建议带前缀：<code>sec:<\/code>、<code>fig:<\/code>、<code>tab:<\/code>、<code>eq:<\/code>，方便搜索。\n<\/li><li>\n引用前加 <code>~<\/code> 防止「图」和编号被断到两行。\n<\/ul>\n<h3>概念 3：参考文献（难度：进阶）<\/h3>\n<p>传统做法用 BibTeX：<\/p>\n<pre class=\"lang-latex\"><code>\\usepackage[numbers]{gbt7714}   % 国标顺序编码制\n\\bibliographystyle{gbt7714-numerical}\n\\bibliography{refs}<\/code><\/pre>\n<p><code>refs.bib<\/code> 里每条记录：<\/p>\n<pre class=\"lang-bibtex\"><code>@article{si2020,\n  author  = {司守奎 and 孙玺菁},\n  title   = {数学建模算法与应用},\n  journal = {国防工业出版社},\n  year    = {2020},\n  pages   = {1--17}\n}<\/code><\/pre>\n<p>正文用 <code>\\cite{si2020}<\/code> 引用，编译链变成：xelatex → bibtex → xelatex → xelatex。<\/p>\n<p>用 biblatex 的话加载 <code>\\usepackage[backend=biber,style=numeric]{biblatex}<\/code>，编译用 biber。<\/p>\n<h3>概念 4：引用不出现的排查（难度：进阶）<\/h3>\n<p>按顺序查四件事：<\/p>\n<ol><li>\n<code>.bib<\/code> 文件路径对不对；\n<\/li><li>\n<code>\\cite<\/code> 的 key 与 bib 里是否完全一致（大小写敏感）；\n<\/li><li>\n有没有跑 bibtex（只跑 xelatex 不会生成文献列表）；\n<\/li><li>\n<code>.bbl<\/code> 文件是否生成，报错日志里搜 <code>I couldn&#x27;t open database<\/code>。\n<\/ol>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[xelatex] --&gt; B[aux 记录引用键]\n    B --&gt; C[bibtex 读 bib 生成 bbl]\n    C --&gt; D[xelatex 读 bbl]\n    D --&gt; E[xelatex 定页码]\n    E --&gt; F[PDF 带文献]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：四步是一条链，少一步文献就显示 <code>[?]<\/code>。latexmk 会自动跑完整条链，所以推荐用它。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：交叉引用像 Excel 的单元格引用，改一处全表更新；手写编号像手抄公式，改一次要抄十处。失效边界：Excel 引用错了会报 <code>#REF!<\/code>，LaTeX 引用错了只显示 <code>??<\/code>，不一定会提醒你。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：论文有 6 章、18 图、9 表，手写编号在插入一章后需要改 30 多处；用 label/ref 只需重编译两遍。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 <code>\\ref<\/code> 会自动带「图」字——实际上只输出编号，前缀要自己写。\n<\/li><li>\n别以为 bib 里的条目顺序影响输出——实际上顺序由样式决定，与文件顺序无关。\n<\/li><li>\n别以为中文文献不用管格式——实际上国标要求作者、题名、文献类型标识齐全，gbt7714 样式帮你补齐。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】<code>\\ref{fig:risk}<\/code> 输出的是什么？<\/h3>\n<ul><li>\nA. 图的文件名\n<\/li><li>\nB. 图的编号\n<\/li><li>\nC. 图的标题\n<\/li><li>\nD. 图的页码\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：ref 输出编号，页码用 pageref，标题不会被引用。<\/p>\n<\/ul>\n<h3>Q2 【单选】文献列表显示 <code>[?]<\/code>，最先检查？<\/h3>\n<ul><li>\nA. 图片路径\n<\/li><li>\nB. 是否跑了 bibtex、cite key 是否匹配\n<\/li><li>\nC. 字号设置\n<\/li><li>\nD. 页边距\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：<code>[?]<\/code> 表示引用键找不到对应条目，先查编译链与 key。<\/p>\n<\/ul>\n<h3>Q3 【填空】国标顺序编码制的宏包是________。<\/h3>\n<p><strong>答案<\/strong>：gbt7714 <strong>解析<\/strong>：gbt7714 提供符合 GB/T 7714 的样式，配合 BibTeX 或 biblatex 使用。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n目录、图表目录都靠 aux，编译至少两遍。\n<\/li><li>\nlabel 带前缀，ref 前加 <code>~<\/code>。\n<\/li><li>\n文献链：xelatex → bibtex → xelatex → xelatex。\n<\/ul>", "kind": "chapter", "title": "第 5 章：目录、交叉引用与参考文献"}, "ch06": {"html": "<h1>第 6 章：数模论文模板实战<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1–5 章 | <strong>原书定位<\/strong>：综合第 2–6 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用一份导言区搭出可直接写正文的论文骨架；\n<\/li><li>\n排出三层以上、编号连续的标题体系，并把「：」后的分论点也编号；\n<\/li><li>\n用 listings 排代码附录，交卷前按清单查出格式硬伤。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>模板的价值不在好看，在于它把「格式」这件事一次性定死，让你后面只操心内容。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：可直接复制的导言区（难度：基础）<\/h3>\n<pre class=\"lang-latex\"><code>\\documentclass[UTF8,a4paper,zihao=-4]{ctexart}\n\\usepackage{amsmath,amssymb,amsthm}\n\\usepackage{graphicx,booktabs,tabularx}\n\\usepackage{geometry}\n\\geometry{top=2.5cm,bottom=2.5cm,left=3cm,right=2.5cm}\n\\usepackage{fancyhdr}\n\\usepackage{caption}\n\\captionsetup{font=small,labelsep=quad}\n\\usepackage[numbers]{gbt7714}\n\\usepackage{listings}\n\\usepackage[hidelinks]{hyperref}\n\n\\linespread{1.3}\n\\setcounter{secnumdepth}{4}\n\\setcounter{tocdepth}{3}\n\n\\pagestyle{fancy}\n\\fancyhf{}\n\\fancyhead[C]{2026 年全国大学生数学建模竞赛}\n\\fancyfoot[C]{\\thepage}\n\\renewcommand{\\headrulewidth}{0.4pt}\n\n\\newtheorem{definition}{定义}[section]\n\\newtheorem{theorem}{定理}[section]\n\n\\lstset{\n  basicstyle=\\ttfamily\\small,\n  numbers=left,\n  numberstyle=\\tiny,\n  frame=single,\n  breaklines=true,\n  showstringspaces=false\n}<\/code><\/pre>\n<p>这段直接贴到新建的 <code>main.tex<\/code> 里，下面接 <code>\\begin{document}<\/code> 就能写。<\/p>\n<h3>概念 2：标题编号体系（难度：进阶）<\/h3>\n<p>竞赛论文常见要求：一级标题用「一、二、三」，二级用「3.1」，三级用「3.1.2」，四级用「6.3.2.1」。<\/p>\n<pre class=\"lang-latex\"><code>\\ctexset{\n  section = {\n    name = {,、},\n    number = \\chinese{section},\n    format = \\Large\\bfseries\n  },\n  subsection = {number = \\arabic{section}.\\arabic{subsection}},\n  subsubsection = {number = \\arabic{section}.\\arabic{subsection}.\\arabic{subsubsection}}\n}<\/code><\/pre>\n<p>要更深的层级（如 6.3.2.1），必须把 <code>secnumdepth<\/code> 设为 4 或 5，否则 <code>\\paragraph<\/code> 只有标题没有编号。<\/p>\n<p>正文里「：」后面跟的分论点也要编号时，别用无序列表，直接排成带编号的段落：<\/p>\n<pre class=\"lang-latex\"><code>\\noindent （1）模型假设：\\\\\n\\indent （1.1）原材料价格在三个月内不变；\\\\\n\\indent （1.2）机器每天最多运行 8 小时。<\/code><\/pre>\n<p>或者定义一个计数器命令，避免手写编号错乱：<\/p>\n<pre class=\"lang-latex\"><code>\\newcounter{subpoint}[subsection]\n\\newcommand{\\pt}[1]{\\stepcounter{subpoint}\\noindent（\\thesubsection.\\thesubpoint）~#1\\par}<\/code><\/pre>\n<h3>概念 3：摘要页（难度：基础）<\/h3>\n<pre class=\"lang-latex\"><code>\\begin{center}\n  {\\LARGE\\bfseries 基于线性规划与灵敏度分析的机床生产优化}\\\\[6pt]\n  {\\large 摘\\quad 要}\n\\end{center}\n\\vspace{6pt}\n本文针对……建立……模型，求得最优方案为……，日利润 2.6 万元。\n第三问用 Monte Carlo 模拟 10 万次，得期望利润 2.41 万元，90\\% 置信区间 [2.05, 2.77]。\n\\vspace{6pt}\\par\\noindent\\textbf{关键词：}线性规划；灵敏度分析；Monte Carlo\n\\newpage<\/code><\/pre>\n<p>摘要独立一页，不编页码或用罗马数字，正文从第一页重新编号。<\/p>\n<h3>概念 4：代码附录（难度：基础）<\/h3>\n<pre class=\"lang-latex\"><code>\\appendix\n\\section{程序代码}\n\\begin{lstlisting}[language=Python]\nimport numpy as np\nfrom scipy.optimize import linprog\nres = linprog([-4, -3], A_ub=[[2, 1], [1, 1], [0, 1]],\n              b_ub=[10, 8, 7], bounds=[(0, None), (0, None)],\n              method=&quot;highs&quot;)\nprint(res.x, -res.fun)\n\\end{lstlisting}<\/code><\/pre>\n<p>中文注释在 listings 里可能乱码，需要设 <code>extendedchars=true<\/code> 或改用 <code>\\lstinputlisting<\/code> 读外部文件。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[导言区定格式] --&gt; B[标题与摘要页]\n    B --&gt; C[正文分章]\n    C --&gt; D[公式图表编号]\n    D --&gt; E[交叉引用与文献]\n    E --&gt; F[代码附录]\n    F --&gt; G[编译三遍]\n    G --&gt; H[提交前清单]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：格式在第一步定死，后面每一步都依赖它。中途改导言区，整篇的编号与分页都要重查。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：模板像盖房子的图纸，先定层高与承重，后面砌墙才有依据。失效边界：图纸能改，但改完要重新验收；模板改字号，全文页数会变，摘要可能挤到第二页。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：正文小四、1.3 倍行距，A4 纸每页约 32 行、每行 36 字，一页约 1150 字。20 页正文约 2.3 万字，加图表与公式实际约 1.8 万字。字数估算能帮你判断内容够不够。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为套模板就能拿格式分——实际上模板只保证不扣分，图表规范、编号连续仍要自己查。\n<\/li><li>\n别以为改字号只影响美观——实际上它改变每页容量，进而影响页数与摘要位置。\n<\/li><li>\n别以为代码附录可以随便截——实际上变量名要与正文一致，否则评委会怀疑结果来源。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】要让四级标题带编号，除设置 number 外还必须？<\/h3>\n<ul><li>\nA. 改 tocdepth\n<\/li><li>\nB. 把 secnumdepth 调到 4 以上\n<\/li><li>\nC. 加载 hyperref\n<\/li><li>\nD. 用 appendix\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：编号深度由 secnumdepth 控制，默认只到 3 级。<\/p>\n<\/ul>\n<h3>Q2 【单选】摘要页后的正文要重新从第 1 页编号，应该？<\/h3>\n<ul><li>\nA. 直接 \\setcounter{page}{1}\n<\/li><li>\nB. 用 \\pagenumbering{arabic} 重置\n<\/li><li>\nC. 改 fancyhdr\n<\/li><li>\nD. 重新编译\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：pagenumbering 会重置页码计数器，setcounter 只改数值不重置样式。<\/p>\n<\/ul>\n<h3>Q3 【填空】代码附录应使用________环境，配合 listings 宏包。<\/h3>\n<p><strong>答案<\/strong>：lstlisting <strong>解析<\/strong>：lstlisting 支持语法高亮、行号、自动换行，是排代码的标准环境。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n导言区一次性定死字号、边距、编号深度。\n<\/li><li>\n「一、」与「3.1.2」混排靠 ctexset 的 number 参数。\n<\/li><li>\n交卷前查：编号连续、图表有注、文献不缺、PDF 无溢出。\n<\/ul>", "kind": "chapter", "title": "第 6 章：数模论文模板实战"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：跑通第一份 PDF<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：环境与第一次编译<\/a><br>检查点：xelatex 编译成功，中文不乱码<\/li><li class='path-step' id='path-02'><strong>步骤 02：排中文版式<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：中文文档与版式<\/a><br>检查点：字号、边距、页眉三项都改过一次<\/li><li class='path-step' id='path-03'><strong>步骤 03：写公式<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：数学公式<\/a><br>检查点：能用 align 与 cases 各排一段<\/li><li class='path-step' id='path-04'><strong>步骤 04：放图表<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：图表与浮动体<\/a><br>检查点：三线表与子图都能正确显示图注<\/li><li class='path-step' id='path-05'><strong>步骤 05：做引用与文献<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：目录、交叉引用与参考文献<\/a><br>检查点：文献编号出现，无 [?]<\/li><li class='path-step' id='path-06'><strong>步骤 06：套论文模板<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：数模论文模板实战<\/a><br>检查点：四级编号 1.1.1.1 正确，摘要独立成页<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：环境与第一次编译<\/h1><div class='quiz-item' data-qid='q0101' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 编译中文文档应使用哪个引擎？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0101' value='0'> pdflatex<\/label><label class='quiz-opt'><input type='radio' name='q0101' value='1'> xelatex<\/label><label class='quiz-opt'><input type='radio' name='q0101' value='2'> latex<\/label><label class='quiz-opt'><input type='radio' name='q0101' value='3'> bibtex<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0102' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 目录为空最可能的原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0102' value='0'> 没有写 \\tableofcontents<\/label><label class='quiz-opt'><input type='radio' name='q0102' value='1'> 只编译了一遍，aux 未生成<\/label><label class='quiz-opt'><input type='radio' name='q0102' value='2'> 文档类不支持目录<\/label><label class='quiz-opt'><input type='radio' name='q0102' value='3'> 缺少 hyperref<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0103' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> TeX Live 缺宏包时，安装命令是 <code>tlmgr ________ 包名<\/code>。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：中文文档与版式<\/h1><div class='quiz-item' data-qid='q0201' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 要让第四级标题也带编号，应设置？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0201' value='0'> \\setcounter{tocdepth}{4}<\/label><label class='quiz-opt'><input type='radio' name='q0201' value='1'> \\setcounter{secnumdepth}{4}<\/label><label class='quiz-opt'><input type='radio' name='q0201' value='2'> \\linespread{1.3}<\/label><label class='quiz-opt'><input type='radio' name='q0201' value='3'> \\pagestyle{fancy}<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0202' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 页眉重复出现两遍，最可能的原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0202' value='0'> 没有 \\fancyhf{}<\/label><label class='quiz-opt'><input type='radio' name='q0202' value='1'> 没有加载 ctex<\/label><label class='quiz-opt'><input type='radio' name='q0202' value='2'> 编译次数不够<\/label><label class='quiz-opt'><input type='radio' name='q0202' value='3'> 字号设置错误<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0203' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 要让「10」与「mm」不被断行分开，应写成 <code>10~mm<\/code>，其中 <code>~<\/code> 表示________空格。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：数学公式<\/h1><div class='quiz-item' data-qid='q0301' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 需要多行对齐并统一编号，应使用？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0301' value='0'> equation<\/label><label class='quiz-opt'><input type='radio' name='q0301' value='1'> align<\/label><label class='quiz-opt'><input type='radio' name='q0301' value='2'> \\[ \\]<\/label><label class='quiz-opt'><input type='radio' name='q0301' value='3'> cases<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0302' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 文本中写「准确率 95%」正确的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0302' value='0'> 95%<\/label><label class='quiz-opt'><input type='radio' name='q0302' value='1'> 95\\%<\/label><label class='quiz-opt'><input type='radio' name='q0302' value='2'> 95$\\%$<\/label><label class='quiz-opt'><input type='radio' name='q0302' value='3'> 95 percent<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0303' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 分段函数用________环境，矩阵用 pmatrix 或 bmatrix。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 4 章：图表与浮动体<\/h1><div class='quiz-item' data-qid='q0401' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 图注要显示在图下方，<code>\\caption<\/code> 应放在？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0401' value='0'> <code>\\includegraphics<\/code> 之前<\/label><label class='quiz-opt'><input type='radio' name='q0401' value='1'> <code>\\includegraphics<\/code> 之后<\/label><label class='quiz-opt'><input type='radio' name='q0401' value='2'> <code>\\label<\/code> 之前<\/label><label class='quiz-opt'><input type='radio' name='q0401' value='3'> figure 环境之外<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0402' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 三线表需要加载哪个宏包？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0402' value='0'> graphicx<\/label><label class='quiz-opt'><input type='radio' name='q0402' value='1'> booktabs<\/label><label class='quiz-opt'><input type='radio' name='q0402' value='2'> hyperref<\/label><label class='quiz-opt'><input type='radio' name='q0402' value='3'> listings<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0403' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 让图片按正文宽度八成显示，应写 <code>width=________\\linewidth<\/code>。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch05__": {"html": "<h1>测验：第 5 章：目录、交叉引用与参考文献<\/h1><div class='quiz-item' data-qid='q0501' data-type='single'><p class='quiz-q'><b>Q1.<\/b> <code>\\ref{fig:risk}<\/code> 输出的是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0501' value='0'> 图的文件名<\/label><label class='quiz-opt'><input type='radio' name='q0501' value='1'> 图的编号<\/label><label class='quiz-opt'><input type='radio' name='q0501' value='2'> 图的标题<\/label><label class='quiz-opt'><input type='radio' name='q0501' value='3'> 图的页码<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0502' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 文献列表显示 <code>[?]<\/code>，最先检查？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0502' value='0'> 图片路径<\/label><label class='quiz-opt'><input type='radio' name='q0502' value='1'> 是否跑了 bibtex、cite key 是否匹配<\/label><label class='quiz-opt'><input type='radio' name='q0502' value='2'> 字号设置<\/label><label class='quiz-opt'><input type='radio' name='q0502' value='3'> 页边距<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0503' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 国标顺序编码制的宏包是________。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch06__": {"html": "<h1>测验：第 6 章：数模论文模板实战<\/h1><div class='quiz-item' data-qid='q0601' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 要让四级标题带编号，除设置 number 外还必须？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0601' value='0'> 改 tocdepth<\/label><label class='quiz-opt'><input type='radio' name='q0601' value='1'> 把 secnumdepth 调到 4 以上<\/label><label class='quiz-opt'><input type='radio' name='q0601' value='2'> 加载 hyperref<\/label><label class='quiz-opt'><input type='radio' name='q0601' value='3'> 用 appendix<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0602' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 摘要页后的正文要重新从第 1 页编号，应该？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0602' value='0'> 直接 \\setcounter{page}{1}<\/label><label class='quiz-opt'><input type='radio' name='q0602' value='1'> 用 \\pagenumbering{arabic} 重置<\/label><label class='quiz-opt'><input type='radio' name='q0602' value='2'> 改 fancyhdr<\/label><label class='quiz-opt'><input type='radio' name='q0602' value='3'> 重新编译<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0603' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 代码附录应使用________环境，配合 listings 宏包。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='tex 发行版'>TeX 发行版 — 把编译器、宏包、字体打包的整体，如 TeX Live <span class=glossary-ref>（第 1 章：环境与第一次编译）<\/span><\/li><li data-term='xelatex'>xelatex — 原生支持 UTF-8 与系统字体的编译引擎，中文首选 <span class=glossary-ref>（第 1 章：环境与第一次编译）<\/span><\/li><li data-term='ctex 文档类'>ctex 文档类 — 专为中文设计的文档类，自动处理字体与间距 <span class=glossary-ref>（第 1 章：环境与第一次编译）<\/span><\/li><li data-term='aux 文件'>aux 文件 — 编译时记录标签与页码的中间文件，目录与引用靠它 <span class=glossary-ref>（第 1 章：环境与第一次编译）<\/span><\/li><li data-term='zihao'>zihao — ctex 的字号参数，-4 表示小四 <span class=glossary-ref>（第 2 章：中文文档与版式）<\/span><\/li><li data-term='secnumdepth'>secnumdepth — 控制标题编号到第几级的计数器 <span class=glossary-ref>（第 2 章：中文文档与版式）<\/span><\/li><li data-term='tocdepth'>tocdepth — 控制目录显示到第几级的计数器 <span class=glossary-ref>（第 2 章：中文文档与版式）<\/span><\/li><li data-term='fancyhdr'>fancyhdr — 设置页眉页脚的宏包 <span class=glossary-ref>（第 2 章：中文文档与版式）<\/span><\/li><li data-term='行内公式'>行内公式 — 与文字同行的公式，用 $...$ 包裹 <span class=glossary-ref>（第 3 章：数学公式）<\/span><\/li><li data-term='行间公式'>行间公式 — 单独成行的公式，用 \\[...\\] 或 equation 环境 <span class=glossary-ref>（第 3 章：数学公式）<\/span><\/li><li data-term='align 环境'>align 环境 — 多行公式按 &amp; 对齐、逐行编号的环境 <span class=glossary-ref>（第 3 章：数学公式）<\/span><\/li><li data-term='cases 环境'>cases 环境 — 排分段函数的左大括号结构 <span class=glossary-ref>（第 3 章：数学公式）<\/span><\/li><li data-term='浮动体'>浮动体 — figure 与 table 这类由 LaTeX 自动安排位置的对象 <span class=glossary-ref>（第 4 章：图表与浮动体）<\/span><\/li><li data-term='三线表'>三线表 — 只有顶线、表头线、底线的表格，booktabs 提供 <span class=glossary-ref>（第 4 章：图表与浮动体）<\/span><\/li><li data-term='tabularx'>tabularx — 支持自动换行列宽的表格式宏包 <span class=glossary-ref>（第 4 章：图表与浮动体）<\/span><\/li><li data-term='子图'>子图 — 一张图内并排多个小图，用 subcaption 实现 <span class=glossary-ref>（第 4 章：图表与浮动体）<\/span><\/li><li data-term='交叉引用'>交叉引用 — 用 label 与 ref 自动维护编号的机制 <span class=glossary-ref>（第 5 章：目录、交叉引用与参考文献）<\/span><\/li><li data-term='bibtex'>BibTeX — 读 bib 数据库生成文献列表的工具 <span class=glossary-ref>（第 5 章：目录、交叉引用与参考文献）<\/span><\/li><li data-term='gbt7714'>gbt7714 — 符合国标 GB/T 7714 的参考文献样式宏包 <span class=glossary-ref>（第 5 章：目录、交叉引用与参考文献）<\/span><\/li><li data-term='listings'>listings — 排代码的宏包，支持行号与语法高亮 <span class=glossary-ref>（第 6 章：数模论文模板实战）<\/span><\/li><li data-term='导言区'>导言区 — begin document 之前的配置区，放宏包与全局参数 <span class=glossary-ref>（第 6 章：数模论文模板实战）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}}, "base_dir": "/home/user/Doubao/chats/38451429143789314/数学建模学习手册/03-LaTeX与论文排版", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：环境与第一次编译", "href": "#/chapter/ch01"}, {"label": "第 2 章：中文文档与版式", "href": "#/chapter/ch02"}, {"label": "第 3 章：数学公式", "href": "#/chapter/ch03"}, {"label": "第 4 章：图表与浮动体", "href": "#/chapter/ch04"}, {"label": "第 5 章：目录、交叉引用与参考文献", "href": "#/chapter/ch05"}, {"label": "第 6 章：数模论文模板实战", "href": "#/chapter/ch06"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：环境与第一次编译", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：中文文档与版式", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：数学公式", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：图表与浮动体", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章：目录、交叉引用与参考文献", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章：数模论文模板实战", "href": "#/quiz/ch06"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}], "rendered": {"ch01": "<h1>第 1 章：环境与第一次编译<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：起步册第 4 章 | <strong>原书定位<\/strong>：第 1 章 p1–49\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n在本地或 Overleaf 上把一份中文文档编译成 PDF；\n<\/li><li>\n说清 xelatex、ctex、编译三遍各自解决什么问题；\n<\/li><li>\n看懂最常见的三类报错并自己修。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>LaTeX 不是排版软件，它是一套「你写源码、它排版面」的工具；第一次跑通比读十页介绍有用。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：发行版与编辑器（难度：基础）<\/h3>\n<p><strong>TeX 发行版<\/strong>：把编译器、宏包、字体打包在一起的整体。Windows 用 TeX Live 或 MiKTeX，macOS 用 MacTeX，Linux 用 TeX Live。<\/p>\n<p><strong>编辑器<\/strong>：写源码的工具，VS Code + LaTeX Workshop 最常用，TeXstudio 传统但功能全。<\/p>\n<p><strong>Overleaf<\/strong>：在线编辑器，免安装，中文支持已内置，适合比赛时多人协作——但免费版编译有时长限制。<\/p>\n<h3>概念 2：中文要考 xelatex（难度：基础）<\/h3>\n<p>老教程里的 pdflatex 加 CJK 宏包已经过时。现在中文文档的标准做法是：<\/p>\n<ul><li>\n编译器用 <code>xelatex<\/code>；\n<\/li><li>\n文档类用 <code>ctexart<\/code>（文章）、<code>ctexrep<\/code>（报告）、<code>ctexbook<\/code>（书）；\n<\/li><li>\n字体用系统字体，ctex 会自动调用。\n<\/ul>\n<h3>概念 3：最小可编译文档（难度：基础）<\/h3>\n<pre class=\"lang-latex\"><code>\\documentclass[UTF8,a4paper,12pt]{ctexart}\n\\usepackage{amsmath,amssymb}\n\\usepackage{graphicx}\n\\usepackage{geometry}\n\\geometry{margin=2.5cm}\n\n\\title{第一次编译}\n\\author{你的名字}\n\\date{\\today}\n\n\\begin{document}\n\\maketitle\n\\tableofcontents\n\n\\section{引言}\n这是一个最小的中文文档，公式：$E = mc^2$。\n\n\\end{document}<\/code><\/pre>\n<p>保存为 <code>main.tex<\/code>，命令行跑 <code>xelatex main.tex<\/code> 两到三遍，得到 <code>main.pdf<\/code>。<\/p>\n<h3>概念 4：为什么要编译两三遍（难度：进阶）<\/h3>\n<p>第一遍生成 <code>.aux<\/code> 文件记录标签与页码；第二遍读 <code>.aux<\/code> 把交叉引用和目录填进去；有参考文献时还要跑 BibTeX，再跑两遍。<\/p>\n<p>只用一遍，目录会空、引用会显示 <code>??<\/code>。这不是 bug，是机制。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[main.tex] --&gt; B[xelatex 第一遍]\n    B --&gt; C[生成 aux 记录标签]\n    C --&gt; D[xelatex 第二遍]\n    D --&gt; E[目录与引用填入]\n    E --&gt; F[main.pdf]\n    F --&gt;|有参考文献| G[bibtex 再跑两遍]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：箭头是单向的，但实际编译是循环：改一次源码，就要重跑整条链。VS Code 的 latexmk 会自动判断该跑几遍。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：LaTeX 像点菜，你写菜单，厨房按标准出菜；Word 像自己下厨，边炒边调味。失效边界：菜单写错一个字，整道菜可能出不来；Word 里改一个字最多是那一页变丑。\n<\/li><li>\n<strong>实例（可动手）<\/strong>：把上面例子里的 <code>ctexart<\/code> 改成 <code>article<\/code>，再用 xelatex 编译，中文会变成空白或方框。这说明中文支持来自文档类，不是来自编译器。改回来即可恢复。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为报错行号就是出错行——实际上 LaTeX 的报错常滞后几行，要看第一个 <code>!<\/code> 号的位置，往前找。\n<\/li><li>\n别以为缺宏包要手动装——实际上 TeX Live 缺包可用 <code>tlmgr install 包名<\/code>，Overleaf 换文档类或改用内置宏包更快。\n<\/li><li>\n别以为 PDF 出来就算成功——实际上要检查目录、引用、公式编号、图片位置四项。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】编译中文文档应使用哪个引擎？<\/h3>\n<ul><li>\nA. pdflatex\n<\/li><li>\nB. xelatex\n<\/li><li>\nC. latex\n<\/li><li>\nD. bibtex\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：xelatex 原生支持 UTF-8 与系统字体，配合 ctex 文档类处理中文最稳。<\/p>\n<\/ul>\n<h3>Q2 【单选】目录为空最可能的原因是？<\/h3>\n<ul><li>\nA. 没有写 \\tableofcontents\n<\/li><li>\nB. 只编译了一遍，aux 未生成\n<\/li><li>\nC. 文档类不支持目录\n<\/li><li>\nD. 缺少 hyperref\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：目录内容来自 aux 文件，需要至少两遍编译。<\/p>\n<\/ul>\n<h3>Q3 【填空】TeX Live 缺宏包时，安装命令是 <code>tlmgr ________ 包名<\/code>。<\/h3>\n<p><strong>答案<\/strong>：install <strong>解析<\/strong>：tlmgr 是 TeX Live 的包管理器，install 后重启编辑器即可识别。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n中文三件套：xelatex + ctex 文档类 + UTF-8。\n<\/li><li>\n编译至少两遍，有文献要加 bibtex。\n<\/li><li>\n报错看第一个 <code>!<\/code>，往前找几行。\n<\/ul>", "ch02": "<h1>第 2 章：中文文档与版式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1 章 | <strong>原书定位<\/strong>：第 2 章 p50–156\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用 geometry 改页边距，用 ctexset 改标题格式与缩进；\n<\/li><li>\n设置三级以上标题编号，并让编号出现在目录里；\n<\/li><li>\n排出一份三页以内、行距与字号都合规的中文文档。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>中文排版的所有调节都落在两处：文档类参数（管全局）和局部命令（管一处），改错了位置就是白改。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：页面与字号（难度：基础）<\/h3>\n<pre class=\"lang-latex\"><code>\\documentclass[UTF8,a4paper,zihao=-4]{ctexart}  % -4 号字，约 12pt\n\\usepackage{geometry}\n\\geometry{top=2.5cm,bottom=2.5cm,left=3cm,right=2.5cm}<\/code><\/pre>\n<p><code>zihao<\/code> 是 ctex 专有的字号参数，<code>-4<\/code> 表示小四。比赛论文常用小四正文、五号图表注。<\/p>\n<p>行距用 <code>\\linespread{1.3}<\/code> 放大到 1.3 倍。注意它必须在 <code>\\begin{document}<\/code> 之前生效。<\/p>\n<h3>概念 2：标题格式与编号深度（难度：进阶）<\/h3>\n<pre class=\"lang-latex\"><code>\\ctexset{\n  section = {format = \\Large\\bfseries\\centering},\n  subsection = {format = \\large\\bfseries},\n  subsubsection = {format = \\normalsize\\bfseries, number = \\arabic{subsubsection}}\n}\n\\setcounter{secnumdepth}{4}   % 编号到第四级\n\\setcounter{tocdepth}{3}      % 目录到第三级<\/code><\/pre>\n<p><code>secnumdepth<\/code> 决定编号到几级，<code>tocdepth<\/code> 决定目录显示到几级。两者要分开设，只设一个会出现「正文有编号、目录没有」或反过来。<\/p>\n<p>如果要求 <code>\\paragraph<\/code> 也带编号，需要 <code>\\setcounter{secnumdepth}{5}<\/code>，并给 paragraph 配 format。<\/p>\n<h3>概念 3：中英文混排（难度：基础）<\/h3>\n<ul><li>\n中文与英文之间，ctex 默认不加空格，需要手写 <code>中文\\ English<\/code> 或在导言区设 <code>\\xeCJKsetup{CJKspace=true}<\/code> 自动加空隙。\n<\/li><li>\n英文单词不要手动断行，LaTeX 自己会断。\n<\/li><li>\n数字与单位之间用不断行空格 <code>~<\/code>：<code>10~mm<\/code>，避免「10」在行末、「mm」在行首。\n<\/ul>\n<h3>概念 4：页眉页脚（难度：进阶）<\/h3>\n<pre class=\"lang-latex\"><code>\\usepackage{fancyhdr}\n\\pagestyle{fancy}\n\\fancyhf{}\n\\fancyhead[C]{数学建模论文}\n\\fancyfoot[C]{\\thepage}\n\\renewcommand{\\headrulewidth}{0.4pt}<\/code><\/pre>\n<p><code>\\fancyhf{}<\/code> 先清空默认设置，否则页眉会重复出现两遍。这是最常见的排版怪象来源。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[文档类参数] --&gt; B[字号 纸张]\n    A --&gt; C[标题格式]\n    D[局部命令] --&gt; E[某段落间距]\n    D --&gt; F[某个标题加星]\n    B --&gt; G[编译]\n    C --&gt; G\n    E --&gt; G\n    F --&gt; G\n    G --&gt; H[检查目录与页码]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边两条管全局，右边两条管局部。改全局参数会影响全文，改完必须重新检查每一页。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：文档类参数像房子的层高与墙厚，局部命令像某个房间贴的壁纸。失效边界：层高一改，所有房间的家具都要重摆，所以全局参数要一开始定好。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：A4 纸宽 21 cm，左右边距 3 cm 与 2.5 cm，正文宽 15.5 cm。小四字号约 12 pt，一行约 36 个汉字。若把左右边距都改成 2 cm，正文宽 17 cm，每行约 40 字，页数会减少约一成。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为改字号能直接改行距——实际上字号与行距是两套参数，需要分别设。\n<\/li><li>\n别以为 secnumdepth 改了目录就会跟着变——实际上目录深度由 tocdepth 控制。\n<\/li><li>\n别以为 fancyhdr 会自动清空默认页眉——实际上不清空就会出现双页眉。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】要让第四级标题也带编号，应设置？<\/h3>\n<ul><li>\nA. \\setcounter{tocdepth}{4}\n<\/li><li>\nB. \\setcounter{secnumdepth}{4}\n<\/li><li>\nC. \\linespread{1.3}\n<\/li><li>\nD. \\pagestyle{fancy}\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：secnumdepth 控制编号深度，tocdepth 只控制目录显示。<\/p>\n<\/ul>\n<h3>Q2 【单选】页眉重复出现两遍，最可能的原因是？<\/h3>\n<ul><li>\nA. 没有 \\fancyhf{}\n<\/li><li>\nB. 没有加载 ctex\n<\/li><li>\nC. 编译次数不够\n<\/li><li>\nD. 字号设置错误\n<p><strong>答案<\/strong>：A <strong>解析<\/strong>：默认页眉未清空，新设置叠加上去就会重复。<\/p>\n<\/ul>\n<h3>Q3 【填空】要让「10」与「mm」不被断行分开，应写成 <code>10~mm<\/code>，其中 <code>~<\/code> 表示________空格。<\/h3>\n<p><strong>答案<\/strong>：不断行 <strong>解析<\/strong>：<code>~<\/code> 在 LaTeX 中是不断行空格，保证两个词始终在同一行。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n全局参数在导言区定，局部调整用命令。\n<\/li><li>\n编号深度与目录深度是两个开关。\n<\/li><li>\nfancyhdr 先清空再设置。\n<\/ul>", "ch03": "<h1>第 3 章：数学公式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 2 章 | <strong>原书定位<\/strong>：第 4 章 p221–300\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n正确区分行内公式与行间公式，并按需编号；\n<\/li><li>\n用 align 排多行推导，用 cases 排分段函数，用 matrix 排矩阵；\n<\/li><li>\n修掉公式里最常见的四类报错。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>公式排版只有两个决定：放不放进独立行，给不给编号；其余都是符号命令的查表工作。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：两种模式（难度：基础）<\/h3>\n<ul><li>\n行内：<code>$E=mc^2$<\/code>，跟文字一起走，不编号。\n<\/li><li>\n行间：<code>\\[ E=mc^2 \\]<\/code>，单独成行，不编号。\n<\/li><li>\n行间带编号：<code>\\begin{equation} ... \\end{equation}<\/code>，自动编号，可用 <code>\\label<\/code> 引用。\n<\/ul>\n<p>经验规则：短式子、句中提到用行内；需要推导、需要被引用用行间带编号。<\/p>\n<h3>概念 2：多行推导（难度：进阶）<\/h3>\n<pre class=\"lang-latex\"><code>\\begin{align}\n  z &amp;= 4x_1 + 3x_2 \\label{eq:obj}\\\\\n  \\text{s.t.}\\quad &amp; 2x_1 + x_2 \\le 10 \\\\\n  &amp; x_1 + x_2 \\le 8\n\\end{align}<\/code><\/pre>\n<p><code>&amp;<\/code> 是对齐点，<code>\\\\<\/code> 换行。每个 <code>&amp;<\/code> 都要成对出现，只写一个会导致「Misplaced alignment tab」报错。<\/p>\n<p>不需要编号时用 <code>align*<\/code>。只想给某一行编号，用 <code>\\notag<\/code> 把其余行去掉编号。<\/p>\n<h3>概念 3：常见结构（难度：进阶）<\/h3>\n<p>分段函数：<\/p>\n<pre class=\"lang-latex\"><code>f(x) = \\begin{cases}\n  x^2, &amp; x \\ge 0,\\\\\n  -x,  &amp; x &lt; 0.\n\\end{cases}<\/code><\/pre>\n<p>矩阵：<\/p>\n<pre class=\"lang-latex\"><code>A = \\begin{pmatrix}\n  2 &amp; 1 \\\\\n  1 &amp; 1\n\\end{pmatrix}, \\quad\nb = \\begin{pmatrix} 10 \\\\ 8 \\end{pmatrix}<\/code><\/pre>\n<p><code>pmatrix<\/code> 用圆括号，<code>bmatrix<\/code> 用方括号，<code>vmatrix<\/code> 用竖线表示行列式。<\/p>\n<h3>概念 4：四类高频报错（难度：基础）<\/h3>\n<ol><li>\n<strong><code>&amp;<\/code> 位置错<\/strong>：在 equation 环境里用 <code>&amp;<\/code> 会报错，应该用 align。\n<\/li><li>\n<strong>下划线未转义<\/strong>：文本里的 <code>file_name<\/code> 要写成 <code>file\\_name<\/code>，公式里才用 <code>_<\/code> 表示下标。\n<\/li><li>\n<strong><code>%<\/code> 未转义<\/strong>：文本里的百分号写成 <code>\\%<\/code>，否则后面整行被当注释吞掉。\n<\/li><li>\n<strong>缺 <code>$<\/code><\/strong>：行间公式用了 <code>\\[<\/code> 却没写 <code>\\]<\/code>，后面全部内容被当成公式。\n<\/ol>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[要排的式子] --&gt; B{是否独立成行}\n    B --&gt;|否| C[行内 $...$]\n    B --&gt;|是| D{是否要编号或引用}\n    D --&gt;|否| E[方括号 或 align*]\n    D --&gt;|是| F[equation 或 align]\n    F --&gt; G[加 label 供 ref 引用]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：两个判断决定环境选择。选错环境，编号或对齐就会出问题。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：行内公式像句中的括号补充，行间公式像单独列出的算式。失效边界：太长的式子塞进行内，会把行距撑开、版面变丑，这时必须改成行间。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：把 KKT 条件排成对齐形式：\n<\/ul>\n<pre class=\"lang-latex\"><code>\\begin{align}\n  \\nabla f + \\sum_{i=1}^{m}\\lambda_i \\nabla g_i &amp;= 0,\\\\\n  \\lambda_i g_i &amp;= 0,\\\\\n  \\lambda_i &amp;\\ge 0.\n\\end{align}<\/code><\/pre>\n<p>三行共用一组编号，对齐点在等号前，这是论文里推导的标准写法。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为公式里的空格会影响排版——实际上数学模式忽略空格，间距由符号类别决定，要手动调就用 <code>\\,<\/code>、<code>\\quad<\/code>。\n<\/li><li>\n别以为 <code>\\text{}<\/code> 可以随便用——实际上它需要 amsmath，且中文要放在 <code>\\text{中文}<\/code> 里配合 ctex 才正常。\n<\/li><li>\n别以为编号会自动更新——实际上编号依赖 aux，改完要重编译两遍。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】需要多行对齐并统一编号，应使用？<\/h3>\n<ul><li>\nA. equation\n<\/li><li>\nB. align\n<\/li><li>\nC. \\[ \\]\n<\/li><li>\nD. cases\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：align 提供对齐点与逐行编号，equation 只适合单行公式。<\/p>\n<\/ul>\n<h3>Q2 【单选】文本中写「准确率 95%」正确的是？<\/h3>\n<ul><li>\nA. 95%\n<\/li><li>\nB. 95\\%\n<\/li><li>\nC. 95$\\%$\n<\/li><li>\nD. 95 percent\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：% 是注释符，必须转义为 \\%。<\/p>\n<\/ul>\n<h3>Q3 【填空】分段函数用________环境，矩阵用 pmatrix 或 bmatrix。<\/h3>\n<p><strong>答案<\/strong>：cases <strong>解析<\/strong>：cases 左侧一个大括号、右侧两列条件，是标准写法。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n行内不编号，行间按需编号，引用要配 label。\n<\/li><li>\n对齐点 <code>&amp;<\/code> 必须成对，换行用 <code>\\\\<\/code>。\n<\/li><li>\n% _ # &amp; 在文本里都要转义。\n<\/ul>", "ch04": "<h1>第 4 章：图表与浮动体<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 2 章 | <strong>原书定位<\/strong>：第 5 章插图、第 6 章表格\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n插入一张宽度合适、图注在图下的图片；\n<\/li><li>\n用 booktabs 排出规范三线表，并解决列宽溢出；\n<\/li><li>\n说清 figure 为什么「跑到下一页」，以及怎么控制。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>图表不是插进去就完事，位置、宽度、图注、正文引用四件事都要交代，缺一件评委会扣格式分。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：插图（难度：基础）<\/h3>\n<pre class=\"lang-latex\"><code>\\usepackage{graphicx}\n\\begin{figure}[htbp]\n  \\centering\n  \\includegraphics[width=0.8\\linewidth]{figs/result.png}\n  \\caption{不同风险水平下的收益曲线}\n  \\label{fig:risk}\n\\end{figure}<\/code><\/pre>\n<ul><li>\n<code>[htbp]<\/code> 是位置偏好：这里、页顶、页底、单独一页。LaTeX 会就近安排，不保证。\n<\/li><li>\n<code>width=0.8\\linewidth<\/code> 按正文宽度比例缩放，比写死厘米更稳。\n<\/li><li>\n<code>\\caption<\/code> 放 <code>\\includegraphics<\/code> 之后，图注才会在图下方。\n<\/li><li>\n<code>\\label<\/code> 放 caption 之后，否则引用会指向错误的编号。\n<\/ul>\n<h3>概念 2：浮动体为什么乱跑（难度：进阶）<\/h3>\n<p>LaTeX 把 figure 当作浮动体，按版面规则排队。图太多、太大、太靠近页底，就会被推到下一页甚至文末。<\/p>\n<p>三个应对：<\/p>\n<ol><li>\n加 <code>[htbp]<\/code> 给更多选择；\n<\/li><li>\n用 <code>\\usepackage{float}<\/code> 加 <code>[H]<\/code> 强制在此处；\n<\/li><li>\n调整图片宽度，别让一张图高过一页的 70%。\n<\/ol>\n<p><code>[H]<\/code> 的代价是可能留下大片空白，正式投稿不推荐，课设可以用。<\/p>\n<h3>概念 3：三线表（难度：基础）<\/h3>\n<pre class=\"lang-latex\"><code>\\usepackage{booktabs}\n\\begin{table}[htbp]\n  \\centering\n  \\caption{三种方案的评价结果}\n  \\label{tab:score}\n  \\begin{tabular}{lccc}\n    \\toprule\n    方案 &amp; 成本 &amp; 质量 &amp; 综合得分 \\\\\n    \\midrule\n    S1 &amp; 0.90 &amp; 0.50 &amp; 0.685 \\\\\n    S2 &amp; 0.70 &amp; 0.80 &amp; 0.685 \\\\\n    S3 &amp; 0.60 &amp; 0.90 &amp; 0.730 \\\\\n    \\bottomrule\n  \\end{tabular}\n\\end{table}<\/code><\/pre>\n<p>三线表只有顶线、表头线、底线，没有竖线。<code>lccc<\/code> 是列对齐：左对齐一列、居中三列。表格过宽时用 <code>tabularx<\/code> 的 <code>X<\/code> 列自动换行。<\/p>\n<h3>概念 4：子图（难度：进阶）<\/h3>\n<pre class=\"lang-latex\"><code>\\usepackage{subcaption}\n\\begin{figure}[htbp]\n  \\centering\n  \\begin{subfigure}{0.45\\linewidth}\n    \\includegraphics[width=\\linewidth]{a.png}\n    \\caption{去噪前}\n  \\end{subfigure}\\hfill\n  \\begin{subfigure}{0.45\\linewidth}\n    \\includegraphics[width=\\linewidth]{b.png}\n    \\caption{去噪后}\n  \\end{subfigure}\n  \\caption{均值滤波效果对比}\n\\end{figure}<\/code><\/pre>\n<p>子图编号变成 (a)、(b)，正文用 <code>\\ref{fig:...}<\/code> 引用总编号。两张图之间用 <code>\\hfill<\/code> 撑开，别用空格硬凑。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[图片文件] --&gt; B[设宽度]\n    B --&gt; C[放进 figure]\n    C --&gt; D[caption 在图下]\n    D --&gt; E[label 加引用]\n    E --&gt; F{位置不对}\n    F --&gt;|是| G[加 htbp 或 H]\n    F --&gt;|否| H[编译检查]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：顺序不能乱，label 一定要在 caption 之后，否则引用编号会错位。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：浮动体像排队的乘客，LaTeX 是调度员，它按规则安排你上哪班车，不是你说了算。失效边界：调度员可以被 <code>[H]<\/code> 强行插队，但后果是车厢留空。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：正文宽 15.5 cm，一张 3000×2000 像素的图，按 0.8 倍正文宽插入，显示宽度 12.4 cm、高度 8.27 cm。若按原尺寸插入，宽度 3000 px 直接溢出页面，这是「图跑到页面外」最常见的原因。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为写了 <code>[h]<\/code> 就一定在原位——实际上空间不够时 LaTeX 会忽略。\n<\/li><li>\n别以为表格竖线越多越清楚——实际上三线表最易读，竖线是排版陋习。\n<\/li><li>\n别以为图片放进同目录就能显示——实际上路径要相对主文件，子目录要写 <code>figs/a.png<\/code>。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】图注要显示在图下方，<code>\\caption<\/code> 应放在？<\/h3>\n<ul><li>\nA. <code>\\includegraphics<\/code> 之前\n<\/li><li>\nB. <code>\\includegraphics<\/code> 之后\n<\/li><li>\nC. <code>\\label<\/code> 之前\n<\/li><li>\nD. figure 环境之外\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：caption 的位置决定图注上下，放后面才在图下。<\/p>\n<\/ul>\n<h3>Q2 【单选】三线表需要加载哪个宏包？<\/h3>\n<ul><li>\nA. graphicx\n<\/li><li>\nB. booktabs\n<\/li><li>\nC. hyperref\n<\/li><li>\nD. listings\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：booktabs 提供 \\toprule、\\midrule、\\bottomrule。<\/p>\n<\/ul>\n<h3>Q3 【填空】让图片按正文宽度八成显示，应写 <code>width=________\\linewidth<\/code>。<\/h3>\n<p><strong>答案<\/strong>：0.8 <strong>解析<\/strong>：用相对宽度而不是绝对厘米，换版式时不用逐张改。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n图注在图下、表注在表上，label 紧跟 caption。\n<\/li><li>\n宽度用相对值，别超一页七成。\n<\/li><li>\n表格用三线表，宽了换 tabularx。\n<\/ul>", "ch05": "<h1>第 5 章：目录、交叉引用与参考文献<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 3、4 章 | <strong>原书定位<\/strong>：第 3 章 p157–219\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n让目录、图表目录、公式编号全部自动生成；\n<\/li><li>\n用 label/ref 管理交叉引用，改章节顺序不用手动改编号；\n<\/li><li>\n用 BibTeX 或 biblatex 生成符合国标的参考文献。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>自动化的意义只有一个：内容改了，编号自己跟着变；手写的编号迟早会错。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：目录与图表目录（难度：基础）<\/h3>\n<pre class=\"lang-latex\"><code>\\tableofcontents\n\\listoffigures\n\\listoftables<\/code><\/pre>\n<p>三者都读 aux 文件，所以要编译两遍。只想让某级标题进目录，用 <code>\\section*{}<\/code> 加 <code>\\addcontentsline<\/code>，或用 <code>\\setcounter{tocdepth}{2}<\/code>。<\/p>\n<h3>概念 2：交叉引用（难度：基础）<\/h3>\n<pre class=\"lang-latex\"><code>\\section{模型建立}\\label{sec:model}\n如图~\\ref{fig:risk} 所示，第~\\ref{sec:model} 节给出了目标函数。<\/code><\/pre>\n<ul><li>\n<code>\\ref<\/code> 给编号，<code>\\pageref<\/code> 给页码，<code>\\eqref<\/code> 给带括号的公式编号。\n<\/li><li>\nlabel 命名建议带前缀：<code>sec:<\/code>、<code>fig:<\/code>、<code>tab:<\/code>、<code>eq:<\/code>，方便搜索。\n<\/li><li>\n引用前加 <code>~<\/code> 防止「图」和编号被断到两行。\n<\/ul>\n<h3>概念 3：参考文献（难度：进阶）<\/h3>\n<p>传统做法用 BibTeX：<\/p>\n<pre class=\"lang-latex\"><code>\\usepackage[numbers]{gbt7714}   % 国标顺序编码制\n\\bibliographystyle{gbt7714-numerical}\n\\bibliography{refs}<\/code><\/pre>\n<p><code>refs.bib<\/code> 里每条记录：<\/p>\n<pre class=\"lang-bibtex\"><code>@article{si2020,\n  author  = {司守奎 and 孙玺菁},\n  title   = {数学建模算法与应用},\n  journal = {国防工业出版社},\n  year    = {2020},\n  pages   = {1--17}\n}<\/code><\/pre>\n<p>正文用 <code>\\cite{si2020}<\/code> 引用，编译链变成：xelatex → bibtex → xelatex → xelatex。<\/p>\n<p>用 biblatex 的话加载 <code>\\usepackage[backend=biber,style=numeric]{biblatex}<\/code>，编译用 biber。<\/p>\n<h3>概念 4：引用不出现的排查（难度：进阶）<\/h3>\n<p>按顺序查四件事：<\/p>\n<ol><li>\n<code>.bib<\/code> 文件路径对不对；\n<\/li><li>\n<code>\\cite<\/code> 的 key 与 bib 里是否完全一致（大小写敏感）；\n<\/li><li>\n有没有跑 bibtex（只跑 xelatex 不会生成文献列表）；\n<\/li><li>\n<code>.bbl<\/code> 文件是否生成，报错日志里搜 <code>I couldn&#x27;t open database<\/code>。\n<\/ol>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[xelatex] --&gt; B[aux 记录引用键]\n    B --&gt; C[bibtex 读 bib 生成 bbl]\n    C --&gt; D[xelatex 读 bbl]\n    D --&gt; E[xelatex 定页码]\n    E --&gt; F[PDF 带文献]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：四步是一条链，少一步文献就显示 <code>[?]<\/code>。latexmk 会自动跑完整条链，所以推荐用它。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：交叉引用像 Excel 的单元格引用，改一处全表更新；手写编号像手抄公式，改一次要抄十处。失效边界：Excel 引用错了会报 <code>#REF!<\/code>，LaTeX 引用错了只显示 <code>??<\/code>，不一定会提醒你。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：论文有 6 章、18 图、9 表，手写编号在插入一章后需要改 30 多处；用 label/ref 只需重编译两遍。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 <code>\\ref<\/code> 会自动带「图」字——实际上只输出编号，前缀要自己写。\n<\/li><li>\n别以为 bib 里的条目顺序影响输出——实际上顺序由样式决定，与文件顺序无关。\n<\/li><li>\n别以为中文文献不用管格式——实际上国标要求作者、题名、文献类型标识齐全，gbt7714 样式帮你补齐。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】<code>\\ref{fig:risk}<\/code> 输出的是什么？<\/h3>\n<ul><li>\nA. 图的文件名\n<\/li><li>\nB. 图的编号\n<\/li><li>\nC. 图的标题\n<\/li><li>\nD. 图的页码\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：ref 输出编号，页码用 pageref，标题不会被引用。<\/p>\n<\/ul>\n<h3>Q2 【单选】文献列表显示 <code>[?]<\/code>，最先检查？<\/h3>\n<ul><li>\nA. 图片路径\n<\/li><li>\nB. 是否跑了 bibtex、cite key 是否匹配\n<\/li><li>\nC. 字号设置\n<\/li><li>\nD. 页边距\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：<code>[?]<\/code> 表示引用键找不到对应条目，先查编译链与 key。<\/p>\n<\/ul>\n<h3>Q3 【填空】国标顺序编码制的宏包是________。<\/h3>\n<p><strong>答案<\/strong>：gbt7714 <strong>解析<\/strong>：gbt7714 提供符合 GB/T 7714 的样式，配合 BibTeX 或 biblatex 使用。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n目录、图表目录都靠 aux，编译至少两遍。\n<\/li><li>\nlabel 带前缀，ref 前加 <code>~<\/code>。\n<\/li><li>\n文献链：xelatex → bibtex → xelatex → xelatex。\n<\/ul>", "ch06": "<h1>第 6 章：数模论文模板实战<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1–5 章 | <strong>原书定位<\/strong>：综合第 2–6 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用一份导言区搭出可直接写正文的论文骨架；\n<\/li><li>\n排出三层以上、编号连续的标题体系，并把「：」后的分论点也编号；\n<\/li><li>\n用 listings 排代码附录，交卷前按清单查出格式硬伤。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>模板的价值不在好看，在于它把「格式」这件事一次性定死，让你后面只操心内容。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：可直接复制的导言区（难度：基础）<\/h3>\n<pre class=\"lang-latex\"><code>\\documentclass[UTF8,a4paper,zihao=-4]{ctexart}\n\\usepackage{amsmath,amssymb,amsthm}\n\\usepackage{graphicx,booktabs,tabularx}\n\\usepackage{geometry}\n\\geometry{top=2.5cm,bottom=2.5cm,left=3cm,right=2.5cm}\n\\usepackage{fancyhdr}\n\\usepackage{caption}\n\\captionsetup{font=small,labelsep=quad}\n\\usepackage[numbers]{gbt7714}\n\\usepackage{listings}\n\\usepackage[hidelinks]{hyperref}\n\n\\linespread{1.3}\n\\setcounter{secnumdepth}{4}\n\\setcounter{tocdepth}{3}\n\n\\pagestyle{fancy}\n\\fancyhf{}\n\\fancyhead[C]{2026 年全国大学生数学建模竞赛}\n\\fancyfoot[C]{\\thepage}\n\\renewcommand{\\headrulewidth}{0.4pt}\n\n\\newtheorem{definition}{定义}[section]\n\\newtheorem{theorem}{定理}[section]\n\n\\lstset{\n  basicstyle=\\ttfamily\\small,\n  numbers=left,\n  numberstyle=\\tiny,\n  frame=single,\n  breaklines=true,\n  showstringspaces=false\n}<\/code><\/pre>\n<p>这段直接贴到新建的 <code>main.tex<\/code> 里，下面接 <code>\\begin{document}<\/code> 就能写。<\/p>\n<h3>概念 2：标题编号体系（难度：进阶）<\/h3>\n<p>竞赛论文常见要求：一级标题用「一、二、三」，二级用「3.1」，三级用「3.1.2」，四级用「6.3.2.1」。<\/p>\n<pre class=\"lang-latex\"><code>\\ctexset{\n  section = {\n    name = {,、},\n    number = \\chinese{section},\n    format = \\Large\\bfseries\n  },\n  subsection = {number = \\arabic{section}.\\arabic{subsection}},\n  subsubsection = {number = \\arabic{section}.\\arabic{subsection}.\\arabic{subsubsection}}\n}<\/code><\/pre>\n<p>要更深的层级（如 6.3.2.1），必须把 <code>secnumdepth<\/code> 设为 4 或 5，否则 <code>\\paragraph<\/code> 只有标题没有编号。<\/p>\n<p>正文里「：」后面跟的分论点也要编号时，别用无序列表，直接排成带编号的段落：<\/p>\n<pre class=\"lang-latex\"><code>\\noindent （1）模型假设：\\\\\n\\indent （1.1）原材料价格在三个月内不变；\\\\\n\\indent （1.2）机器每天最多运行 8 小时。<\/code><\/pre>\n<p>或者定义一个计数器命令，避免手写编号错乱：<\/p>\n<pre class=\"lang-latex\"><code>\\newcounter{subpoint}[subsection]\n\\newcommand{\\pt}[1]{\\stepcounter{subpoint}\\noindent（\\thesubsection.\\thesubpoint）~#1\\par}<\/code><\/pre>\n<h3>概念 3：摘要页（难度：基础）<\/h3>\n<pre class=\"lang-latex\"><code>\\begin{center}\n  {\\LARGE\\bfseries 基于线性规划与灵敏度分析的机床生产优化}\\\\[6pt]\n  {\\large 摘\\quad 要}\n\\end{center}\n\\vspace{6pt}\n本文针对……建立……模型，求得最优方案为……，日利润 2.6 万元。\n第三问用 Monte Carlo 模拟 10 万次，得期望利润 2.41 万元，90\\% 置信区间 [2.05, 2.77]。\n\\vspace{6pt}\\par\\noindent\\textbf{关键词：}线性规划；灵敏度分析；Monte Carlo\n\\newpage<\/code><\/pre>\n<p>摘要独立一页，不编页码或用罗马数字，正文从第一页重新编号。<\/p>\n<h3>概念 4：代码附录（难度：基础）<\/h3>\n<pre class=\"lang-latex\"><code>\\appendix\n\\section{程序代码}\n\\begin{lstlisting}[language=Python]\nimport numpy as np\nfrom scipy.optimize import linprog\nres = linprog([-4, -3], A_ub=[[2, 1], [1, 1], [0, 1]],\n              b_ub=[10, 8, 7], bounds=[(0, None), (0, None)],\n              method=&quot;highs&quot;)\nprint(res.x, -res.fun)\n\\end{lstlisting}<\/code><\/pre>\n<p>中文注释在 listings 里可能乱码，需要设 <code>extendedchars=true<\/code> 或改用 <code>\\lstinputlisting<\/code> 读外部文件。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[导言区定格式] --&gt; B[标题与摘要页]\n    B --&gt; C[正文分章]\n    C --&gt; D[公式图表编号]\n    D --&gt; E[交叉引用与文献]\n    E --&gt; F[代码附录]\n    F --&gt; G[编译三遍]\n    G --&gt; H[提交前清单]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：格式在第一步定死，后面每一步都依赖它。中途改导言区，整篇的编号与分页都要重查。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：模板像盖房子的图纸，先定层高与承重，后面砌墙才有依据。失效边界：图纸能改，但改完要重新验收；模板改字号，全文页数会变，摘要可能挤到第二页。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：正文小四、1.3 倍行距，A4 纸每页约 32 行、每行 36 字，一页约 1150 字。20 页正文约 2.3 万字，加图表与公式实际约 1.8 万字。字数估算能帮你判断内容够不够。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为套模板就能拿格式分——实际上模板只保证不扣分，图表规范、编号连续仍要自己查。\n<\/li><li>\n别以为改字号只影响美观——实际上它改变每页容量，进而影响页数与摘要位置。\n<\/li><li>\n别以为代码附录可以随便截——实际上变量名要与正文一致，否则评委会怀疑结果来源。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】要让四级标题带编号，除设置 number 外还必须？<\/h3>\n<ul><li>\nA. 改 tocdepth\n<\/li><li>\nB. 把 secnumdepth 调到 4 以上\n<\/li><li>\nC. 加载 hyperref\n<\/li><li>\nD. 用 appendix\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：编号深度由 secnumdepth 控制，默认只到 3 级。<\/p>\n<\/ul>\n<h3>Q2 【单选】摘要页后的正文要重新从第 1 页编号，应该？<\/h3>\n<ul><li>\nA. 直接 \\setcounter{page}{1}\n<\/li><li>\nB. 用 \\pagenumbering{arabic} 重置\n<\/li><li>\nC. 改 fancyhdr\n<\/li><li>\nD. 重新编译\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：pagenumbering 会重置页码计数器，setcounter 只改数值不重置样式。<\/p>\n<\/ul>\n<h3>Q3 【填空】代码附录应使用________环境，配合 listings 宏包。<\/h3>\n<p><strong>答案<\/strong>：lstlisting <strong>解析<\/strong>：lstlisting 支持语法高亮、行号、自动换行，是排代码的标准环境。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n导言区一次性定死字号、边距、编号深度。\n<\/li><li>\n「一、」与「3.1.2」混排靠 ctexset 的 number 参数。\n<\/li><li>\n交卷前查：编号连续、图表有注、文献不缺、PDF 无溢出。\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：跑通第一份 PDF<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：环境与第一次编译<\/a><br>检查点：xelatex 编译成功，中文不乱码<\/li><li class='path-step' id='path-02'><strong>步骤 02：排中文版式<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：中文文档与版式<\/a><br>检查点：字号、边距、页眉三项都改过一次<\/li><li class='path-step' id='path-03'><strong>步骤 03：写公式<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：数学公式<\/a><br>检查点：能用 align 与 cases 各排一段<\/li><li class='path-step' id='path-04'><strong>步骤 04：放图表<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：图表与浮动体<\/a><br>检查点：三线表与子图都能正确显示图注<\/li><li class='path-step' id='path-05'><strong>步骤 05：做引用与文献<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：目录、交叉引用与参考文献<\/a><br>检查点：文献编号出现，无 [?]<\/li><li class='path-step' id='path-06'><strong>步骤 06：套论文模板<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：数模论文模板实战<\/a><br>检查点：四级编号 1.1.1.1 正确，摘要独立成页<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__quiz_ch01__": "<h1>测验：第 1 章：环境与第一次编译<\/h1><div class='quiz-item' data-qid='q0101' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 编译中文文档应使用哪个引擎？<\/p><div class='quiz-opts'><label class='quiz-o
