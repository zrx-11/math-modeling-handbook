pt'><input type='radio' name='q0101' value='0'> pdflatex<\/label><label class='quiz-opt'><input type='radio' name='q0101' value='1'> xelatex<\/label><label class='quiz-opt'><input type='radio' name='q0101' value='2'> latex<\/label><label class='quiz-opt'><input type='radio' name='q0101' value='3'> bibtex<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0102' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 目录为空最可能的原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0102' value='0'> 没有写 \\tableofcontents<\/label><label class='quiz-opt'><input type='radio' name='q0102' value='1'> 只编译了一遍，aux 未生成<\/label><label class='quiz-opt'><input type='radio' name='q0102' value='2'> 文档类不支持目录<\/label><label class='quiz-opt'><input type='radio' name='q0102' value='3'> 缺少 hyperref<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0103' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> TeX Live 缺宏包时，安装命令是 <code>tlmgr ________ 包名<\/code>。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：中文文档与版式<\/h1><div class='quiz-item' data-qid='q0201' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 要让第四级标题也带编号，应设置？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0201' value='0'> \\setcounter{tocdepth}{4}<\/label><label class='quiz-opt'><input type='radio' name='q0201' value='1'> \\setcounter{secnumdepth}{4}<\/label><label class='quiz-opt'><input type='radio' name='q0201' value='2'> \\linespread{1.3}<\/label><label class='quiz-opt'><input type='radio' name='q0201' value='3'> \\pagestyle{fancy}<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0202' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 页眉重复出现两遍，最可能的原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0202' value='0'> 没有 \\fancyhf{}<\/label><label class='quiz-opt'><input type='radio' name='q0202' value='1'> 没有加载 ctex<\/label><label class='quiz-opt'><input type='radio' name='q0202' value='2'> 编译次数不够<\/label><label class='quiz-opt'><input type='radio' name='q0202' value='3'> 字号设置错误<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0203' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 要让「10」与「mm」不被断行分开，应写成 <code>10~mm<\/code>，其中 <code>~<\/code> 表示________空格。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：数学公式<\/h1><div class='quiz-item' data-qid='q0301' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 需要多行对齐并统一编号，应使用？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0301' value='0'> equation<\/label><label class='quiz-opt'><input type='radio' name='q0301' value='1'> align<\/label><label class='quiz-opt'><input type='radio' name='q0301' value='2'> \\[ \\]<\/label><label class='quiz-opt'><input type='radio' name='q0301' value='3'> cases<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0302' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 文本中写「准确率 95%」正确的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0302' value='0'> 95%<\/label><label class='quiz-opt'><input type='radio' name='q0302' value='1'> 95\\%<\/label><label class='quiz-opt'><input type='radio' name='q0302' value='2'> 95$\\%$<\/label><label class='quiz-opt'><input type='radio' name='q0302' value='3'> 95 percent<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0303' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 分段函数用________环境，矩阵用 pmatrix 或 bmatrix。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：图表与浮动体<\/h1><div class='quiz-item' data-qid='q0401' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 图注要显示在图下方，<code>\\caption<\/code> 应放在？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0401' value='0'> <code>\\includegraphics<\/code> 之前<\/label><label class='quiz-opt'><input type='radio' name='q0401' value='1'> <code>\\includegraphics<\/code> 之后<\/label><label class='quiz-opt'><input type='radio' name='q0401' value='2'> <code>\\label<\/code> 之前<\/label><label class='quiz-opt'><input type='radio' name='q0401' value='3'> figure 环境之外<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0402' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 三线表需要加载哪个宏包？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0402' value='0'> graphicx<\/label><label class='quiz-opt'><input type='radio' name='q0402' value='1'> booktabs<\/label><label class='quiz-opt'><input type='radio' name='q0402' value='2'> hyperref<\/label><label class='quiz-opt'><input type='radio' name='q0402' value='3'> listings<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0403' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 让图片按正文宽度八成显示，应写 <code>width=________\\linewidth<\/code>。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch05__": "<h1>测验：第 5 章：目录、交叉引用与参考文献<\/h1><div class='quiz-item' data-qid='q0501' data-type='single'><p class='quiz-q'><b>Q1.<\/b> <code>\\ref{fig:risk}<\/code> 输出的是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0501' value='0'> 图的文件名<\/label><label class='quiz-opt'><input type='radio' name='q0501' value='1'> 图的编号<\/label><label class='quiz-opt'><input type='radio' name='q0501' value='2'> 图的标题<\/label><label class='quiz-opt'><input type='radio' name='q0501' value='3'> 图的页码<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0502' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 文献列表显示 <code>[?]<\/code>，最先检查？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0502' value='0'> 图片路径<\/label><label class='quiz-opt'><input type='radio' name='q0502' value='1'> 是否跑了 bibtex、cite key 是否匹配<\/label><label class='quiz-opt'><input type='radio' name='q0502' value='2'> 字号设置<\/label><label class='quiz-opt'><input type='radio' name='q0502' value='3'> 页边距<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0503' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 国标顺序编码制的宏包是________。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch06__": "<h1>测验：第 6 章：数模论文模板实战<\/h1><div class='quiz-item' data-qid='q0601' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 要让四级标题带编号，除设置 number 外还必须？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0601' value='0'> 改 tocdepth<\/label><label class='quiz-opt'><input type='radio' name='q0601' value='1'> 把 secnumdepth 调到 4 以上<\/label><label class='quiz-opt'><input type='radio' name='q0601' value='2'> 加载 hyperref<\/label><label class='quiz-opt'><input type='radio' name='q0601' value='3'> 用 appendix<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0602' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 摘要页后的正文要重新从第 1 页编号，应该？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0602' value='0'> 直接 \\setcounter{page}{1}<\/label><label class='quiz-opt'><input type='radio' name='q0602' value='1'> 用 \\pagenumbering{arabic} 重置<\/label><label class='quiz-opt'><input type='radio' name='q0602' value='2'> 改 fancyhdr<\/label><label class='quiz-opt'><input type='radio' name='q0602' value='3'> 重新编译<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0603' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 代码附录应使用________环境，配合 listings 宏包。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='tex 发行版'>TeX 发行版 — 把编译器、宏包、字体打包的整体，如 TeX Live <span class=glossary-ref>（第 1 章：环境与第一次编译）<\/span><\/li><li data-term='xelatex'>xelatex — 原生支持 UTF-8 与系统字体的编译引擎，中文首选 <span class=glossary-ref>（第 1 章：环境与第一次编译）<\/span><\/li><li data-term='ctex 文档类'>ctex 文档类 — 专为中文设计的文档类，自动处理字体与间距 <span class=glossary-ref>（第 1 章：环境与第一次编译）<\/span><\/li><li data-term='aux 文件'>aux 文件 — 编译时记录标签与页码的中间文件，目录与引用靠它 <span class=glossary-ref>（第 1 章：环境与第一次编译）<\/span><\/li><li data-term='zihao'>zihao — ctex 的字号参数，-4 表示小四 <span class=glossary-ref>（第 2 章：中文文档与版式）<\/span><\/li><li data-term='secnumdepth'>secnumdepth — 控制标题编号到第几级的计数器 <span class=glossary-ref>（第 2 章：中文文档与版式）<\/span><\/li><li data-term='tocdepth'>tocdepth — 控制目录显示到第几级的计数器 <span class=glossary-ref>（第 2 章：中文文档与版式）<\/span><\/li><li data-term='fancyhdr'>fancyhdr — 设置页眉页脚的宏包 <span class=glossary-ref>（第 2 章：中文文档与版式）<\/span><\/li><li data-term='行内公式'>行内公式 — 与文字同行的公式，用 $...$ 包裹 <span class=glossary-ref>（第 3 章：数学公式）<\/span><\/li><li data-term='行间公式'>行间公式 — 单独成行的公式，用 \\[...\\] 或 equation 环境 <span class=glossary-ref>（第 3 章：数学公式）<\/span><\/li><li data-term='align 环境'>align 环境 — 多行公式按 &amp; 对齐、逐行编号的环境 <span class=glossary-ref>（第 3 章：数学公式）<\/span><\/li><li data-term='cases 环境'>cases 环境 — 排分段函数的左大括号结构 <span class=glossary-ref>（第 3 章：数学公式）<\/span><\/li><li data-term='浮动体'>浮动体 — figure 与 table 这类由 LaTeX 自动安排位置的对象 <span class=glossary-ref>（第 4 章：图表与浮动体）<\/span><\/li><li data-term='三线表'>三线表 — 只有顶线、表头线、底线的表格，booktabs 提供 <span class=glossary-ref>（第 4 章：图表与浮动体）<\/span><\/li><li data-term='tabularx'>tabularx — 支持自动换行列宽的表格式宏包 <span class=glossary-ref>（第 4 章：图表与浮动体）<\/span><\/li><li data-term='子图'>子图 — 一张图内并排多个小图，用 subcaption 实现 <span class=glossary-ref>（第 4 章：图表与浮动体）<\/span><\/li><li data-term='交叉引用'>交叉引用 — 用 label 与 ref 自动维护编号的机制 <span class=glossary-ref>（第 5 章：目录、交叉引用与参考文献）<\/span><\/li><li data-term='bibtex'>BibTeX — 读 bib 数据库生成文献列表的工具 <span class=glossary-ref>（第 5 章：目录、交叉引用与参考文献）<\/span><\/li><li data-term='gbt7714'>gbt7714 — 符合国标 GB/T 7714 的参考文献样式宏包 <span class=glossary-ref>（第 5 章：目录、交叉引用与参考文献）<\/span><\/li><li data-term='listings'>listings — 排代码的宏包，支持行号与语法高亮 <span class=glossary-ref>（第 6 章：数模论文模板实战）<\/span><\/li><li data-term='导言区'>导言区 — begin document 之前的配置区，放宏包与全局参数 <span class=glossary-ref>（第 6 章：数模论文模板实战）<\/span><\/li><\/ul>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function attachMermaidHint(){document.querySelectorAll('.mermaid').forEach(el=>{if(el.dataset.hinted)return;el.dataset.hinted='1';const h=document.createElement('p');h.className='mermaid-hint';h.textContent='（未能加载绘图脚本：当前显示的是图示源码，联网后刷新即为图形）';el.after(h);});}
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  if(window.__mmFailed){attachMermaidHint();return;}
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  s.onerror=()=>{window.__mmFailed=1;attachMermaidHint();};
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
</body>
</html>
