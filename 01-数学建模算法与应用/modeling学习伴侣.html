<!DOCTYPE html>

<title>数学建模算法与应用（第3版）精讲</title>
<style>
:root{

[data-theme="dark"]{

.layout{display:flex;min-height:100vh}

.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}

.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px}

.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}

.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}

.quiz-opts label{display:block;padding:4px 0;cursor:pointer}

.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}

#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}

</style>
</head>

要改用 Bellman-Ford。"}, {"id": "q0403", "chapterId": "ch04", "type": "blank", "question": "关键路径上任何一道工序延误，整个工期都会________。", "options": [], "answer": "延误", "explain": "关键路径的总时差为零，路径上工序没有机动时间，任一延误直接传导到总工期。"}, {"id": "q0501", "chapterId": "ch05", "type": "single", "question": "插值与拟合最根本的区别是？", "options": ["插值用多项式，拟合不用", "插值必须经过所有数据点，拟合不要求", "插值只能用于一维", "拟合需要更多数据"], "answer": 1, "explain": "是否穿过数据点，决定了误差的处理方式，也是一切方法选择的起点。"}, {"id": "q0502", "chapterId": "ch05", "type": "single", "question": "Runge 现象说明？", "options": ["节点越多，插值一定越准", "等距节点上高次多项式插值在边缘会剧烈振荡", "三次样条不收敛", "拟合不能用于函数逼近"], "answer": 1, "explain": "次数升高时边缘误差可能发散，这是等距节点的固有缺陷。"}, {"id": "q0503", "chapterId": "ch05", "type": "blank", "question": "数据 (1,2)、(2,3)、(3,5) 的最小二乘直线斜率为________。", "options": [], "answer": "1.5", "explain": "分子 3、分母 2，斜率 1.5，截距约 0.333。"}, {"id": "q0601", "chapterId": "ch06", "type": "single", "question": "R₀ = β/γ 大于 1 意味着？", "options": ["疫情必然消失", "一个感染者平均传染超过一个人，疫情可能扩散", "病毒致死率高", "康复速度过快"], "answer": 1, "explain": "R₀ 是基本再生数，大于 1 时感染链能自我维持。"}, {"id": "q0602", "chapterId": "ch06", "type": "single", "question": "Euler 法的主要缺点是？", "options": ["无法处理线性方程", "只有一阶精度，步长大时误差显著", "需要解析解", "不能处理初值问题"], "answer": 1, "explain": "用直线代替曲线，步长越大偏差越大；提高精度要用 RK4 或减小步长。"}, {"id": "q0603", "chapterId": "ch06", "type": "blank", "question": "用 Euler 法解 dy/dt = y、y(0)=1、h=0.5，两步后 y₂ = ________。", "options": [], "answer": "2.25", "explain": "y₁ = 1.5，y₂ = 1.5 + 0.5×1.5 = 2.25，与精确值 e 有约 17% 的相对误差。"}, {"id": "q0701", "chapterId": "ch07", "type": "single", "question": "p 值的正确解读是？", "options": ["H₀ 为真的概率", "H₀ 为真时出现当前或更极端结果的概率", "结论正确的概率", "效应量大小"], "answer": 1, "explain": "p 值是条件概率，条件是 H₀ 成立，它不告诉你 H₀ 本身真不真。"}, {"id": "q0702", "chapterId": "ch07", "type": "single", "question": "Bootstrap 的核心操作是？", "options": ["增加样本量", "有放回重抽样并重复计算统计量", "对数据做正态化变换", "删除异常值"], "answer": 1, "explain": "通过重抽样模拟抽样分布，避免对分布形式做强假设。"}, {"id": "q0703", "chapterId": "ch07", "type": "blank", "question": "样本 10、12、11、13、9 的标准差约为________。", "options": [], "answer": "1.58", "explain": "偏差平方和 10，除以自由度 4 得 2.5，开方约 1.581。"}, {"id": "q0801", "chapterId": "ch08", "type": "single", "question": "xₙ₊₁ = 0.8xₙ + 20 的平衡点是？", "options": ["20", "80", "100", "120"], "answer": 2, "explain": "令 x = 0.8x + 20，得 0.2x = 20，x = 100。"}, {"id": "q0802", "chapterId": "ch08", "type": "single", "question": "一阶系统稳定的条件是？", "options": ["|a| < 1", "a > 0", "b = 0", "|a| > 1"], "answer": 0, "explain": "每期误差按 a 倍缩放，|a| < 1 才会衰减到零。"}, {"id": "q0803", "chapterId": "ch08", "type": "blank", "question": "Leslie 矩阵的主特征值大于 1 表示种群长期________。", "options": [], "answer": "增长", "explain": "主特征值是每期的渐近增长倍数，大于 1 意味着规模逐年扩大。"}, {"id": "q0901", "chapterId": "ch09", "type": "single", "question": "SVM 中决定分类边界的点是？", "options": ["所有样本点", "支持向量", "离边界最远的点", "标签为 0 的点"], "answer": 1, "explain": "只有支持向量进入约束的等号，其他点删掉不影响 w 与 b。"}, {"id": "q0902", "chapterId": "ch09", "type": "single", "question": "惩罚参数 C 增大，通常会导致？", "options": ["间隔变宽，偏差增大", "间隔变窄，更容易过拟合", "模型变成线性回归", "支持向量消失"], "answer": 1, "explain": "C 大意味着不容忍越界，边界被拉紧贴住样本，方差上升。"}, {"id": "q0903", "chapterId": "ch09", "type": "blank", "question": "核函数的作用是隐式地把数据映射到________空间。", "options": [], "answer": "高维", "explain": "在高维空间更容易线性可分，核技巧避免显式计算高维坐标。"}, {"id": "q1001", "chapterId": "ch10", "type": "single", "question": "K-means 必须预先确定的是？", "options": ["距离度量", "聚类数 k", "特征个数", "样本标签"], "answer": 1, "explain": "k 是超参数，通常用肘部法或轮廓系数辅助选择。"}, {"id": "q1002", "chapterId": "ch10", "type": "single", "question": "PCA 中「贡献率」指的是？", "options": ["某个样本的解释比例", "某主成分特征值占全部特征值之和的比例", "分类准确率", "变量个数占比"], "answer": 1, "explain": "特征值代表该方向上的方差，占比即该主成分保留的信息比例。"}, {"id": "q1003", "chapterId": "ch10", "type": "blank", "question": "有标签、要给新样本归类的分析叫________分析。", "options": [], "answer": "判别", "explain": "判别分析先学类别再分类；聚类没有标签。"}, {"id": "q1101", "chapterId": "ch11", "type": "single", "question": "多重共线性的典型后果是？", "options": ["模型无法求解", "回归系数方差变大、符号可能反常", "R² 一定下降", "样本量自动减少"], "answer": 1, "explain": "共线让设计矩阵接近奇异，系数估计对数据扰动极度敏感。"}, {"id": "q1102", "chapterId": "ch11", "type": "single", "question": "PLS 与 PCA 的核心区别是？", "options": ["PLS 不做降维", "PLS 提取成分时同时考虑与 Y 的相关", "PCA 只能用于分类", "PLS 不需要数据"], "answer": 1, "explain": "PCA 只看 X 的方差，PLS 看 X 与 Y 的协方差。"}, {"id": "q1103", "chapterId": "ch11", "type": "blank", "question": "判断变量重要性常用指标是________值，通常大于 1 视为重要。", "options": [], "answer": "VIP", "explain": "VIP 综合了各成分对 Y 的解释力与变量在成分上的载荷。"}, {"id": "q1201", "chapterId": "ch12", "type": "single", "question": "模拟退火中温度 T 的主要作用是？", "options": ["控制迭代次数", "控制接受较差解的概率", "决定编码长度", "计算适应度"], "answer": 1, "explain": "P = exp(−Δ/T)，T 越大越容易接受差解，用于跳出局部最优。"}, {"id": "q1202", "chapterId": "ch12", "type": "single", "question": "TSP 使用遗传算法时，普通交叉会导致？", "options": ["收敛过快", "路径中出现重复或缺失城市", "适应度无法计算", "种群规模爆炸"], "answer": 1, "explain": "普通单点交叉会重复片段，必须用顺序交叉等保序算子。"}, {"id": "q1203", "chapterId": "ch12", "type": "blank", "question": "启发式算法论文必须报告多次独立运行的________，而不只是最好值。", "options": [], "answer": "分布（平均值与标准差）", "explain": "单次结果无法区分「算法稳定」与「运气好」。"}, {"id": "q1301", "chapterId": "ch13", "type": "single", "question": "灰度化时绿色通道权重最大的原因是？", "options": ["绿色像素最多", "人眼对绿光最敏感", "绿色通道噪声最小", "计算方便"], "answer": 1, "explain": "加权系数按人眼亮度感知设定，绿光权重 0.587 最高。"}, {"id": "q1302", "chapterId": "ch13", "type": "single", "question": "椒盐噪声最适合用哪种滤波？", "options": ["均值滤波", "中值滤波", "高通滤波", "直方图均衡"], "answer": 1, "explain": "中值滤波能剔除极端值同时保住边缘，均值会把噪声摊到整片区域。"}, {"id": "q1303", "chapterId": "ch13", "type": "blank", "question": "3×3 均值滤波窗口中，每个位置的权重是________。", "options": [], "answer": "1/9", "explain": "九个像素等权平均，总和为 1，保证整体亮度不漂移。"}, {"id": "q1401", "chapterId": "ch14", "type": "single", "question": "成本型指标标准化时应该？", "options": ["直接除以最大值", "用 (max − x)/(max − min)", "取对数", "平方后归一"], "answer": 1, "explain": "成本型越小越好，极差法要反向，使标准化后仍是越大越好。"}, {"id": "q1402", "chapterId": "ch14", "type": "single", "question": "熵权法的权重反映的是？", "options": ["指标的业务重要性", "指标在方案间的区分度", "指标间的相关性", "样本量大小"], "answer": 1, "explain": "熵小说明分布不均、区分度大，权重高；与重要性无必然关系。"}, {"id": "q1403", "chapterId": "ch14", "type": "blank", "question": "TOPSIS 通过计算方案到正理想解与负理想解的________来排序。", "options": [], "answer": "距离", "explain": "离正理想越近、离负理想越远，综合得分越高。"}, {"id": "q1501", "chapterId": "ch15", "type": "single", "question": "GM(1,1) 适合的数据特征是？", "options": ["大样本、强季节性", "小样本、近似指数趋势", "状态离散、转移稳定", "多变量非线性"], "answer": 1, "explain": "GM 通过一次累加把序列变成近似指数，适合数据点少的单调趋势。"}, {"id": "q1502", "chapterId": "ch15", "type": "single", "question": "ARIMA 中的 d 表示？", "options": ["差分次数", "自回归阶数", "移动平均阶数", "样本量"], "answer": 0, "explain": "d 是把非平稳序列差分成平稳序列所需的次数。"}, {"id": "q1503", "chapterId": "ch15", "type": "blank", "question": "评估预测精度必须做________检验，而不是只看样本内拟合。", "options": [], "answer": "样本外", "explain": "样本内拟合优度高不代表泛化能力好，留出末段数据做真实验证才有意义。"}, {"id": "q1601", "chapterId": "ch16", "type": "single", "question": "Pareto 有效解的含义是？", "options": ["所有目标都最大", "不存在全面更优的解", "加权和最大的解", "约束最少的解"], "answer": 1, "explain": "有效解指不被任何其他解全面超越，可能有很多个。"}, {"id": "q1602", "chapterId": "ch16", "type": "single", "question": "加权和法的主要局限是？", "options": ["不能处理两个以上目标", "非凸前沿上会漏掉中间解", "必须用整数规划", "权重必须相等"], "answer": 1, "explain": "加权和只能取到支撑点，非凸部分取不到，需改用 ε 约束法。"}, {"id": "q1603", "chapterId": "ch16", "type": "blank", "question": "目标规划中 d⁺ 表示实际值相对目标值的________量。", "options": [], "answer": "超出", "explain": "d⁺ 是正偏差（超出），d⁻ 是负偏差（不足），两者不能同时非零。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "线性规划的最优解一定在哪里？", "back": "可行域的顶点（或边界），只要最优解存在", "tags": ["线性规划", "几何"]}, {"id": "f02", "chapterId": "ch01", "front": "影子价格的含义？", "back": "约束右端项每增加一个单位，目标函数能增加的量，等于对偶变量", "tags": ["线性规划", "对偶"]}, {"id": "f03", "chapterId": "ch01", "front": "影子价格为 0 说明什么？", "back": "该约束未起作用，资源有闲置，追加投入不改变最优值", "tags": ["线性规划", "排错"]}, {"id": "f04", "chapterId": "ch02", "front": "为什么整数规划不能解完取整？", "back": "取整可能违反约束，也可能错过更优的格点，例：max 3x₁+4x₂, 3x₁+5x₂≤8 真正最优是 (1,1) 得 7", "tags": ["整数规划", "常见错误"]}, {"id": "f05", "chapterId": "ch02", "front": "0-1 变量怎么表达「最多选一个」？", "back": "y_A + y_B ≤ 1", "tags": ["整数规划", "建模技巧"]}, {"id": "f06", "chapterId": "ch02", "front": "分枝定界的剪枝依据？", "back": "节点的线性松弛值已不如现有整数解，该分支不可能更优", "tags": ["整数规划", "算法"]}, {"id": "f07", "chapterId": "ch03", "front": "凸规划的好处？", "back": "局部最优即全局最优，梯度类算法不会停在半山腰", "tags": ["非线性规划"]}, {"id": "f08", "chapterId": "ch03", "front": "KKT 互补松弛的含义？", "back": "约束未起作用时乘子为零，起作用时乘子可正，λᵢgᵢ = 0", "tags": ["非线性规划", "理论"]}, {"id": "f09", "chapterId": "ch04", "front": "Dijkstra 的前提条件？", "back": "边权非负；有负权要改 Bellman-Ford 或 Floyd", "tags": ["图论", "算法"]}, {"id": "f10", "chapterId": "ch04", "front": "最短路与最小生成树的区别？", "back": "前者求一对点之间路径最短，后者求连通全图的边集总权最小", "tags": ["图论"]}, {"id": "f11", "chapterId": "ch04", "front": "n 个点的生成树有几条边？", "back": "n−1 条，且无环、连通", "tags": ["图论", "基础"]}, {"id": "f12", "chapterId": "ch05", "front": "插值与拟合的根本区别？", "back": "插值必须穿过每个数据点，拟合只要求整体误差最小", "tags": ["插值拟合"]}, {"id": "f13", "chapterId": "ch05", "front": "Runge 现象说明什么？", "back": "等距节点上提高多项式次数，边缘振荡加剧，误差反而变大", "tags": ["插值拟合", "常见错误"]}, {"id": "f14", "chapterId": "ch05", "front": "三次样条比高次多项式好在哪？", "back": "分段低次、节点处一二阶导数连续，稳定且光滑", "tags": ["插值拟合"]}, {"id": "f15", "chapterId": "ch06", "front": "微分方程建模的第一步？", "back": "找出「变化率等于什么」，即把机制写成 dX/dt = f", "tags": ["微分方程"]}, {"id": "f16", "chapterId": "ch06", "front": "Euler 法与 RK4 的精度阶数？", "back": "Euler 一阶，RK4 四阶；步长减半可检验收敛性", "tags": ["微分方程", "数值解"]}, {"id": "f17", "chapterId": "ch06", "front": "R₀ 的定义与含义？", "back": "R₀ = β/γ，一个感染者平均传染的人数，大于 1 疫情扩散", "tags": ["微分方程", "传染病"]}, {"id": "f18", "chapterId": "ch07", "front": "p 值的准确含义？", "back": "H₀ 为真时，出现当前或更极端结果的概率，不是 H₀ 为真的概率", "tags": ["统计", "假设检验"]}, {"id": "f19", "chapterId": "ch07", "front": "不拒绝 H₀ 该怎么表述？", "back": "没有足够证据说明有差异，不能说「两者相等」", "tags": ["统计", "表述"]}, {"id": "f20", "chapterId": "ch07", "front": "Bootstrap 的核心操作？", "back": "有放回重抽样，重复计算统计量，用其分布代替理论抽样分布", "tags": ["统计"]}, {"id": "f21", "chapterId": "ch08", "front": "一阶差分方程 xₙ₊₁ = axₙ + b 的平衡点？", "back": "x* = b/(1−a)，稳定条件 |a| < 1", "tags": ["差分方程"]}, {"id": "f22", "chapterId": "ch08", "front": "Leslie 矩阵的结构？", "back": "首行各年龄组繁殖率，次对角线为存活率，主特征值定长期增长率", "tags": ["差分方程", "种群"]}, {"id": "f23", "chapterId": "ch09", "front": "SVM 的间隔公式？", "back": "2/‖w‖，要求支持向量处 wᵀx + b = ±1", "tags": ["SVM"]}, {"id": "f24", "chapterId": "ch09", "front": "SVM 的 C 增大意味着什么？", "back": "更不容忍越界，间隔变窄，方差上升，容易过拟合", "tags": ["SVM", "调参"]}, {"id": "f25", "chapterId": "ch09", "front": "核函数的作用？", "back": "隐式映射到高维，使线性不可分变可分，无需算高维坐标", "tags": ["SVM"]}, {"id": "f26", "chapterId": "ch10", "front": "聚类与判别的区别？", "back": "聚类无标签按相似度分组，判别有标签学分类规则", "tags": ["多元分析"]}, {"id": "f27", "chapterId": "ch10", "front": "PCA 的贡献率是什么？", "back": "某主成分特征值占全部特征值之和的比例，即保留的方差份额", "tags": ["多元分析", "降维"]}, {"id": "f28", "chapterId": "ch10", "front": "PCA 与因子分析的区别？", "back": "PCA 是线性变换无模型假设，因子分析假设潜在因子生成观测变量", "tags": ["多元分析"]}, {"id": "f29", "chapterId": "ch11", "front": "多重共线性的后果？", "back": "系数方差大、符号反常、可解释性丧失，VIF > 10 是常见判据", "tags": ["回归", "偏最小二乘"]}, {"id": "f30", "chapterId": "ch11", "front": "PLS 与 PCA 的关键差别？", "back": "PLS 提取成分时同时考虑与 Y 的协方差，PCA 只看 X 的方差", "tags": ["偏最小二乘"]}, {"id": "f31", "chapterId": "ch12", "front": "模拟退火的接受概率？", "back": "P = exp(−Δ/T)，Δ 为变差量，T 为温度，温度高更易接受差解", "tags": ["启发式算法"]}, {"id": "f32", "chapterId": "ch12", "front": "遗传算法五件套？", "back": "编码、适应度、选择、交叉、变异", "tags": ["启发式算法"]}, {"id": "f33", "chapterId": "ch12", "front": "启发式结果必须报告什么？", "back": "多次独立运行的最好值、平均值、标准差，而不只是最好值", "tags": ["启发式算法", "论文规范"]}, {"id": "f34", "chapterId": "ch13", "front": "图像在计算机里是什么？", "back": "灰度图是 m×n 矩阵，彩色图是 m×n×3 的三通道矩阵", "tags": ["图像处理"]}, {"id": "f35", "chapterId": "ch13", "front": "均值滤波与中值滤波的取舍？", "back": "均值去噪但糊边，中值保边、适合椒盐噪声", "tags": ["图像处理"]}, {"id": "f36", "chapterId": "ch14", "front": "综合评价的四步？", "back": "定指标、标准化、定权重、合成排序", "tags": ["综合评价"]}, {"id": "f37", "chapterId": "ch14", "front": "熵权法权重反映什么？", "back": "指标在方案间的区分度，不是业务重要性", "tags": ["综合评价", "权重"]}, {"id": "f38", "chapterId": "ch14", "front": "TOPSIS 的排序依据？", "back": "到正理想解与负理想解的欧氏距离，离正近、离负远者优", "tags": ["综合评价"]}, {"id": "f39", "chapterId": "ch15", "front": "GM(1,1) 适合什么数据？", "back": "小样本、近似指数趋势的单调序列，先做级比检验", "tags": ["预测"]}, {"id": "f40", "chapterId": "ch15", "front": "预测精度必须包含什么？", "back": "样本外检验指标（MAE/RMSE/MAPE）与预测区间", "tags": ["预测", "论文规范"]}, {"id": "f41", "chapterId": "ch16", "front": "Pareto 有效解？", "back": "不存在所有目标都不差且至少一个更好的解，多目标输出的是前沿", "tags": ["多目标"]}, {"id": "f42", "chapterId": "ch16", "front": "加权和法的局限？", "back": "非凸 Pareto 前沿上会漏掉中间解，只能取到支撑点", "tags": ["多目标"]}, {"id": "f43", "chapterId": "ch16", "front": "目标规划中的偏差变量？", "back": "d⁺ 为超出目标的量，d⁻ 为不足的量，两者不能同时非零", "tags": ["多目标", "目标规划"]}], "companion": "modeling学习伴侣.html"}, "pages": {"ch01": {"html": "<h1>第 1 章：线性规划<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：起步册第 1–3 章 | <strong>原书定位<\/strong>：第 1 章 p1–17\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n把「资源有限、要最大化收益」的问题写成标准线性规划；\n<\/li><li>\n手算二元线性规划的可行域顶点并验证最优解；\n<\/li><li>\n说清影子价格的含义，并用它回答「多一小时工时值多少钱」。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>线性规划只做一件事：在凸多边形的可行域里找一个顶点，让目标函数最大。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：线性到底指什么（难度：基础）<\/h3>\n<p><strong>线性规划（LP）<\/strong>：目标函数和每条约束都是决策变量的一次式，变量之间只加减、不乘除、不平方。<\/p>\n<p>为什么这个限制重要？因为它保证可行域是凸的。凸集合有一个好性质：目标函数在边界上的最大值一定能在某个顶点取到。于是「在无穷多个可行解里找最优」变成「把有限个顶点各算一算」。<\/p>\n<h3>概念 2：标准型（难度：基础）<\/h3>\n<p>教材的统一写法是：<\/p>\n<pre class=\"lang-text\"><code>max  z = c₁x₁ + c₂x₂ + … + cₙxₙ\ns.t. a₁₁x₁ + … + a₁ₙxₙ ≤ b₁\n     ……\n     xⱼ ≥ 0<\/code><\/pre>\n<p>min 型、≥ 型、无约束变量，都能通过取负、加松弛变量、拆成两个非负变量转成标准型。软件内部做的就是这套转换，你只要按它的接口喂数。<\/p>\n<h3>概念 3：可行域与顶点（难度：基础）<\/h3>\n<p><strong>可行域<\/strong>：所有满足约束的点组成的集合。二维时画出来是一个多边形。<\/p>\n<p><strong>顶点<\/strong>：两条约束线的交点。线性规划的最优解（如果存在）一定能在顶点上找到。这也是为什么单纯形法只沿顶点走，不算内部。<\/p>\n<h3>概念 4：影子价格（难度：进阶）<\/h3>\n<p><strong>影子价格<\/strong>：某个资源约束的右端项每增加一个单位，目标函数能增加多少。<\/p>\n<p>它等于对偶变量。含义很实用：如果 A 机器工时每小时影子价格是 1 千元，而加班成本是每小时 0.6 千元，那加班划算；反之不划算。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[资源限制与收益] --&gt; B[写目标函数]\n    B --&gt; C[写约束不等式]\n    C --&gt; D[画可行域]\n    D --&gt; E[枚举顶点]\n    E --&gt; F[取目标值最大的顶点]\n    F --&gt; G[影子价格与决策建议]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：注意「枚举顶点」这一步在二维才手工可行，三维以上必须交给单纯形法或软件。图里没有「检验」这一步，因为线性规划的解一定满足约束，要检验的是模型假设是否符合现实。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：线性规划像在有限预算内点菜，菜价和预算是线性的，你要在预算线内选组合让满意度最高。失效边界：真实偏好不是线性的，点多了会腻，这时候模型算出的「全点最贵那道」并不最优。\n<\/li><li>\n<strong>实例（可手算核对）<\/strong>：某机床厂生产甲、乙两种机床，单台利润 4 千元与 3 千元。甲需 A 机器 2 h、B 机器 1 h；乙需 A、B、C 各 1 h。每天可用工时 A 10 h、B 8 h、C 7 h。\n<p>模型：max z = 4x₁ + 3x₂，s.t. 2x₁ + x₂ ≤ 10，x₁ + x₂ ≤ 8，x₂ ≤ 7，x₁,x₂ ≥ 0。 顶点：两线交点为 (2, 6)；与 x₂ 轴交 (0, 10) 越界，取 (0, 7)；(1, 7) 处 z = 25；(5, 0) 处 z = 20；(2, 6) 处 z = 26。最优 (2, 6)，日利润 2.6 万元。 影子价格核对：把 A 的可用工时从 10 改到 11，前两条约束交点变成 (3, 5)，z = 12 + 15 = 27，比 26 多 1。所以 A 的每小时影子价格为 1 千元。<\/p>\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为变量越多模型越准——实际上每加一个变量，就多一组约束要交代，没数据支撑的变量只会让解失去意义。\n<\/li><li>\n别以为最优解一定在可行域内部——实际上线性规划的最优解几乎总在边界顶点，内部点最优只发生在目标函数是常数时。\n<\/li><li>\n别以为算出「无界」是软件坏了——实际上是你漏了上界约束，比如「产量不限」这种假设，会让利润无限增大。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】线性规划的可行域一定是？<\/h3>\n<ul><li>\nA. 凸多边形或凸多面体\n<\/li><li>\nB. 圆形\n<\/li><li>\nC. 任意形状\n<\/li><li>\nD. 一条曲线\n<p><strong>答案<\/strong>：A <strong>解析<\/strong>：线性不等式组的交集是凸集，二维时表现为凸多边形，这也是顶点枚举有效的原因。<\/p>\n<\/ul>\n<h3>Q2 【单选】某约束的影子价格为 0，说明？<\/h3>\n<ul><li>\nA. 该资源完全用尽\n<\/li><li>\nB. 该资源还有剩余，再增加它不能提高目标值\n<\/li><li>\nC. 模型无解\n<\/li><li>\nD. 该约束写错了\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：影子价格为零意味着该约束不是紧约束，资源尚有闲置，追加投入不改变最优值。<\/p>\n<\/ul>\n<h3>Q3 【填空】把 max z 转成 scipy 能接受的形式，需要把目标系数全部________。<\/h3>\n<p><strong>答案<\/strong>：取负 <strong>解析<\/strong>：<code>linprog<\/code> 只做最小化，最大化问题等价于最小化 −z，最后把结果取负还原。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n线性 = 一次式，所以可行域凸，最优解在顶点。\n<\/li><li>\n标准型只有 ≤ 与非负约束，其余形式都靠转换。\n<\/li><li>\n影子价格 = 右端项加一单位带来的目标增量，用来判断资源该不该追加。\n<\/ul>", "kind": "chapter", "title": "第 1 章：线性规划"}, "ch02": {"html": "<h1>第 2 章：整数规划<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 1 章 | <strong>原书定位<\/strong>：第 2 章 p18–36\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n判断一个问题为什么不能直接把线性规划的解四舍五入；\n<\/li><li>\n用分枝定界的手算流程解一个二元小例子；\n<\/li><li>\n把「要么选要么不选」写成 0-1 变量，把指派问题写成 0-1 规划。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>整数规划难，不是因为约束多，而是因为可行域被切成了一堆散点，线性规划那套「沿顶点走」的几何直觉失效了。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：整数约束为什么破坏结构（难度：基础）<\/h3>\n<p>线性规划的最优解出现在顶点，顶点是连续的。要求 x 取整数后，可行点变成离散的格点，最优格点可能离原来的顶点很远。<\/p>\n<p>一个例子就够：max z = 3x₁ + 4x₂，s.t. 3x₁ + 5x₂ ≤ 8，x₁, x₂ ≥ 0。<\/p>\n<p>连续最优是 (2.667, 0)，z = 8。四舍五入到 (3, 0)，代回约束 3×3 = 9 &gt; 8，直接不可行。退一步取 (2, 0)，z = 6。真正的整数最优是 (1, 1)，z = 3 + 4 = 7，比取整结果高出一档。<\/p>\n<p>一个例子同时暴露两种病：取整可能破坏约束，取整也可能错过更优的格点。这两点就是整数规划不能用「解完取整」的全部理由。<\/p>\n<h3>概念 2：0-1 变量（难度：基础）<\/h3>\n<p><strong>0-1 变量<\/strong>：只取 0 或 1 的变量，用来表达「选或不选」。它是整数规划最常用的建模零件。<\/p>\n<p>常用写法：<\/p>\n<ul><li>\n选第 j 个方案：yⱼ ∈ {0,1}，目标里写 cⱼyⱼ。\n<\/li><li>\n最多选 k 个：∑yⱼ ≤ k。\n<\/li><li>\nA 与 B 不能同时选：y_A + y_B ≤ 1。\n<\/li><li>\n选了 A 才能选 B：y_B ≤ y_A。\n<\/ul>\n<h3>概念 3：分枝定界（难度：进阶）<\/h3>\n<p><strong>分枝定界<\/strong>：先解连续松弛，得到一个小数解；挑一个取小数的变量，把它分成「≤ 下取整」和「≥ 上取整」两支，分别再解；用已找到的整数解作为上界，剪掉不可能更好的分支。<\/p>\n<p>手算流程（以上面的 max 3x₁ + 4x₂，3x₁ + 5x₂ ≤ 8 为例）：<\/p>\n<ol><li>\n松弛解 x = (2.667, 0)，z = 8，这是上界。\n<\/li><li>\n对 x₁ 分枝：x₁ ≤ 2 与 x₁ ≥ 3。x₁ ≥ 3 时 3x₁ ≥ 9 &gt; 8，不可行，剪掉。\n<\/li><li>\nx₁ ≤ 2 分支：约束变 3x₁ + 5x₂ ≤ 8，x₁ ≤ 2，解出 x₁ = 2, x₂ = 0.4，z = 6 + 1.6 = 7.6。\n<\/li><li>\n再对 x₂ 分枝：x₂ ≤ 0 得 (2, 0)，z = 6；x₂ ≥ 1 得 x₁ ≤ 1，解 (1, 1)，z = 7。\n<\/li><li>\n比较整数解 6 与 7，取 7。上界 8 已无法再改进，停止。\n<\/ol>\n<p>分枝定界慢，但保证找到最优；启发式（如贪心）快，但不保证。比赛里题目规模小就用精确算法，规模大就用启发式并在论文里说明「近似」。<\/p>\n<h3>概念 4：指派问题（难度：进阶）<\/h3>\n<p>n 个人做 n 件事，每人做每件事的成本不同，求总成本最小的分配。模型是 0-1 规划：xᵢⱼ = 1 表示第 i 人做第 j 事，每行和为 1、每列和为 1。它的特殊结构可以用匈牙利算法在多项式时间求解，不必用通用整数规划。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[连续松弛解] --&gt; B{是否全为整数}\n    B --&gt;|是| C[得到最优整数解]\n    B --&gt;|否| D[选一个小数变量分枝]\n    D --&gt; E[左支 向下取整]\n    D --&gt; F[右支 向上取整]\n    E --&gt; G[重解并更新上界]\n    F --&gt; G\n    G --&gt; B<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这是一棵搜索树，每个节点都是一次线性规划。剪枝的依据是「这个节点的松弛上界已经不如现有整数解」，没有这个上界，树会指数爆炸。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：整数规划像在一堆整箱货物里装箱，箱子不能拆开。线性规划允许你把箱子切开凑重量，整数规划不允许。失效边界：现实里有时允许拆，比如散装货物，那就退回线性规划。\n<\/li><li>\n<strong>实例（可手算）<\/strong>：背包容量 5，三件物品重量与价值分别为 (2, 3)、(3, 4)、(4, 5)。枚举 8 种组合：只选 1 得 3；选 2 得 4；选 3 重量 4 得 5；选 1+2 重量 5 得 7；1+3 重量 6 超重；2+3 重量 7 超重；三件全选超重。最优是选第 1、2 件，价值 7。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为把线性规划解四舍五入就行——实际上可能既不可行也不是最优，必须验证约束。\n<\/li><li>\n别以为整数规划只是「加个取整」——实际上它的求解复杂度高一个量级，很多问题是 NP 难的。\n<\/li><li>\n别以为 0-1 变量只能表示选择——实际上它还能表示「启动成本」「是否开启一条产线」这类固定费用。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】线性规划松弛解为 (2.67, 0)，下列做法正确的是？<\/h3>\n<ul><li>\nA. 直接四舍五入得 (3, 0)\n<\/li><li>\nB. 以松弛解为上界做分枝定界\n<\/li><li>\nC. 认为问题无解\n<\/li><li>\nD. 把约束改成等式\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：松弛解给出上界，分枝定界在此之上搜索整数解；直接取整可能违反约束。<\/p>\n<\/ul>\n<h3>Q2 【单选】「A、B 两个项目最多上一个」应写成？<\/h3>\n<ul><li>\nA. y_A + y_B ≤ 1\n<\/li><li>\nB. y_A + y_B ≥ 1\n<\/li><li>\nC. y_A − y_B ≤ 1\n<\/li><li>\nD. y_A × y_B ≤ 1\n<p><strong>答案<\/strong>：A <strong>解析<\/strong>：两个 0-1 变量之和不超过 1，恰好表达「至多选一个」；乘积不是线性式，不能出现在线性约束里。<\/p>\n<\/ul>\n<h3>Q3 【填空】指派问题的约束特点是每行之和为 1、每列之和为________。<\/h3>\n<p><strong>答案<\/strong>：1 <strong>解析<\/strong>：一个人只做一件事、一件事只由一个人做，两个方向都恰好为 1，这才构成合法指派。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n整数约束把连续可行域切成格点，几何直觉失效。\n<\/li><li>\n0-1 变量是表达选择、互斥、依赖的标准零件。\n<\/li><li>\n分枝定界靠松弛上界剪枝，规模大时改用启发式并说明精度。\n<\/ul>", "kind": "chapter", "title": "第 2 章：整数规划"}, "ch03": {"html": "<h1>第 3 章：非线性规划<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 1 章、起步册第 2 章 | <strong>原书定位<\/strong>：第 3 章 p37–61\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n判断一个非线性规划是凸的还是可能有多个局部最优；\n<\/li><li>\n写出 KKT 条件，并用它手算一个带线性约束的极小值问题；\n<\/li><li>\n说清「罚函数」和「序列二次规划」分别在什么场景下用。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>线性规划只有一个最优解，非线性规划可能有一堆，算法只保证找到其中一个——所以凸性比算法更重要。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：凸函数与凸规划（难度：基础）<\/h3>\n<p><strong>凸函数<\/strong>：图像上任意两点连线都在函数图像上方（碗形）。判定方法：二阶导数（一元）或海森矩阵（多元）半正定。<\/p>\n<p><strong>凸规划<\/strong>：目标函数凸、可行域凸。它的局部最优就是全局最优，梯度类算法不会掉进坑里。<\/p>\n<p>建模时要先问一句：我的目标函数凸吗？如果凸，放心用算法；如果不凸，要么换建模方式，要么用多起点搜索。<\/p>\n<h3>概念 2：KKT 条件（难度：进阶）<\/h3>\n<p><strong>KKT 条件<\/strong>：带约束的极值点必须满足的一组条件，包括：<\/p>\n<ol><li>\n梯度平衡：∇f + ∑λᵢ∇gᵢ = 0，即目标函数的梯度被约束的梯度「抵消」；\n<\/li><li>\n可行性：所有约束满足；\n<\/li><li>\n互补松弛：λᵢgᵢ = 0，约束没起作用时乘子为零，起作用时乘子可以为正；\n<\/li><li>\n乘子非负（不等式约束）。\n<\/ol>\n<p>一句话理解：在最优点，你没法沿着任何可行方向再改善目标，因为改善方向都被约束挡住了。<\/p>\n<h3>概念 3：二次规划（难度：进阶）<\/h3>\n<p><strong>二次规划（QP）<\/strong>：目标函数是二次型，约束是线性的。它是非线性规划里最好解的一类，有成熟算法。<\/p>\n<p>判断标准：目标函数写成 ½xᵀHx + fᵀx，H 半正定则凸。投资组合、最小二乘、支持向量机都归到这里。<\/p>\n<h3>概念 4：罚函数与启发式（难度：进阶）<\/h3>\n<ul><li>\n<strong>罚函数法<\/strong>：把约束违反量加到目标里，min f(x) + M·max(0, g(x))²，M 逐渐增大。优点是简单，缺点是大 M 会让数值病态。\n<\/li><li>\n<strong>梯度法/牛顿法<\/strong>：沿负梯度方向走，牛顿法用二阶信息，收敛快但对初值敏感。\n<\/li><li>\n<strong>启发式<\/strong>：不保证最优，只求可用解。目标函数不可导、变量多、有整数约束时常用。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[非线性模型] --&gt; B{目标与可行域是否凸}\n    B --&gt;|凸| C[梯度法 牛顿法 内点法]\n    B --&gt;|非凸| D{规模大小}\n    D --&gt;|小| E[多起点搜索]\n    D --&gt;|大| F[遗传算法 退火 粒子群]\n    C --&gt; G[得到全局最优]\n    E --&gt; H[得到较优解 需报告多起点结果]\n    F --&gt; H<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：凸性判断在第二步，很多人跳过它直接调算法，结果在非凸问题上反复得到不同的局部最优，却以为是算法不稳定。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：凸规划像碗底放球，怎么滚都滚到最低点；非凸规划像山地地形，球可能停在半山腰的小坑里。失效边界：真实优化问题常有多个「小坑」，球的起点决定结果，所以要多起点。\n<\/li><li>\n<strong>实例（可手算）<\/strong>：min f = (x₁ − 1)² + (x₂ − 2)²，s.t. x₁ + x₂ ≤ 2。\n<p>无约束最优点是 (1, 2)，但 1 + 2 = 3 &gt; 2，不可行。 最优点必在边界 x₁ + x₂ = 2 上。把 (1, 2) 投影到这条线上：沿法向 (1,1) 移动，移动量 = (3 − 2)/2 = 0.5，得 (0.5, 1.5)。 代回 f = (0.5 − 1)² + (1.5 − 2)² = 0.25 + 0.25 = 0.5。 KKT 核对：∇f = (2(x₁−1), 2(x₂−2)) = (−1, −1)，约束梯度 (1, 1)，取 λ = 1 得 (−1,−1) + 1×(1,1) = 0，满足梯度平衡。<\/p>\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为软件返回「优化成功」就是全局最优——实际上局部算法只保证局部，非凸问题必须多起点或换全局算法。\n<\/li><li>\n别以为约束越多越安全——实际上新增约束可能让可行域变成空集，求解器报 status=2。\n<\/li><li>\n别以为非线性规划一定比线性规划高级——实际上能用线性模型解决的问题，用非线性只会增加不确定性。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】判断多元目标函数是否凸，主要看？<\/h3>\n<ul><li>\nA. 一阶导数是否为零\n<\/li><li>\nB. 海森矩阵是否半正定\n<\/li><li>\nC. 变量个数\n<\/li><li>\nD. 约束个数\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：海森矩阵半正定等价于函数凸，这是一元二阶导数判据的推广。<\/p>\n<\/ul>\n<h3>Q2 【单选】KKT 条件中「互补松弛」的含义是？<\/h3>\n<ul><li>\nA. 所有约束都必须取等号\n<\/li><li>\nB. 约束未起作用时对应乘子为零\n<\/li><li>\nC. 乘子必须为负\n<\/li><li>\nD. 目标函数必须为零\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：λᵢgᵢ = 0 表示约束与乘子至少一个为零，未起作用的约束不产生「价格」。<\/p>\n<\/ul>\n<h3>Q3 【填空】把 (1, 2) 投影到直线 x₁ + x₂ = 2 上，得到的点是________。<\/h3>\n<p><strong>答案<\/strong>：(0.5, 1.5) <strong>解析<\/strong>：沿法向 (1,1) 移动 (3−2)/2 = 0.5，坐标各减 0.5。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n凸性决定算法能不能信，先判凸再选方法。\n<\/li><li>\nKKT 是「无法再改善」的数学表达，互补松弛是核心。\n<\/li><li>\n非凸问题必须多起点，并在论文里报告不同起点的结果。\n<\/ul>", "kind": "chapter", "title": "第 3 章：非线性规划"}, "ch04": {"html": "<h1>第 4 章：图与网络模型及方法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 1–3 章 | <strong>原书定位<\/strong>：第 4 章 p62–112\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n把「点与点之间有关系」的问题画成图，写出邻接矩阵；\n<\/li><li>\n手跑 Dijkstra 求最短路，手跑 Kruskal 求最小生成树；\n<\/li><li>\n分清最短路、最小生成树、最大流、TSP、关键路径五类问题各自的用途。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>图论建模的本质是选对问题类型：同一张图，问法不同，算法完全不同。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：图的三种存法（难度：基础）<\/h3>\n<p><strong>图<\/strong>：点（顶点）和边组成的结构。边有方向叫有向图，带数字叫带权图。<\/p>\n<p>三种存法各有用途：<\/p>\n<ul><li>\n<strong>邻接矩阵<\/strong> A：aᵢⱼ 表示 i 到 j 有没有边或权值。适合稠密图，矩阵运算方便。\n<\/li><li>\n<strong>邻接表<\/strong>：每个点存一个邻居列表。适合稀疏图，省空间。\n<\/li><li>\n<strong>边列表<\/strong>：只存 (起点, 终点, 权重)。适合 Kruskal 这类按边排序的算法。\n<\/ul>\n<h3>概念 2：最短路（难度：基础）<\/h3>\n<p><strong>Dijkstra 算法<\/strong>：从起点出发，每次从未确定的点里挑距离最小的，用它去更新邻居，直到所有点确定。要求边权非负。<\/p>\n<p>手算例子：5 个点，边与权值 1-2: 2、1-3: 5、2-3: 1、2-4: 4、3-4: 2、3-5: 6、4-5: 1。<\/p>\n<ol><li>\n起点 1，距离表：1=0，2=2，3=5，4=∞，5=∞。\n<\/li><li>\n选 2，更新：3 = min(5, 2+1) = 3；4 = min(∞, 2+4) = 6。\n<\/li><li>\n选 3（距离 3），更新：4 = min(6, 3+2) = 5；5 = 3+6 = 9。\n<\/li><li>\n选 4（距离 5），更新：5 = min(9, 5+1) = 6。\n<\/li><li>\n选 5，结束。最短路 1→2→3→4→5，长度 6。\n<\/ol>\n<p>若边权有负数，Dijkstra 失效，改用 Bellman-Ford 或 Floyd。<\/p>\n<h3>概念 3：最小生成树（难度：基础）<\/h3>\n<p><strong>生成树<\/strong>：连通所有点且不含环的子图，n 个点需要 n−1 条边。<strong>最小生成树<\/strong>是总权重最小的那棵。<\/p>\n<p>Kruskal：把所有边按权重从小到大排序，依次加入，若成环就跳过。上例排序为 2-3:1、4-5:1、1-2:2、3-4:2、1-3:5、3-5:6，取前四条，总权重 1+1+2+2 = 6。<\/p>\n<p>最小生成树回答「怎么连线最省」，最短路回答「从 A 到 B 怎么走最快」，两者不是一回事。<\/p>\n<h3>概念 4：最大流与关键路径（难度：进阶）<\/h3>\n<ul><li>\n<strong>最大流<\/strong>：源点到汇点最多能送多少流量，每条边有容量上限。求解用增广路算法（Ford-Fulkerson / Dinic）。\n<\/li><li>\n<strong>关键路径<\/strong>：项目管理里，从开工到完工的最长路径，路径上的工序没有机动时间，延误一天整体就延误一天。求法是对 AOE 网络做拓扑排序，算最早开始与最晚开始时间。\n<\/ul>\n<h3>概念 5：旅行商问题（难度：高难）<\/h3>\n<p><strong>TSP<\/strong>：从起点出发，遍历所有点各一次再回到起点，求最短路线。它是 NP 难的，点数超过 20 基本只能求近似解，用第 12 章的遗传算法或退火。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[一张带权图] --&gt; B{问什么}\n    B --&gt;|两点间怎么走最快| C[Dijkstra 最短路]\n    B --&gt;|全部连通最省| D[Kruskal 最小生成树]\n    B --&gt;|最多能送多少| E[最大流]\n    B --&gt;|一圈走完最短| F[TSP 启发式]\n    B --&gt;|工期最短| G[关键路径]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：同一个起点问题，五个分支给出五种完全不同的答案。建模时先把「问什么」说清，再选算法。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：最短路像导航软件算最快路线，最小生成树像给几个村子铺自来水管道总长最短。失效边界：导航考虑实时路况，静态图模型不考虑，所以结果可能和实际差很多。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：上例中，从 1 到 5 的最短路是 6；若把 3-5 的权值从 6 改成 2，则 1→3→5 长 3+2 = 5，比 6 更短，Dijkstra 第 3 步就会把 5 更新为 5。这说明算法结果依赖权值，权值错一位，结论全变。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为最短路和最小生成树可以互换——实际上它们的优化对象不同：一个是一对点的路径，一个是全图的边集。\n<\/li><li>\n别以为 Dijkstra 能处理负权——实际上负权会让「已确定」的点被再次改进，算法前提被破坏。\n<\/li><li>\n别以为 TSP 可以用最短路算法解决——实际上 TSP 要求遍历全部点，复杂度高得多。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】n 个点的最小生成树有几条边？<\/h3>\n<ul><li>\nA. n\n<\/li><li>\nB. n−1\n<\/li><li>\nC. n+1\n<\/li><li>\nD. 不确定\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：树的性质：n 个顶点、n−1 条边、无环且连通。<\/p>\n<\/ul>\n<h3>Q2 【单选】Dijkstra 算法不适用的情形是？<\/h3>\n<ul><li>\nA. 边权为正\n<\/li><li>\nB. 存在负权边\n<\/li><li>\nC. 图是稠密图\n<\/li><li>\nD. 图是有向图\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：负权会破坏「已确定点的距离不会再变小」这一前提，需要改用 Bellman-Ford。<\/p>\n<\/ul>\n<h3>Q3 【填空】关键路径上任何一道工序延误，整个工期都会________。<\/h3>\n<p><strong>答案<\/strong>：延误 <strong>解析<\/strong>：关键路径的总时差为零，路径上工序没有机动时间，任一延误直接传导到总工期。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n图有三存法：矩阵、邻接表、边列表，按算法选。\n<\/li><li>\n最短路是点对问题，最小生成树是全图问题。\n<\/li><li>\nTSP 是 NP 难的，规模大就上启发式并说明近似。\n<\/ul>", "kind": "chapter", "title": "第 4 章：图与网络模型及方法"}, "ch05": {"html": "<h1>第 5 章：插值与拟合<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 1 章、起步册第 2 章 | <strong>原书定位<\/strong>：第 5 章 p113–149\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清插值和拟合的根本区别，并据此选方法；\n<\/li><li>\n手算三点二次插值，理解 Runge 现象为什么发生；\n<\/li><li>\n手算一次最小二乘拟合的斜率与截距，并解释残差。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>插值要求曲线穿过每一个已知点，拟合允许曲线不穿过，只要求整体误差最小。前者补空缺，后者找规律。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：插值（难度：基础）<\/h3>\n<p><strong>插值<\/strong>：已知 n+1 个点，构造一条曲线必须经过这些点，用来估计中间点的值。<\/p>\n<p>n+1 个点可以唯一确定一个次数不超过 n 的多项式，这就是<strong>拉格朗日插值<\/strong>。公式写起来吓人，本质是「每个点配一个权重函数，权重在该点为 1、在别的点为 0」。<\/p>\n<p>手算例子：三点 (0, 1)、(1, 3)、(2, 2)，求 x = 1.5 处的值。<\/p>\n<p>先定二次多项式 P(x) = ax² + bx + c。代入三点得 c = 1、a + b = 2、4a + 2b = 1，解得 a = −1.5、b = 3.5。于是 P(1.5) = −1.5×2.25 + 3.5×1.5 + 1 = 2.875。<\/p>\n<p>用拉格朗日权重核对：L₀ = (x−1)(x−2)/2 在 1.5 处为 −0.125，L₁ = x(x−2)/(−1) 为 0.75，L₂ = x(x−1)/2 为 0.375；加权 1×(−0.125) + 3×0.75 + 2×0.375 = 2.875，一致。<\/p>\n<h3>概念 2：Runge 现象（难度：进阶）<\/h3>\n<p><strong>Runge 现象<\/strong>：等距节点上提高多项式次数，区间边缘的插值曲线会剧烈振荡，误差反而变大。<\/p>\n<p>经典反例是 f(x) = 1/(1 + 25x²) 在 [−1, 1] 上插值，次数越高边缘越离谱。解决办法有两个：改用分段低次插值（三次样条），或改用 Chebyshev 节点（中间密、两端疏）。<\/p>\n<p>这条现象的意义在于：不要以为「点越多、次数越高越准」。数据密集处插值反而更不稳。<\/p>\n<h3>概念 3：三次样条（难度：进阶）<\/h3>\n<p><strong>三次样条<\/strong>：把区间分成若干段，每段用三次多项式，并要求在节点处函数值、一阶导数、二阶导数连续。它比高次多项式稳，比折线光滑，是工程最常用的插值。<\/p>\n<p>代价是要解一个三对角线性方程组求各段的系数，手算不现实，交给 <code>scipy.interpolate.CubicSpline<\/code>。<\/p>\n<h3>概念 4：最小二乘拟合（难度：基础）<\/h3>\n<p><strong>拟合<\/strong>：不要求穿过点，只要求残差平方和最小。<\/p>\n<p>一元线性拟合手算：数据 (1, 2)、(2, 3)、(3, 5)。<\/p>\n<p>x̄ = 2，ȳ = 10/3 ≈ 3.333。 斜率 b = ∑(xᵢ − x̄)(yᵢ − ȳ) / ∑(xᵢ − x̄)² = [(−1)(−1.333) + 0 + (1)(1.667)] / (1 + 0 + 1) = 3 / 2 = 1.5。 截距 a = ȳ − b x̄ = 3.333 − 3 = 0.333。 拟合直线 y = 0.333 + 1.5x。残差：x=1 时 −0.167，x=2 时 +0.333，x=3 时 +0.167，平方和 0.167。<\/p>\n<h3>概念 5：函数逼近（难度：进阶）<\/h3>\n<p><strong>函数逼近<\/strong>：用简单函数（多项式、三角多项式）去近似一个复杂函数，误差用最大偏差或平方积分衡量。它与拟合的区别是：拟合面对离散数据，逼近面对已知函数。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[一批离散数据] --&gt; B{要穿过每个点吗}\n    B --&gt;|要| C[插值]\n    C --&gt; C1[点少 拉格朗日]\n    C --&gt; C2[点密 三次样条]\n    C --&gt; C3[边缘振荡 换 Chebyshev 节点]\n    B --&gt;|不要| D[拟合]\n    D --&gt; D1[线性 最小二乘]\n    D --&gt; D2[非线性 迭代求解]\n    D --&gt; D3[要抗噪 加正则项]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：判断点全在「要不要穿过每个点」。这个判断错了，后面所有方法都白选。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：插值像照着几个路标画一条必须经过它们的路线，拟合像根据几个路标推断大方向，不要求路线压在路标上。失效边界：路标本身测错了怎么办？插值会把错误原样带进曲线，拟合能部分抵消，所以数据有噪声时优先拟合。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：某地 2019—2023 年用水量分别为 12、13、13.5、14、15 亿立方米，问 2024 年。若用线性拟合，斜率约 0.75，预测 15.75；若用二次插值，末端会翘得更高。差别来自方法假设，不是数据本身，论文里必须说明为什么选这个方法。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为插值一定比拟合准——实际上数据有噪声时，插值会把噪声当成规律。\n<\/li><li>\n别以为次数越高越好——实际上高次多项式会振荡，三次样条通常更稳。\n<\/li><li>\n别以为拟合就是画一条直线——实际上可以拟合任意形式的函数，关键是先定函数形式，再定参数。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】插值与拟合最根本的区别是？<\/h3>\n<ul><li>\nA. 插值用多项式，拟合不用\n<\/li><li>\nB. 插值必须经过所有数据点，拟合不要求\n<\/li><li>\nC. 插值只能用于一维\n<\/li><li>\nD. 拟合需要更多数据\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：是否穿过数据点，决定了误差的处理方式，也是一切方法选择的起点。<\/p>\n<\/ul>\n<h3>Q2 【单选】Runge 现象说明？<\/h3>\n<ul><li>\nA. 节点越多，插值一定越准\n<\/li><li>\nB. 等距节点上高次多项式插值在边缘会剧烈振荡\n<\/li><li>\nC. 三次样条不收敛\n<\/li><li>\nD. 拟合不能用于函数逼近\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：次数升高时边缘误差可能发散，这是等距节点的固有缺陷。<\/p>\n<\/ul>\n<h3>Q3 【填空】数据 (1,2)、(2,3)、(3,5) 的最小二乘直线斜率为________。<\/h3>\n<p><strong>答案<\/strong>：1.5 <strong>解析<\/strong>：分子 3、分母 2，斜率 1.5，截距约 0.333。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n插值穿点，拟合不穿点；噪声大时选拟合。\n<\/li><li>\n高次多项式会振荡，三次样条更稳。\n<\/li><li>\n最小二乘的斜率是「协方差除以方差」。\n<\/ul>", "kind": "chapter", "title": "第 5 章：插值与拟合"}, "ch06": {"html": "<h1>第 6 章：微分方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 5 章、起步册第 2 章 | <strong>原书定位<\/strong>：第 6 章 p150–181\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n把「增长率与当前数量成正比」翻译成微分方程；\n<\/li><li>\n用 Euler 法和 RK4 手算两步，并说清误差来源；\n<\/li><li>\n用 SIR 模型解释「接触率下降为什么能压平曲线」。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>微分方程建模只有一步：找出「变化率等于什么」，剩下的都是解方程。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从一句话到方程（难度：基础）<\/h3>\n<p><strong>微分方程<\/strong>：含未知函数及其导数的方程。建模时它通常长这样：<\/p>\n<pre class=\"lang-text\"><code>dN/dt = rN(1 − N/K)<\/code><\/pre>\n<p>这句话读作：种群的变化速度 = 增长率 × 当前数量 × 剩余容量比例。<\/p>\n<p>三个零件：左边是变化率，右边是机制。任何「越……越……」的句子都能这样翻译。<\/p>\n<h3>概念 2：初值与定解（难度：基础）<\/h3>\n<p>方程只描述变化规律，不给起点就解不出具体曲线。<strong>初值条件<\/strong> N(0) = N₀ 决定你落在哪条解曲线上。<\/p>\n<p>建模时初值来自数据。初值错一点，长期预测会偏很多，这是微分方程模型的通病，论文里必须做初值灵敏度。<\/p>\n<h3>概念 3：数值解（难度：进阶）<\/h3>\n<p>大多数微分方程没有解析解，只能数值求解。<\/p>\n<p><strong>Euler 法<\/strong>：y_{n+1} = y_n + h·f(t_n, y_n)，用当前斜率直线外推。一阶精度。<\/p>\n<p>以 dy/dt = y、y(0) = 1、h = 0.5 为例： y₁ = 1 + 0.5×1 = 1.5；y₂ = 1.5 + 0.5×1.5 = 2.25。精确解在 t = 1 处是 e ≈ 2.718，误差 0.468，相对误差 17%。<\/p>\n<p><strong>RK4<\/strong>：每步算四次斜率再加权，四阶精度。同样步长下误差降到千分位。代价是每步四次函数求值。<\/p>\n<p>步长怎么选：先跑 h，再跑 h/2，若结果变化小于容差就接受，这叫步长减半检验。<\/p>\n<h3>概念 4：SIR 模型（难度：进阶）<\/h3>\n<p><strong>SIR<\/strong>：把人群分成易感 S、感染 I、康复 R 三类。<\/p>\n<pre class=\"lang-text\"><code>dS/dt = −βSI/N\ndI/dt = βSI/N − γI\ndR/dt = γI<\/code><\/pre>\n<p>β 是接触传染率，γ 是康复率。两者之比 R₀ = β/γ 叫<strong>基本再生数<\/strong>：一个感染者平均传染几个人。R₀ &gt; 1 疫情扩散，R₀ &lt; 1 衰减。<\/p>\n<p>例：β = 0.3/天、γ = 0.1/天，R₀ = 3。要把 R₀ 压到 1 以下，β 必须降到 0.1 以下，也就是接触率降到原来的三分之一。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    S[易感 S] --&gt;|βSI/N| I[感染 I]\n    I --&gt;|γI| R[康复 R]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：箭头上的式子就是流量。这张图既是模型结构，也是写方程的依据：每个仓室的变化 = 流入 − 流出。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：微分方程像浴缸注水，水龙头流量是导数，水位是函数值，初始水位是初值。失效边界：浴缸的流量可以随时手动改，模型里的流量由状态决定，是自反馈系统。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：逻辑斯蒂增长 dN/dt = 0.5N(1 − N/100)，N₀ = 10。平衡点 N = 100；N &lt; 100 时增长，接近 100 时变慢。用 Euler、h = 1 算两步：N₁ = 10 + 0.5×10×(1 − 0.1) = 14.5；N₂ = 14.5 + 0.5×14.5×(1 − 0.145) = 14.5 + 6.2 = 20.7。曲线呈先快后慢的 S 形。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为数值解一定能代表真实过程——实际上参数估错，曲线形状对但幅度全错。\n<\/li><li>\n别以为步长越小越好——实际上步长过小会累积舍入误差，还会让计算变慢，要按误差容限选。\n<\/li><li>\n别以为 SIR 只能用于传染病——实际上谣言传播、产品扩散都能用同构模型，只要「接触—转化—退出」的结构一致。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】R₀ = β/γ 大于 1 意味着？<\/h3>\n<ul><li>\nA. 疫情必然消失\n<\/li><li>\nB. 一个感染者平均传染超过一个人，疫情可能扩散\n<\/li><li>\nC. 病毒致死率高\n<\/li><li>\nD. 康复速度过快\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：R₀ 是基本再生数，大于 1 时感染链能自我维持。<\/p>\n<\/ul>\n<h3>Q2 【单选】Euler 法的主要缺点是？<\/h3>\n<ul><li>\nA. 无法处理线性方程\n<\/li><li>\nB. 只有一阶精度，步长大时误差显著\n<\/li><li>\nC. 需要解析解\n<\/li><li>\nD. 不能处理初值问题\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：用直线代替曲线，步长越大偏差越大；提高精度要用 RK4 或减小步长。<\/p>\n<\/ul>\n<h3>Q3 【填空】用 Euler 法解 dy/dt = y、y(0)=1、h=0.5，两步后 y₂ = ________。<\/h3>\n<p><strong>答案<\/strong>：2.25 <strong>解析<\/strong>：y₁ = 1.5，y₂ = 1.5 + 0.5×1.5 = 2.25，与精确值 e 有约 17% 的相对误差。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n微分方程建模 = 找变化率机制 + 定初值。\n<\/li><li>\nEuler 一阶、RK4 四阶，步长要做减半检验。\n<\/li><li>\nSIR 的关键数是 R₀ = β/γ，压 R₀ 就是压接触率。\n<\/ul>", "kind": "chapter", "title": "第 6 章：微分方程"}, "ch07": {"html": "<h1>第 7 章：数理统计<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：起步册第 2 章、第 5 章 | <strong>原书定位<\/strong>：第 7 章 p182–230\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n分清点估计、区间估计、假设检验各自回答什么问题；\n<\/li><li>\n手算一次单样本 t 检验，正确解读 p 值；\n<\/li><li>\n说清 Bootstrap 在没有分布假设时怎么给出置信区间。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>统计推断的全部结论都是概率性的：它说的是「在多大程度上可以不相信原假设」，不是「真相是什么」。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：点估计与区间估计（难度：基础）<\/h3>\n<p><strong>点估计<\/strong>：用样本算出的一个数去猜总体参数，比如用样本均值 x̄ 猜总体均值 μ。<\/p>\n<p><strong>区间估计<\/strong>：给出一个区间，并声明「真值落在里面的概率约为 95%」。严格说法是：重复抽样很多次，约有 95% 的区间会覆盖真值。单次抽样得到的那个区间，要么覆盖要么不覆盖，没有 95% 的概率可言。<\/p>\n<p>置信区间宽度取决于三件事：样本量越大越窄，标准差越小越窄，置信水平越高越宽。<\/p>\n<h3>概念 2：假设检验与 p 值（难度：进阶）<\/h3>\n<p><strong>假设检验<\/strong>：先设一个原假设 H₀（通常是「没有差异」），再看样本结果在 H₀ 成立时有多罕见。<\/p>\n<p><strong>p 值<\/strong>：如果 H₀ 为真，出现当前或更极端结果的概率。p 小，说明结果罕见，于是拒绝 H₀。<\/p>\n<p>手算例子：某产品标准厚度 10 mm，抽 5 件测得 10、12、11、13、9，问均值是否偏离 10。<\/p>\n<p>x̄ = 11，偏差 −1、1、0、2、−2，平方和 10，s² = 10/(5−1) = 2.5，s = 1.581。 标准误 SE = s/√5 = 0.707。 t = (11 − 10)/0.707 = 1.414，自由度 4。 查表：双侧 5% 临界值 2.776，1.414 &lt; 2.776，p &gt; 0.05，不拒绝 H₀。<\/p>\n<p>结论写法：「没有足够证据说明均值偏离 10 mm」，不能说「均值就是 10 mm」。后者是把「没证据」当成「证据没有」。<\/p>\n<h3>概念 3：Bootstrap（难度：进阶）<\/h3>\n<p><strong>Bootstrap<\/strong>：从样本里有放回地抽 n 个，算一次统计量，重复几百上千次，用这些统计量的分布近似抽样分布。<\/p>\n<p>它不需要假设正态，适合小样本、偏态分布、复杂统计量（如中位数、R²）。局限是：如果样本本身不能代表总体，Bootstrap 只会把偏差放大。<\/p>\n<h3>概念 4：方差分析与回归（难度：进阶）<\/h3>\n<ul><li>\n<strong>方差分析（ANOVA）<\/strong>：比较三组以上均值是否相同。核心是把总变异拆成组间与组内，用 F 统计量判断组间差异是否显著。\n<\/li><li>\n<strong>回归<\/strong>：用一个或多个自变量解释因变量。多元回归要检查共线性、残差正态性、异方差，R² 高不代表模型可用。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[拿到样本] --&gt; B{想干什么}\n    B --&gt;|估一个数| C[点估计]\n    B --&gt;|估一个范围| D[区间估计]\n    B --&gt;|判断有没有差异| E[假设检验]\n    E --&gt; F{分布假设成立吗}\n    F --&gt;|成立| G[t 检验 F 检验]\n    F --&gt;|不成立| H[Bootstrap 或非参数检验]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：先确定问题类型，再看分布假设。很多误用发生在直接跳到 t 检验，却不管数据是否近似正态。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：假设检验像法庭，H₀ 是「无罪」，p 值是「如果无罪，出现这些证据的概率」。p 小只能说明证据罕见，不等于证明有罪。失效边界：法庭要求排除合理怀疑，统计只给概率，两者不能直接类比定罪。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：某药两组各 10 人，试验组均值 8.2、标准差 1.5，对照组 9.1、标准差 1.8。差值 0.9，合并标准误约 √(1.5²/10 + 1.8²/10) = √(0.225 + 0.324) = 0.745，t ≈ 1.21，p &gt; 0.05。结论是「未见显著差异」，样本量再多一些才可能看出效果。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 p &lt; 0.05 就代表结论重要——实际上 p 只衡量罕见程度，效应大小要看差值本身。\n<\/li><li>\n别以为不显著就是没差异——实际上可能只是样本太小、噪声太大。\n<\/li><li>\n别以为 R² 高就是模型好——实际上加变量就能抬高 R²，要看调整 R² 和残差诊断。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】p 值的正确解读是？<\/h3>\n<ul><li>\nA. H₀ 为真的概率\n<\/li><li>\nB. H₀ 为真时出现当前或更极端结果的概率\n<\/li><li>\nC. 结论正确的概率\n<\/li><li>\nD. 效应量大小\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：p 值是条件概率，条件是 H₀ 成立，它不告诉你 H₀ 本身真不真。<\/p>\n<\/ul>\n<h3>Q2 【单选】Bootstrap 的核心操作是？<\/h3>\n<ul><li>\nA. 增加样本量\n<\/li><li>\nB. 有放回重抽样并重复计算统计量\n<\/li><li>\nC. 对数据做正态化变换\n<\/li><li>\nD. 删除异常值\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：通过重抽样模拟抽样分布，避免对分布形式做强假设。<\/p>\n<\/ul>\n<h3>Q3 【填空】样本 10、12、11、13、9 的标准差约为________。<\/h3>\n<p><strong>答案<\/strong>：1.58 <strong>解析<\/strong>：偏差平方和 10，除以自由度 4 得 2.5，开方约 1.581。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n点估计给数，区间估计给范围，假设检验给「能不能不信 H₀」。\n<\/li><li>\np 值不是 H₀ 为真的概率，也不是结论正确的概率。\n<\/li><li>\nBootstrap 免分布假设，但不能修正样本本身的偏差。\n<\/ul>", "kind": "chapter", "title": "第 7 章：数理统计"}, "ch08": {"html": "<h1>第 8 章：差分方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 6 章、起步册第 2 章 | <strong>原书定位<\/strong>：第 8 章 p231–247\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n把「今年的数量取决于去年的数量」写成差分方程；\n<\/li><li>\n用特征根判断一阶与二阶系统的稳定性；\n<\/li><li>\n写出 Leslie 矩阵，并解释它预测种群规模的逻辑。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>差分方程是离散版的微分方程：微分方程看连续时间的变化率，差分方程看相邻两期的差值。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：差分与递推（难度：基础）<\/h3>\n<p><strong>差分方程<\/strong>：含 xₙ、xₙ₊₁ 这类相邻项关系的方程。<\/p>\n<p>最简单的形式：xₙ₊₁ = a xₙ + b。<\/p>\n<p><strong>平衡点<\/strong>：使 xₙ₊₁ = xₙ 的值，解得 x* = b/(1 − a)（a ≠ 1）。<\/p>\n<p>例：xₙ₊₁ = 0.8xₙ + 20，平衡点 x* = 20/(1 − 0.8) = 100。从 x₀ = 10 出发：x₁ = 28、x₂ = 42.4、x₃ = 53.9……逐期逼近 100，差值每期缩小到 0.8 倍。<\/p>\n<h3>概念 2：稳定性（难度：进阶）<\/h3>\n<p><strong>稳定<\/strong>：初值的小扰动会随时间消失，系统回到平衡点。<\/p>\n<p>一阶系统 xₙ₊₁ = a xₙ + b 稳定的条件是 |a| &lt; 1。|a| &gt; 1 发散，a = −1 振荡不收敛。<\/p>\n<p>二阶系统 xₙ₊₂ = p xₙ₊₁ + q xₙ 的特征方程是 λ² − pλ − q = 0，两个根都落在单位圆内（|λ| &lt; 1）才稳定。<\/p>\n<p>判断稳定性的意义：模型预测长期趋势时，不稳定系统的小误差会被放大到荒谬。<\/p>\n<h3>概念 3：Leslie 矩阵（难度：进阶）<\/h3>\n<p><strong>Leslie 矩阵<\/strong>：按年龄分组，把繁殖率和存活率排成矩阵，用来预测种群规模。<\/p>\n<pre><code>[ F₁  F₂  F₃ ]\n[ S₁   0   0 ]\n[ 0   S₂   0 ]<\/code><\/pre>\n<p>第一行是各年龄组的繁殖贡献，下面是对角线错一位的存活率。下一期种群向量 = 矩阵 × 本期向量。<\/p>\n<p>矩阵的主特征值 λ₁ 决定长期增长率：λ₁ &gt; 1 增长，&lt; 1 衰退。稳定年龄分布由对应的特征向量给出。<\/p>\n<h3>概念 4：典型建模场景（难度：基础）<\/h3>\n<ul><li>\n<strong>存贷款<\/strong>：余额按复利增长，每月还款固定，写成 xₙ₊₁ = 1.01xₙ − A。\n<\/li><li>\n<strong>捕鱼策略<\/strong>：幼鱼长成成鱼需要年限，成鱼被捕捞，用 Leslie 矩阵加捕捞项。\n<\/li><li>\n<strong>设备更新<\/strong>：每年淘汰固定比例，同时购入新设备。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[x₀ 初值] --&gt; B[x₁]\n    B --&gt; C[x₂]\n    C --&gt; D[x₃]\n    D --&gt; E[平衡点 x*]\n    E --&gt; F{收敛吗}\n    F --&gt;|a 小于 1| G[稳定]\n    F --&gt;|a 大于 1| H[发散]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：箭头是逐期递推，虚线指向平衡点。判断稳定性看的是「越来越近还是越来越远」，不是看某一期的数值。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：差分方程像每月还信用卡，欠款 = 上月欠款 × 利率 − 本月还款。失效边界：真实还款可能逾期、利率会浮动，固定参数的模型只能描述理想情况。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：某渔场成鱼每年捕捞 30%，幼鱼存活率 50%，成鱼繁殖率每尾 2 尾。简化为两龄模型，Leslie 矩阵 [[2, 0],[0.5, 0]]，特征值 2 与 0，λ = 2 &gt; 1，种群按每年 2 倍增长——这显然不符合实际，说明繁殖率参数取得过高，需要按实测数据校准。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为差分方程只是微分方程的近似——实际上很多离散过程（年度普查、月度库存）本身就是离散的，差分方程是原始模型。\n<\/li><li>\n别以为平衡点就是稳定点——实际上平衡点可能不稳定，初值稍偏就越走越远。\n<\/li><li>\n别以为 Leslie 矩阵只用于动物——实际上人口预测、客户留存、设备寿命都能用同构模型。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】xₙ₊₁ = 0.8xₙ + 20 的平衡点是？<\/h3>\n<ul><li>\nA. 20\n<\/li><li>\nB. 80\n<\/li><li>\nC. 100\n<\/li><li>\nD. 120\n<p><strong>答案<\/strong>：C <strong>解析<\/strong>：令 x = 0.8x + 20，得 0.2x = 20，x = 100。<\/p>\n<\/ul>\n<h3>Q2 【单选】一阶系统稳定的条件是？<\/h3>\n<ul><li>\nA. |a| &lt; 1\n<\/li><li>\nB. a &gt; 0\n<\/li><li>\nC. b = 0\n<\/li><li>\nD. |a| &gt; 1\n<p><strong>答案<\/strong>：A <strong>解析<\/strong>：每期误差按 a 倍缩放，|a| &lt; 1 才会衰减到零。<\/p>\n<\/ul>\n<h3>Q3 【填空】Leslie 矩阵的主特征值大于 1 表示种群长期________。<\/h3>\n<p><strong>答案<\/strong>：增长 <strong>解析<\/strong>：主特征值是每期的渐近增长倍数，大于 1 意味着规模逐年扩大。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n差分方程描述相邻两期的关系，平衡点由 x = ax + b 解出。\n<\/li><li>\n稳定性看特征根的模是否小于 1。\n<\/li><li>\nLeslie 矩阵 = 繁殖率首行 + 存活率次对角线，主特征值定长期趋势。\n<\/ul>", "kind": "chapter", "title": "第 8 章：差分方程"}, "ch09": {"html": "<h1>第 9 章：支持向量机<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 3 章、起步册第 2 章 | <strong>原书定位<\/strong>：第 9 章 p248–261\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清「最大间隔」为什么比「能分开」更好；\n<\/li><li>\n用 w 与 b 写出决策函数，并算出给定点的间隔；\n<\/li><li>\n解释核函数与惩罚参数 C 各自解决什么问题。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>支持向量机不找一条能分开的线，而是找那条离两类点都最远的线。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：最大间隔（难度：基础）<\/h3>\n<p><strong>支持向量机（SVM）<\/strong>：二分类模型，目标是找一个超平面 wᵀx + b = 0，使两类点到它的最小距离最大。<\/p>\n<p><strong>间隔<\/strong>：两类支持向量到超平面的距离之和，等于 2/‖w‖。最大化间隔等价于最小化 ‖w‖²/2。<\/p>\n<p>为什么间隔大好？因为新数据不会正好落在边界上。间隔是模型的「安全余量」。<\/p>\n<p>手算例子：正类点 (1,1)、(2,2)，负类点 (−1,−1)、(−2,−2)。取 w = (1,1)、b = 0，决策线 x₁ + x₂ = 0。<\/p>\n<p>支持向量到线的距离：|1+1|/√2 = √2 ≈ 1.414。两类点分居线两侧，所以两类之间的间隔带宽度是 2√2 ≈ 2.828。<\/p>\n<p>这与公式 2/‖w‖ 是同一件事，只是 w 的尺度不同。公式里的 w 已被缩放成「支持向量处取 ±1」；本例 wᵀ(1,1) = 2，缩放一半得 w′ = (0.5, 0.5)，‖w′‖ = 0.707，2/‖w′‖ = 2.828，与几何距离对得上。<\/p>\n<p><strong>支持向量<\/strong>：离超平面最近的那些点。它们决定了 w 和 b，其他点删掉不影响结果。<\/p>\n<h3>概念 2：软间隔与 C（难度：进阶）<\/h3>\n<p>真实数据常有重叠，硬间隔无解。引入<strong>松弛变量<\/strong> ξᵢ ≥ 0，允许个别点越界，目标改为：<\/p>\n<pre class=\"lang-text\"><code>min ½‖w‖² + C∑ξᵢ\ns.t. yᵢ(wᵀxᵢ + b) ≥ 1 − ξᵢ<\/code><\/pre>\n<p><strong>C<\/strong> 是惩罚系数：<\/p>\n<ul><li>\nC 大 → 不容忍越界，间隔窄，容易过拟合；\n<\/li><li>\nC 小 → 容忍越界，间隔宽，偏差大。\n<\/ul>\n<p>调 C 是 SVM 最常做的超参数搜索。<\/p>\n<h3>概念 3：核函数（难度：进阶）<\/h3>\n<p>数据在原空间线性不可分时，用<strong>核函数<\/strong>把它们隐式映射到高维，在高维找超平面。<\/p>\n<p>常用核：<\/p>\n<ul><li>\n线性核：特征多、样本少时用；\n<\/li><li>\n多项式核：有明显交互项时用；\n<\/li><li>\nRBF 核（高斯核）：默认首选，参数 γ 控制影响范围，γ 大则每个点影响范围小，容易过拟合。\n<\/ul>\n<p>核技巧的关键：不需要真的算出高维坐标，只需算内积 K(xᵢ, xⱼ)。<\/p>\n<h3>概念 4：多分类与评估（难度：进阶）<\/h3>\n<p>SVM 原生是二分类。多分类用「一对多」或「一对一」拆解。评估别只看准确率：类别不平衡时，要看查全率、查准率、F1 与混淆矩阵。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[带标签数据] --&gt; B{线性可分吗}\n    B --&gt;|可分| C[硬间隔 SVM]\n    B --&gt;|有重叠| D[软间隔 SVM 调 C]\n    B --&gt;|严重非线性| E[核函数映射]\n    C --&gt; F[支持向量与 w b]\n    D --&gt; F\n    E --&gt; F\n    F --&gt; G[分类与评估]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：三条路最终都落到「求 w、b」。区别只在约束形式与是否映射，这也是 SVM 全部公式的统一入口。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：SVM 像在两排人之间画一条分界线，要求线离两边都尽量远，免得有人稍微一动就越界。失效边界：如果两排人本身交错，怎么画都会压到人，这时候必须允许越界，也就是软间隔。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：二维点 (2,0)、(0,2) 标 +1，(0,0)、(1,1) 标 −1。这不是线性可分的（(1,1) 落在正类点连线附近），硬间隔无解。加软间隔后允许 (1,1) 越界，C 越大越不容忍，模型会为了它扭曲边界。这个例子说明：先判断可分性，再选模型。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 SVM 一定比逻辑回归好——实际上特征维度高、样本少时 SVM 有优势，样本很大时线性模型往往够用且更快。\n<\/li><li>\n别以为核函数越复杂越好——实际上 RBF 的 γ 调不好会过拟合，交叉验证比「看起来准」可靠。\n<\/li><li>\n别以为准确率 95% 就是好模型——实际上若负类只占 5%，全判正类也能得 95%。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】SVM 中决定分类边界的点是？<\/h3>\n<ul><li>\nA. 所有样本点\n<\/li><li>\nB. 支持向量\n<\/li><li>\nC. 离边界最远的点\n<\/li><li>\nD. 标签为 0 的点\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：只有支持向量进入约束的等号，其他点删掉不影响 w 与 b。<\/p>\n<\/ul>\n<h3>Q2 【单选】惩罚参数 C 增大，通常会导致？<\/h3>\n<ul><li>\nA. 间隔变宽，偏差增大\n<\/li><li>\nB. 间隔变窄，更容易过拟合\n<\/li><li>\nC. 模型变成线性回归\n<\/li><li>\nD. 支持向量消失\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：C 大意味着不容忍越界，边界被拉紧贴住样本，方差上升。<\/p>\n<\/ul>\n<h3>Q3 【填空】核函数的作用是隐式地把数据映射到________空间。<\/h3>\n<p><strong>答案<\/strong>：高维 <strong>解析<\/strong>：在高维空间更容易线性可分，核技巧避免显式计算高维坐标。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\nSVM 的目标是最大化间隔，间隔 = 2/‖w‖。\n<\/li><li>\n软间隔用 C 换容忍度，C 大紧、C 小松。\n<\/li><li>\n核函数处理非线性，γ 与 C 都要交叉验证。\n<\/ul>", "kind": "chapter", "title": "第 9 章：支持向量机"}, "ch10": {"html": "<h1>第 10 章：多元分析<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 7 章 | <strong>原书定位<\/strong>：第 10 章 p262–354\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n分清聚类、降维、判别、相关分析各自解决什么问题；\n<\/li><li>\n手算一次 K-means 的两轮迭代；\n<\/li><li>\n说清主成分分析为什么能降维，以及主成分不能怎么解释。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>多元分析的七种方法，本质是四件事：把样本分组、把变量压缩、把样本归类、把两组变量联系起来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：聚类（难度：基础）<\/h3>\n<p><strong>聚类<\/strong>：没有标签，只按相似度把样本分组。<\/p>\n<ul><li>\n<strong>K-means<\/strong>：先定 k 个中心，把每个点分给最近的中心，再按组内均值更新中心，反复直到中心不动。要求先给定 k，对初值敏感。\n<\/li><li>\n<strong>层次聚类<\/strong>：每次合并最近的两类，得到一棵树（树状图），按需要切一刀决定类数。不需要预先定 k，但计算量大。\n<\/ul>\n<p>手算例子：一维数据 1、2、8、9，k = 2。初始中心取 1 和 8：分组 {1,2} 与 {8,9}；新中心 1.5 与 8.5；再分组仍是 {1,2}、{8,9}，收敛。若初始中心取 2 和 9，结果相同；但数据换成 1、5、6、9 时，初值不同可能得到不同分组，所以要多次随机初始化。<\/p>\n<h3>概念 2：主成分分析（难度：进阶）<\/h3>\n<p><strong>主成分分析（PCA）<\/strong>：把原始变量线性组合成少数几个互不相关的新变量，尽量保留原有变异。<\/p>\n<p>步骤：标准化 → 算协方差矩阵 → 求特征值与特征向量 → 按特征值从大到小排序 → 取前 k 个。<\/p>\n<p><strong>贡献率<\/strong> = 某个特征值 / 特征值总和。取累计贡献率 85% 以上通常够用。<\/p>\n<p>关键限制：主成分是数学构造，未必有物理含义。说「第一主成分代表综合实力」需要额外证据，不能只因为载荷都为正。<\/p>\n<h3>概念 3：判别分析（难度：进阶）<\/h3>\n<p><strong>判别分析<\/strong>：有标签，建立从变量到类别的判别函数，用来给新样本归类。与聚类相反，它先知道类别再学规则。<\/p>\n<p>常用：线性判别（LDA）、距离判别、贝叶斯判别。评估看错判率与交叉验证准确率。<\/p>\n<h3>概念 4：因子分析与典型相关（难度：高难）<\/h3>\n<ul><li>\n<strong>因子分析<\/strong>：假设观测变量由少数潜在因子加误差生成，用来找「看不见的原因」。与 PCA 的区别是它有模型假设，PCA 只是变换。\n<\/li><li>\n<strong>典型相关分析<\/strong>：找两组变量各自的线性组合，使这两组的相关系数最大。用于「一组自变量与一组因变量」的整体关系。\n<\/li><li>\n<strong>对应分析<\/strong>：处理分类变量的列联表，把行与列画在同一张图上。\n<\/ul>\n<h3>概念 5：多维标度（难度：高难）<\/h3>\n<p><strong>多维标度（MDS）<\/strong>：只给样本间的距离矩阵，反推出低维坐标，使坐标间距离尽量还原原始距离。用于心理测量、气味图谱这类「只有相似度、没有坐标」的数据。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[多元数据] --&gt; B{有标签吗}\n    B --&gt;|没有| C{要分组还是压缩}\n    C --&gt;|分组| D[K-means 层次聚类]\n    C --&gt;|压缩| E[主成分分析 因子分析]\n    B --&gt;|有| F{要归类还是找关系}\n    F --&gt;|归类| G[判别分析]\n    F --&gt;|找关系| H[典型相关 对应分析]\n    A --&gt; I[只有距离矩阵] --&gt; J[多维标度]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：第一个判断是「有没有标签」，这一步错了，方法全错。聚类和判别最容易混，记住：聚类无标签，判别有标签。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：PCA 像把一摞不同角度的照片压成一张正面照，保留轮廓、丢掉侧面细节。失效边界：如果物体的关键特征恰好在被丢掉的方向上，压缩后的照片就认不出它。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：三个样本在两个指标上的值为 (1,1)、(2,2)、(3,3)。两个变量完全相关，PCA 第一主成分方向为 (1,1)/√2，投影值 1.414、2.828、4.243，贡献率 100%，第二主成分为 0。这说明当变量完全共线时，一个主成分就够了。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为聚类结果一定有意义——实际上算法只按距离分组，分出的类可能完全没有业务含义。\n<\/li><li>\n别以为主成分可以随意命名——实际上命名需要载荷分析与领域知识支撑。\n<\/li><li>\n别以为判别分析能替代因果分析——实际上它只给分类规则，不解释为什么。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】K-means 必须预先确定的是？<\/h3>\n<ul><li>\nA. 距离度量\n<\/li><li>\nB. 聚类数 k\n<\/li><li>\nC. 特征个数\n<\/li><li>\nD. 样本标签\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：k 是超参数，通常用肘部法或轮廓系数辅助选择。<\/p>\n<\/ul>\n<h3>Q2 【单选】PCA 中「贡献率」指的是？<\/h3>\n<ul><li>\nA. 某个样本的解释比例\n<\/li><li>\nB. 某主成分特征值占全部特征值之和的比例\n<\/li><li>\nC. 分类准确率\n<\/li><li>\nD. 变量个数占比\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：特征值代表该方向上的方差，占比即该主成分保留的信息比例。<\/p>\n<\/ul>\n<h3>Q3 【填空】有标签、要给新样本归类的分析叫________分析。<\/h3>\n<p><strong>答案<\/strong>：判别 <strong>解析<\/strong>：判别分析先学类别再分类；聚类没有标签。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n无标签分组用聚类，有标签归类用判别。\n<\/li><li>\nPCA 保留方差大的方向，主成分未必可解释。\n<\/li><li>\n因子分析有模型假设，PCA 只是线性变换。\n<\/ul>", "kind": "chapter", "title": "第 10 章：多元分析"}, "ch11": {"html": "<h1>第 11 章：偏最小二乘回归分析<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 7 章、第 10 章 | <strong>原书定位<\/strong>：第 11 章 p355–366\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n判断一份数据是否有多重共线性，以及它为什么让回归系数失控；\n<\/li><li>\n说清偏最小二乘与主成分回归的区别；\n<\/li><li>\n解释「提取几个成分」该怎么定。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>当自变量彼此高度相关时，普通最小二乘会给出方向乱跳的系数；偏最小二乘改成「边压缩边找与因变量最相关的方向」。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：多重共线性（难度：进阶）<\/h3>\n<p><strong>多重共线性<\/strong>：自变量之间近似线性相关。比如 x₂ ≈ x₁ + 少量噪声。<\/p>\n<p>后果：系数估计方差极大，数据动一点系数就翻号。经济解释变成「投资增加、消费减少」，明明两者同向变化。<\/p>\n<p>诊断：方差膨胀因子 VIF &gt; 10，或相关矩阵里有接近 ±1 的元素，或条件数很大。<\/p>\n<h3>概念 2：偏最小二乘的思路（难度：进阶）<\/h3>\n<p><strong>偏最小二乘（PLS）<\/strong>：从自变量 X 中提取若干成分 t₁, t₂, …，同时从因变量 Y 中提取成分 u₁, u₂, …，要求 t 与 u 的协方差最大，再用 t 对 Y 回归。<\/p>\n<p>与 PCA 的关键差别：PCA 只看 X 的方差最大的方向，不管它和 Y 有没有关系；PLS 同时看 X 的变异与 X–Y 的相关，所以提取的方向更「有用」。<\/p>\n<h3>概念 3：NIPALS 迭代（难度：高难）<\/h3>\n<p>每一步做四件事：<\/p>\n<ol><li>\n用 X 与 Y 的协方差挑出权重 w；\n<\/li><li>\n算成分 t = Xw，归一化；\n<\/li><li>\n用 t 回归 X 与 Y，得到载荷 p 与 q；\n<\/li><li>\n从 X、Y 中减去已被解释的部分（收缩），再重复。\n<\/ol>\n<p>停止条件：交叉验证的预测误差不再下降。成分太少欠拟合，太多等于回到普通回归。<\/p>\n<h3>概念 4：结果怎么读（难度：进阶）<\/h3>\n<ul><li>\n<strong>载荷图<\/strong>：看哪些变量在同一个成分上载荷大，说明它们共同驱动这个方向。\n<\/li><li>\n<strong>VIP 值<\/strong>：变量重要性投影，VIP &gt; 1 通常算重要变量。\n<\/li><li>\n<strong>回归系数<\/strong>：PLS 最终也给出系数，但它是在成分空间里算的，解释时要结合载荷。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    X[X 自变量矩阵] --&gt; T[提取成分 t]\n    Y[Y 因变量] --&gt; U[提取成分 u]\n    T &lt;--&gt;|协方差最大| U\n    T --&gt; R[对 Y 回归]\n    R --&gt; C[系数与 VIP]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：中间那条双向箭头是 PLS 与 PCA 的分水岭。只从 X 提取、不看 Y 的，是 PCA；两边一起看的，是 PLS。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：PLS 像挑助手，不只看谁本事大，还看谁跟你手头的活最搭。PCA 只挑本事最大的，可能挑来的人帮不上忙。失效边界：如果活儿本身不需要那么多人，PLS 也会过拟合，成分数要靠交叉验证压住。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：若 x₂ = x₁ + 0.01ε，普通回归的系数会在 (100, −99) 附近剧烈摆动，两个变量单独看都显著，合起来却互相抵消。PLS 会把它们合并成一个成分，系数稳定，但代价是失去「哪一个更重要」的区分能力。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为共线性只影响显著性——实际上它首先破坏的是系数的可解释性。\n<\/li><li>\n别以为 PLS 能替代变量筛选——实际上它把相关变量打包，不会告诉你该删哪个。\n<\/li><li>\n别以为成分越多越好——实际上成分数超过必要值，模型会重新变得不稳定。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】多重共线性的典型后果是？<\/h3>\n<ul><li>\nA. 模型无法求解\n<\/li><li>\nB. 回归系数方差变大、符号可能反常\n<\/li><li>\nC. R² 一定下降\n<\/li><li>\nD. 样本量自动减少\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：共线让设计矩阵接近奇异，系数估计对数据扰动极度敏感。<\/p>\n<\/ul>\n<h3>Q2 【单选】PLS 与 PCA 的核心区别是？<\/h3>\n<ul><li>\nA. PLS 不做降维\n<\/li><li>\nB. PLS 提取成分时同时考虑与 Y 的相关\n<\/li><li>\nC. PCA 只能用于分类\n<\/li><li>\nD. PLS 不需要数据\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：PCA 只看 X 的方差，PLS 看 X 与 Y 的协方差。<\/p>\n<\/ul>\n<h3>Q3 【填空】判断变量重要性常用指标是________值，通常大于 1 视为重要。<\/h3>\n<p><strong>答案<\/strong>：VIP <strong>解析<\/strong>：VIP 综合了各成分对 Y 的解释力与变量在成分上的载荷。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n共线性先毁系数可解释性，再毁显著性。\n<\/li><li>\nPLS 同时看 X 的变异与 X–Y 相关。\n<\/li><li>\n成分数由交叉验证定，不是越多越好。\n<\/ul>", "kind": "chapter", "title": "第 11 章：偏最小二乘回归分析"}, "ch12": {"html": "<h1>第 12 章：现代优化算法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 2–4 章 | <strong>原书定位<\/strong>：第 12 章 p367–382\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清什么时候必须放弃精确算法、改用启发式；\n<\/li><li>\n手写模拟退火的接受概率，并解释温度的作用；\n<\/li><li>\n设计一个遗传算法的编码、适应度、选择、交叉、变异五件套。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>启发式算法不保证最优，它保证在有限时间里给你一个能用的解——所以论文里必须报告「跑了多少次、最好结果多少、波动多大」。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：为什么需要启发式（难度：基础）<\/h3>\n<p>TSP、大规模选址、排班这类问题是 NP 难的，点数一多，精确算法跑不完。启发式牺牲最优性换时间。<\/p>\n<p>判断标准：问题规模超过精确算法能处理的范围（比如 TSP 超过 20 个点），或目标函数不可导、含整数与逻辑约束。<\/p>\n<h3>概念 2：模拟退火（难度：进阶）<\/h3>\n<p><strong>模拟退火（SA）<\/strong>：从当前解出发随机扰动，新解更好就接受，更差也按概率接受。<\/p>\n<p>接受概率：<\/p>\n<pre class=\"lang-text\"><code>P = exp(−Δ/T)<\/code><\/pre>\n<p>Δ 是目标函数变差量，T 是温度。T 高时几乎什么都接受，T 低时只接受更好的解。<\/p>\n<p>流程：初始温度 T₀ → 迭代若干次 → 按降温系数 α（如 0.95）降温 → 到终止温度停止。每个温度下要迭代足够多次，否则退火变成随机游走。<\/p>\n<h3>概念 3：遗传算法（难度：进阶）<\/h3>\n<p><strong>遗传算法（GA）<\/strong>：把解编码成染色体，用适应度评价，通过选择、交叉、变异产生下一代。<\/p>\n<p>五件套：<\/p>\n<ol><li>\n<strong>编码<\/strong>：0-1 串、整数串、实数串。TSP 用路径序列编码。\n<\/li><li>\n<strong>适应度<\/strong>：目标函数转成正值，越大越好。\n<\/li><li>\n<strong>选择<\/strong>：轮盘赌或锦标赛，适应度高的更容易被选中。\n<\/li><li>\n<strong>交叉<\/strong>：交换片段。TSP 要用顺序交叉，避免出现重复城市。\n<\/li><li>\n<strong>变异<\/strong>：随机改动一位，保持多样性。\n<\/ol>\n<p>参数：种群规模 50–200，交叉率 0.7–0.9，变异率 0.01–0.1。参数没有普适最优，要按问题调。<\/p>\n<h3>概念 4：改进与评估（难度：进阶）<\/h3>\n<ul><li>\n<strong>精英保留<\/strong>：每代把最好的几个个体直接复制到下一代，防止退化。\n<\/li><li>\n<strong>自适应变异率<\/strong>：适应度高的个体变异率低，低的个体变异率高。\n<\/li><li>\n<strong>多种群<\/strong>：几个子种群独立进化，定期交流，缓解早熟。\n<\/ul>\n<p>评估必须报告：运行次数（如 20 次独立运行）、最好值、平均值、标准差。只报一次最好结果，等于没说。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[初始种群或初始解] --&gt; B[评价适应度]\n    B --&gt; C{满足停止条件}\n    C --&gt;|否| D[选择 交叉 变异]\n    D --&gt; B\n    C --&gt;|是| E[输出最好解]\n    E --&gt; F[多次独立运行 报告分布]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：注意最后一步在循环之外。它不是算法的一部分，但少了它，结果的可信度没法评估。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：退火像往山坡上扔球再让它慢慢停在低处，温度高时球能弹过小坑，温度低时只能往下滚。失效边界：如果地形有巨大的深坑隔开，球仍可能停在错的坑里，这时要多起点。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：4 城市距离矩阵对称，A-B 2、A-C 6、A-D 5、B-C 3、B-D 4、C-D 7。遍历路线 A-B-C-D-A 长 2+3+7+5 = 17；A-B-D-C-A 长 2+4+7+6 = 19；A-C-B-D-A 长 6+3+4+5 = 18。最优是 17。启发式跑 20 次，若 18 次得 17、2 次得 18，就说明算法稳定但不保证每次都最优。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为启发式不需要建模——实际上编码方式和邻域结构决定搜索能力，这部分比调参重要。\n<\/li><li>\n别以为跑出好结果就万事大吉——实际上不复现、不报告分布，结果无法采信。\n<\/li><li>\n别以为参数越大越好——实际种群过大拖慢收敛，温度过高等于乱搜。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】模拟退火中温度 T 的主要作用是？<\/h3>\n<ul><li>\nA. 控制迭代次数\n<\/li><li>\nB. 控制接受较差解的概率\n<\/li><li>\nC. 决定编码长度\n<\/li><li>\nD. 计算适应度\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：P = exp(−Δ/T)，T 越大越容易接受差解，用于跳出局部最优。<\/p>\n<\/ul>\n<h3>Q2 【单选】TSP 使用遗传算法时，普通交叉会导致？<\/h3>\n<ul><li>\nA. 收敛过快\n<\/li><li>\nB. 路径中出现重复或缺失城市\n<\/li><li>\nC. 适应度无法计算\n<\/li><li>\nD. 种群规模爆炸\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：普通单点交叉会重复片段，必须用顺序交叉等保序算子。<\/p>\n<\/ul>\n<h3>Q3 【填空】启发式算法论文必须报告多次独立运行的________，而不只是最好值。<\/h3>\n<p><strong>答案<\/strong>：分布（平均值与标准差） <strong>解析<\/strong>：单次结果无法区分「算法稳定」与「运气好」。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n规模超限或目标不可导时，才换启发式。\n<\/li><li>\n退火靠温度控制接受差解的概率。\n<\/li><li>\nGA 五件套：编码、适应度、选择、交叉、变异。\n<\/li><li>\n结果要报多次运行的分布。\n<\/ul>", "kind": "chapter", "title": "第 12 章：现代优化算法"}, "ch13": {"html": "<h1>第 13 章：数字图像处理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 5 章、起步册第 2 章 | <strong>原书定位<\/strong>：第 13 章 p383–409\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清一幅数字图像在计算机里到底是什么；\n<\/li><li>\n手算一次 3×3 均值滤波，看出它为什么能去噪也会糊边；\n<\/li><li>\n分清空间域与频域两种做法的适用场景。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>图像是矩阵，处理图像就是对这个矩阵做局部加权平均、变换或编码。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：图像是矩阵（难度：基础）<\/h3>\n<p><strong>灰度图<\/strong>：每个像素一个 0–255 的数，0 黑 255 白。整幅图就是一个 m×n 矩阵。<\/p>\n<p><strong>彩色图<\/strong>：三个通道 R、G、B，每个通道一个矩阵，形状 m×n×3。<\/p>\n<p><strong>灰度化<\/strong>：把三通道合成一个，常用加权 Y = 0.299R + 0.587G + 0.114B。权重不同是因为人眼对绿光最敏感。<\/p>\n<h3>概念 2：亮度变换（难度：基础）<\/h3>\n<ul><li>\n<strong>线性拉伸<\/strong>：把原本集中在 100–150 的灰度拉到 0–255，对比度立刻变强。\n<\/li><li>\n<strong>伽马变换<\/strong>：s = c·r^γ，γ &lt; 1 提亮暗部，γ &gt; 1 压暗。\n<\/li><li>\n<strong>直方图均衡<\/strong>：按累计分布重新分配灰度，使直方图尽量平坦。全局提对比，但可能放大噪声。\n<\/ul>\n<h3>概念 3：空间滤波（难度：进阶）<\/h3>\n<p><strong>空间滤波<\/strong>：拿一个小窗口（如 3×3）在图上滑动，每个位置算一个加权和，写回中心像素。<\/p>\n<p>均值滤波的核是所有权重都为 1/9。手算一个例子：<\/p>\n<pre class=\"lang-text\"><code>10  10  10\n10  10  10\n10  10  90<\/code><\/pre>\n<p>中心像素原值 10，窗口和 = 10×8 + 90 = 170，除以 9 得 18.9，取整 19。原来那个 90 的亮点被压到 19，噪声减弱；同时如果 90 是真实边缘，边缘也被抹平。<\/p>\n<p>中值滤波取窗口中位数，上例中位数是 10，比均值更能保住边缘。椒盐噪声首选它。<\/p>\n<h3>概念 4：频域处理（难度：进阶）<\/h3>\n<p><strong>傅里叶变换<\/strong>把图像从空间域变到频域：低频对应大块平滑区域，高频对应边缘与噪声。<\/p>\n<p>低通滤波（保留低频）去噪但模糊；高通滤波（保留高频）锐化但放大噪声。频域做法的好处是「滤波器的设计直观」，代价是要做正反两次变换。<\/p>\n<h3>概念 5：水印与加密（难度：高难）<\/h3>\n<ul><li>\n<strong>LSB 水印<\/strong>：把水印信息写进像素值的最低位。人眼看不出来，但压缩或裁剪会破坏。\n<\/li><li>\n<strong>DCT 水印<\/strong>：在频域中频系数里嵌入，抗压缩能力强。\n<\/li><li>\n<strong>图像加密<\/strong>：Arnold 置乱打乱像素位置，混沌序列异或改变像素值。两者叠加才算安全，只置乱不改变直方图，容易被统计分析破解。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[原始图像矩阵] --&gt; B{要解决什么}\n    B --&gt;|太暗或太淡| C[亮度变换 直方图均衡]\n    B --&gt;|有噪声| D[均值 中值 高斯滤波]\n    B --&gt;|要锐化或去周期性噪声| E[频域滤波]\n    B --&gt;|要藏信息| F[LSB 或 DCT 水印]\n    B --&gt;|要保密| G[置乱 加 扩散]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：先明确目的再选工具。去噪选错滤波器，会把该保留的边缘一起抹掉。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：均值滤波像给照片蒙一层毛玻璃，颗粒感没了，细节也糊了。失效边界：毛玻璃是均匀模糊，均值滤波在边缘处会产生「拖影」，方向性噪声用它反而更糟。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：上面那个 3×3 窗口，若改用中值滤波，排序后中间值是 10，输出 10，亮点被完全剔除；若用最大值滤波，输出 90，亮点保留。同一窗口，三种滤波三种结果，说明「滤波」不是单一操作。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为分辨率越高信息越多——实际上压缩、模糊、噪声都会让高分辨率图的有效信息变少。\n<\/li><li>\n别以为滤波一定让图更好看——实际上过度平滑会让边缘消失，后续识别精度下降。\n<\/li><li>\n别以为 LSB 水印很安全——实际上任何有损压缩都能把它抹掉。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】灰度化时绿色通道权重最大的原因是？<\/h3>\n<ul><li>\nA. 绿色像素最多\n<\/li><li>\nB. 人眼对绿光最敏感\n<\/li><li>\nC. 绿色通道噪声最小\n<\/li><li>\nD. 计算方便\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：加权系数按人眼亮度感知设定，绿光权重 0.587 最高。<\/p>\n<\/ul>\n<h3>Q2 【单选】椒盐噪声最适合用哪种滤波？<\/h3>\n<ul><li>\nA. 均值滤波\n<\/li><li>\nB. 中值滤波\n<\/li><li>\nC. 高通滤波\n<\/li><li>\nD. 直方图均衡\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：中值滤波能剔除极端值同时保住边缘，均值会把噪声摊到整片区域。<\/p>\n<\/ul>\n<h3>Q3 【填空】3×3 均值滤波窗口中，每个位置的权重是________。<\/h3>\n<p><strong>答案<\/strong>：1/9 <strong>解析<\/strong>：九个像素等权平均，总和为 1，保证整体亮度不漂移。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n图像就是矩阵，处理就是矩阵运算。\n<\/li><li>\n均值去噪糊边，中值保边去椒盐。\n<\/li><li>\n频域低通去噪、高通锐化，各管一头。\n<\/ul>", "kind": "chapter", "title": "第 13 章：数字图像处理"}, "ch14": {"html": "<h1>第 14 章：综合评价与决策方法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：7 小时 | <strong>前置<\/strong>：第 7 章、第 10 章 | <strong>原书定位<\/strong>：第 14 章 p410–447\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n把「哪个方案更好」拆成指标、权重、标准化、合成四步；\n<\/li><li>\n手算一次极差标准化与加权合成，看出权重如何改变排序；\n<\/li><li>\n说清 TOPSIS、熵权法、模糊综合评判各自的前提。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>综合评价没有绝对正确，只有「口径说清楚了、权重交代了、结论能复现」的排序。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：四步流程（难度：基础）<\/h3>\n<ol><li>\n<strong>定指标<\/strong>：选能测、能比的量，分清效益型（越大越好）与成本型（越小越好）。\n<\/li><li>\n<strong>标准化<\/strong>：把不同量纲拉到同一区间。常用极差法：效益型 (x − min)/(max − min)，成本型 (max − x)/(max − min)。\n<\/li><li>\n<strong>定权重<\/strong>：主观（专家打分、AHP）或客观（熵权、主成分）。\n<\/li><li>\n<strong>合成排序<\/strong>：加权求和，或算与理想解的距离。\n<\/ol>\n<h3>概念 2：手算一个排序（难度：基础）<\/h3>\n<p>三个方案，价格 20、25、30 万元（成本型），质量评分 80、90、85（效益型）。<\/p>\n<p>价格标准化：(30 − x)/10 → 1、0.5、0。 质量标准化：(x − 80)/10 → 0、1、0.5。<\/p>\n<p>权重各 0.5：得分 0.5、0.75、0.25，方案 2 最好。 权重改成价格 0.8、质量 0.2：得分 0.8、0.6、0.1，方案 1 最好。<\/p>\n<p>同一组数据，换个权重排序就翻。这不是方法不稳，而是「哪个更重要」本来就是决策者的判断。论文里必须写清权重来源，并做权重灵敏度。<\/p>\n<h3>概念 3：TOPSIS（难度：进阶）<\/h3>\n<p><strong>理想解法（TOPSIS）<\/strong>：先构造正理想解（每个指标都取最好）与负理想解（每个都取最差），再算每个方案到两者的欧氏距离，离正理想近、离负理想远的排前面。<\/p>\n<p>优点：不要求指标独立，排序结果对权重不那么敏感。缺点：距离用的是欧氏距离，指标相关性高时会重复计权。<\/p>\n<h3>概念 4：熵权法（难度：进阶）<\/h3>\n<p><strong>熵权法<\/strong>：指标在方案间差异越大，信息量越大，权重越高。<\/p>\n<p>步骤：标准化 → 算比重 pᵢⱼ → 算熵 eⱼ = −(1/ln n)∑pᵢⱼln pᵢⱼ → 权重 wⱼ = (1 − eⱼ)/∑(1 − eⱼ)。<\/p>\n<p>注意：熵权是客观权重，它不代表重要性，只代表区分度。某项指标所有方案都一样，熵权为 0，但它可能极其重要——这是熵权法最大的坑。<\/p>\n<h3>概念 5：其他方法一句话（难度：进阶）<\/h3>\n<table><thead><tr><th>方法<\/th><th>一句话<\/th><th>前提<\/th><\/tr><\/thead><tbody><tr><td>模糊综合评判<\/td><td>用隶属度处理「说不太清」的评价<\/td><td>要构造合理的隶属函数<\/td><\/tr><tr><td>数据包络分析 DEA<\/td><td>用投入产出比评价效率<\/td><td>决策单元要同类、指标非负<\/td><\/tr><tr><td>灰色关联分析<\/td><td>看序列形状相似度<\/td><td>数据少也能用，但分辨率有限<\/td><\/tr><tr><td>秩和比 RSR<\/td><td>用秩次合成，抗异常值<\/td><td>会丢失原始数值信息<\/td><\/tr><tr><td>主成分分析<\/td><td>用少数综合成分排序<\/td><td>成分要有可解释性<\/td><\/tr><tr><td>PageRank<\/td><td>用链接关系给节点排序<\/td><td>要有有向关系网络<\/td><\/tr><\/tbody><\/table>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[待评价对象] --&gt; B[选指标]\n    B --&gt; C[区分效益型与成本型]\n    C --&gt; D[标准化]\n    D --&gt; E{权重怎么来}\n    E --&gt;|主观| F[AHP 专家打分]\n    E --&gt;|客观| G[熵权 主成分]\n    F --&gt; H[合成]\n    G --&gt; H\n    H --&gt; I[排序与灵敏度]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：权重来源是整章分歧最大的地方。主观权重可解释但可被质疑，客观权重可复现但可能背离业务重要性，稳妥做法是两种都算、对比结果。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：综合评价像给几个候选人打分录取，指标是分数项，权重是各科占比。失效边界：录取只看排序，评价常常还要给「为什么」，光有排名不够。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：上例三方案，若改用熵权法：价格标准化值 1、0.5、0 的差异大，熵小、权重大；质量 0、1、0.5 差异也大。两者熵接近，权重接近 0.5，结果与等权相同。这说明熵权并不自动偏向「更重要的指标」。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为指标越多越全面——实际上指标相关性高会重复计权，反而失真。\n<\/li><li>\n别以为客观权重比主观权重科学——实际上熵权只看区分度，不看业务重要性。\n<\/li><li>\n别以为排序稳定就说明方法好——实际上可能只是权重给得接近平均。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】成本型指标标准化时应该？<\/h3>\n<ul><li>\nA. 直接除以最大值\n<\/li><li>\nB. 用 (max − x)/(max − min)\n<\/li><li>\nC. 取对数\n<\/li><li>\nD. 平方后归一\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：成本型越小越好，极差法要反向，使标准化后仍是越大越好。<\/p>\n<\/ul>\n<h3>Q2 【单选】熵权法的权重反映的是？<\/h3>\n<ul><li>\nA. 指标的业务重要性\n<\/li><li>\nB. 指标在方案间的区分度\n<\/li><li>\nC. 指标间的相关性\n<\/li><li>\nD. 样本量大小\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：熵小说明分布不均、区分度大，权重高；与重要性无必然关系。<\/p>\n<\/ul>\n<h3>Q3 【填空】TOPSIS 通过计算方案到正理想解与负理想解的________来排序。<\/h3>\n<p><strong>答案<\/strong>：距离 <strong>解析<\/strong>：离正理想越近、离负理想越远，综合得分越高。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n评价四步：指标、标准化、权重、合成。\n<\/li><li>\n权重换一换，排序可能翻，必须做灵敏度。\n<\/li><li>\n熵权看区分度，不看重要性。\n<\/ul>", "kind": "chapter", "title": "第 14 章：综合评价与决策方法"}, "ch15": {"html": "<h1>第 15 章：预测方法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：7 小时 | <strong>前置<\/strong>：第 6、7 章 | <strong>原书定位<\/strong>：第 15 章 p448–477\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n按数据形态选预测方法：有机制、有趋势、有周期、有状态转移；\n<\/li><li>\n手算 GM(1,1) 的两步预测，并解释为什么它适合小样本；\n<\/li><li>\n说清「预测精度」该怎么报，为什么不能只报一个点估计。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>预测方法的差别不在算法新旧，而在它假设数据由什么驱动。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：六类方法与它们的假设（难度：基础）<\/h3>\n<table><thead><tr><th>方法<\/th><th>假设数据由什么驱动<\/th><th>适用场景<\/th><\/tr><\/thead><tbody><tr><td>微分方程<\/td><td>有明确的机制与反馈<\/td><td>传染病、人口、反应过程<\/td><\/tr><tr><td>灰色 GM(1,1)<\/td><td>累加后近似指数增长<\/td><td>小样本、单调趋势<\/td><\/tr><tr><td>马尔可夫<\/td><td>下一状态只依赖当前状态<\/td><td>状态离散、转移概率稳定<\/td><\/tr><tr><td>时间序列 ARIMA<\/td><td>趋势 + 差分平稳 + 自相关<\/td><td>有历史序列、季节性<\/td><\/tr><tr><td>插值与拟合<\/td><td>趋势平滑可外推<\/td><td>数据点少、规律简单<\/td><\/tr><tr><td>神经网络<\/td><td>非线性映射关系<\/td><td>样本多、机制不明<\/td><\/tr><\/tbody><\/table>\n<p>选错假设，再精细的参数也救不回来。比如用线性外推预测疫情早期，会低估指数增长。<\/p>\n<h3>概念 2：GM(1,1) 手算（难度：进阶）<\/h3>\n<p>原始序列 x⁰ = (2, 3, 4)，做一次累加得 x¹ = (2, 5, 9)。<\/p>\n<p>级比检验：λ(2) = 2/3 = 0.667，λ(3) = 3/4 = 0.75。n = 3 时容许区间约为 (0.607, 1.649)，两个比值都落在区间内，可以用 GM(1,1)。<\/p>\n<p>构造矩阵：紧邻均值 z = (3.5, 7)，B = [[−3.5, 1], [−7, 1]]，Y = [[3], [4]]。<\/p>\n<p>最小二乘解 (BᵀB)⁻¹BᵀY 得 a = −0.2857，b = 2。<\/p>\n<p>预测式：x̂¹(k+1) = (x⁰(1) − b/a)e^(−a k) + b/a = 9 e^(0.2857k) − 7。<\/p>\n<p>k = 1：x̂¹(2) = 9×1.3307 − 7 = 4.98。 k = 2：x̂¹(3) = 9×1.7709 − 7 = 8.94。<\/p>\n<p>还原：x̂⁰(3) = 8.94 − 4.98 = 3.96，与真值 4 相差 0.04，相对误差约 1%。<\/p>\n<p>注意 a 为负表示增长。若 a 为正，说明序列在衰减，模型形式仍成立，但预测会递减。<\/p>\n<h3>概念 3：马尔可夫与时间序列（难度：进阶）<\/h3>\n<p><strong>马尔可夫链<\/strong>：状态集合 + 转移概率矩阵。下一期状态只由本期状态决定，与更早的历史无关。<\/p>\n<p>用法：统计历史转移频次得矩阵 P，下一期分布 = 本期分布 × P。要求样本足够估计转移概率，且过程近似平稳。<\/p>\n<p><strong>ARIMA(p,d,q)<\/strong>：p 是自回归阶数，d 是差分次数，q 是移动平均阶数。先做单位根检验确定 d，再看 ACF/PACF 定 p、q，最后用 AIC 选模型。<\/p>\n<h3>概念 4：精度怎么报（难度：进阶）<\/h3>\n<p>三个指标：MAE 平均绝对误差、RMSE 均方根误差、MAPE 平均绝对百分比误差。<\/p>\n<p>必须做<strong>样本外检验<\/strong>：留出最后若干期不参与建模，用它们评估。样本内拟合得好，不代表预测得准。<\/p>\n<p>只报一个预测值而不给区间，等于隐藏不确定性。区间可以用残差标准差估，也可以用 Bootstrap。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[历史数据] --&gt; B{数据形态}\n    B --&gt;|有机制可写方程| C[微分方程]\n    B --&gt;|小样本单调趋势| D[灰色 GM]\n    B --&gt;|状态离散| E[马尔可夫]\n    B --&gt;|长序列有季节性| F[ARIMA]\n    B --&gt;|规律简单| G[拟合外推]\n    B --&gt;|样本大机制不明| H[神经网络]\n    C --&gt; I[样本外检验]\n    D --&gt; I\n    E --&gt; I\n    F --&gt; I\n    G --&gt; I\n    H --&gt; I<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：六条路径最后都汇到「样本外检验」。这一步省掉，方法再花哨也没有可信度。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：预测像看后视镜开车，镜子里清楚，前方只能推断。失效边界：路况突变时后视镜毫无用处，这正是所有统计预测的共同弱点。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：某产品销量 2、3、4 万件，用 GM(1,1) 得下一期 3.96，用线性拟合（斜率 1）得 5，用二次外推得 5。三个方法差 1 万件。差异来自假设：GM 认为增长放缓，线性认为匀速，二次认为加速。论文里选哪个，要说清依据。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为模型越复杂预测越准——实际上样本少时复杂模型参数估不准，简单模型更稳。\n<\/li><li>\n别以为拟合 R² 高就能预测——实际上过拟合在样本外会崩。\n<\/li><li>\n别以为预测是一个数——实际上必须给区间或误差范围。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】GM(1,1) 适合的数据特征是？<\/h3>\n<ul><li>\nA. 大样本、强季节性\n<\/li><li>\nB. 小样本、近似指数趋势\n<\/li><li>\nC. 状态离散、转移稳定\n<\/li><li>\nD. 多变量非线性\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：GM 通过一次累加把序列变成近似指数，适合数据点少的单调趋势。<\/p>\n<\/ul>\n<h3>Q2 【单选】ARIMA 中的 d 表示？<\/h3>\n<ul><li>\nA. 差分次数\n<\/li><li>\nB. 自回归阶数\n<\/li><li>\nC. 移动平均阶数\n<\/li><li>\nD. 样本量\n<p><strong>答案<\/strong>：A <strong>解析<\/strong>：d 是把非平稳序列差分成平稳序列所需的次数。<\/p>\n<\/ul>\n<h3>Q3 【填空】评估预测精度必须做________检验，而不是只看样本内拟合。<\/h3>\n<p><strong>答案<\/strong>：样本外 <strong>解析<\/strong>：样本内拟合优度高不代表泛化能力好，留出末段数据做真实验证才有意义。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n六类预测对应六种数据假设，先判形态再选方法。\n<\/li><li>\nGM(1,1) 靠累加 + 最小二乘，适合小样本。\n<\/li><li>\n精度必须报样本外指标与区间。\n<\/ul>", "kind": "chapter", "title": "第 15 章：预测方法"}, "ch16": {"html": "<h1>第 16 章：多目标规划和目标规划<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 1–3 章 | <strong>原书定位<\/strong>：第 16 章 p478–492\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清多目标问题为什么没有唯一最优解；\n<\/li><li>\n用加权和法与 ε 约束法各求一个折中方案；\n<\/li><li>\n把「尽量达到某目标」写成带偏差变量的目标规划。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>多目标不是「几个目标一起最大」，而是「在冲突的目标之间选一个你愿意接受的交换比例」。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：Pareto 有效解（难度：基础）<\/h3>\n<p><strong>Pareto 有效解<\/strong>：找不到另一个解在所有目标上都不差、且至少一个目标更好。也叫非劣解。<\/p>\n<p>例：五个方案的目标值为 (1,5)、(2,4)、(3,3)、(4,2)、(5,1)，都在直线 x + y = 6 上，互相无法全面超越，都是有效解。而 (2,3) 被 (3,3) 全面超越（第一目标更高、第二目标相同），是劣解。<\/p>\n<p>多目标优化的输出不是一个点，而是一条<strong>Pareto 前沿<\/strong>。选哪一点，是决策，不是计算。<\/p>\n<h3>概念 2：加权和法（难度：基础）<\/h3>\n<p>把多个目标加权成一个大目标：max w₁f₁ + w₂f₂，w₁ + w₂ = 1。<\/p>\n<p>优点：简单，一次求解。缺点：权重不同结果不同，且当目标量纲差很多时，权重要先归一化。<\/p>\n<p>坑：如果 Pareto 前沿不是凸的，加权和法会漏掉中间的解——它只能取到支撑点。<\/p>\n<h3>概念 3：ε 约束法（难度：进阶）<\/h3>\n<p>把一个目标作为主目标，其余目标改成约束：max f₁，s.t. f₂ ≥ ε₂, f₃ ≥ ε₃。<\/p>\n<p>扫 ε 从大到小，得到一串解，构成前沿。优点是非凸前沿也能取到；缺点是要反复求解，且 ε 的可行范围要试。<\/p>\n<h3>概念 4：目标规划（难度：进阶）<\/h3>\n<p><strong>目标规划<\/strong>：不追求最大最小，而是「尽量接近给定目标值」。<\/p>\n<p>引入偏差变量 d⁺（超出量）与 d⁻（不足量），满足 f(x) + d⁻ − d⁺ = 目标值，d⁺, d⁻ ≥ 0，目标是最小化加权偏差。<\/p>\n<p>优先级：先保证第一级目标，再在它的最优解集里优化第二级。这叫<strong>分层目标规划<\/strong>。<\/p>\n<p>例：利润目标 120（千元），用工上限 80（工时）。约束写成 3x + 2y + d₁⁻ − d₁⁺ = 120；x + y + d₂⁻ = 80。目标 min 5d₁⁻ + 3d₂⁻。系数 5 与 3 表示「利润差 1 千元比用工差 1 工时更严重」。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[多个冲突目标] --&gt; B{要前沿还是要一个方案}\n    B --&gt;|要前沿| C[ε 约束法扫参数]\n    B --&gt;|要一个方案| D{决策者能给出偏好}\n    D --&gt;|能给权重| E[加权和法]\n    D --&gt;|能给目标值| F[目标规划]\n    C --&gt; G[前沿曲线]\n    E --&gt; H[单一方案]\n    F --&gt; H<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：先问「要一条线还是一个点」。这是多目标建模最先要问清的问题，答错了后面全白做。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：多目标像买电脑时在性能与续航之间权衡。没有「最好」的电脑，只有「按你的用法最合适」的电脑。失效边界：电脑还能加钱两样都要，多目标问题里资源固定，加钱这个选项不存在。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：某厂两目标 f₁ = 4x + 3y（利润），f₂ = x + 2y（市场份额），约束 2x + y ≤ 10、x + y ≤ 8、x,y ≥ 0。加权 w = 0.5：max 2.5x + 2.5y，沿 x + y = 8 取到，值 20，解不唯一——这说明权重相等时问题退化。改用 w₁ = 0.7、w₂ = 0.3：max 3.1x + 2.7y，最优在 (2,6)，得 6.2 + 16.2 = 22.4；对比 (1,7) 得 3.1 + 18.9 = 22.0，前者更优。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为多目标可以「全部最大化」——实际上目标冲突时不存在这样的解。\n<\/li><li>\n别以为加权和法一定找到最优折中——实际上非凸前沿会漏解。\n<\/li><li>\n别以为目标规划就是多目标规划——实际上它把目标变成约束，优化的是偏差。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】Pareto 有效解的含义是？<\/h3>\n<ul><li>\nA. 所有目标都最大\n<\/li><li>\nB. 不存在全面更优的解\n<\/li><li>\nC. 加权和最大的解\n<\/li><li>\nD. 约束最少的解\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：有效解指不被任何其他解全面超越，可能有很多个。<\/p>\n<\/ul>\n<h3>Q2 【单选】加权和法的主要局限是？<\/h3>\n<ul><li>\nA. 不能处理两个以上目标\n<\/li><li>\nB. 非凸前沿上会漏掉中间解\n<\/li><li>\nC. 必须用整数规划\n<\/li><li>\nD. 权重必须相等\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：加权和只能取到支撑点，非凸部分取不到，需改用 ε 约束法。<\/p>\n<\/ul>\n<h3>Q3 【填空】目标规划中 d⁺ 表示实际值相对目标值的________量。<\/h3>\n<p><strong>答案<\/strong>：超出 <strong>解析<\/strong>：d⁺ 是正偏差（超出），d⁻ 是负偏差（不足），两者不能同时非零。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n多目标输出前沿，不输出单点。\n<\/li><li>\n加权和简单但漏非凸解，ε 约束更全但更慢。\n<\/li><li>\n目标规划把目标写成约束，最小化偏差。\n<\/ul>", "kind": "chapter", "title": "第 16 章：多目标规划和目标规划"}, "c01": {"html": "<h1>标准化与权重<\/h1>\n<p>&lt;!--chapters: ch14,ch10--&gt;<\/p>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 14 章、第 10 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>标准化把不同量纲的指标压到同一区间；权重决定哪个指标在最终排序里说话更响。<\/p>\n<h2>为什么重要<\/h2>\n<p>综合评价的结论几乎完全由这两步决定。同一组数据，换标准化方法或换权重，排序就可能翻。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[原始指标] --&gt; B[区分效益型与成本型]\n    B --&gt; C[极差或向量标准化]\n    C --&gt; D[赋权]\n    D --&gt; E[加权合成]\n    E --&gt; F[排序]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>极差法：效益型 (x−min)/(max−min)，成本型 (max−x)/(max−min)。向量标准化：x/√∑x²。前者受极值影响大，后者保留分布形状。<\/p>\n<p>权重来源：主观（AHP、专家打分）可解释但可被质疑；客观（熵权、主成分）可复现但可能背离业务重要性。稳妥做法是两种都算、对比。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为标准化方法可以随便选——实际上极差法对异常值极敏感，有一个离群点就会把其余值压扁。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 14 章<\/td><td>评价流程<\/td><td>价格 20/25/30 标准化为 1/0.5/0<\/td><\/tr><tr><td>第 10 章<\/td><td>PCA<\/td><td>先标准化再算协方差<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：指标、量纲\n<\/li><li>\n后续：TOPSIS、熵权法\n<\/ul>", "kind": "concept", "title": "标准化与权重"}, "c02": {"html": "<h1>间隔与支持向量<\/h1>\n<p>&lt;!--chapters: ch09--&gt;<\/p>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 9 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>间隔是两类点之间的安全距离；支持向量是决定这条边界的那几个最近的点。<\/p>\n<h2>为什么重要<\/h2>\n<p>它解释了 SVM 为什么比「随便找条线分开」更稳：间隔是模型的容错空间。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[正类点] --&gt; C[决策线]\n    B[负类点] --&gt; C\n    C --&gt; D[支持向量到线距离]\n    D --&gt; E[间隔 = 2 倍距离]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>规范化后支持向量满足 wᵀx + b = ±1，间隔 2/‖w‖。最大化间隔等价于最小化 ‖w‖²/2，这是个二次规划。<\/p>\n<p>类比：在两排人之间画线，要求离两边都尽量远，谁稍微动一下都不会越界。失效边界：两排人本身交错时无法做到，只能允许越界，即软间隔。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为所有样本都影响边界——实际上只有支持向量进入约束等号，其余点删掉不影响结果。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 9 章<\/td><td>基本模型<\/td><td>间隔 2/‖w‖，支持向量定边界<\/td><\/tr><tr><td>第 9 章<\/td><td>软间隔<\/td><td>C 控制容忍度<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：二次规划、KKT\n<\/li><li>\n后续：核函数、多分类\n<\/ul>", "kind": "concept", "title": "间隔与支持向量"}, "c03": {"html": "<h1>可行域与顶点<\/h1>\n<p>&lt;!--chapters: ch01,ch02,ch16--&gt;<\/p>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1、2、16 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>可行域是所有满足约束的点，线性约束下它是凸多边形；最优解一定能在它的顶点上找到。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把「在无穷多个解里找最优」变成「算有限个顶点」。整数规划、多目标规划的各种方法，都在和这个几何结构打交道。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[约束不等式组] --&gt; B[可行域凸多边形]\n    B --&gt; C[顶点集合]\n    C --&gt; D[逐点算目标值]\n    D --&gt; E[最优顶点]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>二维时每条约束是一条直线，可行域是这些直线围出的多边形。三维是多面体。顶点处有几条约束同时取等号，这就是「紧约束」的含义。<\/p>\n<p>类比：可行域像一块草地，顶点是四角。你想在草地上找最高的点，如果草地是平的或均匀倾斜，最高点一定在角上。失效边界：草地中间有个土包时，最高点就在内部，这就是非线性规划要单独处理的原因。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为顶点一定可行——实际上两条约束线的交点可能落在第三条约束外，要逐条代回验证。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 1 章<\/td><td>机床厂例子<\/td><td>顶点 (2,6) 给出 z=26<\/td><\/tr><tr><td>第 2 章<\/td><td>整数规划<\/td><td>顶点变格点，几何直觉失效<\/td><\/tr><tr><td>第 16 章<\/td><td>多目标<\/td><td>有效解构成前沿而非单点<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：约束条件\n<\/li><li>\n后续：单纯形法、Pareto 前沿\n<\/ul>", "kind": "concept", "title": "可行域与顶点"}, "c04": {"html": "<h1>Pareto 前沿<\/h1>\n<p>&lt;!--chapters: ch16,ch14--&gt;<\/p>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 16 章、第 14 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>所有不被其他解全面超越的解构成的集合，形状是一条权衡曲线。<\/p>\n<h2>为什么重要<\/h2>\n<p>多目标问题没有唯一答案，前沿就是「所有理性选择」的集合。选哪一点是决策，不是计算。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[可行解集合] --&gt; B[剔除被支配解]\n    B --&gt; C[Pareto 前沿]\n    C --&gt; D[按偏好选一点]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>点 (1,5)、(2,4)、(3,3)、(4,2)、(5,1) 都在 x+y=6 上，互不支配，都是有效解；(2,3) 被 (3,3) 支配，剔除。<\/p>\n<p>求法：加权和法（快，但漏非凸部分）、ε 约束法（全，但慢）、遗传算法（适合大规模）。<\/p>\n<p>类比：买电脑在性能与续航之间权衡，前沿就是「同等预算下所有值得买的型号」。失效边界：预算可以加时，前沿会整体外移，这时问题本身变了。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为前沿上的点都同样好——实际上它们只是互不支配，具体选哪个取决于偏好。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 16 章<\/td><td>多目标<\/td><td>加权 0.7/0.3 得 (2,6)<\/td><\/tr><tr><td>第 14 章<\/td><td>评价<\/td><td>排序等价于在前沿上选点<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：可行域、加权和\n<\/li><li>\n后续：目标规划\n<\/ul>", "kind": "concept", "title": "Pareto 前沿"}, "c05": {"html": "<h1>凸性<\/h1>\n<p>&lt;!--chapters: ch03,ch10,ch16--&gt;<\/p>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3、10、16 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>碗形结构：集合里任意两点的连线仍在集合内，函数上任意两点的连线仍在函数上方。<\/p>\n<h2>为什么重要<\/h2>\n<p>凸性决定算法能不能保证全局最优。凸问题用梯度法一次就能收敛到最优；非凸问题必须多起点，且每次结果可能不同。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[模型] --&gt; B{目标凸且可行域凸}\n    B --&gt;|是| C[局部最优即全局最优]\n    B --&gt;|否| D[多起点搜索或全局算法]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>判定：一元看二阶导数 ≥ 0；多元看海森矩阵半正定；可行域由线性约束构成时必凸，含等式非线性约束时要单独检查。<\/p>\n<p>类比：凸像碗，球滚下去一定到碗底；非凸像山地，球可能停在小坑。失效边界：碗底也可能是一条平底槽，这时最优解不唯一，但仍是全局最优。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为约束是线性的就一定凸——实际上目标函数非凸时整体仍非凸。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 3 章<\/td><td>KKT 与二次规划<\/td><td>半正定 Hessian 保证凸<\/td><\/tr><tr><td>第 10 章<\/td><td>PCA<\/td><td>协方差矩阵半正定，主成分方向唯一<\/td><\/tr><tr><td>第 16 章<\/td><td>加权和<\/td><td>非凸前沿导致漏解<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：导数、矩阵\n<\/li><li>\n后续：KKT 条件、Pareto 前沿\n<\/ul>", "kind": "concept", "title": "凸性"}, "c06": {"html": "<h1>稳定性<\/h1>\n<p>&lt;!--chapters: ch06,ch08--&gt;<\/p>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 6、8 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>初值受到小扰动后，系统会不会自己回到原来的平衡状态。<\/p>\n<h2>为什么重要<\/h2>\n<p>预测类模型最怕「参数差一点，结果差很多」。稳定性分析告诉你模型能用多久、误差会不会放大。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[平衡点] --&gt; B{扰动后}\n    B --&gt;|回到平衡点| C[稳定]\n    B --&gt;|越走越远| D[不稳定]\n    B --&gt;|等幅振荡| E[临界]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>离散系统看特征根的模是否小于 1；连续系统看特征值实部是否为负。一阶差分 xₙ₊₁ = axₙ + b 的判据是 |a| &lt; 1。<\/p>\n<p>类比：不倒翁被推一下会晃回来，是稳定；鸡蛋立起来被碰一下就倒，是不稳定。失效边界：不倒翁只在平地稳定，斜坡上照样滚走，模型的稳定域也有范围。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为平衡点存在就等于稳定——实际上很多平衡点是不稳定的，稍有偏差就发散。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 6 章<\/td><td>微分方程<\/td><td>特征值实部为负则渐近稳定<\/td><\/tr><tr><td>第 8 章<\/td><td>差分方程<\/td><td>特征根模小于 1 则稳定<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：特征值\n<\/li><li>\n后续：长期预测的可信度评估\n<\/ul>", "kind": "concept", "title": "稳定性"}, "c07": {"html": "<h1>影子价格<\/h1>\n<p>&lt;!--chapters: ch01,ch14--&gt;<\/p>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1 章、第 14 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>某条资源约束的右端项每增加一个单位，最优目标值能提高多少。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把「资源紧不紧」变成可比较的数字，直接支撑「要不要加班、要不要采购」这类决策。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[右端项加 1] --&gt; B[重解模型]\n    B --&gt; C[目标值增量]\n    C --&gt; D[与资源成本比较]\n    D --&gt;|增量大于成本| E[追加资源]\n    D --&gt;|增量小于成本| F[不追加]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>对偶理论保证影子价格等于对偶变量。约束未起作用时影子价格为 0：资源闲着，再给也没用。<\/p>\n<p>机床上例中 A 工时从 10 增到 11，最优值从 26 增到 27，影子价格 1 千元/小时。若加班费 0.6 千元/小时，值得加。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为影子价格永远为正——实际上非紧约束的影子价格为 0，约束放松也不会改善目标。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 1 章<\/td><td>灵敏度讨论<\/td><td>影子价格 = 对偶变量<\/td><\/tr><tr><td>第 14 章<\/td><td>评价<\/td><td>权重可视为资源重要性的影子价格<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：线性规划、对偶\n<\/li><li>\n后续：灵敏度分析\n<\/ul>", "kind": "concept", "title": "影子价格"}, "c08": {"html": "<h1>最小二乘<\/h1>\n<p>&lt;!--chapters: ch05,ch07,ch11--&gt;<\/p>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 5、7、11 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>在所有候选参数里，挑使残差平方和最小的那一组。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是拟合、回归、PLS 的共同底座。理解了它，第 5、7、11 章的公式就都是同一件事的不同包装。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[数据点] --&gt; B[假设函数形式]\n    B --&gt; C[算残差平方和]\n    C --&gt; D[对参数求导令零]\n    D --&gt; E[解出参数]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>一元直线拟合的解析解：斜率 = 协方差 / 方差，截距 = 均值差。多元时写成 (XᵀX)⁻¹Xᵀy，共线会让 XᵀX 接近奇异，系数爆炸。<\/p>\n<p>类比：往几个点中间拉一根橡皮筋，它最终停在总拉伸量最小的位置。失效边界：橡皮筋对所有点等权，有异常值时会被单点拽偏，这时要用稳健回归。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为最小二乘只适合直线——实际上任何线性于参数的模型都能用，多项式拟合也是线性的。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 5 章<\/td><td>直线拟合<\/td><td>斜率 1.5、截距 0.333<\/td><\/tr><tr><td>第 7 章<\/td><td>回归<\/td><td>与假设检验配套使用<\/td><\/tr><tr><td>第 11 章<\/td><td>共线性<\/td><td>XᵀX 病态导致系数不稳<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：矩阵、导数\n<\/li><li>\n后续：岭回归、偏最小二乘\n<\/ul>", "kind": "concept", "title": "最小二乘"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题
