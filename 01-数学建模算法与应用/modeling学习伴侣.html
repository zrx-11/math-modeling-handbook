）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：先学规划，占赛题一半<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：线性规划<\/a>、<a href=\"#/chapter/ch02\">第 2 章：整数规划<\/a>、<a href=\"#/chapter/ch03\">第 3 章：非线性规划<\/a><br>检查点：能手算 (2,6)=26 与影子价格 1，会用分枝定界<\/li><li class='path-step' id='path-02'><strong>步骤 02：图论：点和点的关系<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：图与网络模型及方法<\/a><br>检查点：手跑 Dijkstra 得 1→5 最短 6，Kruskal 得总权 6<\/li><li class='path-step' id='path-03'><strong>步骤 03：连续与离散的分析工具<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：插值与拟合<\/a>、<a href=\"#/chapter/ch06\">第 6 章：微分方程<\/a>、<a href=\"#/chapter/ch08\">第 8 章：差分方程<\/a><br>检查点：手算三点插值 2.875 与差分平衡点 100<\/li><li class='path-step' id='path-04'><strong>步骤 04：统计：从样本猜总体<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：数理统计<\/a><br>检查点：手算 t=1.414 并正确表述不显著<\/li><li class='path-step' id='path-05'><strong>步骤 05：分类与降维<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章：支持向量机<\/a>、<a href=\"#/chapter/ch10\">第 10 章：多元分析<\/a>、<a href=\"#/chapter/ch11\">第 11 章：偏最小二乘回归分析<\/a><br>检查点：说清聚类与判别、PCA 与因子分析的区别<\/li><li class='path-step' id='path-06'><strong>步骤 06：解空间太大时<\/strong><br>阅读：<a href=\"#/chapter/ch12\">第 12 章：现代优化算法<\/a>、<a href=\"#/chapter/ch13\">第 13 章：数字图像处理<\/a><br>检查点：能设计 GA 五件套与退火温度表<\/li><li class='path-step' id='path-07'><strong>步骤 07：排序、预测与折中<\/strong><br>阅读：<a href=\"#/chapter/ch14\">第 14 章：综合评价与决策方法<\/a>、<a href=\"#/chapter/ch15\">第 15 章：预测方法<\/a>、<a href=\"#/chapter/ch16\">第 16 章：多目标规划和目标规划<\/a><br>检查点：手算加权排序并说明权重灵敏度<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：线性规划<\/h1><div class='quiz-item' data-qid='q0101' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 线性规划的可行域一定是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0101' value='0'> 凸多边形或凸多面体<\/label><label class='quiz-opt'><input type='radio' name='q0101' value='1'> 圆形<\/label><label class='quiz-opt'><input type='radio' name='q0101' value='2'> 任意形状<\/label><label class='quiz-opt'><input type='radio' name='q0101' value='3'> 一条曲线<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0102' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 某约束的影子价格为 0，说明？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0102' value='0'> 该资源完全用尽<\/label><label class='quiz-opt'><input type='radio' name='q0102' value='1'> 该资源还有剩余，再增加它不能提高目标值<\/label><label class='quiz-opt'><input type='radio' name='q0102' value='2'> 模型无解<\/label><label class='quiz-opt'><input type='radio' name='q0102' value='3'> 该约束写错了<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0103' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 把 max z 转成 scipy 能接受的形式，需要把目标系数全部________。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：整数规划<\/h1><div class='quiz-item' data-qid='q0201' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 线性规划松弛解为 (2.67, 0)，下列做法正确的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0201' value='0'> 直接四舍五入得 (3, 0)<\/label><label class='quiz-opt'><input type='radio' name='q0201' value='1'> 以松弛解为上界做分枝定界<\/label><label class='quiz-opt'><input type='radio' name='q0201' value='2'> 认为问题无解<\/label><label class='quiz-opt'><input type='radio' name='q0201' value='3'> 把约束改成等式<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0202' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 「A、B 两个项目最多上一个」应写成？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0202' value='0'> y_A + y_B ≤ 1<\/label><label class='quiz-opt'><input type='radio' name='q0202' value='1'> y_A + y_B ≥ 1<\/label><label class='quiz-opt'><input type='radio' name='q0202' value='2'> y_A − y_B ≤ 1<\/label><label class='quiz-opt'><input type='radio' name='q0202' value='3'> y_A × y_B ≤ 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0203' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 指派问题的约束特点是每行之和为 1、每列之和为________。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：非线性规划<\/h1><div class='quiz-item' data-qid='q0301' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 判断多元目标函数是否凸，主要看？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0301' value='0'> 一阶导数是否为零<\/label><label class='quiz-opt'><input type='radio' name='q0301' value='1'> 海森矩阵是否半正定<\/label><label class='quiz-opt'><input type='radio' name='q0301' value='2'> 变量个数<\/label><label class='quiz-opt'><input type='radio' name='q0301' value='3'> 约束个数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0302' data-type='single'><p class='quiz-q'><b>Q2.<\/b> KKT 条件中「互补松弛」的含义是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0302' value='0'> 所有约束都必须取等号<\/label><label class='quiz-opt'><input type='radio' name='q0302' value='1'> 约束未起作用时对应乘子为零<\/label><label class='quiz-opt'><input type='radio' name='q0302' value='2'> 乘子必须为负<\/label><label class='quiz-opt'><input type='radio' name='q0302' value='3'> 目标函数必须为零<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0303' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 把 (1, 2) 投影到直线 x₁ + x₂ = 2 上，得到的点是________。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 4 章：图与网络模型及方法<\/h1><div class='quiz-item' data-qid='q0401' data-type='single'><p class='quiz-q'><b>Q1.<\/b> n 个点的最小生成树有几条边？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0401' value='0'> n<\/label><label class='quiz-opt'><input type='radio' name='q0401' value='1'> n−1<\/label><label class='quiz-opt'><input type='radio' name='q0401' value='2'> n+1<\/label><label class='quiz-opt'><input type='radio' name='q0401' value='3'> 不确定<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0402' data-type='single'><p class='quiz-q'><b>Q2.<\/b> Dijkstra 算法不适用的情形是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0402' value='0'> 边权为正<\/label><label class='quiz-opt'><input type='radio' name='q0402' value='1'> 存在负权边<\/label><label class='quiz-opt'><input type='radio' name='q0402' value='2'> 图是稠密图<\/label><label class='quiz-opt'><input type='radio' name='q0402' value='3'> 图是有向图<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0403' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 关键路径上任何一道工序延误，整个工期都会________。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch05__": {"html": "<h1>测验：第 5 章：插值与拟合<\/h1><div class='quiz-item' data-qid='q0501' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 插值与拟合最根本的区别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0501' value='0'> 插值用多项式，拟合不用<\/label><label class='quiz-opt'><input type='radio' name='q0501' value='1'> 插值必须经过所有数据点，拟合不要求<\/label><label class='quiz-opt'><input type='radio' name='q0501' value='2'> 插值只能用于一维<\/label><label class='quiz-opt'><input type='radio' name='q0501' value='3'> 拟合需要更多数据<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0502' data-type='single'><p class='quiz-q'><b>Q2.<\/b> Runge 现象说明？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0502' value='0'> 节点越多，插值一定越准<\/label><label class='quiz-opt'><input type='radio' name='q0502' value='1'> 等距节点上高次多项式插值在边缘会剧烈振荡<\/label><label class='quiz-opt'><input type='radio' name='q0502' value='2'> 三次样条不收敛<\/label><label class='quiz-opt'><input type='radio' name='q0502' value='3'> 拟合不能用于函数逼近<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0503' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 数据 (1,2)、(2,3)、(3,5) 的最小二乘直线斜率为________。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch06__": {"html": "<h1>测验：第 6 章：微分方程<\/h1><div class='quiz-item' data-qid='q0601' data-type='single'><p class='quiz-q'><b>Q1.<\/b> R₀ = β/γ 大于 1 意味着？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0601' value='0'> 疫情必然消失<\/label><label class='quiz-opt'><input type='radio' name='q0601' value='1'> 一个感染者平均传染超过一个人，疫情可能扩散<\/label><label class='quiz-opt'><input type='radio' name='q0601' value='2'> 病毒致死率高<\/label><label class='quiz-opt'><input type='radio' name='q0601' value='3'> 康复速度过快<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0602' data-type='single'><p class='quiz-q'><b>Q2.<\/b> Euler 法的主要缺点是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0602' value='0'> 无法处理线性方程<\/label><label class='quiz-opt'><input type='radio' name='q0602' value='1'> 只有一阶精度，步长大时误差显著<\/label><label class='quiz-opt'><input type='radio' name='q0602' value='2'> 需要解析解<\/label><label class='quiz-opt'><input type='radio' name='q0602' value='3'> 不能处理初值问题<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0603' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 用 Euler 法解 dy/dt = y、y(0)=1、h=0.5，两步后 y₂ = ________。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch07__": {"html": "<h1>测验：第 7 章：数理统计<\/h1><div class='quiz-item' data-qid='q0701' data-type='single'><p class='quiz-q'><b>Q1.<\/b> p 值的正确解读是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0701' value='0'> H₀ 为真的概率<\/label><label class='quiz-opt'><input type='radio' name='q0701' value='1'> H₀ 为真时出现当前或更极端结果的概率<\/label><label class='quiz-opt'><input type='radio' name='q0701' value='2'> 结论正确的概率<\/label><label class='quiz-opt'><input type='radio' name='q0701' value='3'> 效应量大小<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0702' data-type='single'><p class='quiz-q'><b>Q2.<\/b> Bootstrap 的核心操作是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0702' value='0'> 增加样本量<\/label><label class='quiz-opt'><input type='radio' name='q0702' value='1'> 有放回重抽样并重复计算统计量<\/label><label class='quiz-opt'><input type='radio' name='q0702' value='2'> 对数据做正态化变换<\/label><label class='quiz-opt'><input type='radio' name='q0702' value='3'> 删除异常值<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0703' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 样本 10、12、11、13、9 的标准差约为________。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch08__": {"html": "<h1>测验：第 8 章：差分方程<\/h1><div class='quiz-item' data-qid='q0801' data-type='single'><p class='quiz-q'><b>Q1.<\/b> xₙ₊₁ = 0.8xₙ + 20 的平衡点是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0801' value='0'> 20<\/label><label class='quiz-opt'><input type='radio' name='q0801' value='1'> 80<\/label><label class='quiz-opt'><input type='radio' name='q0801' value='2'> 100<\/label><label class='quiz-opt'><input type='radio' name='q0801' value='3'> 120<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0802' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 一阶系统稳定的条件是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0802' value='0'> |a| &lt; 1<\/label><label class='quiz-opt'><input type='radio' name='q0802' value='1'> a &gt; 0<\/label><label class='quiz-opt'><input type='radio' name='q0802' value='2'> b = 0<\/label><label class='quiz-opt'><input type='radio' name='q0802' value='3'> |a| &gt; 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0803' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> Leslie 矩阵的主特征值大于 1 表示种群长期________。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch09__": {"html": "<h1>测验：第 9 章：支持向量机<\/h1><div class='quiz-item' data-qid='q0901' data-type='single'><p class='quiz-q'><b>Q1.<\/b> SVM 中决定分类边界的点是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0901' value='0'> 所有样本点<\/label><label class='quiz-opt'><input type='radio' name='q0901' value='1'> 支持向量<\/label><label class='quiz-opt'><input type='radio' name='q0901' value='2'> 离边界最远的点<\/label><label class='quiz-opt'><input type='radio' name='q0901' value='3'> 标签为 0 的点<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0902' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 惩罚参数 C 增大，通常会导致？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0902' value='0'> 间隔变宽，偏差增大<\/label><label class='quiz-opt'><input type='radio' name='q0902' value='1'> 间隔变窄，更容易过拟合<\/label><label class='quiz-opt'><input type='radio' name='q0902' value='2'> 模型变成线性回归<\/label><label class='quiz-opt'><input type='radio' name='q0902' value='3'> 支持向量消失<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0903' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 核函数的作用是隐式地把数据映射到________空间。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch10__": {"html": "<h1>测验：第 10 章：多元分析<\/h1><div class='quiz-item' data-qid='q1001' data-type='single'><p class='quiz-q'><b>Q1.<\/b> K-means 必须预先确定的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1001' value='0'> 距离度量<\/label><label class='quiz-opt'><input type='radio' name='q1001' value='1'> 聚类数 k<\/label><label class='quiz-opt'><input type='radio' name='q1001' value='2'> 特征个数<\/label><label class='quiz-opt'><input type='radio' name='q1001' value='3'> 样本标签<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q1002' data-type='single'><p class='quiz-q'><b>Q2.<\/b> PCA 中「贡献率」指的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1002' value='0'> 某个样本的解释比例<\/label><label class='quiz-opt'><input type='radio' name='q1002' value='1'> 某主成分特征值占全部特征值之和的比例<\/label><label class='quiz-opt'><input type='radio' name='q1002' value='2'> 分类准确率<\/label><label class='quiz-opt'><input type='radio' name='q1002' value='3'> 变量个数占比<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q1003' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 有标签、要给新样本归类的分析叫________分析。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch11__": {"html": "<h1>测验：第 11 章：偏最小二乘回归分析<\/h1><div class='quiz-item' data-qid='q1101' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 多重共线性的典型后果是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1101' value='0'> 模型无法求解<\/label><label class='quiz-opt'><input type='radio' name='q1101' value='1'> 回归系数方差变大、符号可能反常<\/label><label class='quiz-opt'><input type='radio' name='q1101' value='2'> R² 一定下降<\/label><label class='quiz-opt'><input type='radio' name='q1101' value='3'> 样本量自动减少<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q1102' data-type='single'><p class='quiz-q'><b>Q2.<\/b> PLS 与 PCA 的核心区别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1102' value='0'> PLS 不做降维<\/label><label class='quiz-opt'><input type='radio' name='q1102' value='1'> PLS 提取成分时同时考虑与 Y 的相关<\/label><label class='quiz-opt'><input type='radio' name='q1102' value='2'> PCA 只能用于分类<\/label><label class='quiz-opt'><input type='radio' name='q1102' value='3'> PLS 不需要数据<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q1103' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 判断变量重要性常用指标是________值，通常大于 1 视为重要。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch12__": {"html": "<h1>测验：第 12 章：现代优化算法<\/h1><div class='quiz-item' data-qid='q1201' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 模拟退火中温度 T 的主要作用是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1201' value='0'> 控制迭代次数<\/label><label class='quiz-opt'><input type='radio' name='q1201' value='1'> 控制接受较差解的概率<\/label><label class='quiz-opt'><input type='radio' name='q1201' value='2'> 决定编码长度<\/label><label class='quiz-opt'><input type='radio' name='q1201' value='3'> 计算适应度<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q1202' data-type='single'><p class='quiz-q'><b>Q2.<\/b> TSP 使用遗传算法时，普通交叉会导致？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1202' value='0'> 收敛过快<\/label><label class='quiz-opt'><input type='radio' name='q1202' value='1'> 路径中出现重复或缺失城市<\/label><label class='quiz-opt'><input type='radio' name='q1202' value='2'> 适应度无法计算<\/label><label class='quiz-opt'><input type='radio' name='q1202' value='3'> 种群规模爆炸<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q1203' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 启发式算法论文必须报告多次独立运行的________，而不只是最好值。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch13__": {"html": "<h1>测验：第 13 章：数字图像处理<\/h1><div class='quiz-item' data-qid='q1301' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 灰度化时绿色通道权重最大的原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1301' value='0'> 绿色像素最多<\/label><label class='quiz-opt'><input type='radio' name='q1301' value='1'> 人眼对绿光最敏感<\/label><label class='quiz-opt'><input type='radio' name='q1301' value='2'> 绿色通道噪声最小<\/label><label class='quiz-opt'><input type='radio' name='q1301' value='3'> 计算方便<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q1302' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 椒盐噪声最适合用哪种滤波？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1302' value='0'> 均值滤波<\/label><label class='quiz-opt'><input type='radio' name='q1302' value='1'> 中值滤波<\/label><label class='quiz-opt'><input type='radio' name='q1302' value='2'> 高通滤波<\/label><label class='quiz-opt'><input type='radio' name='q1302' value='3'> 直方图均衡<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q1303' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 3×3 均值滤波窗口中，每个位置的权重是________。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch14__": {"html": "<h1>测验：第 14 章：综合评价与决策方法<\/h1><div class='quiz-item' data-qid='q1401' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 成本型指标标准化时应该？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1401' value='0'> 直接除以最大值<\/label><label class='quiz-opt'><input type='radio' name='q1401' value='1'> 用 (max − x)/(max − min)<\/label><label class='quiz-opt'><input type='radio' name='q1401' value='2'> 取对数<\/label><label class='quiz-opt'><input type='radio' name='q1401' value='3'> 平方后归一<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q1402' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 熵权法的权重反映的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1402' value='0'> 指标的业务重要性<\/label><label class='quiz-opt'><input type='radio' name='q1402' value='1'> 指标在方案间的区分度<\/label><label class='quiz-opt'><input type='radio' name='q1402' value='2'> 指标间的相关性<\/label><label class='quiz-opt'><input type='radio' name='q1402' value='3'> 样本量大小<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q1403' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> TOPSIS 通过计算方案到正理想解与负理想解的________来排序。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch15__": {"html": "<h1>测验：第 15 章：预测方法<\/h1><div class='quiz-item' data-qid='q1501' data-type='single'><p class='quiz-q'><b>Q1.<\/b> GM(1,1) 适合的数据特征是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1501' value='0'> 大样本、强季节性<\/label><label class='quiz-opt'><input type='radio' name='q1501' value='1'> 小样本、近似指数趋势<\/label><label class='quiz-opt'><input type='radio' name='q1501' value='2'> 状态离散、转移稳定<\/label><label class='quiz-opt'><input type='radio' name='q1501' value='3'> 多变量非线性<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q1502' data-type='single'><p class='quiz-q'><b>Q2.<\/b> ARIMA 中的 d 表示？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1502' value='0'> 差分次数<\/label><label class='quiz-opt'><input type='radio' name='q1502' value='1'> 自回归阶数<\/label><label class='quiz-opt'><input type='radio' name='q1502' value='2'> 移动平均阶数<\/label><label class='quiz-opt'><input type='radio' name='q1502' value='3'> 样本量<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q1503' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 评估预测精度必须做________检验，而不是只看样本内拟合。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch16__": {"html": "<h1>测验：第 16 章：多目标规划和目标规划<\/h1><div class='quiz-item' data-qid='q1601' data-type='single'><p class='quiz-q'><b>Q1.<\/b> Pareto 有效解的含义是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1601' value='0'> 所有目标都最大<\/label><label class='quiz-opt'><input type='radio' name='q1601' value='1'> 不存在全面更优的解<\/label><label class='quiz-opt'><input type='radio' name='q1601' value='2'> 加权和最大的解<\/label><label class='quiz-opt'><input type='radio' name='q1601' value='3'> 约束最少的解<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q1602' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 加权和法的主要局限是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1602' value='0'> 不能处理两个以上目标<\/label><label class='quiz-opt'><input type='radio' name='q1602' value='1'> 非凸前沿上会漏掉中间解<\/label><label class='quiz-opt'><input type='radio' name='q1602' value='2'> 必须用整数规划<\/label><label class='quiz-opt'><input type='radio' name='q1602' value='3'> 权重必须相等<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q1603' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 目标规划中 d⁺ 表示实际值相对目标值的________量。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='线性规划'>线性规划 — 目标与约束都是一次式的优化问题，可行域为凸多边形 <span class=glossary-ref>（第 1 章：线性规划）<\/span><\/li><li data-term='标准型'>标准型 — 目标最大化、约束全为 ≤、变量非负的统一写法 <span class=glossary-ref>（第 1 章：线性规划）<\/span><\/li><li data-term='可行域'>可行域 — 所有满足约束的点组成的集合 <span class=glossary-ref>（第 1 章：线性规划）<\/span><\/li><li data-term='顶点'>顶点 — 两条约束线的交点，线性规划最优解的候选位置 <span class=glossary-ref>（第 1 章：线性规划）<\/span><\/li><li data-term='松弛变量'>松弛变量 — 把 ≤ 约束变成等式的非负辅助变量 <span class=glossary-ref>（第 1 章：线性规划）<\/span><\/li><li data-term='影子价格'>影子价格 — 约束右端项加一单位带来的目标增量，等于对偶变量 <span class=glossary-ref>（第 1 章：线性规划）<\/span><\/li><li data-term='整数规划'>整数规划 — 要求部分或全部变量取整数的规划问题 <span class=glossary-ref>（第 2 章：整数规划）<\/span><\/li><li data-term='0-1 变量'>0-1 变量 — 只取 0 或 1 的变量，用来表示选或不选 <span class=glossary-ref>（第 2 章：整数规划）<\/span><\/li><li data-term='分枝定界'>分枝定界 — 用线性松弛解作上界、逐变量分枝搜索整数解的方法 <span class=glossary-ref>（第 2 章：整数规划）<\/span><\/li><li data-term='指派问题'>指派问题 — n 人做 n 事、每人一事、每事一人的 0-1 规划 <span class=glossary-ref>（第 2 章：整数规划）<\/span><\/li><li data-term='非线性规划'>非线性规划 — 目标或约束含非线性项的优化问题 <span class=glossary-ref>（第 3 章：非线性规划）<\/span><\/li><li data-term='凸函数'>凸函数 — 图像呈碗形、任意两点连线在图像上方的函数 <span class=glossary-ref>（第 3 章：非线性规划）<\/span><\/li><li data-term='凸规划'>凸规划 — 目标凸且可行域凸的规划，局部最优即全局最优 <span class=glossary-ref>（第 3 章：非线性规划）<\/span><\/li><li data-term='kkt 条件'>KKT 条件 — 带约束极值点必须满足的梯度平衡与互补松弛条件 <span class=glossary-ref>（第 3 章：非线性规划）<\/span><\/li><li data-term='互补松弛'>互补松弛 — 约束未起作用时对应乘子为零的条件，λᵢgᵢ = 0 <span class=glossary-ref>（第 3 章：非线性规划）<\/span><\/li><li data-term='二次规划'>二次规划 — 二次目标加线性约束的优化问题 <span class=glossary-ref>（第 3 章：非线性规划）<\/span><\/li><li data-term='罚函数法'>罚函数法 — 把约束违反量加进目标函数、用大系数逼迫可行的办法 <span class=glossary-ref>（第 3 章：非线性规划）<\/span><\/li><li data-term='邻接矩阵'>邻接矩阵 — 用矩阵元素表示两点之间有无边或权值的存图方式 <span class=glossary-ref>（第 4 章：图与网络模型及方法）<\/span><\/li><li data-term='最短路'>最短路 — 两点之间总权值最小的路径 <span class=glossary-ref>（第 4 章：图与网络模型及方法）<\/span><\/li><li data-term='最小生成树'>最小生成树 — 连通全部点且总权值最小的无环子图 <span class=glossary-ref>（第 4 章：图与网络模型及方法）<\/span><\/li><li data-term='最大流'>最大流 — 源点到汇点在不超容量的前提下能输送的最大流量 <span class=glossary-ref>（第 4 章：图与网络模型及方法）<\/span><\/li><li data-term='关键路径'>关键路径 — 项目中总时差为零、决定总工期的工序链 <span class=glossary-ref>（第 4 章：图与网络模型及方法）<\/span><\/li><li data-term='tsp'>TSP — 遍历所有点各一次并回到起点的最短回路问题 <span class=glossary-ref>（第 4 章：图与网络模型及方法）<\/span><\/li><li data-term='插值'>插值 — 构造必须经过全部已知点的曲线 <span class=glossary-ref>（第 5 章：插值与拟合）<\/span><\/li><li data-term='拟合'>拟合 — 不要求穿过点、只要求残差平方和最小的近似 <span class=glossary-ref>（第 5 章：插值与拟合）<\/span><\/li><li data-term='runge 现象'>Runge 现象 — 等距节点上高次插值在区间边缘剧烈振荡 <span class=glossary-ref>（第 5 章：插值与拟合）<\/span><\/li><li data-term='三次样条'>三次样条 — 分段三次多项式且在节点处一二阶导数连续 <span class=glossary-ref>（第 5 章：插值与拟合）<\/span><\/li><li data-term='最小二乘'>最小二乘 — 使残差平方和最小来估计参数的准则 <span class=glossary-ref>（第 5 章：插值与拟合）<\/span><\/li><li data-term='微分方程'>微分方程 — 含未知函数及其导数的方程，描述变化机制 <span class=glossary-ref>（第 6 章：微分方程）<\/span><\/li><li data-term='初值条件'>初值条件 — 给定某时刻状态、决定落在哪条解曲线上的条件 <span class=glossary-ref>（第 6 章：微分方程）<\/span><\/li><li data-term='euler 法'>Euler 法 — 用当前斜率直线外推的一阶数值解法 <span class=glossary-ref>（第 6 章：微分方程）<\/span><\/li><li data-term='rk4'>RK4 — 每步四次求斜率再加权的四阶数值解法 <span class=glossary-ref>（第 6 章：微分方程）<\/span><\/li><li data-term='sir 模型'>SIR 模型 — 把人群分为易感、感染、康复三类的传染病模型 <span class=glossary-ref>（第 6 章：微分方程）<\/span><\/li><li data-term='基本再生数'>基本再生数 — R₀ = β/γ，一个感染者平均传染的人数 <span class=glossary-ref>（第 6 章：微分方程）<\/span><\/li><li data-term='点估计'>点估计 — 用样本统计量直接猜总体参数 <span class=glossary-ref>（第 7 章：数理统计）<\/span><\/li><li data-term='区间估计'>区间估计 — 给出覆盖真值的概率范围的估计方法 <span class=glossary-ref>（第 7 章：数理统计）<\/span><\/li><li data-term='p 值'>p 值 — H₀ 为真时出现当前或更极端结果的概率 <span class=glossary-ref>（第 7 章：数理统计）<\/span><\/li><li data-term='bootstrap'>Bootstrap — 有放回重抽样模拟抽样分布的方法 <span class=glossary-ref>（第 7 章：数理统计）<\/span><\/li><li data-term='方差分析'>方差分析 — 把总变异拆成组间与组内、用 F 检验比较均值的办法 <span class=glossary-ref>（第 7 章：数理统计）<\/span><\/li><li data-term='差分方程'>差分方程 — 描述相邻两期数值关系的方程 <span class=glossary-ref>（第 8 章：差分方程）<\/span><\/li><li data-term='平衡点'>平衡点 — 使下一期等于本期、系统不再变化的取值 <span class=glossary-ref>（第 8 章：差分方程）<\/span><\/li><li data-term='稳定性'>稳定性 — 初值小扰动会随时间消失的性质 <span class=glossary-ref>（第 8 章：差分方程）<\/span><\/li><li data-term='leslie 矩阵'>Leslie 矩阵 — 由繁殖率首行与存活率次对角线构成的种群投影矩阵 <span class=glossary-ref>（第 8 章：差分方程）<\/span><\/li><li data-term='支持向量机'>支持向量机 — 最大化分类间隔的二分类模型 <span class=glossary-ref>（第 9 章：支持向量机）<\/span><\/li><li data-term='间隔'>间隔 — 两类支持向量之间的距离，等于 2/‖w‖（规范化情形） <span class=glossary-ref>（第 9 章：支持向量机）<\/span><\/li><li data-term='支持向量'>支持向量 — 离分类超平面最近、决定边界的样本点 <span class=glossary-ref>（第 9 章：支持向量机）<\/span><\/li><li data-term='软间隔'>软间隔 — 允许个别样本越界的 SVM 形式，由 C 控制容忍度 <span class=glossary-ref>（第 9 章：支持向量机）<\/span><\/li><li data-term='核函数'>核函数 — 隐式把样本映射到高维、只需算内积的函数 <span class=glossary-ref>（第 9 章：支持向量机）<\/span><\/li><li data-term='聚类'>聚类 — 无标签、按相似度把样本分组的分析 <span class=glossary-ref>（第 10 章：多元分析）<\/span><\/li><li data-term='k-means'>K-means — 迭代更新 k 个中心、按最近中心分组的聚类算法 <span class=glossary-ref>（第 10 章：多元分析）<\/span><\/li><li data-term='主成分分析'>主成分分析 — 把变量线性组合成少数互不相关新变量的降维方法 <span class=glossary-ref>（第 10 章：多元分析）<\/span><\/li><li data-term='贡献率'>贡献率 — 某主成分特征值占特征值总和的比例 <span class=glossary-ref>（第 10 章：多元分析）<\/span><\/li><li data-term='判别分析'>判别分析 — 有标签、学习分类规则并给新样本归类的分析 <span class=glossary-ref>（第 10 章：多元分析）<\/span><\/li><li data-term='因子分析'>因子分析 — 假设少数潜在因子生成观测变量的统计模型 <span class=glossary-ref>（第 10 章：多元分析）<\/span><\/li><li data-term='典型相关分析'>典型相关分析 — 找两组变量各自线性组合使相关系数最大 <span class=glossary-ref>（第 10 章：多元分析）<\/span><\/li><li data-term='多维标度'>多维标度 — 只凭距离矩阵反推低维坐标的方法 <span class=glossary-ref>（第 10 章：多元分析）<\/span><\/li><li data-term='多重共线性'>多重共线性 — 自变量之间近似线性相关，导致系数估计不稳定 <span class=glossary-ref>（第 11 章：偏最小二乘回归分析）<\/span><\/li><li data-term='方差膨胀因子'>方差膨胀因子 — 衡量某变量被其余变量解释程度的指标，VIF &gt; 10 视为严重共线 <span class=glossary-ref>（第 11 章：偏最小二乘回归分析）<\/span><\/li><li data-term='偏最小二乘'>偏最小二乘 — 同时考虑 X 变异与 X–Y 相关来提取成分的回归方法 <span class=glossary-ref>（第 11 章：偏最小二乘回归分析）<\/span><\/li><li data-term='vip 值'>VIP 值 — 变量重要性投影，大于 1 通常视为重要变量 <span class=glossary-ref>（第 11 章：偏最小二乘回归分析）<\/span><\/li><li data-term='模拟退火'>模拟退火 — 按 exp(−Δ/T) 概率接受差解的随机搜索算法 <span class=glossary-ref>（第 12 章：现代优化算法）<\/span><\/li><li data-term='遗传算法'>遗传算法 — 用编码、适应度、选择、交叉、变异模拟进化的搜索算法 <span class=glossary-ref>（第 12 章：现代优化算法）<\/span><\/li><li data-term='精英保留'>精英保留 — 每代把最优个体直接复制到下一代，防止退化 <span class=glossary-ref>（第 12 章：现代优化算法）<\/span><\/li><li data-term='灰度化'>灰度化 — 把三通道彩色图按亮度权重合成单通道图 <span class=glossary-ref>（第 13 章：数字图像处理）<\/span><\/li><li data-term='空间滤波'>空间滤波 — 用小窗口在图上滑动做加权和的处理方式 <span class=glossary-ref>（第 13 章：数字图像处理）<\/span><\/li><li data-term='中值滤波'>中值滤波 — 取窗口内中位数作为中心像素值的非线性滤波 <span class=glossary-ref>（第 13 章：数字图像处理）<\/span><\/li><li data-term='直方图均衡'>直方图均衡 — 按累计分布重排灰度、使直方图平坦的对比度增强 <span class=glossary-ref>（第 13 章：数字图像处理）<\/span><\/li><li data-term='lsb 水印'>LSB 水印 — 把信息写入像素最低位的隐蔽水印方法 <span class=glossary-ref>（第 13 章：数字图像处理）<\/span><\/li><li data-term='综合评价'>综合评价 — 多指标标准化加权后排序的方法体系 <span class=glossary-ref>（第 14 章：综合评价与决策方法）<\/span><\/li><li data-term='极差标准化'>极差标准化 — 用 (x−min)/(max−min) 把指标压到 0–1 区间 <span class=glossary-ref>（第 14 章：综合评价与决策方法）<\/span><\/li><li data-term='熵权法'>熵权法 — 按指标区分度分配权重的客观赋权方法 <span class=glossary-ref>（第 14 章：综合评价与决策方法）<\/span><\/li><li data-term='理想解法'>理想解法 — 按到正负理想解的距离排序的 TOPSIS 方法 <span class=glossary-ref>（第 14 章：综合评价与决策方法）<\/span><\/li><li data-term='数据包络分析'>数据包络分析 — 用投入产出比评价决策单元效率的方法 <span class=glossary-ref>（第 14 章：综合评价与决策方法）<\/span><\/li><li data-term='秩和比'>秩和比 — 用秩次合成评价结果、抗异常值的方法 <span class=glossary-ref>（第 14 章：综合评价与决策方法）<\/span><\/li><li data-term='pagerank'>PageRank — 按链接关系迭代给节点打分的排序算法 <span class=glossary-ref>（第 14 章：综合评价与决策方法）<\/span><\/li><li data-term='灰色预测'>灰色预测 — 用累加生成近似指数趋势、适合小样本的预测方法 <span class=glossary-ref>（第 15 章：预测方法）<\/span><\/li><li data-term='级比检验'>级比检验 — GM(1,1) 建模前检查序列是否适合的比值判据 <span class=glossary-ref>（第 15 章：预测方法）<\/span><\/li><li data-term='马尔可夫链'>马尔可夫链 — 下一状态只依赖当前状态、按转移概率演化的过程 <span class=glossary-ref>（第 15 章：预测方法）<\/span><\/li><li data-term='arima'>ARIMA — 自回归差分移动平均模型 <span class=glossary-ref>（第 15 章：预测方法）<\/span><\/li><li data-term='样本外检验'>样本外检验 — 留出末段数据不建模、用来评估预测能力 <span class=glossary-ref>（第 15 章：预测方法）<\/span><\/li><li data-term='mape'>MAPE — 平均绝对百分比误差，衡量相对预测偏差 <span class=glossary-ref>（第 15 章：预测方法）<\/span><\/li><li data-term='多目标规划'>多目标规划 — 同时优化多个可能冲突目标的规划问题 <span class=glossary-ref>（第 16 章：多目标规划和目标规划）<\/span><\/li><li data-term='pareto 有效解'>Pareto 有效解 — 不存在全面更优解的非劣解 <span class=glossary-ref>（第 16 章：多目标规划和目标规划）<\/span><\/li><li data-term='加权和法'>加权和法 — 把多目标按权重合成单一目标求解的方法 <span class=glossary-ref>（第 16 章：多目标规划和目标规划）<\/span><\/li><li data-term='ε 约束法'>ε 约束法 — 把次要目标改成约束、扫描阈值求前沿的方法 <span class=glossary-ref>（第 16 章：多目标规划和目标规划）<\/span><\/li><li data-term='目标规划'>目标规划 — 把目标写成约束、最小化偏差变量的方法 <span class=glossary-ref>（第 16 章：多目标规划和目标规划）<\/span><\/li><li data-term='偏差变量'>偏差变量 — d⁺ 表示超出目标、d⁻ 表示不足目标的辅助变量 <span class=glossary-ref>（第 16 章：多目标规划和目标规划）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<h2>框架：题型识别四问<\/h2>\n<ol><li>\n要不要给出一个方案或数值？要 → 规划类，第 1–3、16 章。\n<\/li><li>\n对象之间有没有连接关系？有 → 图论，第 4 章。\n<\/li><li>\n有没有时间序列或状态演化？有 → 微分方程、差分方程、预测，第 6、8、15 章。\n<\/li><li>\n要不要从一堆对象里分组、排序、挑出重要变量？要 → 多元分析与评价，第 9–11、14 章。\n<\/ol>\n<p>四问的答案可以叠加。真实赛题常常是「先用评价排序，再对前几名做规划」。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n变量全为整数且规模小于 50 → 精确整数规划；大于 50 → 启发式 + 报告近似。\n<\/li><li>\n数据点少于 15 且单调 → 灰色预测或拟合；有明确机制 → 微分方程；长序列有季节性 → ARIMA。\n<\/li><li>\n指标超过 5 个且量纲不一 → 先标准化再评价，不要直接加权求和。\n<\/li><li>\n两个目标明显冲突 → 先画 Pareto 前沿，再让决策者选点，不要自己拍权重。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>把相关当因果<\/strong>：相关系数 0.8 只说明同向变化，写「A 导致 B」需要额外证据。\n<\/li><li>\n<strong>只报一次最好结果<\/strong>：启发式算法跑一次得 17，就宣称最优 17，无法排除运气。\n<\/li><li>\n<strong>用复杂模型掩盖假设缺失<\/strong>：神经网络拟合得再好，也说不出机制，评委要看的是解释。\n<\/li><li>\n<strong>灵敏度写成自我表扬<\/strong>：只写「模型稳健」不给扰动范围和结论变化，等于没写。\n<\/ul>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>核心公式<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>线性规划标准型<\/td><td>max z = cᵀx，s.t. Ax ≤ b，x ≥ 0<\/td><\/tr><tr><td>影子价格<\/td><td>右端项加 1 引起的最优值增量，等于对偶变量<\/td><\/tr><tr><td>整数规划松弛<\/td><td>连续解是整数解的上界，用于分枝定界剪枝<\/td><\/tr><tr><td>KKT 梯度平衡<\/td><td>∇f + ∑λᵢ∇gᵢ = 0，λᵢgᵢ = 0<\/td><\/tr><tr><td>SVM 间隔<\/td><td>2/‖w‖（支持向量处 wᵀx + b = ±1）<\/td><\/tr><tr><td>最小二乘斜率<\/td><td>∑(xᵢ−x̄)(yᵢ−ȳ) / ∑(xᵢ−x̄)²<\/td><\/tr><tr><td>一阶差分平衡点<\/td><td>x* = b/(1−a)，稳定条件<\/td><td>a<\/td><td>&lt; 1<\/td><\/tr><tr><td>SIR 基本再生数<\/td><td>R₀ = β/γ<\/td><\/tr><tr><td>极差标准化<\/td><td>效益型 (x−min)/(max−min)，成本型 (max−x)/(max−min)<\/td><\/tr><tr><td>熵权<\/td><td>wⱼ = (1−eⱼ)/∑(1−eⱼ)<\/td><\/tr><tr><td>GM(1,1)<\/td><td>x̂¹(k+1) = (x⁰(1) − b/a)e^(−ak) + b/a<\/td><\/tr><tr><td>退火接受概率<\/td><td>P = exp(−Δ/T)<\/td><\/tr><\/tbody><\/table>\n<h2>常用调用<\/h2>\n<table><thead><tr><th>目的<\/th><th>写法<\/th><\/tr><\/thead><tbody><tr><td>线性/整数规划<\/td><td><code>linprog(c, A_ub=A, b_ub=b, bounds=..., method=&quot;highs&quot;)<\/code><\/td><\/tr><tr><td>非线性规划<\/td><td><code>minimize(fun, x0, method=&quot;SLSQP&quot;, constraints=cons)<\/code><\/td><\/tr><tr><td>最短路<\/td><td><code>scipy.sparse.csgraph.dijkstra<\/code><\/td><\/tr><tr><td>最小生成树<\/td><td><code>scipy.sparse.csgraph.minimum_spanning_tree<\/code><\/td><\/tr><tr><td>插值<\/td><td><code>CubicSpline(x, y)<\/code>、<code>interp1d<\/code><\/td><\/tr><tr><td>常微分方程<\/td><td><code>solve_ivp(f, [t0, t1], y0, method=&quot;RK45&quot;)<\/code><\/td><\/tr><tr><td>聚类<\/td><td><code>KMeans(n_clusters=3).fit(X)<\/code><\/td><\/tr><tr><td>主成分<\/td><td><code>PCA(n_components=2).fit_transform(X)<\/code><\/td><\/tr><tr><td>SVM<\/td><td><code>SVC(C=1.0, kernel=&quot;rbf&quot;, gamma=&quot;scale&quot;)<\/code><\/td><\/tr><\/tbody><\/table>\n<h2>检查清单<\/h2>\n<table><thead><tr><th>检查项<\/th><th>标准<\/th><\/tr><\/thead><tbody><tr><td>单位<\/td><td>等号两边量纲一致<\/td><\/tr><tr><td>量级<\/td><td>结果落在常识范围<\/td><\/tr><tr><td>极端值<\/td><td>变量取 0 或上界时公式仍合理<\/td><\/tr><tr><td>结果复现<\/td><td>换个随机种子结果波动可接受<\/td><\/tr><tr><td>论文一致<\/td><td>摘要数字与正文、代码输出三处一致<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38451429143789314/数学建模学习手册/01-数学建模算法与应用", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：线性规划", "href": "#/chapter/ch01"}, {"label": "第 2 章：整数规划", "href": "#/chapter/ch02"}, {"label": "第 3 章：非线性规划", "href": "#/chapter/ch03"}, {"label": "第 4 章：图与网络模型及方法", "href": "#/chapter/ch04"}, {"label": "第 5 章：插值与拟合", "href": "#/chapter/ch05"}, {"label": "第 6 章：微分方程", "href": "#/chapter/ch06"}, {"label": "第 7 章：数理统计", "href": "#/chapter/ch07"}, {"label": "第 8 章：差分方程", "href": "#/chapter/ch08"}, {"label": "第 9 章：支持向量机", "href": "#/chapter/ch09"}, {"label": "第 10 章：多元分析", "href": "#/chapter/ch10"}, {"label": "第 11 章：偏最小二乘回归分析", "href": "#/chapter/ch11"}, {"label": "第 12 章：现代优化算法", "href": "#/chapter/ch12"}, {"label": "第 13 章：数字图像处理", "href": "#/chapter/ch13"}, {"label": "第 14 章：综合评价与决策方法", "href": "#/chapter/ch14"}, {"label": "第 15 章：预测方法", "href": "#/chapter/ch15"}, {"label": "第 16 章：多目标规划和目标规划", "href": "#/chapter/ch16"}]}, {"label": "概念", "children": [{"label": "标准化与权重", "href": "#/concept/c01"}, {"label": "间隔与支持向量", "href": "#/concept/c02"}, {"label": "可行域与顶点", "href": "#/concept/c03"}, {"label": "Pareto 前沿", "href": "#/concept/c04"}, {"label": "凸性", "href": "#/concept/c05"}, {"label": "稳定性", "href": "#/concept/c06"}, {"label": "影子价格", "href": "#/concept/c07"}, {"label": "最小二乘", "href": "#/concept/c08"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：线性规划", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：整数规划", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：非线性规划", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：图与网络模型及方法", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章：插值与拟合", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章：微分方程", "href": "#/quiz/ch06"}, {"label": "测验：第 7 章：数理统计", "href": "#/quiz/ch07"}, {"label": "测验：第 8 章：差分方程", "href": "#/quiz/ch08"}, {"label": "测验：第 9 章：支持向量机", "href": "#/quiz/ch09"}, {"label": "测验：第 10 章：多元分析", "href": "#/quiz/ch10"}, {"label": "测验：第 11 章：偏最小二乘回归分析", "href": "#/quiz/ch11"}, {"label": "测验：第 12 章：现代优化算法", "href": "#/quiz/ch12"}, {"label": "测验：第 13 章：数字图像处理", "href": "#/quiz/ch13"}, {"label": "测验：第 14 章：综合评价与决策方法", "href": "#/quiz/ch14"}, {"label": "测验：第 15 章：预测方法", "href": "#/quiz/ch15"}, {"label": "测验：第 16 章：多目标规划和目标规划", "href": "#/quiz/ch16"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<h1>第 1 章：线性规划<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：起步册第 1–3 章 | <strong>原书定位<\/strong>：第 1 章 p1–17\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n把「资源有限、要最大化收益」的问题写成标准线性规划；\n<\/li><li>\n手算二元线性规划的可行域顶点并验证最优解；\n<\/li><li>\n说清影子价格的含义，并用它回答「多一小时工时值多少钱」。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>线性规划只做一件事：在凸多边形的可行域里找一个顶点，让目标函数最大。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：线性到底指什么（难度：基础）<\/h3>\n<p><strong>线性规划（LP）<\/strong>：目标函数和每条约束都是决策变量的一次式，变量之间只加减、不乘除、不平方。<\/p>\n<p>为什么这个限制重要？因为它保证可行域是凸的。凸集合有一个好性质：目标函数在边界上的最大值一定能在某个顶点取到。于是「在无穷多个可行解里找最优」变成「把有限个顶点各算一算」。<\/p>\n<h3>概念 2：标准型（难度：基础）<\/h3>\n<p>教材的统一写法是：<\/p>\n<pre class=\"lang-text\"><code>max  z = c₁x₁ + c₂x₂ + … + cₙxₙ\ns.t. a₁₁x₁ + … + a₁ₙxₙ ≤ b₁\n     ……\n     xⱼ ≥ 0<\/code><\/pre>\n<p>min 型、≥ 型、无约束变量，都能通过取负、加松弛变量、拆成两个非负变量转成标准型。软件内部做的就是这套转换，你只要按它的接口喂数。<\/p>\n<h3>概念 3：可行域与顶点（难度：基础）<\/h3>\n<p><strong>可行域<\/strong>：所有满足约束的点组成的集合。二维时画出来是一个多边形。<\/p>\n<p><strong>顶点<\/strong>：两条约束线的交点。线性规划的最优解（如果存在）一定能在顶点上找到。这也是为什么单纯形法只沿顶点走，不算内部。<\/p>\n<h3>概念 4：影子价格（难度：进阶）<\/h3>\n<p><strong>影子价格<\/strong>：某个资源约束的右端项每增加一个单位，目标函数能增加多少。<\/p>\n<p>它等于对偶变量。含义很实用：如果 A 机器工时每小时影子价格是 1 千元，而加班成本是每小时 0.6 千元，那加班划算；反之不划算。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[资源限制与收益] --&gt; B[写目标函数]\n    B --&gt; C[写约束不等式]\n    C --&gt; D[画可行域]\n    D --&gt; E[枚举顶点]\n    E --&gt; F[取目标值最大的顶点]\n    F --&gt; G[影子价格与决策建议]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：注意「枚举顶点」这一步在二维才手工可行，三维以上必须交给单纯形法或软件。图里没有「检验」这一步，因为线性规划的解一定满足约束，要检验的是模型假设是否符合现实。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：线性规划像在有限预算内点菜，菜价和预算是线性的，你要在预算线内选组合让满意度最高。失效边界：真实偏好不是线性的，点多了会腻，这时候模型算出的「全点最贵那道」并不最优。\n<\/li><li>\n<strong>实例（可手算核对）<\/strong>：某机床厂生产甲、乙两种机床，单台利润 4 千元与 3 千元。甲需 A 机器 2 h、B 机器 1 h；乙需 A、B、C 各 1 h。每天可用工时 A 10 h、B 8 h、C 7 h。\n<p>模型：max z = 4x₁ + 3x₂，s.t. 2x₁ + x₂ ≤ 10，x₁ + x₂ ≤ 8，x₂ ≤ 7，x₁,x₂ ≥ 0。 顶点：两线交点为 (2, 6)；与 x₂ 轴交 (0, 10) 越界，取 (0, 7)；(1, 7) 处 z = 25；(5, 0) 处 z = 20；(2, 6) 处 z = 26。最优 (2, 6)，日利润 2.6 万元。 影子价格核对：把 A 的可用工时从 10 改到 11，前两条约束交点变成 (3, 5)，z = 12 + 15 = 27，比 26 多 1。所以 A 的每小时影子价格为 1 千元。<\/p>\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为变量越多模型越准——实际上每加一个变量，就多一组约束要交代，没数据支撑的变量只会让解失去意义。\n<\/li><li>\n别以为最优解一定在可行域内部——实际上线性规划的最优解几乎总在边界顶点，内部点最优只发生在目标函数是常数时。\n<\/li><li>\n别以为算出「无界」是软件坏了——实际上是你漏了上界约束，比如「产量不限」这种假设，会让利润无限增大。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】线性规划的可行域一定是？<\/h3>\n<ul><li>\nA. 凸多边形或凸多面体\n<\/li><li>\nB. 圆形\n<\/li><li>\nC. 任意形状\n<\/li><li>\nD. 一条曲线\n<p><strong>答案<\/strong>：A <strong>解析<\/strong>：线性不等式组的交集是凸集，二维时表现为凸多边形，这也是顶点枚举有效的原因。<\/p>\n<\/ul>\n<h3>Q2 【单选】某约束的影子价格为 0，说明？<\/h3>\n<ul><li>\nA. 该资源完全用尽\n<\/li><li>\nB. 该资源还有剩余，再增加它不能提高目标值\n<\/li><li>\nC. 模型无解\n<\/li><li>\nD. 该约束写错了\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：影子价格为零意味着该约束不是紧约束，资源尚有闲置，追加投入不改变最优值。<\/p>\n<\/ul>\n<h3>Q3 【填空】把 max z 转成 scipy 能接受的形式，需要把目标系数全部________。<\/h3>\n<p><strong>答案<\/strong>：取负 <strong>解析<\/strong>：<code>linprog<\/code> 只做最小化，最大化问题等价于最小化 −z，最后把结果取负还原。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n线性 = 一次式，所以可行域凸，最优解在顶点。\n<\/li><li>\n标准型只有 ≤ 与非负约束，其余形式都靠转换。\n<\/li><li>\n影子价格 = 右端项加一单位带来的目标增量，用来判断资源该不该追加。\n<\/ul>", "ch02": "<h1>第 2 章：整数规划<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 1 章 | <strong>原书定位<\/strong>：第 2 章 p18–36\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n判断一个问题为什么不能直接把线性规划的解四舍五入；\n<\/li><li>\n用分枝定界的手算流程解一个二元小例子；\n<\/li><li>\n把「要么选要么不选」写成 0-1 变量，把指派问题写成 0-1 规划。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>整数规划难，不是因为约束多，而是因为可行域被切成了一堆散点，线性规划那套「沿顶点走」的几何直觉失效了。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：整数约束为什么破坏结构（难度：基础）<\/h3>\n<p>线性规划的最优解出现在顶点，顶点是连续的。要求 x 取整数后，可行点变成离散的格点，最优格点可能离原来的顶点很远。<\/p>\n<p>一个例子就够：max z = 3x₁ + 4x₂，s.t. 3x₁ + 5x₂ ≤ 8，x₁, x₂ ≥ 0。<\/p>\n<p>连续最优是 (2.667, 0)，z = 8。四舍五入到 (3, 0)，代回约束 3×3 = 9 &gt; 8，直接不可行。退一步取 (2, 0)，z = 6。真正的整数最优是 (1, 1)，z = 3 + 4 = 7，比取整结果高出一档。<\/p>\n<p>一个例子同时暴露两种病：取整可能破坏约束，取整也可能错过更优的格点。这两点就是整数规划不能用「解完取整」的全部理由。<\/p>\n<h3>概念 2：0-1 变量（难度：基础）<\/h3>\n<p><strong>0-1 变量<\/strong>：只取 0 或 1 的变量，用来表达「选或不选」。它是整数规划最常用的建模零件。<\/p>\n<p>常用写法：<\/p>\n<ul><li>\n选第 j 个方案：yⱼ ∈ {0,1}，目标里写 cⱼyⱼ。\n<\/li><li>\n最多选 k 个：∑yⱼ ≤ k。\n<\/li><li>\nA 与 B 不能同时选：y_A + y_B ≤ 1。\n<\/li><li>\n选了 A 才能选 B：y_B ≤ y_A。\n<\/ul>\n<h3>概念 3：分枝定界（难度：进阶）<\/h3>\n<p><strong>分枝定界<\/strong>：先解连续松弛，得到一个小数解；挑一个取小数的变量，把它分成「≤ 下取整」和「≥ 上取整」两支，分别再解；用已找到的整数解作为上界，剪掉不可能更好的分支。<\/p>\n<p>手算流程（以上面的 max 3x₁ + 4x₂，3x₁ + 5x₂ ≤ 8 为例）：<\/p>\n<ol><li>\n松弛解 x = (2.667, 0)，z = 8，这是上界。\n<\/li><li>\n对 x₁ 分枝：x₁ ≤ 2 与 x₁ ≥ 3。x₁ ≥ 3 时 3x₁ ≥ 9 &gt; 8，不可行，剪掉。\n<\/li><li>\nx₁ ≤ 2 分支：约束变 3x₁ + 5x₂ ≤ 8，x₁ ≤ 2，解出 x₁ = 2, x₂ = 0.4，z = 6 + 1.6 = 7.6。\n<\/li><li>\n再对 x₂ 分枝：x₂ ≤ 0 得 (2, 0)，z = 6；x₂ ≥ 1 得 x₁ ≤ 1，解 (1, 1)，z = 7。\n<\/li><li>\n比较整数解 6 与 7，取 7。上界 8 已无法再改进，停止。\n<\/ol>\n<p>分枝定界慢，但保证找到最优；启发式（如贪心）快，但不保证。比赛里题目规模小就用精确算法，规模大就用启发式并在论文里说明「近似」。<\/p>\n<h3>概念 4：指派问题（难度：进阶）<\/h3>\n<p>n 个人做 n 件事，每人做每件事的成本不同，求总成本最小的分配。模型是 0-1 规划：xᵢⱼ = 1 表示第 i 人做第 j 事，每行和为 1、每列和为 1。它的特殊结构可以用匈牙利算法在多项式时间求解，不必用通用整数规划。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[连续松弛解] --&gt; B{是否全为整数}\n    B --&gt;|是| C[得到最优整数解]\n    B --&gt;|否| D[选一个小数变量分枝]\n    D --&gt; E[左支 向下取整]\n    D --&gt; F[右支 向上取整]\n    E --&gt; G[重解并更新上界]\n    F --&gt; G\n    G --&gt; B<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这是一棵搜索树，每个节点都是一次线性规划。剪枝的依据是「这个节点的松弛上界已经不如现有整数解」，没有这个上界，树会指数爆炸。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：整数规划像在一堆整箱货物里装箱，箱子不能拆开。线性规划允许你把箱子切开凑重量，整数规划不允许。失效边界：现实里有时允许拆，比如散装货物，那就退回线性规划。\n<\/li><li>\n<strong>实例（可手算）<\/strong>：背包容量 5，三件物品重量与价值分别为 (2, 3)、(3, 4)、(4, 5)。枚举 8 种组合：只选 1 得 3；选 2 得 4；选 3 重量 4 得 5；选 1+2 重量 5 得 7；1+3 重量 6 超重；2+3 重量 7 超重；三件全选超重。最优是选第 1、2 件，价值 7。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为把线性规划解四舍五入就行——实际上可能既不可行也不是最优，必须验证约束。\n<\/li><li>\n别以为整数规划只是「加个取整」——实际上它的求解复杂度高一个量级，很多问题是 NP 难的。\n<\/li><li>\n别以为 0-1 变量只能表示选择——实际上它还能表示「启动成本」「是否开启一条产线」这类固定费用。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】线性规划松弛解为 (2.67, 0)，下列做法正确的是？<\/h3>\n<ul><li>\nA. 直接四舍五入得 (3, 0)\n<\/li><li>\nB. 以松弛解为上界做分枝定界\n<\/li><li>\nC. 认为问题无解\n<\/li><li>\nD. 把约束改成等式\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：松弛解给出上界，分枝定界在此之上搜索整数解；直接取整可能违反约束。<\/p>\n<\/ul>\n<h3>Q2 【单选】「A、B 两个项目最多上一个」应写成？<\/h3>\n<ul><li>\nA. y_A + y_B ≤ 1\n<\/li><li>\nB. y_A + y_B ≥ 1\n<\/li><li>\nC. y_A − y_B ≤ 1\n<\/li><li>\nD. y_A × y_B ≤ 1\n<p><strong>答案<\/strong>：A <strong>解析<\/strong>：两个 0-1 变量之和不超过 1，恰好表达「至多选一个」；乘积不是线性式，不能出现在线性约束里。<\/p>\n<\/ul>\n<h3>Q3 【填空】指派问题的约束特点是每行之和为 1、每列之和为________。<\/h3>\n<p><strong>答案<\/strong>：1 <strong>解析<\/strong>：一个人只做一件事、一件事只由一个人做，两个方向都恰好为 1，这才构成合法指派。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n整数约束把连续可行域切成格点，几何直觉失效。\n<\/li><li>\n0-1 变量是表达选择、互斥、依赖的标准零件。\n<\/li><li>\n分枝定界靠松弛上界剪枝，规模大时改用启发式并说明精度。\n<\/ul>", "ch03": "<h1>第 3 章：非线性规划<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 1 章、起步册第 2 章 | <strong>原书定位<\/strong>：第 3 章 p37–61\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n判断一个非线性规划是凸的还是可能有多个局部最优；\n<\/li><li>\n写出 KKT 条件，并用它手算一个带线性约束的极小值问题；\n<\/li><li>\n说清「罚函数」和「序列二次规划」分别在什么场景下用。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>线性规划只有一个最优解，非线性规划可能有一堆，算法只保证找到其中一个——所以凸性比算法更重要。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：凸函数与凸规划（难度：基础）<\/h3>\n<p><strong>凸函数<\/strong>：图像上任意两点连线都在函数图像上方（碗形）。判定方法：二阶导数（一元）或海森矩阵（多元）半正定。<\/p>\n<p><strong>凸规划<\/strong>：目标函数凸、可行域凸。它的局部最优就是全局最优，梯度类算法不会掉进坑里。<\/p>\n<p>建模时要先问一句：我的目标函数凸吗？如果凸，放心用算法；如果不凸，要么换建模方式，要么用多起点搜索。<\/p>\n<h3>概念 2：KKT 条件（难度：进阶）<\/h3>\n<p><strong>KKT 条件<\/strong>：带约束的极值点必须满足的一组条件，包括：<\/p>\n<ol><li>\n梯度平衡：∇f + ∑λᵢ∇gᵢ = 0，即目标函数的梯度被约束的梯度「抵消」；\n<\/li><li>\n可行性：所有约束满足；\n<\/li><li>\n互补松弛：λᵢgᵢ = 0，约束没起作用时乘子为零，起作用时乘子可以为正；\n<\/li><li>\n乘子非负（不等式约束）。\n<\/ol>\n<p>一句话理解：在最优点，你没法沿着任何可行方向再改善目标，因为改善方向都被约束挡住了。<\/p>\n<h3>概念 3：二次规划（难度：进阶）<\/h3>\n<p><strong>二次规划（QP）<\/strong>：目标函数是二次型，约束是线性的。它是非线性规划里最好解的一类，有成熟算法。<\/p>\n<p>判断标准：目标函数写成 ½xᵀHx + fᵀx，H 半正定则凸。投资组合、最小二乘、支持向量机都归到这里。<\/p>\n<h3>概念 4：罚函数与启发式（难度：进阶）<\/h3>\n<ul><li>\n<strong>罚函数法<\/strong>：把约束违反量加到目标里，min f(x) + M·max(0, g(x))²，M 逐渐增大。优点是简单，缺点是大 M 会让数值病态。\n<\/li><li>\n<strong>梯度法/牛顿法<\/strong>：沿负梯度方向走，牛顿法用二阶信息，收敛快但对初值敏感。\n<\/li><li>\n<strong>启发式<\/strong>：不保证最优，只求可用解。目标函数不可导、变量多、有整数约束时常用。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[非线性模型] --&gt; B{目标与可行域是否凸}\n    B --&gt;|凸| C[梯度法 牛顿法 内点法]\n    B --&gt;|非凸| D{规模大小}\n    D --&gt;|小| E[多起点搜索]\n    D --&gt;|大| F[遗传算法 退火 粒子群]\n    C --&gt; G[得到全局最优]\n    E --&gt; H[得到较优解 需报告多起点结果]\n    F --&gt; H<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：凸性判断在第二步，很多人跳过它直接调算法，结果在非凸问题上反复得到不同的局部最优，却以为是算法不稳定。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：凸规划像碗底放球，怎么滚都滚到最低点；非凸规划像山地地形，球可能停在半山腰的小坑里。失效边界：真实优化问题常有多个「小坑」，球的起点决定结果，所以要多起点。\n<\/li><li>\n<strong>实例（可手算）<\/strong>：min f = (x₁ − 1)² + (x₂ − 2)²，s.t. x₁ + x₂ ≤ 2。\n<p>无约束最优点是 (1, 2)，但 1 + 2 = 3 &gt; 2，不可行。 最优点必在边界 x₁ + x₂ = 2 上。把 (1, 2) 投影到这条线上：沿法向 (1,1) 移动，移动量 = (3 − 2)/2 = 0.5，得 (0.5, 1.5)。 代回 f = (0.5 − 1)² + (1.5 − 2)² = 0.25 + 0.25 = 0.5。 KKT 核对：∇f = (2(x₁−1), 2(x₂−2)) = (−1, −1)，约束梯度 (1, 1)，取 λ = 1 得 (−1,−1) + 1×(1,1) = 0，满足梯度平衡。<\/p>\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为软件返回「优化成功」就是全局最优——实际上局部算法只保证局部，非凸问题必须多起点或换全局算法。\n<\/li><li>\n别以为约束越多越安全——实际上新增约束可能让可行域变成空集，求解器报 status=2。\n<\/li><li>\n别以为非线性规划一定比线性规划高级——实际上能用线性模型解决的问题，用非线性只会增加不确定性。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】判断多元目标函数是否凸，主要看？<\/h3>\n<ul><li>\nA. 一阶导数是否为零\n<\/li><li>\nB. 海森矩阵是否半正定\n<\/li><li>\nC. 变量个数\n<\/li><li>\nD. 约束个数\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：海森矩阵半正定等价于函数凸，这是一元二阶导数判据的推广。<\/p>\n<\/ul>\n<h3>Q2 【单选】KKT 条件中「互补松弛」的含义是？<\/h3>\n<ul><li>\nA. 所有约束都必须取等号\n<\/li><li>\nB. 约束未起作用时对应乘子为零\n<\/li><li>\nC. 乘子必须为负\n<\/li><li>\nD. 目标函数必须为零\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：λᵢgᵢ = 0 表示约束与乘子至少一个为零，未起作用的约束不产生「价格」。<\/p>\n<\/ul>\n<h3>Q3 【填空】把 (1, 2) 投影到直线 x₁ + x₂ = 2 上，得到的点是________。<\/h3>\n<p><strong>答案<\/strong>：(0.5, 1.5) <strong>解析<\/strong>：沿法向 (1,1) 移动 (3−2)/2 = 0.5，坐标各减 0.5。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n凸性决定算法能不能信，先判凸再选方法。\n<\/li><li>\nKKT 是「无法再改善」的数学表达，互补松弛是核心。\n<\/li><li>\n非凸问题必须多起点，并在论文里报告不同起点的结果。\n<\/ul>", "ch04": "<h1>第 4 章：图与网络模型及方法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 1–3 章 | <strong>原书定位<\/strong>：第 4 章 p62–112\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n把「点与点之间有关系」的问题画成图，写出邻接矩阵；\n<\/li><li>\n手跑 Dijkstra 求最短路，手跑 Kruskal 求最小生成树；\n<\/li><li>\n分清最短路、最小生成树、最大流、TSP、关键路径五类问题各自的用途。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>图论建模的本质是选对问题类型：同一张图，问法不同，算法完全不同。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：图的三种存法（难度：基础）<\/h3>\n<p><strong>图<\/strong>：点（顶点）和边组成的结构。边有方向叫有向图，带数字叫带权图。<\/p>\n<p>三种存法各有用途：<\/p>\n<ul><li>\n<strong>邻接矩阵<\/strong> A：aᵢⱼ 表示 i 到 j 有没有边或权值。适合稠密图，矩阵运算方便。\n<\/li><li>\n<strong>邻接表<\/strong>：每个点存一个邻居列表。适合稀疏图，省空间。\n<\/li><li>\n<strong>边列表<\/strong>：只存 (起点, 终点, 权重)。适合 Kruskal 这类按边排序的算法。\n<\/ul>\n<h3>概念 2：最短路（难度：基础）<\/h3>\n<p><strong>Dijkstra 算法<\/strong>：从起点出发，每次从未确定的点里挑距离最小的，用它去更新邻居，直到所有点确定。要求边权非负。<\/p>\n<p>手算例子：5 个点，边与权值 1-2: 2、1-3: 5、2-3: 1、2-4: 4、3-4: 2、3-5: 6、4-5: 1。<\/p>\n<ol><li>\n起点 1，距离表：1=0，2=2，3=5，4=∞，5=∞。\n<\/li><li>\n选 2，更新：3 = min(5, 2+1) = 3；4 = min(∞, 2+4) = 6。\n<\/li><li>\n选 3（距离 3），更新：4 = min(6, 3+2) = 5；5 = 3+6 = 9。\n<\/li><li>\n选 4（距离 5），更新：5 = min(9, 5+1) = 6。\n<\/li><li>\n选 5，结束。最短路 1→2→3→4→5，长度 6。\n<\/ol>\n<p>若边权有负数，Dijkstra 失效，改用 Bellman-Ford 或 Floyd。<\/p>\n<h3>概念 3：最小生成树（难度：基础）<\/h3>\n<p><strong>生成树<\/strong>：连通所有点且不含环的子图，n 个点需要 n−1 条边。<strong>最小生成树<\/strong>是总权重最小的那棵。<\/p>\n<p>Kruskal：把所有边按权重从小到大排序，依次加入，若成环就跳过。上例排序为 2-3:1、4-5:1、1-2:2、3-4:2、1-3:5、3-5:6，取前四条，总权重 1+1+2+2 = 6。<\/p>\n<p>最小生成树回答「怎么连线最省」，最短路回答「从 A 到 B 怎么走最快」，两者不是一回事。<\/p>\n<h3>概念 4：最大流与关键路径（难度：进阶）<\/h3>\n<ul><li>\n<strong>最大流<\/strong>：源点到汇点最多能送多少流量，每条边有容量上限。求解用增广路算法（Ford-Fulkerson / Dinic）。\n<\/li><li>\n<strong>关键路径<\/strong>：项目管理里，从开工到完工的最长路径，路径上的工序没有机动时间，延误一天整体就延误一天。求法是对 AOE 网络做拓扑排序，算最早开始与最晚开始时间。\n<\/ul>\n<h3>概念 5：旅行商问题（难度：高难）<\/h3>\n<p><strong>TSP<\/strong>：从起点出发，遍历所有点各一次再回到起点，求最短路线。它是 NP 难的，点数超过 20 基本只能求近似解，用第 12 章的遗传算法或退火。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[一张带权图] --&gt; B{问什么}\n    B --&gt;|两点间怎么走最快| C[Dijkstra 最短路]\n    B --&gt;|全部连通最省| D[Kruskal 最小生成树]\n    B --&gt;|最多能送多少| E[最大流]\n    B --&gt;|一圈走完最短| F[TSP 启发式]\n    B --&gt;|工期最短| G[关键路径]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：同一个起点问题，五个分支给出五种完全不同的答案。建模时先把「问什么」说清，再选算法。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：最短路像导航软件算最快路线，最小生成树像给几个村子铺自来水管道总长最短。失效边界：导航考虑实时路况，静态图模型不考虑，所以结果可能和实际差很多。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：上例中，从 1 到 5 的最短路是 6；若把 3-5 的权值从 6 改成 2，则 1→3→5 长 3+2 = 5，比 6 更短，Dijkstra 第 3 步就会把 5 更新为 5。这说明算法结果依赖权值，权值错一位，结论全变。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为最短路和最小生成树可以互换——实际上它们的优化对象不同：一个是一对点的路径，一个是全图的边集。\n<\/li><li>\n别以为 Dijkstra 能处理负权——实际上负权会让「已确定」的点被再次改进，算法前提被破坏。\n<\/li><li>\n别以为 TSP 可以用最短路算法解决——实际上 TSP 要求遍历全部点，复杂度高得多。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】n 个点的最小生成树有几条边？<\/h3>\n<ul><li>\nA. n\n<\/li><li>\nB. n−1\n<\/li><li>\nC. n+1\n<\/li><li>\nD. 不确定\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：树的性质：n 个顶点、n−1 条边、无环且连通。<\/p>\n<\/ul>\n<h3>Q2 【单选】Dijkstra 算法不适用的情形是？<\/h3>\n<ul><li>\nA. 边权为正\n<\/li><li>\nB. 存在负权边\n<\/li><li>\nC. 图是稠密图\n<\/li><li>\nD. 图是有向图\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：负权会破坏「已确定点的距离不会再变小」这一前提，需要改用 Bellman-Ford。<\/p>\n<\/ul>\n<h3>Q3 【填空】关键路径上任何一道工序延误，整个工期都会________。<\/h3>\n<p><strong>答案<\/strong>：延误 <strong>解析<\/strong>：关键路径的总时差为零，路径上工序没有机动时间，任一延误直接传导到总工期。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n图有三存法：矩阵、邻接表、边列表，按算法选。\n<\/li><li>\n最短路是点对问题，最小生成树是全图问题。\n<\/li><li>\nTSP 是 NP 难的，规模大就上启发式并说明近似。\n<\/ul>", "ch05": "<h1>第 5 章：插值与拟合<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 1 章、起步册第 2 章 | <strong>原书定位<\/strong>：第 5 章 p113–149\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清插值和拟合的根本区别，并据此选方法；\n<\/li><li>\n手算三点二次插值，理解 Runge 现象为什么发生；\n<\/li><li>\n手算一次最小二乘拟合的斜率与截距，并解释残差。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>插值要求曲线穿过每一个已知点，拟合允许曲线不穿过，只要求整体误差最小。前者补空缺，后者找规律。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：插值（难度：基础）<\/h3>\n<p><strong>插值<\/strong>：已知 n+1 个点，构造一条曲线必须经过这些点，用来估计中间点的值。<\/p>\n<p>n+1 个点可以唯一确定一个次数不超过 n 的多项式，这就是<strong>拉格朗日插值<\/strong>。公式写起来吓人，本质是「每个点配一个权重函数，权重在该点为 1、在别的点为 0」。<\/p>\n<p>手算例子：三点 (0, 1)、(1, 3)、(2, 2)，求 x = 1.5 处的值。<\/p>\n<p>先定二次多项式 P(x) = ax² + bx + c。代入三点得 c = 1、a + b = 2、4a + 2b = 1，解得 a = −1.5、b = 3.5。于是 P(1.5) = −1.5×2.25 + 3.5×1.5 + 1 = 2.875。<\/p>\n<p>用拉格朗日权重核对：L₀ = (x−1)(x−2)/2 在 1.5 处为 −0.125，L₁ = x(x−2)/(−1) 为 0.75，L₂ = x(x−1)/2 为 0.375；加权 1×(−0.125) + 3×0.75 + 2×0.375 = 2.875，一致。<\/p>\n<h3>概念 2：Runge 现象（难度：进阶）<\/h3>\n<p><strong>Runge 现象<\/strong>：等距节点上提高多项式次数，区间边缘的插值曲线会剧烈振荡，误差反而变大。<\/p>\n<p>经典反例是 f(x) = 1/(1 + 25x²) 在 [−1, 1] 上插值，次数越高边缘越离谱。解决办法有两个：改用分段低次插值（三次样条），或改用 Chebyshev 节点（中间密、两端疏）。<\/p>\n<p>这条现象的意义在于：不要以为「点越多、次数越高越准」。数据密集处插值反而更不稳。<\/p>\n<h3>概念 3：三次样条（难度：进阶）<\/h3>\n<p><strong>三次样条<\/strong>：把区间分成若干段，每段用三次多项式，并要求在节点处函数值、一阶导数、二阶导数连续。它比高次多项式稳，比折线光滑，是工程最常用的插值。<\/p>\n<p>代价是要解一个三对角线性方程组求各段的系数，手算不现实，交给 <code>scipy.interpolate.CubicSpline<\/code>。<\/p>\n<h3>概念 4：最小二乘拟合（难度：基础）<\/h3>\n<p><strong>拟合<\/strong>：不要求穿过点，只要求残差平方和最小。<\/p>\n<p>一元线性拟合手算：数据 (1, 2)、(2, 3)、(3, 5)。<\/p>\n<p>x̄ = 2，ȳ = 10/3 ≈ 3.333。 斜率 b = ∑(xᵢ − x̄)(yᵢ − ȳ) / ∑(xᵢ − x̄)² = [(−1)(−1.333) + 0 + (1)(1.667)] / (1 + 0 + 1) = 3 / 2 = 1.5。 截距 a = ȳ − b x̄ = 3.333 − 3 = 0.333。 拟合直线 y = 0.333 + 1.5x。残差：x=1 时 −0.167，x=2 时 +0.333，x=3 时 +0.167，平方和 0.167。<\/p>\n<h3>概念 5：函数逼近（难度：进阶）<\/h3>\n<p><strong>函数逼近<\/strong>：用简单函数（多项式、三角多项式）去近似一个复杂函数，误差用最大偏差或平方积分衡量。它与拟合的区别是：拟合面对离散数据，逼近面对已知函数。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[一批离散数据] --&gt; B{要穿过每个点吗}\n    B --&gt;|要| C[插值]\n    C --&gt; C1[点少 拉格朗日]\n    C --&gt; C2[点密 三次样条]\n    C --&gt; C3[边缘振荡 换 Chebyshev 节点]\n    B --&gt;|不要| D[拟合]\n    D --&gt; D1[线性 最小二乘]\n    D --&gt; D2[非线性 迭代求解]\n    D --&gt; D3[要抗噪 加正则项]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：判断点全在「要不要穿过每个点」。这个判断错了，后面所有方法都白选。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：插值像照着几个路标画一条必须经过它们的路线，拟合像根据几个路标推断大方向，不要求路线压在路标上。失效边界：路标本身测错了怎么办？插值会把错误原样带进曲线，拟合能部分抵消，所以数据有噪声时优先拟合。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：某地 2019—2023 年用水量分别为 12、13、13.5、14、15 亿立方米，问 2024 年。若用线性拟合，斜率约 0.75，预测 15.75；若用二次插值，末端会翘得更高。差别来自方法假设，不是数据本身，论文里必须说明为什么选这个方法。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为插值一定比拟合准——实际上数据有噪声时，插值会把噪声当成规律。\n<\/li><li>\n别以为次数越高越好——实际上高次多项式会振荡，三次样条通常更稳。\n<\/li><li>\n别以为拟合就是画一条直线——实际上可以拟合任意形式的函数，关键是先定函数形式，再定参数。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】插值与拟合最根本的区别是？<\/h3>\n<ul><li>\nA. 插值用多项式，拟合不用\n<\/li><li>\nB. 插值必须经过所有数据点，拟合不要求\n<\/li><li>\nC. 插值只能用于一维\n<\/li><li>\nD. 拟合需要更多数据\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：是否穿过数据点，决定了误差的处理方式，也是一切方法选择的起点。<\/p>\n<\/ul>\n<h3>Q2 【单选】Runge 现象说明？<\/h3>\n<ul><li>\nA. 节点越多，插值一定越准\n<\/li><li>\nB. 等距节点上高次多项式插值在边缘会剧烈振荡\n<\/li><li>\nC. 三次样条不收敛\n<\/li><li>\nD. 拟合不能用于函数逼近\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：次数升高时边缘误差可能发散，这是等距节点的固有缺陷。<\/p>\n<\/ul>\n<h3>Q3 【填空】数据 (1,2)、(2,3)、(3,5) 的最小二乘直线斜率为________。<\/h3>\n<p><strong>答案<\/strong>：1.5 <strong>解析<\/strong>：分子 3、分母 2，斜率 1.5，截距约 0.333。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n插值穿点，拟合不穿点；噪声大时选拟合。\n<\/li><li>\n高次多项式会振荡，三次样条更稳。\n<\/li><li>\n最小二乘的斜率是「协方差除以方差」。\n<\/ul>", "ch06": "<h1>第 6 章：微分方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 5 章、起步册第 2 章 | <strong>原书定位<\/strong>：第 6 章 p150–181\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n把「增长率与当前数量成正比」翻译成微分方程；\n<\/li><li>\n用 Euler 法和 RK4 手算两步，并说清误差来源；\n<\/li><li>\n用 SIR 模型解释「接触率下降为什么能压平曲线」。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>微分方程建模只有一步：找出「变化率等于什么」，剩下的都是解方程。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从一句话到方程（难度：基础）<\/h3>\n<p><strong>微分方程<\/strong>：含未知函数及其导数的方程。建模时它通常长这样：<\/p>\n<pre class=\"lang-text\"><code>dN/dt = rN(1 − N/K)<\/code><\/pre>\n<p>这句话读作：种群的变化速度 = 增长率 × 当前数量 × 剩余容量比例。<\/p>\n<p>三个零件：左边是变化率，右边是机制。任何「越……越……」的句子都能这样翻译。<\/p>\n<h3>概念 2：初值与定解（难度：基础）<\/h3>\n<p>方程只描述变化规律，不给起点就解不出具体曲线。<strong>初值条件<\/strong> N(0) = N₀ 决定你落在哪条解曲线上。<\/p>\n<p>建模时初值来自数据。初值错一点，长期预测会偏很多，这是微分方程模型的通病，论文里必须做初值灵敏度。<\/p>\n<h3>概念 3：数值解（难度：进阶）<\/h3>\n<p>大多数微分方程没有解析解，只能数值求解。<\/p>\n<p><strong>Euler 法<\/strong>：y_{n+1} = y_n + h·f(t_n, y_n)，用当前斜率直线外推。一阶精度。<\/p>\n<p>以 dy/dt = y、y(0) = 1、h = 0.5 为例： y₁ = 1 + 0.5×1 = 1.5；y₂ = 1.5 + 0.5×1.5 = 2.25。精确解在 t = 1 处是 e ≈ 2.718，误差 0.468，相对误差 17%。<\/p>\n<p><strong>RK4<\/strong>：每步算四次斜率再加权，四阶精度。同样步长下误差降到千分位。代价是每步四次函数求值。<\/p>\n<p>步长怎么选：先跑 h，再跑 h/2，若结果变化小于容差就接受，这叫步长减半检验。<\/p>\n<h3>概念 4：SIR 模型（难度：进阶）<\/h3>\n<p><strong>SIR<\/strong>：把人群分成易感 S、感染 I、康复 R 三类。<\/p>\n<pre class=\"lang-text\"><code>dS/dt = −βSI/N\ndI/dt = βSI/N − γI\ndR/dt = γI<\/code><\/pre>\n<p>β 是接触传染率，γ 是康复率。两者之比 R₀ = β/γ 叫<strong>基本再生数<\/strong>：一个感染者平均传染几个人。R₀ &gt; 1 疫情扩散，R₀ &lt; 1 衰减。<\/p>\n<p>例：β = 0.3/天、γ = 0.1/天，R₀ = 3。要把 R₀ 压到 1 以下，β 必须降到 0.1 以下，也就是接触率降到原来的三分之一。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    S[易感 S] --&gt;|βSI/N| I[感染 I]\n    I --&gt;|γI| R[康复 R]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：箭头上的式子就是流量。这张图既是模型结构，也是写方程的依据：每个仓室的变化 = 流入 − 流出。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：微分方程像浴缸注水，水龙头流量是导数，水位是函数值，初始水位是初值。失效边界：浴缸的流量可以随时手动改，模型里的流量由状态决定，是自反馈系统。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：逻辑斯蒂增长 dN/dt = 0.5N(1 − N/100)，N₀ = 10。平衡点 N = 100；N &lt; 100 时增长，接近 100 时变慢。用 Euler、h = 1 算两步：N₁ = 10 + 0.5×10×(1 − 0.1) = 14.5；N₂ = 14.5 + 0.5×14.5×(1 − 0.145) = 14.5 + 6.2 = 20.7。曲线呈先快后慢的 S 形。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为数值解一定能代表真实过程——实际上参数估错，曲线形状对但幅度全错。\n<\/li><li>\n别以为步长越小越好——实际上步长过小会累积舍入误差，还会让计算变慢，要按误差容限选。\n<\/li><li>\n别以为 SIR 只能用于传染病——实际上谣言传播、产品扩散都能用同构模型，只要「接触—转化—退出」的结构一致。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】R₀ = β/γ 大于 1 意味着？<\/h3>\n<ul><li>\nA. 疫情必然消失\n<\/li><li>\nB. 一个感染者平均传染超过一个人，疫情可能扩散\n<\/li><li>\nC. 病毒致死率高\n<\/li><li>\nD. 康复速度过快\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：R₀ 是基本再生数，大于 1 时感染链能自我维持。<\/p>\n<\/ul>\n<h3>Q2 【单选】Euler 法的主要缺点是？<\/h3>\n<ul><li>\nA. 无法处理线性方程\n<\/li><li>\nB. 只有一阶精度，步长大时误差显著\n<\/li><li>\nC. 需要解析解\n<\/li><li>\nD. 不能处理初值问题\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：用直线代替曲线，步长越大偏差越大；提高精度要用 RK4 或减小步长。<\/p>\n<\/ul>\n<h3>Q3 【填空】用 Euler 法解 dy/dt = y、y(0)=1、h=0.5，两步后 y₂ = ________。<\/h3>\n<p><strong>答案<\/strong>：2.25 <strong>解析<\/strong>：y₁ = 1.5，y₂ = 1.5 + 0.5×1.5 = 2.25，与精确值 e 有约 17% 的相对误差。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n微分方程建模 = 找变化率机制 + 定初值。\n<\/li><li>\nEuler 一阶、RK4 四阶，步长要做减半检验。\n<\/li><li>\nSIR 的关键数是 R₀ = β/γ，压 R₀ 就是压接触率。\n<\/ul>", "ch07": "<h1>第 7 章：数理统计<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：起步册第 2 章、第 5 章 | <strong>原书定位<\/strong>：第 7 章 p182–230\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n分清点估计、区间估计、假设检验各自回答什么问题；\n<\/li><li>\n手算一次单样本 t 检验，正确解读 p 值；\n<\/li><li>\n说清 Bootstrap 在没有分布假设时怎么给出置信区间。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>统计推断的全部结论都是概率性的：它说的是「在多大程度上可以不相信原假设」，不是「真相是什么」。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：点估计与区间估计（难度：基础）<\/h3>\n<p><strong>点估计<\/strong>：用样本算出的一个数去猜总体参数，比如用样本均值 x̄ 猜总体均值 μ。<\/p>\n<p><strong>区间估计<\/strong>：给出一个区间，并声明「真值落在里面的概率约为 95%」。严格说法是：重复抽样很多次，约有 95% 的区间会覆盖真值。单次抽样得到的那个区间，要么覆盖要么不覆盖，没有 95% 的概率可言。<\/p>\n<p>置信区间宽度取决于三件事：样本量越大越窄，标准差越小越窄，置信水平越高越宽。<\/p>\n<h3>概念 2：假设检验与 p 值（难度：进阶）<\/h3>\n<p><strong>假设检验<\/strong>：先设一个原假设 H₀（通常是「没有差异」），再看样本结果在 H₀ 成立时有多罕见。<\/p>\n<p><strong>p 值<\/strong>：如果 H₀ 为真，出现当前或更极端结果的概率。p 小，说明结果罕见，于是拒绝 H₀。<\/p>\n<p>手算例子：某产品标准厚度 10 mm，抽 5 件测得 10、12、11、13、9，问均值是否偏离 10。<\/p>\n<p>x̄ = 11，偏差 −1、1、0、2、−2，平方和 10，s² = 10/(5−1) = 2.5，s = 1.581。 标准误 SE = s/√5 = 0.707。 t = (11 − 10)/0.707 = 1.414，自由度 4。 查表：双侧 5% 临界值 2.776，1.414 &lt; 2.776，p &gt; 0.05，不拒绝 H₀。<\/p>\n<p>结论写法：「没有足够证据说明均值偏离 10 mm」，不能说「均值就是 10 mm」。后者是把「没证据」当成「证据没有」。<\/p>\n<h3>概念 3：Bootstrap（难度：进阶）<\/h3>\n<p><strong>Bootstrap<\/strong>：从样本里有放回地抽 n 个，算一次统计量，重复几百上千次，用这些统计量的分布近似抽样分布。<\/p>\n<p>它不需要假设正态，适合小样本、偏态分布、复杂统计量（如中位数、R²）。局限是：如果样本本身不能代表总体，Bootstrap 只会把偏差放大。<\/p>\n<h3>概念 4：方差分析与回归（难度：进阶）<\/h3>\n<ul><li>\n<strong>方差分析（ANOVA）<\/strong>：比较三组以上均值是否相同。核心是把总变异拆成组间与组内，用 F 统计量判断组间差异是否显著。\n<\/li><li>\n<strong>回归<\/strong>：用一个或多个自变量解释因变量。多元回归要检查共线性、残差正态性、异方差，R² 高不代表模型可用。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[拿到样本] --&gt; B{想干什么}\n    B --&gt;|估一个数| C[点估计]\n    B --&gt;|估一个范围| D[区间估计]\n    B --&gt;|判断有没有差异| E[假设检验]\n    E --&gt; F{分布假设成立吗}\n    F --&gt;|成立| G[t 检验 F 检验]\n    F --&gt;|不成立| H[Bootstrap 或非参数检验]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：先确定问题类型，再看分布假设。很多误用发生在直接跳到 t 检验，却不管数据是否近似正态。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：假设检验像法庭，H₀ 是「无罪」，p 值是「如果无罪，出现这些证据的概率」。p 小只能说明证据罕见，不等于证明有罪。失效边界：法庭要求排除合理怀疑，统计只给概率，两者不能直接类比定罪。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：某药两组各 10 人，试验组均值 8.2、标准差 1.5，对照组 9.1、标准差 1.8。差值 0.9，合并标准误约 √(1.5²/10 + 1.8²/10) = √(0.225 + 0.324) = 0.745，t ≈ 1.21，p &gt; 0.05。结论是「未见显著差异」，样本量再多一些才可能看出效果。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 p &lt; 0.05 就代表结论重要——实际上 p 只衡量罕见程度，效应大小要看差值本身。\n<\/li><li>\n别以为不显著就是没差异——实际上可能只是样本太小、噪声太大。\n<\/li><li>\n别以为 R² 高就是模型好——实际上加变量就能抬高 R²，要看调整 R² 和残差诊断。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】p 值的正确解读是？<\/h3>\n<ul><li>\nA. H₀ 为真的概率\n<\/li><li>\nB. H₀ 为真时出现当前或更极端结果的概率\n<\/li><li>\nC. 结论正确的概率\n<\/li><li>\nD. 效应量大小\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：p 值是条件概率，条件是 H₀ 成立，它不告诉你 H₀ 本身真不真。<\/p>\n<\/ul>\n<h3>Q2 【单选】Bootstrap 的核心操作是？<\/h3>\n<ul><li>\nA. 增加样本量\n<\/li><li>\nB. 有放回重抽样并重复计算统计量\n<\/li><li>\nC. 对数据做正态化变换\n<\/li><li>\nD. 删除异常值\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：通过重抽样模拟抽样分布，避免对分布形式做强假设。<\/p>\n<\/ul>\n<h3>Q3 【填空】样本 10、12、11、13、9 的标准差约为________。<\/h3>\n<p><strong>答案<\/strong>：1.58 <strong>解析<\/strong>：偏差平方和 10，除以自由度 4 得 2.5，开方约 1.581。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n点估计给数，区间估计给范围，假设检验给「能不能不信 H₀」。\n<\/li><li>\np 值不是 H₀ 为真的概率，也不是结论正确的概率。\n<\/li><li>\nBootstrap 免分布假设，但不能修正样本本身的偏差。\n<\/ul>", "ch08": "<h1>第 8 章：差分方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 6 章、起步册第 2 章 | <strong>原书定位<\/strong>：第 8 章 p231–247\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n把「今年的数量取决于去年的数量」写成差分方程；\n<\/li><li>\n用特征根判断一阶与二阶系统的稳定性；\n<\/li><li>\n写出 Leslie 矩阵，并解释它预测种群规模的逻辑。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>差分方程是离散版的微分方程：微分方程看连续时间的变化率，差分方程看相邻两期的差值。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：差分与递推（难度：基础）<\/h3>\n<p><strong>差分方程<\/strong>：含 xₙ、xₙ₊₁ 这类相邻项关系的方程。<\/p>\n<p>最简单的形式：xₙ₊₁ = a xₙ + b。<\/p>\n<p><strong>平衡点<\/strong>：使 xₙ₊₁ = xₙ 的值，解得 x* = b/(1 − a)（a ≠ 1）。<\/p>\n<p>例：xₙ₊₁ = 0.8xₙ + 20，平衡点 x* = 20/(1 − 0.8) = 100。从 x₀ = 10 出发：x₁ = 28、x₂ = 42.4、x₃ = 53.9……逐期逼近 100，差值每期缩小到 0.8 倍。<\/p>\n<h3>概念 2：稳定性（难度：进阶）<\/h3>\n<p><strong>稳定<\/strong>：初值的小扰动会随时间消失，系统回到平衡点。<\/p>\n<p>一阶系统 xₙ₊₁ = a xₙ + b 稳定的条件是 |a| &lt; 1。|a| &gt; 1 发散，a = −1 振荡不收敛。<\/p>\n<p>二阶系统 xₙ₊₂ = p xₙ₊₁ + q xₙ 的特征方程是 λ² − pλ − q = 0，两个根都落在单位圆内（|λ| &lt; 1）才稳定。<\/p>\n<p>判断稳定性的意义：模型预测长期趋势时，不稳定系统的小误差会被放大到荒谬。<\/p>\n<h3>概念 3：Leslie 矩阵（难度：进阶）<\/h3>\n<p><strong>Leslie 矩阵<\/strong>：按年龄分组，把繁殖率和存活率排成矩阵，用来预测种群规模。<\/p>\n<pre><code>[ F₁  F₂  F₃ ]\n[ S₁   0   0 ]\n[ 0   S₂   0 ]<\/code><\/pre>\n<p>第一行是各年龄组的繁殖贡献，下面是对角线错一位的存活率。下一期种群向量 = 矩阵 × 本期向量。<\/p>\n<p>矩阵的主特征值 λ₁ 决定长期增长率：λ₁ &gt; 1 增长，&lt; 1 衰退。稳定年龄分布由对应的特征向量给出。<\/p>\n<h3>概念 4：典型建模场景（难度：基础）<\/h3>\n<ul><li>\n<strong>存贷款<\/strong>：余额按复利增长，每月还款固定，写成 xₙ₊₁ = 1.01xₙ − A。\n<\/li><li>\n<strong>捕鱼策略<\/strong>：幼鱼长成成鱼需要年限，成鱼被捕捞，用 Leslie 矩阵加捕捞项。\n<\/li><li>\n<strong>设备更新<\/strong>：每年淘汰固定比例，同时购入新设备。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[x₀ 初值] --&gt; B[x₁]\n    B --&gt; C[x₂]\n    C --&gt; D[x₃]\n    D --&gt; E[平衡点 x*]\n    E --&gt; F{收敛吗}\n    F --&gt;|a 小于 1| G[稳定]\n    F --&gt;|a 大于 1| H[发散]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：箭头是逐期递推，虚线指向平衡点。判断稳定性看的是「越来越近还是越来越远」，不是看某一期的数值。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：差分方程像每月还信用卡，欠款 = 上月欠款 × 利率 − 本月还款。失效边界：真实还款可能逾期、利率会浮动，固定参数的模型只能描述理想情况。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：某渔场成鱼每年捕捞 30%，幼鱼存活率 50%，成鱼繁殖率每尾 2 尾。简化为两龄模型，Leslie 矩阵 [[2, 0],[0.5, 0]]，特征值 2 与 0，λ = 2 &gt; 1，种群按每年 2 倍增长——这显然不符合实际，说明繁殖率参数取得过高，需要按实测数据校准。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为差分方程只是微分方程的近似——实际上很多离散过程（年度普查、月度库存）本身就是离散的，差分方程是原始模型。\n<\/li><li>\n别以为平衡点就是稳定点——实际上平衡点可能不稳定，初值稍偏就越走越远。\n<\/li><li>\n别以为 Leslie 矩阵只用于动物——实际上人口预测、客户留存、设备寿命都能用同构模型。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】xₙ₊₁ = 0.8xₙ + 20 的平衡点是？<\/h3>\n<ul><li>\nA. 20\n<\/li><li>\nB. 80\n<\/li><li>\nC. 100\n<\/li><li>\nD. 120\n<p><strong>答案<\/strong>：C <strong>解析<\/strong>：令 x = 0.8x + 20，得 0.2x = 20，x = 100。<\/p>\n<\/ul>\n<h3>Q2 【单选】一阶系统稳定的条件是？<\/h3>\n<ul><li>\nA. |a| &lt; 1\n<\/li><li>\nB. a &gt; 0\n<\/li><li>\nC. b = 0\n<\/li><li>\nD. |a| &gt; 1\n<p><strong>答案<\/strong>：A <strong>解析<\/strong>：每期误差按 a 倍缩放，|a| &lt; 1 才会衰减到零。<\/p>\n<\/ul>\n<h3>Q3 【填空】Leslie 矩阵的主特征值大于 1 表示种群长期________。<\/h3>\n<p><strong>答案<\/strong>：增长 <strong>解析<\/strong>：主特征值是每期的渐近增长倍数，大于 1 意味着规模逐年扩大。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n差分方程描述相邻两期的关系，平衡点由 x = ax + b 解出。\n<\/li><li>\n稳定性看特征根的模是否小于 1。\n<\/li><li>\nLeslie 矩阵 = 繁殖率首行 + 存活率次对角线，主特征值定长期趋势。\n<\/ul>", "ch09": "<h1>第 9 章：支持向量机<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 3 章、起步册第 2 章 | <strong>原书定位<\/strong>：第 9 章 p248–261\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清「最大间隔」为什么比「能分开」更好；\n<\/li><li>\n用 w 与 b 写出决策函数，并算出给定点的间隔；\n<\/li><li>\n解释核函数与惩罚参数 C 各自解决什么问题。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>支持向量机不找一条能分开的线，而是找那条离两类点都最远的线。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：最大间隔（难度：基础）<\/h3>\n<p><strong>支持向量机（SVM）<\/strong>：二分类模型，目标是找一个超平面 wᵀx + b = 0，使两类点到它的最小距离最大。<\/p>\n<p><strong>间隔<\/strong>：两类支持向量到超平面的距离之和，等于 2/‖w‖。最大化间隔等价于最小化 ‖w‖²/2。<\/p>\n<p>为什么间隔大好？因为新数据不会正好落在边界上。间隔是模型的「安全余量」。<\/p>\n<p>手算例子：正类点 (1,1)、(2,2)，负类点 (−1,−1)、(−2,−2)。取 w = (1,1)、b = 0，决策线 x₁ + x₂ = 0。<\/p>\n<p>支持向量到线的距离：|1+1|/√2 = √2 ≈ 1.414。两类点分居线两侧，所以两类之间的间隔带宽度是 2√2 ≈ 2.828。<\/p>\n<p>这与公式 2/‖w‖ 是同一件事，只是 w 的尺度不同。公式里的 w 已被缩放成「支持向量处取 ±1」；本例 wᵀ(1,1) = 2，缩放一半得 w′ = (0.5, 0.5)，‖w′‖ = 0.707，2/‖w′‖ = 2.828，与几何距离对得上。<\/p>\n<p><strong>支持向量<\/strong>：离超平面最近的那些点。它们决定了 w 和 b，其他点删掉不影响结果。<\/p>\n<h3>概念 2：软间隔与 C（难度：进阶）<\/h3>\n<p>真实数据常有重叠，硬间隔无解。引入<strong>松弛变量<\/strong> ξᵢ ≥ 0，允许个别点越界，目标改为：<\/p>\n<pre class=\"lang-text\"><code>min ½‖w‖² + C∑ξᵢ\ns.t. yᵢ(wᵀxᵢ + b) ≥ 1 − ξᵢ<\/code><\/pre>\n<p><strong>C<\/strong> 是惩罚系数：<\/p>\n<ul><li>\nC 大 → 不容忍越界，间隔窄，容易过拟合；\n<\/li><li>\nC 小 → 容忍越界，间隔宽，偏差大。\n<\/ul>\n<p>调 C 是 SVM 最常做的超参数搜索。<\/p>\n<h3>概念 3：核函数（难度：进阶）<\/h3>\n<p>数据在原空间线性不可分时，用<strong>核函数<\/strong>把它们隐式映射到高维，在高维找超平面。<\/p>\n<p>常用核：<\/p>\n<ul><li>\n线性核：特征多、样本少时用；\n<\/li><li>\n多项式核：有明显交互项时用；\n<\/li><li>\nRBF 核（高斯核）：默认首选，参数 γ 控制影响范围，γ 大则每个点影响范围小，容易过拟合。\n<\/ul>\n<p>核技巧的关键：不需要真的算出高维坐标，只需算内积 K(xᵢ, xⱼ)。<\/p>\n<h3>概念 4：多分类与评估（难度：进阶）<\/h3>\n<p>SVM 原生是二分类。多分类用「一对多」或「一对一」拆解。评估别只看准确率：类别不平衡时，要看查全率、查准率、F1 与混淆矩阵。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[带标签数据] --&gt; B{线性可分吗}\n    B --&gt;|可分| C[硬间隔 SVM]\n    B --&gt;|有重叠| D[软间隔 SVM 调 C]\n    B --&gt;|严重非线性| E[核函数映射]\n    C --&gt; F[支持向量与 w b]\n    D --&gt; F\n    E --&gt; F\n    F --&gt; G[分类与评估]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：三条路最终都落到「求 w、b」。区别只在约束形式与是否映射，这也是 SVM 全部公式的统一入口。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：SVM 像在两排人之间画一条分界线，要求线离两边都尽量远，免得有人稍微一动就越界。失效边界：如果两排人本身交错，怎么画都会压到人，这时候必须允许越界，也就是软间隔。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：二维点 (2,0)、(0,2) 标 +1，(0,0)、(1,1) 标 −1。这不是线性可分的（(1,1) 落在正类点连线附近），硬间隔无解。加软间隔后允许 (1,1) 越界，C 越大越不容忍，模型会为了它扭曲边界。这个例子说明：先判断可分性，再选模型。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 SVM 一定比逻辑回归好——实际上特征维度高、样本少时 SVM 有优势，样本很大时线性模型往往够用且更快。\n<\/li><li>\n别以为核函数越复杂越好——实际上 RBF 的 γ 调不好会过拟合，交叉验证比「看起来准」可靠。\n<\/li><li>\n别以为准确率 95% 就是好模型——实际上若负类只占 5%，全判正类也能得 95%。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】SVM 中决定分类边界的点是？<\/h3>\n<ul><li>\nA. 所有样本点\n<\/li><li>\nB. 支持向量\n<\/li><li>\nC. 离边界最远的点\n<\/li><li>\nD. 标签为 0 的点\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：只有支持向量进入约束的等号，其他点删掉不影响 w 与 b。<\/p>\n<\/ul>\n<h3>Q2 【单选】惩罚参数 C 增大，通常会导致？<\/h3>\n<ul><li>\nA. 间隔变宽，偏差增大\n<\/li><li>\nB. 间隔变窄，更容易过拟合\n<\/li><li>\nC. 模型变成线性回归\n<\/li><li>\nD. 支持向量消失\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：C 大意味着不容忍越界，边界被拉紧贴住样本，方差上升。<\/p>\n<\/ul>\n<h3>Q3 【填空】核函数的作用是隐式地把数据映射到________空间。<\/h3>\n<p><strong>答案<\/strong>：高维 <strong>解析<\/strong>：在高维空间更容易线性可分，核技巧避免显式计算高维坐标。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\nSVM 的目标是最大化间隔，间隔 = 2/‖w‖。\n<\/li><li>\n软间隔用 C 换容忍度，C 大紧、C 小松。\n<\/li><li>\n核函数处理非线性，γ 与 C 都要交叉验证。\n<\/ul>", "ch10": "<h1>第 10 章：多元分析<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 7 章 | <strong>原书定位<\/strong>：第 10 章 p262–354\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n分清聚类、降维、判别、相关分析各自解决什么问题；\n<\/li><li>\n手算一次 K-means 的两轮迭代；\n<\/li><li>\n说清主成分分析为什么能降维，以及主成分不能怎么解释。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>多元分析的七种方法，本质是四件事：把样本分组、把变量压缩、把样本归类、把两组变量联系起来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：聚类（难度：基础）<\/h3>\n<p><strong>聚类<\/strong>：没有标签，只按相似度把样本分组。<\/p>\n<ul><li>\n<strong>K-means<\/strong>：先定 k 个中心，把每个点分给最近的中心，再按组内均值更新中心，反复直到中心不动。要求先给定 k，对初值敏感。\n<\/li><li>\n<strong>层次聚类<\/strong>：每次合并最近的两类，得到一棵树（树状图），按需要切一刀决定类数。不需要预先定 k，但计算量大。\n<\/ul>\n<p>手算例子：一维数据 1、2、8、9，k = 2。初始中心取 1 和 8：分组 {1,2} 与 {8,9}；新中心 1.5 与 8.5；再分组仍是 {1,2}、{8,9}，收敛。若初始中心取 2 和 9，结果相同；但数据换成 1、5、6、9 时，初值不同可能得到不同分组，所以要多次随机初始化。<\/p>\n<h3>概念 2：主成分分析（难度：进阶）<\/h3>\n<p><strong>主成分分析（PCA）<\/strong>：把原始变量线性组合成少数几个互不相关的新变量，尽量保留原有变异。<\/p>\n<p>步骤：标准化 → 算协方差矩阵 → 求特征值与特征向量 → 按特征值从大到小排序 → 取前 k 个。<\/p>\n<p><strong>贡献率<\/strong> = 某个特征值 / 特征值总和。取累计贡献率 85% 以上通常够用。<\/p>\n<p>关键限制：主成分是数学构造，未必有物理含义。说「第一主成分代表综合实力」需要额外证据，不能只因为载荷都为正。<\/p>\n<h3>概念 3：判别分析（难度：进阶）<\/h3>\n<p><strong>判别分析<\/strong>：有标签，建立从变量到类别的判别函数，用来给新样本归类。与聚类相反，它先知道类别再学规则。<\/p>\n<p>常用：线性判别（LDA）、距离判别、贝叶斯判别。评估看错判率与交叉验证准确率。<\/p>\n<h3>概念 4：因子分析与典型相关（难度：高难）<\/h3>\n<ul><li>\n<strong>因子分析<\/strong>：假设观测变量由少数潜在因子加误差生成，用来找「看不见的原因」。与 PCA 的区别是它有模型假设，PCA 只是变换。\n<\/li><li>\n<strong>典型相关分析<\/strong>：找两组变量各自的线性组合，使这两组的相关系数最大。用于「一组自变量与一组因变量」的整体关系。\n<\/li><li>\n<strong>对应分析<\/strong>：处理分类变量的列联表，把行与列画在同一张图上。\n<\/ul>\n<h3>概念 5：多维标度（难度：高难）<\/h3>\n<p><strong>多维标度（MDS）<\/strong>：只给样本间的距离矩阵，反推出低维坐标，使坐标间距离尽量还原原始距离。用于心理测量、气味图谱这类「只有相似度、没有坐标」的数据。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[多元数据] --&gt; B{有标签吗}\n    B --&gt;|没有| C{要分组还是压缩}\n    C --&gt;|分组| D[K-means 层次聚类]\n    C --&gt;|压缩| E[主成分分析 因子分析]\n    B --&gt;|有| F{要归类还是找关系}\n    F --&gt;|归类| G[判别分析]\n    F --&gt;|找关系| H[典型相关 对应分析]\n    A --&gt; I[只有距离矩阵] --&gt; J[多维标度]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：第一个判断是「有没有标签」，这一步错了，方法全错。聚类和判别最容易混，记住：聚类无标签，判别有标签。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：PCA 像把一摞不同角度的照片压成一张正面照，保留轮廓、丢掉侧面细节。失效边界：如果物体的关键特征恰好在被丢掉的方向上，压缩后的照片就认不出它。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：三个样本在两个指标上的值为 (1,1)、(2,2)、(3,3)。两个变量完全相关，PCA 第一主成分方向为 (1,1)/√2，投影值 1.414、2.828、4.243，贡献率 100%，第二主成分为 0。这说明当变量完全共线时，一个主成分就够了。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为聚类结果一定有意义——实际上算法只按距离分组，分出的类可能完全没有业务含义。\n<\/li><li>\n别以为主成分可以随意命名——实际上命名需要载荷分析与领域知识支撑。\n<\/li><li>\n别以为判别分析能替代因果分析——实际上它只给分类规则，不解释为什么。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】K-means 必须预先确定的是？<\/h3>\n<ul><li>\nA. 距离度量\n<\/li><li>\nB. 聚类数 k\n<\/li><li>\nC. 特征个数\n<\/li><li>\nD. 样本标签\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：k 是超参数，通常用肘部法或轮廓系数辅助选择。<\/p>\n<\/ul>\n<h3>Q2 【单选】PCA 中「贡献率」指的是？<\/h3>\n<ul><li>\nA. 某个样本的解释比例\n<\/li><li>\nB. 某主成分特征值占全部特征值之和的比例\n<\/li><li>\nC. 分类准确率\n<\/li><li>\nD. 变量个数占比\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：特征值代表该方向上的方差，占比即该主成分保留的信息比例。<\/p>\n<\/ul>\n<h3>Q3 【填空】有标签、要给新样本归类的分析叫________分析。<\/h3>\n<p><strong>答案<\/strong>：判别 <strong>解析<\/strong>：判别分析先学类别再分类；聚类没有标签。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n无标签分组用聚类，有标签归类用判别。\n<\/li><li>\nPCA 保留方差大的方向，主成分未必可解释。\n<\/li><li>\n因子分析有模型假设，PCA 只是线性变换。\n<\/ul>", "ch11": "<h1>第 11 章：偏最小二乘回归分析<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 7 章、第 10 章 | <strong>原书定位<\/strong>：第 11 章 p355–366\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n判断一份数据是否有多重共线性，以及它为什么让回归系数失控；\n<\/li><li>\n说清偏最小二乘与主成分回归的区别；\n<\/li><li>\n解释「提取几个成分」该怎么定。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>当自变量彼此高度相关时，普通最小二乘会给出方向乱跳的系数；偏最小二乘改成「边压缩边找与因变量最相关的方向」。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：多重共线性（难度：进阶）<\/h3>\n<p><strong>多重共线性<\/strong>：自变量之间近似线性相关。比如 x₂ ≈ x₁ + 少量噪声。<\/p>\n<p>后果：系数估计方差极大，数据动一点系数就翻号。经济解释变成「投资增加、消费减少」，明明两者同向变化。<\/p>\n<p>诊断：方差膨胀因子 VIF &gt; 10，或相关矩阵里有接近 ±1 的元素，或条件数很大。<\/p>\n<h3>概念 2：偏最小二乘的思路（难度：进阶）<\/h3>\n<p><strong>偏最小二乘（PLS）<\/strong>：从自变量 X 中提取若干成分 t₁, t₂, …，同时从因变量 Y 中提取成分 u₁, u₂, …，要求 t 与 u 的协方差最大，再用 t 对 Y 回归。<\/p>\n<p>与 PCA 的关键差别：PCA 只看 X 的方差最大的方向，不管它和 Y 有没有关系；PLS 同时看 X 的变异与 X–Y 的相关，所以提取的方向更「有用」。<\/p>\n<h3>概念 3：NIPALS 迭代（难度：高难）<\/h3>\n<p>每一步做四件事：<\/p>\n<ol><li>\n用 X 与 Y 的协方差挑出权重 w；\n<\/li><li>\n算成分 t = Xw，归一化；\n<\/li><li>\n用 t 回归 X 与 Y，得到载荷 p 与 q；\n<\/li><li>\n从 X、Y 中减去已被解释的部分（收缩），再重复。\n<\/ol>\n<p>停止条件：交叉验证的预测误差不再下降。成分太少欠拟合，太多等于回到普通回归。<\/p>\n<h3>概念 4：结果怎么读（难度：进阶）<\/h3>\n<ul><li>\n<strong>载荷图<\/strong>：看哪些变量在同一个成分上载荷大，说明它们共同驱动这个方向。\n<\/li><li>\n<strong>VIP 值<\/strong>：变量重要性投影，VIP &gt; 1 通常算重要变量。\n<\/li><li>\n<strong>回归系数<\/strong>：PLS 最终也给出系数，但它是在成分空间里算的，解释时要结合载荷。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    X[X 自变量矩阵] --&gt; T[提取成分 t]\n    Y[Y 因变量] --&gt; U[提取成分 u]\n    T &lt;--&gt;|协方差最大| U\n    T --&gt; R[对 Y 回归]\n    R --&gt; C[系数与 VIP]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：中间那条双向箭头是 PLS 与 PCA 的分水岭。只从 X 提取、不看 Y 的，是 PCA；两边一起看的，是 PLS。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：PLS 像挑助手，不只看谁本事大，还看谁跟你手头的活最搭。PCA 只挑本事最大的，可能挑来的人帮不上忙。失效边界：如果活儿本身不需要那么多人，PLS 也会过拟合，成分数要靠交叉验证压住。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：若 x₂ = x₁ + 0.01ε，普通回归的系数会在 (100, −99) 附近剧烈摆动，两个变量单独看都显著，合起来却互相抵消。PLS 会把它们合并成一个成分，系数稳定，但代价是失去「哪一个更重要」的区分能力。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为共线性只影响显著性——实际上它首先破坏的是系数的可解释性。\n<\/li><li>\n别以为 PLS 能替代变量筛选——实际上它把相关变量打包，不会告诉你该删哪个。\n<\/li><li>\n别以为成分越多越好——实际上成分数超过必要值，模型会重新变得不稳定。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】多重共线性的典型后果是？<\/h3>\n<ul><li>\nA. 模型无法求解\n<\/li><li>\nB. 回归系数方差变大、符号可能反常\n<\/li><li>\nC. R² 一定下降\n<\/li><li>\nD. 样本量自动减少\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：共线让设计矩阵接近奇异，系数估计对数据扰动极度敏感。<\/p>\n<\/ul>\n<h3>Q2 【单选】PLS 与 PCA 的核心区别是？<\/h3>\n<ul><li>\nA. PLS 不做降维\n<\/li><li>\nB. PLS 提取成分时同时考虑与 Y 的相关\n<\/li><li>\nC. PCA 只能用于分类\n<\/li><li>\nD. PLS 不需要数据\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：PCA 只看 X 的方差，PLS 看 X 与 Y 的协方差。<\/p>\n<\/ul>\n<h3>Q3 【填空】判断变量重要性常用指标是________值，通常大于 1 视为重要。<\/h3>\n<p><strong>答案<\/strong>：VIP <strong>解析<\/strong>：VIP 综合了各成分对 Y 的解释力与变量在成分上的载荷。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n共线性先毁系数可解释性，再毁显著性。\n<\/li><li>\nPLS 同时看 X 的变异与 X–Y 相关。\n<\/li><li>\n成分数由交叉验证定，不是越多越好。\n<\/ul>", "ch12": "<h1>第 12 章：现代优化算法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 2–4 章 | <strong>原书定位<\/strong>：第 12 章 p367–382\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清什么时候必须放弃精确算法、改用启发式；\n<\/li><li>\n手写模拟退火的接受概率，并解释温度的作用；\n<\/li><li>\n设计一个遗传算法的编码、适应度、选择、交叉、变异五件套。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>启发式算法不保证最优，它保证在有限时间里给你一个能用的解——所以论文里必须报告「跑了多少次、最好结果多少、波动多大」。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：为什么需要启发式（难度：基础）<\/h3>\n<p>TSP、
