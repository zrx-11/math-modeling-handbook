大规模选址、排班这类问题是 NP 难的，点数一多，精确算法跑不完。启发式牺牲最优性换时间。<\/p>\n<p>判断标准：问题规模超过精确算法能处理的范围（比如 TSP 超过 20 个点），或目标函数不可导、含整数与逻辑约束。<\/p>\n<h3>概念 2：模拟退火（难度：进阶）<\/h3>\n<p><strong>模拟退火（SA）<\/strong>：从当前解出发随机扰动，新解更好就接受，更差也按概率接受。<\/p>\n<p>接受概率：<\/p>\n<pre class=\"lang-text\"><code>P = exp(−Δ/T)<\/code><\/pre>\n<p>Δ 是目标函数变差量，T 是温度。T 高时几乎什么都接受，T 低时只接受更好的解。<\/p>\n<p>流程：初始温度 T₀ → 迭代若干次 → 按降温系数 α（如 0.95）降温 → 到终止温度停止。每个温度下要迭代足够多次，否则退火变成随机游走。<\/p>\n<h3>概念 3：遗传算法（难度：进阶）<\/h3>\n<p><strong>遗传算法（GA）<\/strong>：把解编码成染色体，用适应度评价，通过选择、交叉、变异产生下一代。<\/p>\n<p>五件套：<\/p>\n<ol><li>\n<strong>编码<\/strong>：0-1 串、整数串、实数串。TSP 用路径序列编码。\n<\/li><li>\n<strong>适应度<\/strong>：目标函数转成正值，越大越好。\n<\/li><li>\n<strong>选择<\/strong>：轮盘赌或锦标赛，适应度高的更容易被选中。\n<\/li><li>\n<strong>交叉<\/strong>：交换片段。TSP 要用顺序交叉，避免出现重复城市。\n<\/li><li>\n<strong>变异<\/strong>：随机改动一位，保持多样性。\n<\/ol>\n<p>参数：种群规模 50–200，交叉率 0.7–0.9，变异率 0.01–0.1。参数没有普适最优，要按问题调。<\/p>\n<h3>概念 4：改进与评估（难度：进阶）<\/h3>\n<ul><li>\n<strong>精英保留<\/strong>：每代把最好的几个个体直接复制到下一代，防止退化。\n<\/li><li>\n<strong>自适应变异率<\/strong>：适应度高的个体变异率低，低的个体变异率高。\n<\/li><li>\n<strong>多种群<\/strong>：几个子种群独立进化，定期交流，缓解早熟。\n<\/ul>\n<p>评估必须报告：运行次数（如 20 次独立运行）、最好值、平均值、标准差。只报一次最好结果，等于没说。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[初始种群或初始解] --&gt; B[评价适应度]\n    B --&gt; C{满足停止条件}\n    C --&gt;|否| D[选择 交叉 变异]\n    D --&gt; B\n    C --&gt;|是| E[输出最好解]\n    E --&gt; F[多次独立运行 报告分布]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：注意最后一步在循环之外。它不是算法的一部分，但少了它，结果的可信度没法评估。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：退火像往山坡上扔球再让它慢慢停在低处，温度高时球能弹过小坑，温度低时只能往下滚。失效边界：如果地形有巨大的深坑隔开，球仍可能停在错的坑里，这时要多起点。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：4 城市距离矩阵对称，A-B 2、A-C 6、A-D 5、B-C 3、B-D 4、C-D 7。遍历路线 A-B-C-D-A 长 2+3+7+5 = 17；A-B-D-C-A 长 2+4+7+6 = 19；A-C-B-D-A 长 6+3+4+5 = 18。最优是 17。启发式跑 20 次，若 18 次得 17、2 次得 18，就说明算法稳定但不保证每次都最优。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为启发式不需要建模——实际上编码方式和邻域结构决定搜索能力，这部分比调参重要。\n<\/li><li>\n别以为跑出好结果就万事大吉——实际上不复现、不报告分布，结果无法采信。\n<\/li><li>\n别以为参数越大越好——实际种群过大拖慢收敛，温度过高等于乱搜。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】模拟退火中温度 T 的主要作用是？<\/h3>\n<ul><li>\nA. 控制迭代次数\n<\/li><li>\nB. 控制接受较差解的概率\n<\/li><li>\nC. 决定编码长度\n<\/li><li>\nD. 计算适应度\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：P = exp(−Δ/T)，T 越大越容易接受差解，用于跳出局部最优。<\/p>\n<\/ul>\n<h3>Q2 【单选】TSP 使用遗传算法时，普通交叉会导致？<\/h3>\n<ul><li>\nA. 收敛过快\n<\/li><li>\nB. 路径中出现重复或缺失城市\n<\/li><li>\nC. 适应度无法计算\n<\/li><li>\nD. 种群规模爆炸\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：普通单点交叉会重复片段，必须用顺序交叉等保序算子。<\/p>\n<\/ul>\n<h3>Q3 【填空】启发式算法论文必须报告多次独立运行的________，而不只是最好值。<\/h3>\n<p><strong>答案<\/strong>：分布（平均值与标准差） <strong>解析<\/strong>：单次结果无法区分「算法稳定」与「运气好」。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n规模超限或目标不可导时，才换启发式。\n<\/li><li>\n退火靠温度控制接受差解的概率。\n<\/li><li>\nGA 五件套：编码、适应度、选择、交叉、变异。\n<\/li><li>\n结果要报多次运行的分布。\n<\/ul>", "ch13": "<h1>第 13 章：数字图像处理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 5 章、起步册第 2 章 | <strong>原书定位<\/strong>：第 13 章 p383–409\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清一幅数字图像在计算机里到底是什么；\n<\/li><li>\n手算一次 3×3 均值滤波，看出它为什么能去噪也会糊边；\n<\/li><li>\n分清空间域与频域两种做法的适用场景。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>图像是矩阵，处理图像就是对这个矩阵做局部加权平均、变换或编码。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：图像是矩阵（难度：基础）<\/h3>\n<p><strong>灰度图<\/strong>：每个像素一个 0–255 的数，0 黑 255 白。整幅图就是一个 m×n 矩阵。<\/p>\n<p><strong>彩色图<\/strong>：三个通道 R、G、B，每个通道一个矩阵，形状 m×n×3。<\/p>\n<p><strong>灰度化<\/strong>：把三通道合成一个，常用加权 Y = 0.299R + 0.587G + 0.114B。权重不同是因为人眼对绿光最敏感。<\/p>\n<h3>概念 2：亮度变换（难度：基础）<\/h3>\n<ul><li>\n<strong>线性拉伸<\/strong>：把原本集中在 100–150 的灰度拉到 0–255，对比度立刻变强。\n<\/li><li>\n<strong>伽马变换<\/strong>：s = c·r^γ，γ &lt; 1 提亮暗部，γ &gt; 1 压暗。\n<\/li><li>\n<strong>直方图均衡<\/strong>：按累计分布重新分配灰度，使直方图尽量平坦。全局提对比，但可能放大噪声。\n<\/ul>\n<h3>概念 3：空间滤波（难度：进阶）<\/h3>\n<p><strong>空间滤波<\/strong>：拿一个小窗口（如 3×3）在图上滑动，每个位置算一个加权和，写回中心像素。<\/p>\n<p>均值滤波的核是所有权重都为 1/9。手算一个例子：<\/p>\n<pre class=\"lang-text\"><code>10  10  10\n10  10  10\n10  10  90<\/code><\/pre>\n<p>中心像素原值 10，窗口和 = 10×8 + 90 = 170，除以 9 得 18.9，取整 19。原来那个 90 的亮点被压到 19，噪声减弱；同时如果 90 是真实边缘，边缘也被抹平。<\/p>\n<p>中值滤波取窗口中位数，上例中位数是 10，比均值更能保住边缘。椒盐噪声首选它。<\/p>\n<h3>概念 4：频域处理（难度：进阶）<\/h3>\n<p><strong>傅里叶变换<\/strong>把图像从空间域变到频域：低频对应大块平滑区域，高频对应边缘与噪声。<\/p>\n<p>低通滤波（保留低频）去噪但模糊；高通滤波（保留高频）锐化但放大噪声。频域做法的好处是「滤波器的设计直观」，代价是要做正反两次变换。<\/p>\n<h3>概念 5：水印与加密（难度：高难）<\/h3>\n<ul><li>\n<strong>LSB 水印<\/strong>：把水印信息写进像素值的最低位。人眼看不出来，但压缩或裁剪会破坏。\n<\/li><li>\n<strong>DCT 水印<\/strong>：在频域中频系数里嵌入，抗压缩能力强。\n<\/li><li>\n<strong>图像加密<\/strong>：Arnold 置乱打乱像素位置，混沌序列异或改变像素值。两者叠加才算安全，只置乱不改变直方图，容易被统计分析破解。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[原始图像矩阵] --&gt; B{要解决什么}\n    B --&gt;|太暗或太淡| C[亮度变换 直方图均衡]\n    B --&gt;|有噪声| D[均值 中值 高斯滤波]\n    B --&gt;|要锐化或去周期性噪声| E[频域滤波]\n    B --&gt;|要藏信息| F[LSB 或 DCT 水印]\n    B --&gt;|要保密| G[置乱 加 扩散]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：先明确目的再选工具。去噪选错滤波器，会把该保留的边缘一起抹掉。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：均值滤波像给照片蒙一层毛玻璃，颗粒感没了，细节也糊了。失效边界：毛玻璃是均匀模糊，均值滤波在边缘处会产生「拖影」，方向性噪声用它反而更糟。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：上面那个 3×3 窗口，若改用中值滤波，排序后中间值是 10，输出 10，亮点被完全剔除；若用最大值滤波，输出 90，亮点保留。同一窗口，三种滤波三种结果，说明「滤波」不是单一操作。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为分辨率越高信息越多——实际上压缩、模糊、噪声都会让高分辨率图的有效信息变少。\n<\/li><li>\n别以为滤波一定让图更好看——实际上过度平滑会让边缘消失，后续识别精度下降。\n<\/li><li>\n别以为 LSB 水印很安全——实际上任何有损压缩都能把它抹掉。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】灰度化时绿色通道权重最大的原因是？<\/h3>\n<ul><li>\nA. 绿色像素最多\n<\/li><li>\nB. 人眼对绿光最敏感\n<\/li><li>\nC. 绿色通道噪声最小\n<\/li><li>\nD. 计算方便\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：加权系数按人眼亮度感知设定，绿光权重 0.587 最高。<\/p>\n<\/ul>\n<h3>Q2 【单选】椒盐噪声最适合用哪种滤波？<\/h3>\n<ul><li>\nA. 均值滤波\n<\/li><li>\nB. 中值滤波\n<\/li><li>\nC. 高通滤波\n<\/li><li>\nD. 直方图均衡\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：中值滤波能剔除极端值同时保住边缘，均值会把噪声摊到整片区域。<\/p>\n<\/ul>\n<h3>Q3 【填空】3×3 均值滤波窗口中，每个位置的权重是________。<\/h3>\n<p><strong>答案<\/strong>：1/9 <strong>解析<\/strong>：九个像素等权平均，总和为 1，保证整体亮度不漂移。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n图像就是矩阵，处理就是矩阵运算。\n<\/li><li>\n均值去噪糊边，中值保边去椒盐。\n<\/li><li>\n频域低通去噪、高通锐化，各管一头。\n<\/ul>", "ch14": "<h1>第 14 章：综合评价与决策方法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：7 小时 | <strong>前置<\/strong>：第 7 章、第 10 章 | <strong>原书定位<\/strong>：第 14 章 p410–447\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n把「哪个方案更好」拆成指标、权重、标准化、合成四步；\n<\/li><li>\n手算一次极差标准化与加权合成，看出权重如何改变排序；\n<\/li><li>\n说清 TOPSIS、熵权法、模糊综合评判各自的前提。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>综合评价没有绝对正确，只有「口径说清楚了、权重交代了、结论能复现」的排序。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：四步流程（难度：基础）<\/h3>\n<ol><li>\n<strong>定指标<\/strong>：选能测、能比的量，分清效益型（越大越好）与成本型（越小越好）。\n<\/li><li>\n<strong>标准化<\/strong>：把不同量纲拉到同一区间。常用极差法：效益型 (x − min)/(max − min)，成本型 (max − x)/(max − min)。\n<\/li><li>\n<strong>定权重<\/strong>：主观（专家打分、AHP）或客观（熵权、主成分）。\n<\/li><li>\n<strong>合成排序<\/strong>：加权求和，或算与理想解的距离。\n<\/ol>\n<h3>概念 2：手算一个排序（难度：基础）<\/h3>\n<p>三个方案，价格 20、25、30 万元（成本型），质量评分 80、90、85（效益型）。<\/p>\n<p>价格标准化：(30 − x)/10 → 1、0.5、0。 质量标准化：(x − 80)/10 → 0、1、0.5。<\/p>\n<p>权重各 0.5：得分 0.5、0.75、0.25，方案 2 最好。 权重改成价格 0.8、质量 0.2：得分 0.8、0.6、0.1，方案 1 最好。<\/p>\n<p>同一组数据，换个权重排序就翻。这不是方法不稳，而是「哪个更重要」本来就是决策者的判断。论文里必须写清权重来源，并做权重灵敏度。<\/p>\n<h3>概念 3：TOPSIS（难度：进阶）<\/h3>\n<p><strong>理想解法（TOPSIS）<\/strong>：先构造正理想解（每个指标都取最好）与负理想解（每个都取最差），再算每个方案到两者的欧氏距离，离正理想近、离负理想远的排前面。<\/p>\n<p>优点：不要求指标独立，排序结果对权重不那么敏感。缺点：距离用的是欧氏距离，指标相关性高时会重复计权。<\/p>\n<h3>概念 4：熵权法（难度：进阶）<\/h3>\n<p><strong>熵权法<\/strong>：指标在方案间差异越大，信息量越大，权重越高。<\/p>\n<p>步骤：标准化 → 算比重 pᵢⱼ → 算熵 eⱼ = −(1/ln n)∑pᵢⱼln pᵢⱼ → 权重 wⱼ = (1 − eⱼ)/∑(1 − eⱼ)。<\/p>\n<p>注意：熵权是客观权重，它不代表重要性，只代表区分度。某项指标所有方案都一样，熵权为 0，但它可能极其重要——这是熵权法最大的坑。<\/p>\n<h3>概念 5：其他方法一句话（难度：进阶）<\/h3>\n<table><thead><tr><th>方法<\/th><th>一句话<\/th><th>前提<\/th><\/tr><\/thead><tbody><tr><td>模糊综合评判<\/td><td>用隶属度处理「说不太清」的评价<\/td><td>要构造合理的隶属函数<\/td><\/tr><tr><td>数据包络分析 DEA<\/td><td>用投入产出比评价效率<\/td><td>决策单元要同类、指标非负<\/td><\/tr><tr><td>灰色关联分析<\/td><td>看序列形状相似度<\/td><td>数据少也能用，但分辨率有限<\/td><\/tr><tr><td>秩和比 RSR<\/td><td>用秩次合成，抗异常值<\/td><td>会丢失原始数值信息<\/td><\/tr><tr><td>主成分分析<\/td><td>用少数综合成分排序<\/td><td>成分要有可解释性<\/td><\/tr><tr><td>PageRank<\/td><td>用链接关系给节点排序<\/td><td>要有有向关系网络<\/td><\/tr><\/tbody><\/table>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[待评价对象] --&gt; B[选指标]\n    B --&gt; C[区分效益型与成本型]\n    C --&gt; D[标准化]\n    D --&gt; E{权重怎么来}\n    E --&gt;|主观| F[AHP 专家打分]\n    E --&gt;|客观| G[熵权 主成分]\n    F --&gt; H[合成]\n    G --&gt; H\n    H --&gt; I[排序与灵敏度]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：权重来源是整章分歧最大的地方。主观权重可解释但可被质疑，客观权重可复现但可能背离业务重要性，稳妥做法是两种都算、对比结果。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：综合评价像给几个候选人打分录取，指标是分数项，权重是各科占比。失效边界：录取只看排序，评价常常还要给「为什么」，光有排名不够。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：上例三方案，若改用熵权法：价格标准化值 1、0.5、0 的差异大，熵小、权重大；质量 0、1、0.5 差异也大。两者熵接近，权重接近 0.5，结果与等权相同。这说明熵权并不自动偏向「更重要的指标」。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为指标越多越全面——实际上指标相关性高会重复计权，反而失真。\n<\/li><li>\n别以为客观权重比主观权重科学——实际上熵权只看区分度，不看业务重要性。\n<\/li><li>\n别以为排序稳定就说明方法好——实际上可能只是权重给得接近平均。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】成本型指标标准化时应该？<\/h3>\n<ul><li>\nA. 直接除以最大值\n<\/li><li>\nB. 用 (max − x)/(max − min)\n<\/li><li>\nC. 取对数\n<\/li><li>\nD. 平方后归一\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：成本型越小越好，极差法要反向，使标准化后仍是越大越好。<\/p>\n<\/ul>\n<h3>Q2 【单选】熵权法的权重反映的是？<\/h3>\n<ul><li>\nA. 指标的业务重要性\n<\/li><li>\nB. 指标在方案间的区分度\n<\/li><li>\nC. 指标间的相关性\n<\/li><li>\nD. 样本量大小\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：熵小说明分布不均、区分度大，权重高；与重要性无必然关系。<\/p>\n<\/ul>\n<h3>Q3 【填空】TOPSIS 通过计算方案到正理想解与负理想解的________来排序。<\/h3>\n<p><strong>答案<\/strong>：距离 <strong>解析<\/strong>：离正理想越近、离负理想越远，综合得分越高。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n评价四步：指标、标准化、权重、合成。\n<\/li><li>\n权重换一换，排序可能翻，必须做灵敏度。\n<\/li><li>\n熵权看区分度，不看重要性。\n<\/ul>", "ch15": "<h1>第 15 章：预测方法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：7 小时 | <strong>前置<\/strong>：第 6、7 章 | <strong>原书定位<\/strong>：第 15 章 p448–477\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n按数据形态选预测方法：有机制、有趋势、有周期、有状态转移；\n<\/li><li>\n手算 GM(1,1) 的两步预测，并解释为什么它适合小样本；\n<\/li><li>\n说清「预测精度」该怎么报，为什么不能只报一个点估计。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>预测方法的差别不在算法新旧，而在它假设数据由什么驱动。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：六类方法与它们的假设（难度：基础）<\/h3>\n<table><thead><tr><th>方法<\/th><th>假设数据由什么驱动<\/th><th>适用场景<\/th><\/tr><\/thead><tbody><tr><td>微分方程<\/td><td>有明确的机制与反馈<\/td><td>传染病、人口、反应过程<\/td><\/tr><tr><td>灰色 GM(1,1)<\/td><td>累加后近似指数增长<\/td><td>小样本、单调趋势<\/td><\/tr><tr><td>马尔可夫<\/td><td>下一状态只依赖当前状态<\/td><td>状态离散、转移概率稳定<\/td><\/tr><tr><td>时间序列 ARIMA<\/td><td>趋势 + 差分平稳 + 自相关<\/td><td>有历史序列、季节性<\/td><\/tr><tr><td>插值与拟合<\/td><td>趋势平滑可外推<\/td><td>数据点少、规律简单<\/td><\/tr><tr><td>神经网络<\/td><td>非线性映射关系<\/td><td>样本多、机制不明<\/td><\/tr><\/tbody><\/table>\n<p>选错假设，再精细的参数也救不回来。比如用线性外推预测疫情早期，会低估指数增长。<\/p>\n<h3>概念 2：GM(1,1) 手算（难度：进阶）<\/h3>\n<p>原始序列 x⁰ = (2, 3, 4)，做一次累加得 x¹ = (2, 5, 9)。<\/p>\n<p>级比检验：λ(2) = 2/3 = 0.667，λ(3) = 3/4 = 0.75。n = 3 时容许区间约为 (0.607, 1.649)，两个比值都落在区间内，可以用 GM(1,1)。<\/p>\n<p>构造矩阵：紧邻均值 z = (3.5, 7)，B = [[−3.5, 1], [−7, 1]]，Y = [[3], [4]]。<\/p>\n<p>最小二乘解 (BᵀB)⁻¹BᵀY 得 a = −0.2857，b = 2。<\/p>\n<p>预测式：x̂¹(k+1) = (x⁰(1) − b/a)e^(−a k) + b/a = 9 e^(0.2857k) − 7。<\/p>\n<p>k = 1：x̂¹(2) = 9×1.3307 − 7 = 4.98。 k = 2：x̂¹(3) = 9×1.7709 − 7 = 8.94。<\/p>\n<p>还原：x̂⁰(3) = 8.94 − 4.98 = 3.96，与真值 4 相差 0.04，相对误差约 1%。<\/p>\n<p>注意 a 为负表示增长。若 a 为正，说明序列在衰减，模型形式仍成立，但预测会递减。<\/p>\n<h3>概念 3：马尔可夫与时间序列（难度：进阶）<\/h3>\n<p><strong>马尔可夫链<\/strong>：状态集合 + 转移概率矩阵。下一期状态只由本期状态决定，与更早的历史无关。<\/p>\n<p>用法：统计历史转移频次得矩阵 P，下一期分布 = 本期分布 × P。要求样本足够估计转移概率，且过程近似平稳。<\/p>\n<p><strong>ARIMA(p,d,q)<\/strong>：p 是自回归阶数，d 是差分次数，q 是移动平均阶数。先做单位根检验确定 d，再看 ACF/PACF 定 p、q，最后用 AIC 选模型。<\/p>\n<h3>概念 4：精度怎么报（难度：进阶）<\/h3>\n<p>三个指标：MAE 平均绝对误差、RMSE 均方根误差、MAPE 平均绝对百分比误差。<\/p>\n<p>必须做<strong>样本外检验<\/strong>：留出最后若干期不参与建模，用它们评估。样本内拟合得好，不代表预测得准。<\/p>\n<p>只报一个预测值而不给区间，等于隐藏不确定性。区间可以用残差标准差估，也可以用 Bootstrap。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[历史数据] --&gt; B{数据形态}\n    B --&gt;|有机制可写方程| C[微分方程]\n    B --&gt;|小样本单调趋势| D[灰色 GM]\n    B --&gt;|状态离散| E[马尔可夫]\n    B --&gt;|长序列有季节性| F[ARIMA]\n    B --&gt;|规律简单| G[拟合外推]\n    B --&gt;|样本大机制不明| H[神经网络]\n    C --&gt; I[样本外检验]\n    D --&gt; I\n    E --&gt; I\n    F --&gt; I\n    G --&gt; I\n    H --&gt; I<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：六条路径最后都汇到「样本外检验」。这一步省掉，方法再花哨也没有可信度。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：预测像看后视镜开车，镜子里清楚，前方只能推断。失效边界：路况突变时后视镜毫无用处，这正是所有统计预测的共同弱点。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：某产品销量 2、3、4 万件，用 GM(1,1) 得下一期 3.96，用线性拟合（斜率 1）得 5，用二次外推得 5。三个方法差 1 万件。差异来自假设：GM 认为增长放缓，线性认为匀速，二次认为加速。论文里选哪个，要说清依据。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为模型越复杂预测越准——实际上样本少时复杂模型参数估不准，简单模型更稳。\n<\/li><li>\n别以为拟合 R² 高就能预测——实际上过拟合在样本外会崩。\n<\/li><li>\n别以为预测是一个数——实际上必须给区间或误差范围。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】GM(1,1) 适合的数据特征是？<\/h3>\n<ul><li>\nA. 大样本、强季节性\n<\/li><li>\nB. 小样本、近似指数趋势\n<\/li><li>\nC. 状态离散、转移稳定\n<\/li><li>\nD. 多变量非线性\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：GM 通过一次累加把序列变成近似指数，适合数据点少的单调趋势。<\/p>\n<\/ul>\n<h3>Q2 【单选】ARIMA 中的 d 表示？<\/h3>\n<ul><li>\nA. 差分次数\n<\/li><li>\nB. 自回归阶数\n<\/li><li>\nC. 移动平均阶数\n<\/li><li>\nD. 样本量\n<p><strong>答案<\/strong>：A <strong>解析<\/strong>：d 是把非平稳序列差分成平稳序列所需的次数。<\/p>\n<\/ul>\n<h3>Q3 【填空】评估预测精度必须做________检验，而不是只看样本内拟合。<\/h3>\n<p><strong>答案<\/strong>：样本外 <strong>解析<\/strong>：样本内拟合优度高不代表泛化能力好，留出末段数据做真实验证才有意义。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n六类预测对应六种数据假设，先判形态再选方法。\n<\/li><li>\nGM(1,1) 靠累加 + 最小二乘，适合小样本。\n<\/li><li>\n精度必须报样本外指标与区间。\n<\/ul>", "ch16": "<h1>第 16 章：多目标规划和目标规划<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 1–3 章 | <strong>原书定位<\/strong>：第 16 章 p478–492\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清多目标问题为什么没有唯一最优解；\n<\/li><li>\n用加权和法与 ε 约束法各求一个折中方案；\n<\/li><li>\n把「尽量达到某目标」写成带偏差变量的目标规划。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>多目标不是「几个目标一起最大」，而是「在冲突的目标之间选一个你愿意接受的交换比例」。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：Pareto 有效解（难度：基础）<\/h3>\n<p><strong>Pareto 有效解<\/strong>：找不到另一个解在所有目标上都不差、且至少一个目标更好。也叫非劣解。<\/p>\n<p>例：五个方案的目标值为 (1,5)、(2,4)、(3,3)、(4,2)、(5,1)，都在直线 x + y = 6 上，互相无法全面超越，都是有效解。而 (2,3) 被 (3,3) 全面超越（第一目标更高、第二目标相同），是劣解。<\/p>\n<p>多目标优化的输出不是一个点，而是一条<strong>Pareto 前沿<\/strong>。选哪一点，是决策，不是计算。<\/p>\n<h3>概念 2：加权和法（难度：基础）<\/h3>\n<p>把多个目标加权成一个大目标：max w₁f₁ + w₂f₂，w₁ + w₂ = 1。<\/p>\n<p>优点：简单，一次求解。缺点：权重不同结果不同，且当目标量纲差很多时，权重要先归一化。<\/p>\n<p>坑：如果 Pareto 前沿不是凸的，加权和法会漏掉中间的解——它只能取到支撑点。<\/p>\n<h3>概念 3：ε 约束法（难度：进阶）<\/h3>\n<p>把一个目标作为主目标，其余目标改成约束：max f₁，s.t. f₂ ≥ ε₂, f₃ ≥ ε₃。<\/p>\n<p>扫 ε 从大到小，得到一串解，构成前沿。优点是非凸前沿也能取到；缺点是要反复求解，且 ε 的可行范围要试。<\/p>\n<h3>概念 4：目标规划（难度：进阶）<\/h3>\n<p><strong>目标规划<\/strong>：不追求最大最小，而是「尽量接近给定目标值」。<\/p>\n<p>引入偏差变量 d⁺（超出量）与 d⁻（不足量），满足 f(x) + d⁻ − d⁺ = 目标值，d⁺, d⁻ ≥ 0，目标是最小化加权偏差。<\/p>\n<p>优先级：先保证第一级目标，再在它的最优解集里优化第二级。这叫<strong>分层目标规划<\/strong>。<\/p>\n<p>例：利润目标 120（千元），用工上限 80（工时）。约束写成 3x + 2y + d₁⁻ − d₁⁺ = 120；x + y + d₂⁻ = 80。目标 min 5d₁⁻ + 3d₂⁻。系数 5 与 3 表示「利润差 1 千元比用工差 1 工时更严重」。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[多个冲突目标] --&gt; B{要前沿还是要一个方案}\n    B --&gt;|要前沿| C[ε 约束法扫参数]\n    B --&gt;|要一个方案| D{决策者能给出偏好}\n    D --&gt;|能给权重| E[加权和法]\n    D --&gt;|能给目标值| F[目标规划]\n    C --&gt; G[前沿曲线]\n    E --&gt; H[单一方案]\n    F --&gt; H<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：先问「要一条线还是一个点」。这是多目标建模最先要问清的问题，答错了后面全白做。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：多目标像买电脑时在性能与续航之间权衡。没有「最好」的电脑，只有「按你的用法最合适」的电脑。失效边界：电脑还能加钱两样都要，多目标问题里资源固定，加钱这个选项不存在。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：某厂两目标 f₁ = 4x + 3y（利润），f₂ = x + 2y（市场份额），约束 2x + y ≤ 10、x + y ≤ 8、x,y ≥ 0。加权 w = 0.5：max 2.5x + 2.5y，沿 x + y = 8 取到，值 20，解不唯一——这说明权重相等时问题退化。改用 w₁ = 0.7、w₂ = 0.3：max 3.1x + 2.7y，最优在 (2,6)，得 6.2 + 16.2 = 22.4；对比 (1,7) 得 3.1 + 18.9 = 22.0，前者更优。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为多目标可以「全部最大化」——实际上目标冲突时不存在这样的解。\n<\/li><li>\n别以为加权和法一定找到最优折中——实际上非凸前沿会漏解。\n<\/li><li>\n别以为目标规划就是多目标规划——实际上它把目标变成约束，优化的是偏差。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】Pareto 有效解的含义是？<\/h3>\n<ul><li>\nA. 所有目标都最大\n<\/li><li>\nB. 不存在全面更优的解\n<\/li><li>\nC. 加权和最大的解\n<\/li><li>\nD. 约束最少的解\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：有效解指不被任何其他解全面超越，可能有很多个。<\/p>\n<\/ul>\n<h3>Q2 【单选】加权和法的主要局限是？<\/h3>\n<ul><li>\nA. 不能处理两个以上目标\n<\/li><li>\nB. 非凸前沿上会漏掉中间解\n<\/li><li>\nC. 必须用整数规划\n<\/li><li>\nD. 权重必须相等\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：加权和只能取到支撑点，非凸部分取不到，需改用 ε 约束法。<\/p>\n<\/ul>\n<h3>Q3 【填空】目标规划中 d⁺ 表示实际值相对目标值的________量。<\/h3>\n<p><strong>答案<\/strong>：超出 <strong>解析<\/strong>：d⁺ 是正偏差（超出），d⁻ 是负偏差（不足），两者不能同时非零。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n多目标输出前沿，不输出单点。\n<\/li><li>\n加权和简单但漏非凸解，ε 约束更全但更慢。\n<\/li><li>\n目标规划把目标写成约束，最小化偏差。\n<\/ul>", "c01": "<h1>标准化与权重<\/h1>\n<p>&lt;!--chapters: ch14,ch10--&gt;<\/p>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 14 章、第 10 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>标准化把不同量纲的指标压到同一区间；权重决定哪个指标在最终排序里说话更响。<\/p>\n<h2>为什么重要<\/h2>\n<p>综合评价的结论几乎完全由这两步决定。同一组数据，换标准化方法或换权重，排序就可能翻。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[原始指标] --&gt; B[区分效益型与成本型]\n    B --&gt; C[极差或向量标准化]\n    C --&gt; D[赋权]\n    D --&gt; E[加权合成]\n    E --&gt; F[排序]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>极差法：效益型 (x−min)/(max−min)，成本型 (max−x)/(max−min)。向量标准化：x/√∑x²。前者受极值影响大，后者保留分布形状。<\/p>\n<p>权重来源：主观（AHP、专家打分）可解释但可被质疑；客观（熵权、主成分）可复现但可能背离业务重要性。稳妥做法是两种都算、对比。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为标准化方法可以随便选——实际上极差法对异常值极敏感，有一个离群点就会把其余值压扁。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 14 章<\/td><td>评价流程<\/td><td>价格 20/25/30 标准化为 1/0.5/0<\/td><\/tr><tr><td>第 10 章<\/td><td>PCA<\/td><td>先标准化再算协方差<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：指标、量纲\n<\/li><li>\n后续：TOPSIS、熵权法\n<\/ul>", "c02": "<h1>间隔与支持向量<\/h1>\n<p>&lt;!--chapters: ch09--&gt;<\/p>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 9 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>间隔是两类点之间的安全距离；支持向量是决定这条边界的那几个最近的点。<\/p>\n<h2>为什么重要<\/h2>\n<p>它解释了 SVM 为什么比「随便找条线分开」更稳：间隔是模型的容错空间。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[正类点] --&gt; C[决策线]\n    B[负类点] --&gt; C\n    C --&gt; D[支持向量到线距离]\n    D --&gt; E[间隔 = 2 倍距离]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>规范化后支持向量满足 wᵀx + b = ±1，间隔 2/‖w‖。最大化间隔等价于最小化 ‖w‖²/2，这是个二次规划。<\/p>\n<p>类比：在两排人之间画线，要求离两边都尽量远，谁稍微动一下都不会越界。失效边界：两排人本身交错时无法做到，只能允许越界，即软间隔。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为所有样本都影响边界——实际上只有支持向量进入约束等号，其余点删掉不影响结果。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 9 章<\/td><td>基本模型<\/td><td>间隔 2/‖w‖，支持向量定边界<\/td><\/tr><tr><td>第 9 章<\/td><td>软间隔<\/td><td>C 控制容忍度<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：二次规划、KKT\n<\/li><li>\n后续：核函数、多分类\n<\/ul>", "c03": "<h1>可行域与顶点<\/h1>\n<p>&lt;!--chapters: ch01,ch02,ch16--&gt;<\/p>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1、2、16 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>可行域是所有满足约束的点，线性约束下它是凸多边形；最优解一定能在它的顶点上找到。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把「在无穷多个解里找最优」变成「算有限个顶点」。整数规划、多目标规划的各种方法，都在和这个几何结构打交道。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[约束不等式组] --&gt; B[可行域凸多边形]\n    B --&gt; C[顶点集合]\n    C --&gt; D[逐点算目标值]\n    D --&gt; E[最优顶点]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>二维时每条约束是一条直线，可行域是这些直线围出的多边形。三维是多面体。顶点处有几条约束同时取等号，这就是「紧约束」的含义。<\/p>\n<p>类比：可行域像一块草地，顶点是四角。你想在草地上找最高的点，如果草地是平的或均匀倾斜，最高点一定在角上。失效边界：草地中间有个土包时，最高点就在内部，这就是非线性规划要单独处理的原因。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为顶点一定可行——实际上两条约束线的交点可能落在第三条约束外，要逐条代回验证。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 1 章<\/td><td>机床厂例子<\/td><td>顶点 (2,6) 给出 z=26<\/td><\/tr><tr><td>第 2 章<\/td><td>整数规划<\/td><td>顶点变格点，几何直觉失效<\/td><\/tr><tr><td>第 16 章<\/td><td>多目标<\/td><td>有效解构成前沿而非单点<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：约束条件\n<\/li><li>\n后续：单纯形法、Pareto 前沿\n<\/ul>", "c04": "<h1>Pareto 前沿<\/h1>\n<p>&lt;!--chapters: ch16,ch14--&gt;<\/p>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 16 章、第 14 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>所有不被其他解全面超越的解构成的集合，形状是一条权衡曲线。<\/p>\n<h2>为什么重要<\/h2>\n<p>多目标问题没有唯一答案，前沿就是「所有理性选择」的集合。选哪一点是决策，不是计算。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[可行解集合] --&gt; B[剔除被支配解]\n    B --&gt; C[Pareto 前沿]\n    C --&gt; D[按偏好选一点]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>点 (1,5)、(2,4)、(3,3)、(4,2)、(5,1) 都在 x+y=6 上，互不支配，都是有效解；(2,3) 被 (3,3) 支配，剔除。<\/p>\n<p>求法：加权和法（快，但漏非凸部分）、ε 约束法（全，但慢）、遗传算法（适合大规模）。<\/p>\n<p>类比：买电脑在性能与续航之间权衡，前沿就是「同等预算下所有值得买的型号」。失效边界：预算可以加时，前沿会整体外移，这时问题本身变了。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为前沿上的点都同样好——实际上它们只是互不支配，具体选哪个取决于偏好。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 16 章<\/td><td>多目标<\/td><td>加权 0.7/0.3 得 (2,6)<\/td><\/tr><tr><td>第 14 章<\/td><td>评价<\/td><td>排序等价于在前沿上选点<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：可行域、加权和\n<\/li><li>\n后续：目标规划\n<\/ul>", "c05": "<h1>凸性<\/h1>\n<p>&lt;!--chapters: ch03,ch10,ch16--&gt;<\/p>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3、10、16 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>碗形结构：集合里任意两点的连线仍在集合内，函数上任意两点的连线仍在函数上方。<\/p>\n<h2>为什么重要<\/h2>\n<p>凸性决定算法能不能保证全局最优。凸问题用梯度法一次就能收敛到最优；非凸问题必须多起点，且每次结果可能不同。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[模型] --&gt; B{目标凸且可行域凸}\n    B --&gt;|是| C[局部最优即全局最优]\n    B --&gt;|否| D[多起点搜索或全局算法]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>判定：一元看二阶导数 ≥ 0；多元看海森矩阵半正定；可行域由线性约束构成时必凸，含等式非线性约束时要单独检查。<\/p>\n<p>类比：凸像碗，球滚下去一定到碗底；非凸像山地，球可能停在小坑。失效边界：碗底也可能是一条平底槽，这时最优解不唯一，但仍是全局最优。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为约束是线性的就一定凸——实际上目标函数非凸时整体仍非凸。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 3 章<\/td><td>KKT 与二次规划<\/td><td>半正定 Hessian 保证凸<\/td><\/tr><tr><td>第 10 章<\/td><td>PCA<\/td><td>协方差矩阵半正定，主成分方向唯一<\/td><\/tr><tr><td>第 16 章<\/td><td>加权和<\/td><td>非凸前沿导致漏解<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：导数、矩阵\n<\/li><li>\n后续：KKT 条件、Pareto 前沿\n<\/ul>", "c06": "<h1>稳定性<\/h1>\n<p>&lt;!--chapters: ch06,ch08--&gt;<\/p>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 6、8 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>初值受到小扰动后，系统会不会自己回到原来的平衡状态。<\/p>\n<h2>为什么重要<\/h2>\n<p>预测类模型最怕「参数差一点，结果差很多」。稳定性分析告诉你模型能用多久、误差会不会放大。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[平衡点] --&gt; B{扰动后}\n    B --&gt;|回到平衡点| C[稳定]\n    B --&gt;|越走越远| D[不稳定]\n    B --&gt;|等幅振荡| E[临界]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>离散系统看特征根的模是否小于 1；连续系统看特征值实部是否为负。一阶差分 xₙ₊₁ = axₙ + b 的判据是 |a| &lt; 1。<\/p>\n<p>类比：不倒翁被推一下会晃回来，是稳定；鸡蛋立起来被碰一下就倒，是不稳定。失效边界：不倒翁只在平地稳定，斜坡上照样滚走，模型的稳定域也有范围。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为平衡点存在就等于稳定——实际上很多平衡点是不稳定的，稍有偏差就发散。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 6 章<\/td><td>微分方程<\/td><td>特征值实部为负则渐近稳定<\/td><\/tr><tr><td>第 8 章<\/td><td>差分方程<\/td><td>特征根模小于 1 则稳定<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：特征值\n<\/li><li>\n后续：长期预测的可信度评估\n<\/ul>", "c07": "<h1>影子价格<\/h1>\n<p>&lt;!--chapters: ch01,ch14--&gt;<\/p>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1 章、第 14 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>某条资源约束的右端项每增加一个单位，最优目标值能提高多少。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把「资源紧不紧」变成可比较的数字，直接支撑「要不要加班、要不要采购」这类决策。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[右端项加 1] --&gt; B[重解模型]\n    B --&gt; C[目标值增量]\n    C --&gt; D[与资源成本比较]\n    D --&gt;|增量大于成本| E[追加资源]\n    D --&gt;|增量小于成本| F[不追加]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>对偶理论保证影子价格等于对偶变量。约束未起作用时影子价格为 0：资源闲着，再给也没用。<\/p>\n<p>机床上例中 A 工时从 10 增到 11，最优值从 26 增到 27，影子价格 1 千元/小时。若加班费 0.6 千元/小时，值得加。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为影子价格永远为正——实际上非紧约束的影子价格为 0，约束放松也不会改善目标。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 1 章<\/td><td>灵敏度讨论<\/td><td>影子价格 = 对偶变量<\/td><\/tr><tr><td>第 14 章<\/td><td>评价<\/td><td>权重可视为资源重要性的影子价格<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：线性规划、对偶\n<\/li><li>\n后续：灵敏度分析\n<\/ul>", "c08": "<h1>最小二乘<\/h1>\n<p>&lt;!--chapters: ch05,ch07,ch11--&gt;<\/p>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 5、7、11 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>在所有候选参数里，挑使残差平方和最小的那一组。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是拟合、回归、PLS 的共同底座。理解了它，第 5、7、11 章的公式就都是同一件事的不同包装。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[数据点] --&gt; B[假设函数形式]\n    B --&gt; C[算残差平方和]\n    C --&gt; D[对参数求导令零]\n    D --&gt; E[解出参数]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>一元直线拟合的解析解：斜率 = 协方差 / 方差，截距 = 均值差。多元时写成 (XᵀX)⁻¹Xᵀy，共线会让 XᵀX 接近奇异，系数爆炸。<\/p>\n<p>类比：往几个点中间拉一根橡皮筋，它最终停在总拉伸量最小的位置。失效边界：橡皮筋对所有点等权，有异常值时会被单点拽偏，这时要用稳健回归。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为最小二乘只适合直线——实际上任何线性于参数的模型都能用，多项式拟合也是线性的。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 5 章<\/td><td>直线拟合<\/td><td>斜率 1.5、截距 0.333<\/td><\/tr><tr><td>第 7 章<\/td><td>回归<\/td><td>与假设检验配套使用<\/td><\/tr><tr><td>第 11 章<\/td><td>共线性<\/td><td>XᵀX 病态导致系数不稳<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：矩阵、导数\n<\/li><li>\n后续：岭回归、偏最小二乘\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：先学规划，占赛题一半<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：线性规划<\/a>、<a href=\"#/chapter/ch02\">第 2 章：整数规划<\/a>、<a href=\"#/chapter/ch03\">第 3 章：非线性规划<\/a><br>检查点：能手算 (2,6)=26 与影子价格 1，会用分枝定界<\/li><li class='path-step' id='path-02'><strong>步骤 02：图论：点和点的关系<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：图与网络模型及方法<\/a><br>检查点：手跑 Dijkstra 得 1→5 最短 6，Kruskal 得总权 6<\/li><li class='path-step' id='path-03'><strong>步骤 03：连续与离散的分析工具<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：插值与拟合<\/a>、<a href=\"#/chapter/ch06\">第 6 章：微分方程<\/a>、<a href=\"#/chapter/ch08\">第 8 章：差分方程<\/a><br>检查点：手算三点插值 2.875 与差分平衡点 100<\/li><li class='path-step' id='path-04'><strong>步骤 04：统计：从样本猜总体<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：数理统计<\/a><br>检查点：手算 t=1.414 并正确表述不显著<\/li><li class='path-step' id='path-05'><strong>步骤 05：分类与降维<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章：支持向量机<\/a>、<a href=\"#/chapter/ch10\">第 10 章：多元分析<\/a>、<a href=\"#/chapter/ch11\">第 11 章：偏最小二乘回归分析<\/a><br>检查点：说清聚类与判别、PCA 与因子分析的区别<\/li><li class='path-step' id='path-06'><strong>步骤 06：解空间太大时<\/strong><br>阅读：<a href=\"#/chapter/ch12\">第 12 章：现代优化算法<\/a>、<a href=\"#/chapter/ch13\">第 13 章：数字图像处理<\/a><br>检查点：能设计 GA 五件套与退火温度表<\/li><li class='path-step' id='path-07'><strong>步骤 07：排序、预测与折中<\/strong><br>阅读：<a href=\"#/chapter/ch14\">第 14 章：综合评价与决策方法<\/a>、<a href=\"#/chapter/ch15\">第 15 章：预测方法<\/a>、<a href=\"#/chapter/ch16\">第 16 章：多目标规划和目标规划<\/a><br>检查点：手算加权排序并说明权重灵敏度<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__quiz_ch01__": "<h1>测验：第 1 章：线性规划<\/h1><div class='quiz-item' data-qid='q0101' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 线性规划的可行域一定是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0101' value='0'> 凸多边形或凸多面体<\/label><label class='quiz-opt'><input type='radio' name='q0101' value='1'> 圆形<\/label><label class='quiz-opt'><input type='radio' name='q0101' value='2'> 任意形状<\/label><label class='quiz-opt'><input type='radio' name='q0101' value='3'> 一条曲线<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0102' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 某约束的影子价格为 0，说明？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0102' value='0'> 该资源完全用尽<\/label><label class='quiz-opt'><input type='radio' name='q0102' value='1'> 该资源还有剩余，再增加它不能提高目标值<\/label><label class='quiz-opt'><input type='radio' name='q0102' value='2'> 模型无解<\/label><label class='quiz-opt'><input type='radio' name='q0102' value='3'> 该约束写错了<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0103' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 把 max z 转成 scipy 能接受的形式，需要把目标系数全部________。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：整数规划<\/h1><div class='quiz-item' data-qid='q0201' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 线性规划松弛解为 (2.67, 0)，下列做法正确的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0201' value='0'> 直接四舍五入得 (3, 0)<\/label><label class='quiz-opt'><input type='radio' name='q0201' value='1'> 以松弛解为上界做分枝定界<\/label><label class='quiz-opt'><input type='radio' name='q0201' value='2'> 认为问题无解<\/label><label class='quiz-opt'><input type='radio' name='q0201' value='3'> 把约束改成等式<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0202' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 「A、B 两个项目最多上一个」应写成？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0202' value='0'> y_A + y_B ≤ 1<\/label><label class='quiz-opt'><input type='radio' name='q0202' value='1'> y_A + y_B ≥ 1<\/label><label class='quiz-opt'><input type='radio' name='q0202' value='2'> y_A − y_B ≤ 1<\/label><label class='quiz-opt'><input type='radio' name='q0202' value='3'> y_A × y_B ≤ 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0203' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 指派问题的约束特点是每行之和为 1、每列之和为________。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button c 案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch08__": "<h1>测验：第 8 章：差分方程<\/h1><div class='quiz-item' data-qid='q0801' data-type='single'><p class='quiz-q'><b>Q1.<\/b> xₙ₊₁ = 0.8xₙ + 20 的平衡点是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0801' value='0'> 20<\/label><label class='quiz-opt'><input type='radio' name='q0801' value='1'> 80<\/label><label class='quiz-opt'><input type='radio' name='q0801' value='2'> 100<\/label><label class='quiz-opt'><input type='radio' name='q0801' value='3'> 120<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0802' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 一阶系统稳定的条件是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0802' value='0'> |a| &lt; 1<\/label><label class='quiz-opt'><input type='radio' name='q0802' value='1'> a &gt; 0<\/label><label class='quiz-opt'><input type='radio' name='q0802' value='2'> b = 0<\/label><label class='quiz-opt'><input type='radio' name='q0802' value='3'> |a| &gt; 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0803' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> Leslie 矩阵的主特征值大于 1 表示种群长期________。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch09__": "<h1>测验：第 9 章：支持向量机<\/h1><div class='quiz-item' data-qid='q0901' data-type='single'><p class='quiz-q'><b>Q1.<\/b> SVM 中决定分类边界的点是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0901' value='0'> 所有样本点<\/label><label class='quiz-opt'><input type='radio' name='q0901' value='1'> 支持向量<\/label><label class='quiz-opt'><input type='radio' name='q0901' value='2'> 离边界最远的点<\/label><label class='quiz-opt'><input type='radio' name='q0901' value='3'> 标签为 0 的点<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0902' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 惩罚参数 C 增大，通常会导致？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0902' value='0'> 间隔变宽，偏差增大<\/label><label class='quiz-opt'><input type='radio' name='q0902' value='1'> 间隔变窄，更容易过拟合<\/label><label class='quiz-opt'><input type='radio' name='q0902' value='2'> 模型变成线性回归<\/label><label class='quiz-opt'><input type='radio' name='q0902' value='3'> 支持向量消失<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0903' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 核函数的作用是隐式地把数据映射到________空间。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch10__": "<h1>测验：第 10 章：多元分析<\/h1><div class='quiz-item' data-qid='q1001' data-type='single'><p class='quiz-q'><b>Q1.<\/b> K-means 必须预先确定的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1001' value='0'> 距离度量<\/label><label class='quiz-opt'><input type='radio' name='q1001' value='1'> 聚类数 k<\/label><label class='quiz-opt'><input type='radio' name='q1001' value='2'> 特征个数<\/label><label class='quiz-opt'><input type='radio' name='q1001' value='3'> 样本标签<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q1002' data-type='single'><p class='quiz-q'><b>Q2.<\/b> PCA 中「贡献率」指的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1002' value='0'> 某个样本的解释比例<\/label><label class='quiz-opt'><input type='radio' name='q1002' value='1'> 某主成分特征值占全部特征值之和的比例<\/label><label class='quiz-opt'><input type='radio' name='q1002' value='2'> 分类准确率<\/label><label class='quiz-opt'><input type='radio' name='q1002' value='3'> 变量个数占比<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q1003' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 有标签、要给新样本归类的分析叫________分析。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch11__": "<h1>测验：第 11 章：偏最小二乘回归分析<\/h1><div class='quiz-item' data-qid='q1101' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 多重共线性的典型后果是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1101' value='0'> 模型无法求解<\/label><label class='quiz-opt'><input type='radio' name='q1101' value='1'> 回归系数方差变大、符号可能反常<\/label><label class='quiz-opt'><input type='radio' name='q1101' value='2'> R² 一定下降<\/label><label class='quiz-opt'><input type='radio' name='q1101' value='3'> 样本量自动减少<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q1102' data-type='single'><p class='quiz-q'><b>Q2.<\/b> PLS 与 PCA 的核心区别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1102' value='0'> PLS 不做降维<\/label><label class='quiz-opt'><input type='radio' name='q1102' value='1'> PLS 提取成分时同时考虑与 Y 的相关<\/label><label class='quiz-opt'><input type='radio' name='q1102' value='2'> PCA 只能用于分类<\/label><label class='quiz-opt'><input type='radio' name='q1102' value='3'> PLS 不需要数据<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q1103' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 判断变量重要性常用指标是________值，通常大于 1 视为重要。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch12__": "<h1>测验：第 12 章：现代优化算法<\/h1><div class='quiz-item' data-qid='q1201' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 模拟退火中温度 T 的主要作用是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1201' value='0'> 控制迭代次数<\/label><label class='quiz-opt'><input type='radio' name='q1201' value='1'> 控制接受较差解的概率<\/label><label class='quiz-opt'><input type='radio' name='q1201' value='2'> 决定编码长度<\/label><label class='quiz-opt'><input type='radio' name='q1201' value='3'> 计算适应度<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q1202' data-type='single'><p class='quiz-q'><b>Q2.<\/b> TSP 使用遗传算法时，普通交叉会导致？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1202' value='0'> 收敛过快<\/label><label class='quiz-opt'><input type='radio' name='q1202' value='1'> 路径中出现重复或缺失城市<\/label><label class='quiz-opt'><input type='radio' name='q1202' value='2'> 适应度无法计算<\/label><label class='quiz-opt'><input type='radio' name='q1202' value='3'> 种群规模爆炸<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q1203' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 启发式算法论文必须报告多次独立运行的________，而不只是最好值。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch13__": "<h1>测验：第 13 章：数字图像处理<\/h1><div class='quiz-item' data-qid='q1301' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 灰度化时绿色通道权重最大的原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1301' value='0'> 绿色像素最多<\/label><label class='quiz-opt'><input type='radio' name='q1301' value='1'> 人眼对绿光最敏感<\/label><label class='quiz-opt'><input type='radio' name='q1301' value='2'> 绿色通道噪声最小<\/label><label class='quiz-opt'><input type='radio' name='q1301' value='3'> 计算方便<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q1302' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 椒盐噪声最适合用哪种滤波？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1302' value='0'> 均值滤波<\/label><label class='quiz-opt'><input type='radio' name='q1302' value='1'> 中值滤波<\/label><label class='quiz-opt'><input type='radio' name='q1302' value='2'> 高通滤波<\/label><label class='quiz-opt'><input type='radio' name='q1302' value='3'> 直方图均衡<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q1303' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 3×3 均值滤波窗口中，每个位置的权重是________。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch14__": "<h1>测验：第 14 章：综合评价与决策方法<\/h1><div class='quiz-item' data-qid='q1401' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 成本型指标标准化时应该？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1401' value='0'> 直接除以最大值<\/label><label class='quiz-opt'><input type='radio' name='q1401' value='1'> 用 (max − x)/(max − min)<\/label><label class='quiz-opt'><input type='radio' name='q1401' value='2'> 取对数<\/label><label class='quiz-opt'><input type='radio' name='q1401' value='3'> 平方后归一<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q1402' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 熵权法的权重反映的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1402' value='0'> 指标的业务重要性<\/label><label class='quiz-opt'><input type='radio' name='q1402' value='1'> 指标在方案间的区分度<\/label><label class='quiz-opt'><input type='radio' name='q1402' value='2'> 指标间的相关性<\/label><label class='quiz-opt'><input type='radio' name='q1402' value='3'> 样本量大小<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q1403' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> TOPSIS 通过计算方案到正理想解与负理想解的________来排序。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch15__": "<h1>测验：第 15 章：预测方法<\/h1><div class='quiz-item' data-qid='q1501' data-type='single'><p class='quiz-q'><b>Q1.<\/b> GM(1,1) 适合的数据特征是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1501' value='0'> 大样本、强季节性<\/label><label class='quiz-opt'><input type='radio' name='q1501' value='1'> 小样本、近似指数趋势<\/label><label class='quiz-opt'><input type='radio' name='q1501' value='2'> 状态离散、转移稳定<\/label><label class='quiz-opt'><input type='radio' name='q1501' value='3'> 多变量非线性<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q1502' data-type='single'><p class='quiz-q'><b>Q2.<\/b> ARIMA 中的 d 表示？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1502' value='0'> 差分次数<\/label><label class='quiz-opt'><input type='radio' name='q1502' value='1'> 自回归阶数<\/label><label class='quiz-opt'><input type='radio' name='q1502' value='2'> 移动平均阶数<\/label><label class='quiz-opt'><input type='radio' name='q1502' value='3'> 样本量<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q1503' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 评估预测精度必须做________检验，而不是只看样本内拟合。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch16__": "<h1>测验：第 16 章：多目标规划和目标规划<\/h1><div class='quiz-item' data-qid='q1601' data-type='single'><p class='quiz-q'><b>Q1.<\/b> Pareto 有效解的含义是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1601' value='0'> 所有目标都最大<\/label><label class='quiz-opt'><input type='radio' name='q1601' value='1'> 不存在全面更优的解<\/label><label class='quiz-opt'><input type='radio' name='q1601' value='2'> 加权和最大的解<\/label><label class='quiz-opt'><input type='radio' name='q1601' value='3'> 约束最少的解<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q1602' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 加权和法的主要局限是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q1602' value='0'> 不能处理两个以上目标<\/label><label class='quiz-opt'><input type='radio' name='q1602' value='1'> 非凸前沿上会漏掉中间解<\/label><label class='quiz-opt'><input type='radio' name='q1602' value='2'> 必须用整数规划<\/label><label class='quiz-opt'><input type='radio' name='q1602' value='3'> 权重必须相等<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q1603' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 目标规划中 d⁺ 表示实际值相对目标值的________量。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='线性规划'>线性规划 — 目标与约束都是一次式的优化问题，可行域为凸多边形 <span class=glossary-ref>（第 1 章：线性规划）<\/span><\/li><li data-term='标准型'>标准型 — 目标最大化、约束全为 ≤、变量非负的统一写法 <span class=glossary-ref>（第 1 章：线性规划）<\/span><\/li><li data-term='可行域'>可行域 — 所有满足约束的点组成的集合 <span class=glossary-ref>（第 1 章：线性规划）<\/span><\/li><li data-term='顶点'>顶点 — 两条约束线的交点，线性规划最优解的候选位置 <span class=glossary-ref>（第 1 章：线性规划）<\/span><\/li><li data-term='松弛变量'>松弛变量 — 把 ≤ 约束变成等式的非负辅助变量 <span class=glossary-ref>（第 1 章：线性规划）<\/span><\/li><li data-term='影子价格'>影子价格 — 约束右端项加一单位带来的目标增量，等于对偶变量 <span class=glossary-ref>（第 1 章：线性规划）<\/span><\/li><li data-term='整数规划'>整数规划 — 要求部分或全部变量取整数的规划问题 <span class=glossary-ref>（第 2 章：整数规划）<\/span><\/li><li data-term='0-1 变量'>0-1 变量 — 只取 0 或 1 的变量，用来表示选或不选 <span class=glossary-ref>（第 2 章：整数规划）<\/span><\/li><li data-term='分枝定界'>分枝定界 — 用线性松弛解作上界、逐变量分枝搜索整数解的方法 <span class=glossary-ref>（第 2 章：整数规划）<\/span><\/li><li data-term='指派问题'>指派问题 — n 人做 n 事、每人一事、每事一人的 0-1 规划 <span class=glossary-ref>（第 2 章：整数规划）<\/span><\/li><li data-term='非线性规划'>非线性规划 — 目标或约束含非线性项的优化问题 <span class=glossary-ref>（第 3 章：非线性规划）<\/span><\/li><li data-term='凸函数'>凸函数 — 图像呈碗形、任意两点连线在图像上方的函数 <span class=glossary-ref>（第 3 章：非线性规划）<\/span><\/li><li data-term='凸规划'>凸规划 — 目标凸且可行域凸的规划，局部最优即全局最优 <span class=glossary-ref>（第 3 章：非线性规划）<\/span><\/li><li data-term='kkt 条件'>KKT 条件 — 带约束极值点必须满足的梯度平衡与互补松弛条件 <span class=glossary-ref>（第 3 章：非线性规划）<\/span><\/li><li data-term='互补松弛'>互补松弛 — 约束未起作用时对应乘子为零的条件，λᵢgᵢ = 0 <span class=glossary-ref>（第 3 章：非线性规划）<\/span><\/li><li data-term='二次规划'>二次规划 — 二次目标加线性约束的优化问题 <span class=glossary-ref>（第 3 章：非线性规划）<\/span><\/li><li data-term='罚函数法'>罚函数法 — 把约束违反量加进目标函数、用大系数逼迫可行的办法 <span class=glossary-ref>（第 3 章：非线性规划）<\/span><\/li><li data-term='邻接矩阵'>邻接矩阵 — 用矩阵元素表示两点之间有无边或权值的存图方式 <span class=glossary-ref>（第 4 章：图与网络模型及方法）<\/span><\/li><li data-term='最短路'>最短路 — 两点之间总权值最小的路径 <span class=glossary-ref>（第 4 章：图与网络模型及方法）<\/span><\/li><li data-term='最小生成树'>最小生成树 — 连通全部点且总权值最小的无环子图 <span class=glossary-ref>（第 4 章：图与网络模型及方法）<\/span><\/li><li data-term='最大流'>最大流 — 源点到汇点在不超容量的前提下能输送的最大流量 <span class=glossary-ref>（第 4 章：图与网络模型及方法）<\/span><\/li><li data-term='关键路径'>关键路径 — 项目中总时差为零、决定总工期的工序链 <span class=glossary-ref>（第 4 章：图与网络模型及方法）<\/span><\/li><li data-term='tsp'>TSP — 遍历所有点各一次并回到起点的最短回路问题 <span class=glossary-ref>（第 4 章：图与网络模型及方法）<\/span><\/li><li data-term='插值'>插值 — 构造必须经过全部已知点的曲线 <span class=glossary-ref>（第 5 章：插值与拟合）<\/span><\/li><li data-term='拟合'>拟合 — 不要求穿过点、只要求残差平方和最小的近似 <span class=glossary-ref>（第 5 章：插值与拟合）<\/span><\/li><li data-term='runge 现象'>Runge 现象 — 等距节点上高次插值在区间边缘剧烈振荡 <span class=glossary-ref>（第 5 章：插值与拟合）<\/span><\/li><li data-term='三次样条'>三次样条 — 分段三次多项式且在节点处一二阶导数连续 <span class=glossary-ref>（第 5 章：插值与拟合）<\/span><\/li><li data-term='最小二乘'>最小二乘 — 使残差平方和最小来估计参数的准则 <span class=glossary-ref>（第 5 章：插值与拟合）<\/span><\/li><li data-term='微分方程'>微分方程 — 含未知函数及其导数的方程，描述变化机制 <span class=glossary-ref>（第 6 章：微分方程）<\/span><\/li><li data-term='初值条件'>初值条件 — 给定某时刻状态、决定落在哪条解曲线上的条件 <span class=glossary-ref>（第 6 章：微分方程）<\/span><\/li><li data-term='euler 法'>Euler 法 — 用当前斜率直线外推的一阶数值解法 <span class=glossary-ref>（第 6 章：微分方程）<\/span><\/li><li data-term='rk4'>RK4 — 每步四次求斜率再加权的四阶数值解法 <span class=glossary-ref>（第 6 章：微分方程）<\/span><\/li><li data-term='sir 模型'>SIR 模型 — 把人群分为易感、感染、康复三类的传染病模型 <span class=glossary-ref>（第 6 章：微分方程）<\/span><\/li><li data-term='基本再生数'>基本再生数 — R₀ = β/γ，一个感染者平均传染的人数 <span class=glossary-ref>（第 6 章：微分方程）<\/span><\/li><li data-term='点估计'>点估计 — 用样本统计量直接猜总体参数 <span class=glossary-ref>（第 7 章：数理统计）<\/span><\/li><li data-term='区间估计'>区间估计 — 给出覆盖真值的概率范围的估计方法 <span class=glossary-ref>（第 7 章：数理统计）<\/span><\/li><li data-term='p 值'>p 值 — H₀ 为真时出现当前或更极端结果的概率 <span class=glossary-ref>（第 7 章：数理统计）<\/span><\/li><li data-term='bootstrap'>Bootstrap — 有放回重抽样模拟抽样分布的方法 <span class=glossary-ref>（第 7 章：数理统计）<\/span><\/li><li data-term='方差分析'>方差分析 — 把总变异拆成组间与组内、用 F 检验比较均值的办法 <span class=glossary-ref>（第 7 章：数理统计）<\/span><\/li><li data-term='差分方程'>差分方程 — 描述相邻两期数值关系的方程 <span class=glossary-ref>（第 8 章：差分方程）<\/span><\/li><li data-term='平衡点'>平衡点 — 使下一期等于本期、系统不再变化的取值 <span class=glossary-ref>（第 8 章：差分方程）<\/span><\/li><li data-term='稳定性'>稳定性 — 初值小扰动会随时间消失的性质 <span class=glossary-ref>（第 8 章：差分方程）<\/span><\/li><li data-term='leslie 矩阵'>Leslie 矩阵 — 由繁殖率首行与存活率次对角线构成的种群投影矩阵 <span class=glossary-ref>（第 8 章：差分方程）<\/span><\/li><li data-term='支持向量机'>支持向量机 — 最大化分类间隔的二分类模型 <span class=glossary-ref>（第 9 章：支持向量机）<\/span><\/li><li data-term='间隔'>间隔 — 两类支持向量之间的距离，等于 2/‖w‖（规范化情形） <span class=glossary-ref>（第 9 章：支持向量机）<\/span><\/li><li data-term='支持向量'>支持向量 — 离分类超平面最近、决定边界的样本点 <span class=glossary-ref>（第 9 章：支持向量机）<\/span><\/li><li data-term='软间隔'>软间隔 — 允许个别样本越界的 SVM 形式，由 C 控制容忍度 <span class=glossary-ref>（第 9 章：支持向量机）<\/span><\/li><li data-term='核函数'>核函数 — 隐式把样本映射到高维、只需算内积的函数 <span class=glossary-ref>（第 9 章：支持向量机）<\/span><\/li><li data-term='聚类'>聚类 — 无标签、按相似度把样本分组的分析 <span class=glossary-ref>（第 10 章：多元分析）<\/span><\/li><li data-term='k-means'>K-means — 迭代更新 k 个中心、按最近中心分组的聚类算法 <span class=glossary-ref>（第 10 章：多元分析）<\/span><\/li><li data-term='主成分分析'>主成分分析 — 把变量线性组合成少数互不相关新变量的降维方法 <span class=glossary-ref>（第 10 章：多元分析）<\/span><\/li><li data-term='贡献率'>贡献率 — 某主成分特征值占特征值总和的比例 <span class=glossary-ref>（第 10 章：多元分析）<\/span><\/li><li data-term='判别分析'>判别分析 — 有标签、学习分类规则并给新样本归类的分析 <span class=glossary-ref>（第 10 章：多元分析）<\/span><\/li><li data-term='因子分析'>因子分析 — 假设少数潜在因子生成观测变量的统计模型 <span class=glossary-ref>（第 10 章：多元分析）<\/span><\/li><li data-term='典型相关分析'>典型相关分析 — 找两组变量各自线性组合使相关系数最大 <span class=glossary-ref>（第 10 章：多元分析）<\/span><\/li><li data-term='多维标度'>多维标度 — 只凭距离矩阵反推低维坐标的方法 <span class=glossary-ref>（第 10 章：多元分析）<\/span><\/li><li data-term='多重共线性'>多重共线性 — 自变量之间近似线性相关，导致系数估计不稳定 <span class=glossary-ref>（第 11 章：偏最小二乘回归分析）<\/span><\/li><li data-term='方差膨胀因子'>方差膨胀因子 — 衡量某变量被其余变量解释程度的指标，VIF &gt; 10 视为严重共线 <span class=glossary-ref>（第 11 章：偏最小二乘回归分析）<\/span><\/li><li data-term='偏最小二乘'>偏最小二乘 — 同时考虑 X 变异与 X–Y 相关来提取成分的回归方法 <span class=glossary-ref>（第 11 章：偏最小二乘回归分析）<\/span><\/li><li data-term='vip 值'>VIP 值 — 变量重要性投影，大于 1 通常视为重要变量 <span class=glossary-ref>（第 11 章：偏最小二乘回归分析）<\/span><\/li><li data-term='模拟退火'>模拟退火 — 按 exp(−Δ/T) 概率接受差解的随机搜索算法 <span class=glossary-ref>（第 12 章：现代优化算法）<\/span><\/li><li data-term='遗传算法'>遗传算法 — 用编码、适应度、选择、交叉、变异模拟进化的搜索算法 <span class=glossary-ref>（第 12 章：现代优化算法）<\/span><\/li><li data-term='精英保留'>精英保留 — 每代把最优个体直接复制到下一代，防止退化 <span class=glossary-ref>（第 12 章：现代优化算法）<\/span><\/li><li data-term='灰度化'>灰度化 — 把三通道彩色图按亮度权重合成单通道图 <span class=glossary-ref>（第 13 章：数字图像处理）<\/span><\/li><li data-term='空间滤波'>空间滤波 — 用小窗口在图上滑动做加权和的处理方式 <span class=glossary-ref>（第 13 章：数字图像处理）<\/span><\/li><li data-term='中值滤波'>中值滤波 — 取窗口内中位数作为中心像素值的非线性滤波 <span class=glossary-ref>（第 13 章：数字图像处理）<\/span><\/li><li data-term='直方图均衡'>直方图均衡 — 按累计分布重排灰度、使直方图平坦的对比度增强 <span class=glossary-ref>（第 13 章：数字图像处理）<\/span><\/li><li data-term='lsb 水印'>LSB 水印 — 把信息写入像素最低位的隐蔽水印方法 <span class=glossary-ref>（第 13 章：数字图像处理）<\/span><\/li><li data-term='综合评价'>综合评价 — 多指标标准化加权后排序的方法体系 <span class=glossary-ref>（第 14 章：综合评价与决策方法）<\/span><\/li><li data-term='极差标准化'>极差标准化 — 用 (x−min)/(max−min) 把指标压到 0–1 区间 <span class=glossary-ref>（第 14 章：综合评价与决策方法）<\/span><\/li><li data-term='熵权法'>熵权法 — 按指标区分度分配权重的客观赋权方法 <span class=glossary-ref>（第 14 章：综合评价与决策方法）<\/span><\/li><li data-term='理想解法'>理想解法 — 按到正负理想解的距离排序的 TOPSIS 方法 <span class=glossary-ref>（第 14 章：综合评价与决策方法）<\/span><\/li><li data-term='数据包络分析'>数据包络分析 — 用投入产出比评价决策单元效率的方法 <span class=glossary-ref>（第 14 章：综合评价与决策方法）<\/span><\/li><li data-term='秩和比'>秩和比 — 用秩次合成评价结果、抗异常值的方法 <span class=glossary-ref>（第 14 章：综合评价与决策方法）<\/span><\/li><li data-term='pagerank'>PageRank — 按链接关系迭代给节点打分的排序算法 <span class=glossary-ref>（第 14 章：综合评价与决策方法）<\/span><\/li><li data-term='灰色预测'>灰色预测 — 用累加生成近似指数趋势、适合小样本的预测方法 <span class=glossary-ref>（第 15 章：预测方法）<\/span><\/li><li data-term='级比检验'>级比检验 — GM(1,1) 建模前检查序列是否适合的比值判据 <span class=glossary-ref>（第 15 章：预测方法）<\/span><\/li><li data-term='马尔可夫链'>马尔可夫链 — 下一状态只依赖当前状态、按转移概率演化的过程 <span class=glossary-ref>（第 15 章：预测方法）<\/span><\/li><li data-term='arima'>ARIMA — 自回归差分移动平均模型 <span class=glossary-ref>（第 15 章：预测方法）<\/span><\/li><li data-term='样本外检验'>样本外检验 — 留出末段数据不建模、用来评估预测能力 <span class=glossary-ref>（第 15 章：预测方法）<\/span><\/li><li data-term='mape'>MAPE — 平均绝对百分比误差，衡量相对预测偏差 <span class=glossary-ref>（第 15 章：预测方法）<\/span><\/li><li data-term='多目标规划'>多目标规划 — 同时优化多个可能冲突目标的规划问题 <span class=glossary-ref>（第 16 章：多目标规划和目标规划）<\/span><\/li><li data-term='pareto 有效解'>Pareto 有效解 — 不存在全面更优解的非劣解 <span class=glossary-ref>（第 16 章：多目标规划和目标规划）<\/span><\/li><li data-term='加权和法'>加权和法 — 把多目标按权重合成单一目标求解的方法 <span class=glossary-ref>（第 16 章：多目标规划和目标规划）<\/span><\/li><li data-term='ε 约束法'>ε 约束法 — 把次要目标改成约束、扫描阈值求前沿的方法 <span class=glossary-ref>（第 16 章：多目标规划和目标规划）<\/span><\/li><li data-term='目标规划'>目标规划 — 把目标写成约束、最小化偏差变量的方法 <span class=glossary-ref>（第 16 章：多目标规划和目标规划）<\/span><\/li><li data-term='偏差变量'>偏差变量 — d⁺ 表示超出目标、d⁻ 表示不足目标的辅助变量 <span class=glossary-ref>（第 16 章：多目标规划和目标规划）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：题型识别四问<\/h2>\n<ol><li>\n要不要给出一个方案或数值？要 → 规划类，第 1–3、16 章。\n<\/li><li>\n对象之间有没有连接关系？有 → 图论，第 4 章。\n<\/li><li>\n有没有时间序列或状态演化？有 → 微分方程、差分方程、预测，第 6、8、15 章。\n<\/li><li>\n要不要从一堆对象里分组、排序、挑出重要变量？要 → 多元分析与评价，第 9–11、14 章。\n<\/ol>\n<p>四问的答案可以叠加。真实赛题常常是「先用评价排序，再对前几名做规划」。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n变量全为整数且规模小于 50 → 精确整数规划；大于 50 → 启发式 + 报告近似。\n<\/li><li>\n数据点少于 15 且单调 → 灰色预测或拟合；有明确机制 → 微分方程；长序列有季节性 → ARIMA。\n<\/li><li>\n指标超过 5 个且量纲不一 → 先标准化再评价，不要直接加权求和。\n<\/li><li>\n两个目标明显冲突 → 先画 Pareto 前沿，再让决策者选点，不要自己拍权重。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>把相关当因果<\/strong>：相关系数 0.8 只说明同向变化，写「A 导致 B」需要额外证据。\n<\/li><li>\n<strong>只报一次最好结果<\/strong>：启发式算法跑一次得 17，就宣称最优 17，无法排除运气。\n<\/li><li>\n<strong>用复杂模型掩盖假设缺失<\/strong>：神经网络拟合得再好，也说不出机制，评委要看的是解释。\n<\/li><li>\n<strong>灵敏度写成自我表扬<\/strong>：只写「模型稳健」不给扰动范围和结论变化，等于没写。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>核心公式<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>线性规划标准型<\/td><td>max z = cᵀx，s.t. Ax ≤ b，x ≥ 0<\/td><\/tr><tr><td>影子价格<\/td><td>右端项加 1 引起的最优值增量，等于对偶变量<\/td><\/tr><tr><td>整数规划松弛<\/td><td>连续解是整数解的上界，用于分枝定界剪枝<\/td><\/tr><tr><td>KKT 梯度平衡<\/td><td>∇f + ∑λᵢ∇gᵢ = 0，λᵢgᵢ = 0<\/td><\/tr><tr><td>SVM 间隔<\/td><td>2/‖w‖（支持向量处 wᵀx + b = ±1）<\/td><\/tr><tr><td>最小二乘斜率<\/td><td>∑(xᵢ−x̄)(yᵢ−ȳ) / ∑(xᵢ−x̄)²<\/td><\/tr><tr><td>一阶差分平衡点<\/td><td>x* = b/(1−a)，稳定条件<\/td><td>a<\/td><td>&lt; 1<\/td><\/tr><tr><td>SIR 基本再生数<\/td><td>R₀ = β/γ<\/td><\/tr><tr><td>极差标准化<\/td><td>效益型 (x−min)/(max−min)，成本型 (max−x)/(max−min)<\/td><\/tr><tr><td>熵权<\/td><td>wⱼ = (1−eⱼ)/∑(1−eⱼ)<\/td><\/tr><tr><td>GM(1,1)<\/td><td>x̂¹(k+1) = (x⁰(1) − b/a)e^(−ak) + b/a<\/td><\/tr><tr><td>退火接受概率<\/td><td>P = exp(−Δ/T)<\/td><\/tr><\/tbody><\/table>\n<h2>常用调用<\/h2>\n<table><thead><tr><th>目的<\/th><th>写法<\/th><\/tr><\/thead><tbody><tr><td>线性/整数规划<\/td><td><code>linprog(c, A_ub=A, b_ub=b, bounds=..., method=&quot;highs&quot;)<\/code><\/td><\/tr><tr><td>非线性规划<\/td><td><code>minimize(fun, x0, method=&quot;SLSQP&quot;, constraints=cons)<\/code><\/td><\/tr><tr><td>最短路<\/td><td><code>scipy.sparse.csgraph.dijkstra<\/code><\/td><\/tr><tr><td>最小生成树<\/td><td><code>scipy.sparse.csgraph.minimum_spanning_tree<\/code><\/td><\/tr><tr><td>插值<\/td><td><code>CubicSpline(x, y)<\/code>、<code>interp1d<\/code><\/td><\/tr><tr><td>常微分方程<\/td><td><code>solve_ivp(f, [t0, t1], y0, method=&quot;RK45&quot;)<\/code><\/td><\/tr><tr><td>聚类<\/td><td><code>KMeans(n_clusters=3).fit(X)<\/code><\/td><\/tr><tr><td>主成分<\/td><td><code>PCA(n_components=2).fit_transform(X)<\/code><\/td><\/tr><tr><td>SVM<\/td><td><code>SVC(C=1.0, kernel=&quot;rbf&quot;, gamma=&quot;scale&quot;)<\/code><\/td><\/tr><\/tbody><\/table>\n<h2>检查清单<\/h2>\n<table><thead><tr><th>检查项<\/th><th>标准<\/th><\/tr><\/thead><tbody><tr><td>单位<\/td><td>等号两边量纲一致<\/td><\/tr><tr><td>量级<\/td><td>结果落在常识范围<\/td><\/tr><tr><td>极端值<\/td><td>变量取 0 或上界时公式仍合理<\/td><\/tr><tr><td>结果复现<\/td><td>换个随机种子结果波动可接受<\/td><\/tr><tr><td>论文一致<\/td><td>摘要数字与正文、代码输出三处一致<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function attachMermaidHint(){document.querySelectorAll('.mermaid').forEach(el=>{if(el.dataset.hinted)return;el.dataset.hinted='1';const h=document.createElement('p');h.className='mermaid-hint';h.textContent='（未能加载绘图脚本：当前显示的是图示源码，联网后刷新即为图形）';el.after(h);});}
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  if(window.__mmFailed){attachMermaidHint();return;}
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  s.onerror=()=>{window.__mmFailed=1;attachMermaidHint();};
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
