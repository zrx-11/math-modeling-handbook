ss='quiz-item' data-qid='ch06-q0601' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 要让四级标题带编号，除设置 number 外还必须？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q0601' value='0'> 改 tocdepth<\/label><label class='quiz-opt'><input type='radio' name='ch06-q0601' value='1'> 把 secnumdepth 调到 4 以上<\/label><label class='quiz-opt'><input type='radio' name='ch06-q0601' value='2'> 加载 hyperref<\/label><label class='quiz-opt'><input type='radio' name='ch06-q0601' value='3'> 用 appendix<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch06-q0602' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 摘要页后的正文要重新从第 1 页编号，应该？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q0602' value='0'> 直接 \\setcounter{page}{1}<\/label><label class='quiz-opt'><input type='radio' name='ch06-q0602' value='1'> 用 \\pagenumbering{arabic} 重置<\/label><label class='quiz-opt'><input type='radio' name='ch06-q0602' value='2'> 改 fancyhdr<\/label><label class='quiz-opt'><input type='radio' name='ch06-q0602' value='3'> 重新编译<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch06-q0603' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 代码附录应使用________环境，配合 listings 宏包。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class= ", "type": "single", "question": "2019 年论文的格式是？", "options": ["PDF", "每篇多张 JPG", "Word", "网页"], "answer": 1, "explain": "按序号排列的扫描图，需要拼页阅读。"}, {"id": "ch02-q0203", "chapterId": "ch02", "type": "blank", "question": "推荐的读法是同一道题读________篇，比较不同队的拆法。", "options": [], "answer": "三", "explain": "同题对比能暴露假设与方法的差异，比泛读有效。"}, {"id": "ch03-q0301", "chapterId": "ch03", "type": "single", "question": "三层可借度中，哪一层完全不能借？", "options": ["结构层", "方法层", "数据层", "图表类型"], "answer": 2, "explain": "具体数值与结论必须自己算，照抄属于学术不端。"}, {"id": "ch03-q0302", "chapterId": "ch03", "type": "single", "question": "改造四步的正确顺序是？", "options": ["换表述 → 换对象 → 换约束 → 换检验", "换对象 → 换约束 → 换检验 → 换表述", "换检验 → 换表述 → 换对象 → 换约束", "任意顺序"], "answer": 1, "explain": "先把对象与约束改对，再重跑与检验，最后才是表述。"}, {"id": "ch03-q0303", "chapterId": "ch03", "type": "blank", "question": "借鉴他人模型框架时，应在文中写清来源与________。", "options": [], "answer": "改动", "explain": "交代改了什么，读者才能判断你的贡献在哪。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "读论文六步法的顺序？", "back": "摘要、假设、模型结构、求解、检验、写法摘抄", "tags": ["读论文"]}, {"id": "f02", "chapterId": "ch01", "front": "方法卡必填的五个字段？", "back": "题目类型、核心方法、数据要求、可复用部分、硬伤", "tags": ["读论文"]}, {"id": "f03", "chapterId": "ch01", "front": "判断论文真优秀的最低标准？", "back": "摘要里的数字能在正文找到且前后一致", "tags": ["读论文"]}, {"id": "f04", "chapterId": "ch02", "front": "资料包中五题最齐全的是哪一年？", "back": "2021 年，34 份 PDF，A 到 E 齐全", "tags": ["资料包"]}, {"id": "f05", "chapterId": "ch02", "front": "2019 年论文是什么格式？", "back": "每篇多张按序号排列的 JPG，扫描件", "tags": ["资料包"]}, {"id": "f06", "chapterId": "ch02", "front": "哪一年的论文明显不全？", "back": "2020 年，只有 3 篇", "tags": ["资料包"]}, {"id": "f07", "chapterId": "ch02", "front": "同题读几篇最有效？", "back": "三篇，比较假设与方法的差异", "tags": ["读论文"]}, {"id": "f08", "chapterId": "ch03", "front": "三层可借度分别是什么？", "back": "结构层可借、方法层要改、数据层不能借", "tags": ["借鉴"]}, {"id": "f09", "chapterId": "ch03", "front": "改造论文方法的四步？", "back": "换对象、换约束、重跑数值、换检验与表述", "tags": ["借鉴"]}, {"id": "f10", "chapterId": "ch03", "front": "借鉴说明要写清哪三件事？", "back": "来源、改动、全部数值重新计算", "tags": ["学术规范"]}], "companion": "cases学习伴侣.html"}, "rendered": {"ch01": "<h1>第 1 章：怎么读一篇优秀论文<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：起步册第 4 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用六步法在 40 分钟内拆完一篇 20 页的竞赛论文；\n<\/li><li>\n做出一张「方法卡」，记录这篇论文能复用什么；\n<\/li><li>\n判断一篇论文是真优秀还是只是排版好看。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>读论文不是读文字，是逆向拆解作者的决策链：他为什么这样假设、为什么选这个方法、凭什么说结果可信。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：六步拆解法（难度：基础）<\/h3>\n<ol><li>\n<strong>只读摘要<\/strong>（3 分钟）：抄下每问的方法与关键数字。摘要写不清的论文，后面大概率也乱。\n<\/li><li>\n<strong>列假设<\/strong>（5 分钟）：把假设逐条抄下来，标出哪条是「为了简化」、哪条是「没有数据只好假设」。\n<\/li><li>\n<strong>画模型结构<\/strong>（8 分钟）：用一张图还原「问题 → 变量 → 目标/约束 → 求解」的链条。\n<\/li><li>\n<strong>看求解<\/strong>（10 分钟）：记录用了什么工具、参数怎么定、跑了几次。\n<\/li><li>\n<strong>看检验<\/strong>（8 分钟）：有没有灵敏度、误差分析、与基准方法对比。\n<\/li><li>\n<strong>抄写法<\/strong>（6 分钟）：摘 3 句你以后能用的句式，比如「为避免共线性，将 x₁ 与 x₂ 合并为综合指标」。\n<\/ol>\n<h3>概念 2：方法卡（难度：基础）<\/h3>\n<p>每读一篇，填一张卡：<\/p>\n<table><thead><tr><th>字段<\/th><th>记什么<\/th><\/tr><\/thead><tbody><tr><td>题目类型<\/td><td>优化 / 预测 / 评价 / 分类 / 机理<\/td><\/tr><tr><td>核心方法<\/td><td>一句话，带具体算法名<\/td><\/tr><tr><td>数据要求<\/td><td>需要什么数据、多少量、什么格式<\/td><\/tr><tr><td>可复用部分<\/td><td>模型结构、代码、图表画法<\/td><\/tr><tr><td>硬伤<\/td><td>假设不成立、检验缺失、结论过强<\/td><\/tr><\/tbody><\/table>\n<p>十篇之后，卡片会自己形成一张方法索引，比任何笔记都好用。<\/p>\n<h3>概念 3：辨别真优秀（难度：进阶）<\/h3>\n<p>三个信号说明论文真的好：<\/p>\n<ul><li>\n摘要里的数字能在正文找到，且前后一致；\n<\/li><li>\n假设能对应到具体处理，不是空话；\n<\/li><li>\n有「如果参数变了会怎样」的分析，而不是只报一个最优结果。\n<\/ul>\n<p>两个信号说明只是排版好：图表漂亮但图注不解释结论；模型名词堆得多但每个都只写一句。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[摘要] --&gt; B[假设]\n    B --&gt; C[模型结构]\n    C --&gt; D[求解]\n    D --&gt; E[检验]\n    E --&gt; F[写法摘抄]\n    F --&gt; G[方法卡]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：箭头是单向的，但第 5 步发现检验缺失时，要退回第 3 步看模型是否根本没法检验。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：读论文像拆一台别人的机器，先看说明书（摘要），再拆外壳（假设），最后看零件怎么咬合（模型）。失效边界：机器拆完能装回去，论文拆完你未必能复现——数据与代码常常没给全。\n<\/li><li>\n<strong>实例（可操作）<\/strong>：拿 2021 年 A 题的一篇论文，按六步走一遍，限定 40 分钟。第一遍只填方法卡的空格，不追求看懂每个公式。第二遍再针对你要用的那一部分精读。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为要从第一页读到最后一页——实际上摘要、假设、检验三处就决定这篇值不值得细读。\n<\/li><li>\n别以为公式看不懂就没收获——实际上建模思路、图表组织、结论表述都能直接借。\n<\/li><li>\n别以为获奖论文没有错——实际上不少论文的假设与结论并不匹配，读的时候要挑。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】六步法第一步应该读？<\/h3>\n<ul><li>\nA. 参考文献\n<\/li><li>\nB. 摘要\n<\/li><li>\nC. 附录代码\n<\/li><li>\nD. 模型假设\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：摘要给出方法与关键数字，是最快判断论文质量的位置。<\/p>\n<\/ul>\n<h3>Q2 【单选】方法卡里最该记的是？<\/h3>\n<ul><li>\nA. 作者单位\n<\/li><li>\nB. 可复用的模型结构与数据要求\n<\/li><li>\nC. 页数\n<\/li><li>\nD. 排版软件\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：卡片的目的不是归档，是让自己下次能直接调用。<\/p>\n<\/ul>\n<h3>Q3 【填空】判断论文是否真优秀，关键看假设能否对应到具体________。<\/h3>\n<p><strong>答案<\/strong>：处理（或模型步骤） <strong>解析<\/strong>：空话假设不产生任何建模动作，能落地到步骤的假设才有价值。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n六步：摘要、假设、结构、求解、检验、写法。\n<\/li><li>\n一篇一张方法卡，十篇成一页索引。\n<\/li><li>\n摘要数字与正文一致，是最低可信标准。\n<\/ul>", "ch02": "<h1>第 2 章：2016–2023 论文地图<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：1 小时 | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清手头这份资料包里每年有多少篇、覆盖哪些题；\n<\/li><li>\n按「同题多篇对比」的方式挑出该读的几篇；\n<\/li><li>\n知道哪几年的资料不完整，别白找。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>读论文的正确顺序不是从 2016 读到 2023，而是同一道题读三篇，看不同队怎么拆同一个问题。<\/p>\n<h2>资料包实际内容<\/h2>\n<p>压缩包 <code>2016-2023年——全国大学生数学建模竞赛优秀论文.rar<\/code> 共 767 个条目，按年份分 8 个目录。实际可用论文数量如下（按文件名统计）：<\/p>\n<table><thead><tr><th>年份<\/th><th>论文份数<\/th><th>覆盖题号<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>2016<\/td><td>23 份 PDF<\/td><td>A、B、C、D<\/td><td>含 4 份赛题讲评<\/td><\/tr><tr><td>2017<\/td><td>33 份 PDF<\/td><td>A、B 为主，另有综合展示<\/td><td>含赛题评析<\/td><\/tr><tr><td>2018<\/td><td>19 份 PDF<\/td><td>A、B、C、D<\/td><td>A 题 9 篇，最全<\/td><\/tr><tr><td>2019<\/td><td>4 篇（扫描图）<\/td><td>A、B、C、D、E<\/td><td>每篇为多张 JPG，需拼页阅读<\/td><\/tr><tr><td>2020<\/td><td>3 份 PDF<\/td><td>A、B<\/td><td>仅 3 篇，明显不全<\/td><\/tr><tr><td>2021<\/td><td>34 份 PDF<\/td><td>A、B、C、D、E<\/td><td>五题齐全，最完整的一年<\/td><\/tr><tr><td>2022<\/td><td>9 份 PDF<\/td><td>A、B、C<\/td><td>数量中等<\/td><\/tr><tr><td>2023<\/td><td>13 份 PDF<\/td><td>A、B、C、D、E<\/td><td>五题都有<\/td><\/tr><\/tbody><\/table>\n<p>两点必须知道：<\/p>\n<ul><li>\n<strong>2019 是图片<\/strong>，不是 PDF。要读得先把每篇的 JPG 按序号拼起来，或者用 OCR 工具转文字。\n<\/li><li>\n<strong>2020 只有 3 篇<\/strong>，别以为是自己解压失败。\n<\/ul>\n<h2>挑选策略<\/h2>\n<h3>概念 1：同题三篇（难度：基础）<\/h3>\n<p>选一道你熟悉的题，找同题的三篇论文，分别读摘要与模型结构，比较：<\/p>\n<ul><li>\n变量定义是否一致；\n<\/li><li>\n假设差在哪；\n<\/li><li>\n一个用规划、一个用启发式时，各自怎么解释选择。\n<\/ul>\n<p>三篇读完，你会发现自己对这道题的理解比对十道不同的题更深。<\/p>\n<h3>概念 2：按方法找（难度：进阶）<\/h3>\n<p>如果你正在练某个方法（比如第 14 章的综合评价），去索引里找用了这个方法的所有论文，横向比较它们怎么处理权重、怎么做灵敏度。这比读教材例题更接近实战。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[资料包 8 个年度] --&gt; B{要练什么}\n    B --&gt;|练某一题型| C[同题三篇对比]\n    B --&gt;|练某个方法| D[按方法横向找]\n    B --&gt;|练写作| E[读摘要与检验部分]\n    C --&gt; F[方法卡]\n    D --&gt; F\n    E --&gt; F<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：三条路都落到方法卡。不要为了「读完」而读，为了「用上」而读。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：这份资料包像一间旧书店，2021 那排最齐，2020 那排缺了好几本。先看清库存再借书，比一本本翻快。失效边界：书店能补齐，这份包补不齐，缺的年份只能另找。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：2021 年五题共 34 篇，平均每题约 7 篇。按每题读 3 篇算，读完五题需 15 篇，约 10 小时（每篇 40 分钟）。这是可执行的计划，而不是「把 34 篇都读完」。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为份数多的年份质量就高——实际上论文是择优展示，份数反映的是收录力度。\n<\/li><li>\n别以为扫描件不能读——实际上拼页后完全可读，只是费时间。\n<\/li><li>\n别以为读得越多越好——实际上同题三篇的收获大于十道不同的题各读一篇。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】资料包中五题最齐全的年份是？<\/h3>\n<ul><li>\nA. 2018\n<\/li><li>\nB. 2019\n<\/li><li>\nC. 2021\n<\/li><li>\nD. 2023\n<p><strong>答案<\/strong>：C <strong>解析<\/strong>：2021 年 34 份，A 到 E 五题都有，且为 PDF。<\/p>\n<\/ul>\n<h3>Q2 【单选】2019 年论文的格式是？<\/h3>\n<ul><li>\nA. PDF\n<\/li><li>\nB. 每篇多张 JPG\n<\/li><li>\nC. Word\n<\/li><li>\nD. 网页\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：按序号排列的扫描图，需要拼页阅读。<\/p>\n<\/ul>\n<h3>Q3 【填空】推荐的读法是同一道题读________篇，比较不同队的拆法。<\/h3>\n<p><strong>答案<\/strong>：三 <strong>解析<\/strong>：同题对比能暴露假设与方法的差异，比泛读有效。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n2021 最全、2020 最缺、2019 是图片。\n<\/li><li>\n同题三篇优于十题各一篇。\n<\/li><li>\n按方法横向找，练什么找什么。\n<\/ul>", "ch03": "<h1>第 3 章：从案例到自己的方案<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 1、2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n把一篇论文的方法改造成适合自己题目的版本；\n<\/li><li>\n判断哪些部分可以直接抄结构、哪些必须重做；\n<\/li><li>\n写出「借鉴说明」，避免被判定为抄袭。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>案例能借的是结构和流程，不能借的是数据与结论；改一个参数就当成自己的结果，是竞赛里最危险的动作。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三层可借度（难度：基础）<\/h3>\n<table><thead><tr><th>层级<\/th><th>能借什么<\/th><th>处理方式<\/th><\/tr><\/thead><tbody><tr><td>结构层<\/td><td>章节顺序、图表类型、检验方式<\/td><td>直接照搬，注明参考<\/td><\/tr><tr><td>方法层<\/td><td>模型框架、算法流程<\/td><td>改参数、改约束，重跑<\/td><\/tr><tr><td>数据层<\/td><td>具体数值、结论<\/td><td>一律不能借，必须自己算<\/td><\/tr><\/tbody><\/table>\n<p>结构层借用不算抄袭，方法层要说明改动，数据层照抄就是学术不端。<\/p>\n<h3>概念 2：改造四步（难度：进阶）<\/h3>\n<ol><li>\n<strong>换对象<\/strong>：把论文里的「某工厂」换成你的题里的对象，检查量纲与量级是否还成立。\n<\/li><li>\n<strong>换约束<\/strong>：新题往往多一两条限制，加进去后重解，看结论怎么变。\n<\/li><li>\n<strong>换检验<\/strong>：论文做的是参数灵敏度，你的题可能需要误差分析或与基准方法对比。\n<\/li><li>\n<strong>换表述<\/strong>：结论要用你自己的数据说话，不能保留原文的数字。\n<\/ol>\n<h3>概念 3：借鉴说明怎么写（难度：基础）<\/h3>\n<p>在参考文献或脚注写清：<\/p>\n<pre class=\"lang-text\"><code>本文模型框架参考了 2021 年 A 题某队的分层求解思路，将原模型的两阶段改为三阶段，\n增加了约束 …, 全部数值结果由本文程序重新计算。<\/code><\/pre>\n<p>一句话交代来源与改动，比藏着不说安全得多。<\/p>\n<h3>概念 4：把论文变成代码（难度：进阶）<\/h3>\n<p>论文给的是公式，代码要自己写。顺序：<\/p>\n<ol><li>\n先用小数据手算一遍，确认公式能对上论文里的数字；\n<\/li><li>\n写成脚本，跑同一组小数据，对比结果；\n<\/li><li>\n换成自己的数据，检查量级是否合理；\n<\/li><li>\n保存中间结果，论文里的每个数字都要能追到一个输出文件。\n<\/ol>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[选中一篇论文] --&gt; B[拆结构]\n    B --&gt; C[改对象与约束]\n    C --&gt; D[重跑数值]\n    D --&gt; E[换检验方式]\n    E --&gt; F[写借鉴说明]\n    F --&gt; G[自己的方案]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：注意「重跑数值」在改完约束之后，顺序颠倒就会把旧结论带进新题。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：借论文像借菜谱，步骤可以照做，食材必须换成你家的。失效边界：菜谱换了食材味道会变，模型换了数据结论可能完全反过来，所以必须重算而不是微调。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：某论文的线性规划最优解是 (2, 6)、利润 26。你若把乙产品利润从 3 改成 5，最优解变成 (1, 7)、利润 39，与原文完全不同。直接沿用 26，评委会立刻发现数字对不上你的模型。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为改几个字就不算抄——实际上模型、数据、结论三处任一重合都可能被查。\n<\/li><li>\n别以为方法一样就没有创新——实际上在新约束下重新求解、给出新的灵敏度，本身就是工作。\n<\/li><li>\n别以为引用越少越显得独立——实际上该引不引，反而显得你不知道来源。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】三层可借度中，哪一层完全不能借？<\/h3>\n<ul><li>\nA. 结构层\n<\/li><li>\nB. 方法层\n<\/li><li>\nC. 数据层\n<\/li><li>\nD. 图表类型\n<p><strong>答案<\/strong>：C <strong>解析<\/strong>：具体数值与结论必须自己算，照抄属于学术不端。<\/p>\n<\/ul>\n<h3>Q2 【单选】改造四步的正确顺序是？<\/h3>\n<ul><li>\nA. 换表述 → 换对象 → 换约束 → 换检验\n<\/li><li>\nB. 换对象 → 换约束 → 换检验 → 换表述\n<\/li><li>\nC. 换检验 → 换表述 → 换对象 → 换约束\n<\/li><li>\nD. 任意顺序\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：先把对象与约束改对，再重跑与检验，最后才是表述。<\/p>\n<\/ul>\n<h3>Q3 【填空】借鉴他人模型框架时，应在文中写清来源与________。<\/h3>\n<p><strong>答案<\/strong>：改动 <strong>解析<\/strong>：交代改了什么，读者才能判断你的贡献在哪。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n结构可借、方法要改、数据必重算。\n<\/li><li>\n改造顺序：对象、约束、检验、表述。\n<\/li><li>\n借鉴说明一句话：来源 + 改动 + 全部重算。\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：学会拆论文<\/strong><br>阅读：<a href=\"#/book/cases/chapter/ch01\">第 1 章：怎么读一篇优秀论文<\/a><br>检查点：40 分钟完成一张方法卡<\/li><li class='path-step' id='path-02'><strong>步骤 02：摸清资料包<\/strong><br>阅读：<a href=\"#/book/cases/chapter/ch02\">第 2 章：2016–2023 论文地图<\/a><br>检查点：能按年份与题号挑出三篇同题论文<\/li><li class='path-step' id='path-03'><strong>步骤 03：改成自己的方案<\/strong><br>阅读：<a href=\"#/book/cases/chapter/ch03\">第 3 章：从案例到自己的方案<\/a><br>检查点：写出含来源与改动的借鉴说明<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：怎么读一篇优秀论文<\/h2><div class='quiz-item' data-qid='ch01-q0101' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 六步法第一步应该读？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q0101' value='0'> 参考文献<\/label><label class='quiz-opt'><input type='radio' name='ch01-q0101' value='1'> 摘要<\/label><label class='quiz-opt'><input type='radio' name='ch01-q0101' value='2'> 附录代码<\/label><label class='quiz-opt'><input type='radio' name='ch01-q0101' value='3'> 模型假设<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q0102' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 方法卡里最该记的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q0102' value='0'> 作者单位<\/label><label class='quiz-opt'><input type='radio' name='ch01-q0102' value='1'> 可复用的模型结构与数据要求<\/label><label class='quiz-opt'><input type='radio' name='ch01-q0102' value='2'> 页数<\/label><label class='quiz-opt'><input type='radio' name='ch01-q0102' value='3'> 排版软件<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q0103' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 判断论文是否真优秀，关键看假设能否对应到具体________。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：2016–2023 论文地图<\/h2><div class='quiz-item' data-qid='ch02-q0201' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 资料包中五题最齐全的年份是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q0201' value='0'> 2018<\/label><label class='quiz-opt'><input type='radio' name='ch02-q0201' value='1'> 2019<\/label><label class='quiz-opt'><input type='radio' name='ch02-q0201' value='2'> 2021<\/label><label class='quiz-opt'><input type='radio' name='ch02-q0201' value='3'> 2023<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q0202' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 2019 年论文的格式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q0202' value='0'> PDF<\/label><label class='quiz-opt'><input type='radio' name='ch02-q0202' value='1'> 每篇多张 JPG<\/label><label class='quiz-opt'><input type='radio' name='ch02-q0202' value='2'> Word<\/label><label class='quiz-opt'><input type='radio' name='ch02-q0202' value='3'> 网页<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q0203' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 推荐的读法是同一道题读________篇，比较不同队的拆法。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章：从案例到自己的方案<\/h2><div class='quiz-item' data-qid='ch03-q0301' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 三层可借度中，哪一层完全不能借？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q0301' value='0'> 结构层<\/label><label class='quiz-opt'><input type='radio' name='ch03-q0301' value='1'> 方法层<\/label><label class='quiz-opt'><input type='radio' name='ch03-q0301' value='2'> 数据层<\/label><label class='quiz-opt'><input type='radio' name='ch03-q0301' value='3'> 图表类型<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q0302' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 改造四步的正确顺序是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q0302' value='0'> 换表述 → 换对象 → 换约束 → 换检验<\/label><label class='quiz-opt'><input type='radio' name='ch03-q0302' value='1'> 换对象 → 换约束 → 换检验 → 换表述<\/label><label class='quiz-opt'><input type='radio' name='ch03-q0302' value='2'> 换检验 → 换表述 → 换对象 → 换约束<\/label><label class='quiz-opt'><input type='radio' name='ch03-q0302' value='3'> 任意顺序<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q0303' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 借鉴他人模型框架时，应在文中写清来源与________。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch01__": "<h1>测验：第 1 章：怎么读一篇优秀论文<\/h1><div class='quiz-item' data-qid='ch01-q0101' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 六步法第一步应该读？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q0101' value='0'> 参考文献<\/label><label class='quiz-opt'><input type='radio' name='ch01-q0101' value='1'> 摘要<\/label><label class='quiz-opt'><input type='radio' name='ch01-q0101' value='2'> 附录代码<\/label><label class='quiz-opt'><input type='radio' name='ch01-q0101' value='3'> 模型假设<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q0102' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 方法卡里最该记的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q0102' value='0'> 作者单位<\/label><label class='quiz-opt'><input type='radio' name='ch01-q0102' value='1'> 可复用的模型结构与数据要求<\/label><label class='quiz-opt'><input type='radio' name='ch01-q0102' value='2'> 页数<\/label><label class='quiz-opt'><input type='radio' name='ch01-q0102' value='3'> 排版软件<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q0103' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 判断论文是否真优秀，关键看假设能否对应到具体________。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-acti const CROSS = {"doc1": "<h1>跨书总览：数学建模五阶路线<\/h1>\n<h2>推荐学习顺序<\/h2>\n<table><thead><tr><th>顺序<\/th><th>书<\/th><th>为什么在这个位置<\/th><th>能力里程碑<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>零基础起步（5 章）<\/td><td>先把「建模是什么、要哪些数学、用什么工具、论文长什么样、72 小时怎么排」立起来<\/td><td>能说清一道题从读题到交卷的完整流程<\/td><\/tr><tr><td>2<\/td><td>数学建模算法与应用（16 章）<\/td><td>主干。按原书章序覆盖规划、图论、微分方程、统计、评价、预测<\/td><td>每类题型都能写出模型并求解<\/td><\/tr><tr><td>3<\/td><td>习题与真题演练（4 章）<\/td><td>与第 2 本并行，学完一章就做题<\/td><td>12 道手算题独立完成，能与原书题解对账<\/td><\/tr><tr><td>4<\/td><td>LaTeX 与论文排版（6 章）<\/td><td>等到有内容可写时再学，学完立刻能套模板<\/td><td>独立排出一份含公式、图表、文献的论文<\/td><\/tr><tr><td>5<\/td><td>竞赛论文案例库（3 章）<\/td><td>最后读，用别人的结构检验自己的方案<\/td><td>40 分钟拆完一篇，并能写出借鉴说明<\/td><\/tr><\/tbody><\/table>\n<p>注意顺序上的一个例外：第 4 本不必等到第 2 本全部学完。第 2 本学到第 7 章（数理统计）时，就可以插入 LaTeX 的学习，因为此时你已经有了能写成公式的内容。<\/p>\n<h2>各书定位（一句话）<\/h2>\n<ul><li>\n《零基础起步》：补的是「不知道从哪下手」，不补数学。\n<\/li><li>\n《数学建模算法与应用》：补的是方法与模型库，16 章对应原书 16 章。\n<\/li><li>\n《习题与真题演练》：补的是手感，题目自编、答案可手算复核。\n<\/li><li>\n《LaTeX 与论文排版》：补的是呈现，只讲比赛用得到的六件事。\n<\/li><li>\n《竞赛论文案例库》：补的是眼界，教你怎么借结构而不抄数据。\n<\/ul>\n<h2>学习节奏建议<\/h2>\n<p>八周计划，每周 8–10 小时：<\/p>\n<table><thead><tr><th>周<\/th><th>做什么<\/th><th>产出<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>起步册 5 章 + 主册第 1–3 章<\/td><td>一篇 3 页的练手论文（线性规划题）<\/td><\/tr><tr><td>2<\/td><td>主册第 4–6 章 + 习题册第 1、2 章<\/td><td>图论与微分方程各一道完整题<\/td><\/tr><tr><td>3<\/td><td>主册第 7–8 章 + 习题册第 3 章<\/td><td>统计检验一份完整报告<\/td><\/tr><tr><td>4<\/td><td>主册第 9–12 章<\/td><td>智能算法参数表 + 一次对比实验<\/td><\/tr><tr><td>5<\/td><td>主册第 13–16 章 + 习题册第 4 章<\/td><td>综合评价含权重灵敏度<\/td><\/tr><tr><td>6<\/td><td>LaTeX 六章<\/td><td>把第 1 周的练手论文重排成正式格式<\/td><\/tr><tr><td>7<\/td><td>案例库三章 + 同题三篇<\/td><td>三张方法卡 + 一份改造方案<\/td><\/tr><tr><td>8<\/td><td>综合检验<\/td><td>完整模拟一次 72 小时<\/td><\/tr><\/tbody><\/table>\n<h2>总入口<\/h2>\n<p>打开根目录 <code>index.html<\/code>，按上面的顺序推进。每本书的进度独立保存，互不影响。<\/p>", "doc2": "<h1>跨书概念映射表<\/h1>\n<p>对照五册真实 manifest 生成，章节号可直接跳转。<\/p>\n<table><thead><tr><th>概念<\/th><th>零基础起步<\/th><th>算法与应用<\/th><th>习题演练<\/th><th>LaTeX<\/th><th>案例库<\/th><th>口径差异<\/th><\/tr><\/thead><tbody><tr><td>三要素（目标/决策/约束）<\/td><td>第 1 章<\/td><td>第 1 章<\/td><td>第 1 章<\/td><td>—<\/td><td>—<\/td><td>起步册讲直觉，主册给标准形式<\/td><\/tr><tr><td>可行域与顶点<\/td><td>第 1 章<\/td><td>第 1 章<\/td><td>第 1 章<\/td><td>—<\/td><td>—<\/td><td>主册补了「顶点必为最优」的证明思路<\/td><\/tr><tr><td>整数间隙<\/td><td>—<\/td><td>第 2 章<\/td><td>第 1 章<\/td><td>—<\/td><td>—<\/td><td>习题册用 20.33 与 19 的具体差值说明<\/td><\/tr><tr><td>影子价格<\/td><td>—<\/td><td>第 1 章<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>只在主册展开，习题册以灵敏度形式出现<\/td><\/tr><tr><td>最短路径<\/td><td>—<\/td><td>第 4 章<\/td><td>第 2 章<\/td><td>—<\/td><td>—<\/td><td>主册讲算法原理，习题册练手跑<\/td><\/tr><tr><td>最小生成树<\/td><td>—<\/td><td>第 4 章<\/td><td>第 2 章<\/td><td>—<\/td><td>—<\/td><td>同上<\/td><\/tr><tr><td>稳定性<\/td><td>—<\/td><td>第 6、8 章<\/td><td>第 2 章<\/td><td>—<\/td><td>—<\/td><td>连续系统看特征值，离散系统看倍数模<\/td><\/tr><tr><td>最小二乘<\/td><td>—<\/td><td>第 5 章<\/td><td>第 3 章<\/td><td>—<\/td><td>—<\/td><td>主册讲拟合，习题册给可手算的 1.47 斜率<\/td><\/tr><tr><td>假设检验<\/td><td>—<\/td><td>第 7 章<\/td><td>第 3 章<\/td><td>—<\/td><td>—<\/td><td>习题册强调结论措辞不能写成「证明」<\/td><\/tr><tr><td>共线性与 VIF<\/td><td>—<\/td><td>第 10、11 章<\/td><td>第 3 章<\/td><td>—<\/td><td>—<\/td><td>主册讲主成分与偏最小二乘两条出路<\/td><\/tr><tr><td>标准化<\/td><td>—<\/td><td>第 14 章<\/td><td>第 4 章<\/td><td>—<\/td><td>—<\/td><td>评价前必须统一方向与量纲<\/td><\/tr><tr><td>权重灵敏度<\/td><td>—<\/td><td>第 14 章<\/td><td>第 4 章<\/td><td>—<\/td><td>第 1 章<\/td><td>三处都讲，习题册给出排序翻转的算例<\/td><\/tr><tr><td>启发式算法<\/td><td>—<\/td><td>第 12 章<\/td><td>第 4 章<\/td><td>—<\/td><td>—<\/td><td>主册讲退火与遗传，习题册要求多次运行分布<\/td><\/tr><tr><td>摘要写法<\/td><td>第 4 章<\/td><td>—<\/td><td>—<\/td><td>第 6 章<\/td><td>第 1 章<\/td><td>起步册给骨架，LaTeX 册给排版，案例库给读法<\/td><\/tr><tr><td>编译链<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>第 1、5 章<\/td><td>—<\/td><td>只在 LaTeX 册出现<\/td><\/tr><\/tbody><\/table>\n<h2>使用方式<\/h2>\n<p>先在主册学到某个概念，再到本表看它在其他册的落点：<\/p>\n<ul><li>\n想练手：去习题册对应章；\n<\/li><li>\n想排出来：去 LaTeX 册对应章；\n<\/li><li>\n想看别人怎么做：去案例库。\n<\/ul>", "doc3": "<h1>综合检验建议<\/h1>\n<h2>跨书整合题<\/h2>\n<h3>题 1：从读到写（跨度最大）<\/h3>\n<ul><li>\n涉及：案例库第 1 章、算法与应用第 1、14 章、LaTeX 第 6 章\n<\/li><li>\n要求：读一篇 2021 年 A 题论文，按六步法拆解，然后用你自己的假设重写一份 8 页论文，含三线表、两条公式、五篇参考文献。\n<\/li><li>\n评分要点：\n<ol>\n<li>\n方法卡五字段齐全，硬伤判断有依据；\n<\/li><li>\n新论文的假设与原论文至少两处不同，且改动写清；\n<\/li><li>\n所有数值可追溯到程序输出；\n<\/li><li>\n四级标题编号连续，文献无 <code>[?]<\/code>。\n<\/ol>\n<\/ul>\n<h3>题 2：建模与验证闭环<\/h3>\n<ul><li>\n涉及：算法与应用第 1、14 章，习题演练第 1、4 章\n<\/li><li>\n要求：给一组四方案三指标的数据，先做加权评价，再做权重灵敏度，最后用线性规划给出「在预算约束下如何改方案使综合得分最大」。\n<\/li><li>\n评分要点：\n<ol>\n<li>\n标准化方向统一，权重来源写明；\n<\/li><li>\n灵敏度至少两组权重，排序变化要解释；\n<\/li><li>\n规划模型变量与评价指标对应，约束量纲正确；\n<\/li><li>\n结论区分「评价结论」与「优化结论」。\n<\/ol>\n<\/ul>\n<h3>题 3：预测与决策<\/h3>\n<ul><li>\n涉及：算法与应用第 15、6 章，习题演练第 2、3 章\n<\/li><li>\n要求：用指数平滑预测 6 期需求，再用预测值做库存优化，最后做一次参数扰动，说明策略稳健性。\n<\/li><li>\n评分要点：\n<ol>\n<li>\n预测方法与 α 的选择有依据；\n<\/li><li>\n预测误差有指标（MAE 或 MAPE）；\n<\/li><li>\n优化模型用预测值而非原始值；\n<\/li><li>\n扰动后给出「策略何时失效」的边界。\n<\/ol>\n<\/ul>\n<h3>题 4：全流程模拟（72 小时压缩版）<\/h3>\n<ul><li>\n涉及：起步册第 5 章 + 全部四册\n<\/li><li>\n要求：用 12 小时完成一道往届题：读题 1 小时、建模 4 小时、求解 3 小时、写作 3 小时、检查 1 小时。\n<\/li><li>\n评分要点：\n<ol>\n<li>\n有明确的里程碑时间表并基本执行；\n<\/li><li>\n摘要含每问方法与关键数字；\n<\/li><li>\n至少一处灵敏度或误差分析；\n<\/li><li>\n交卷前按格式清单自查并记录。\n<\/ol>\n<\/ul>\n<h2>进阶路线<\/h2>\n<ol><li>\n<strong>偏理论<\/strong>：算法与应用第 3、9、11 章 → 补凸优化与统计学习教材 → 复现一篇论文的完整推导。\n<\/li><li>\n<strong>偏工程<\/strong>：第 12、13 章 → 学 Python 科学计算栈（numpy/scipy/sklearn）→ 把 16 章的例子全部代码化。\n<\/li><li>\n<strong>偏竞赛<\/strong>：案例库同题三篇 → 组队做三次完整模拟 → 建立自己的模板库与代码库。\n<\/ol>"};
const CROSS_META = [{"key": "doc1", "label": "跨书总览：数学建模五阶路线", "file": "README.md"}, {"key": "doc2", "label": "跨书概念映射表", "file": "跨书概念映射表.md"}, {"key": "doc3", "label": "综合检验建议", "file": "综合检验建议.md"}];
const TABS = [{"key": "cross", "label": "跨书总览"}, {"key": "start", "label": "零基础起步：数学建模的第一本书"}, {"key": "modeling", "label": "数学建模算法与应用（第3版）精讲"}, {"key": "exercises", "label": "习题与真题演练"}, {"key": "latex", "label": "LaTeX 与论文排版"}, {"key": "cases", "label": "竞赛论文案例库"}];
const FIRST_DOC = "doc1";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let cur = {book:'cross', doc:FIRST_DOC, page:'cross'};
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};
function stKey(book,k){ return 'hb:'+book+':'+k; }
function getState(book){
  return { visited: store.get(stKey(book,'visited'))||[], quiz: store.get(stKey(book,'quiz'))||{}, cards: store.get(stKey(book,'cards'))||{} };
}

/* ---------- 路由 ---------- */
function parseHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return {book:'cross', doc:FIRST_DOC, page:'cross'};
  const p = h.split('/');
  if(p[0]==='cross') return {book:'cross', doc:p[1]||FIRST_DOC, page:'cross'};
  if(p[0]==='book'){
    const key=p[1], page=p.slice(2).join('/')||'path';
    return {book:key, page:page, doc:null};
  }
  return {book:'cross', doc:FIRST_DOC, page:'cross'};
}
function pageIdOf(page){
  if(page==='path') return '__path__';
  if(page==='cards') return '__cards__';
  if(page==='glossary') return '__glossary__';
  if(page==='patterns') return '__patterns__';
  if(page==='cheatsheet') return '__cheatsheet__';
  if(page.startsWith('quiz/')) return '__quiz_'+(page.split('/')[1]||'all')+'__';
  if(page.startsWith('chapter/')) return page.slice(8);
  if(page.startsWith('concept/')) return page.slice(8);
  return page;
}

/* ---------- 顶栏 ---------- */
function renderTabs(){
  const el = $('#tabs'); el.innerHTML='';
  TABS.forEach(t=>{
    const b=document.createElement('button');
    b.className='tab'+(cur.book===t.key?' active':'');
    b.textContent=t.label;
    b.onclick=()=>{ location.hash = t.key==='cross' ? '#/cross/'+FIRST_DOC : '#/book/'+t.key+'/path'; };
    el.appendChild(b);
  });
}

/* ---------- 侧栏 ---------- */
function renderNav(){
  const nav=$('#nav'); nav.innerHTML='';
  const add=(label,href,cls)=>{
    const a=document.createElement('a'); a.className='nav-item'+(cls?' '+cls:''); a.href=href; a.textContent=label;
    nav.appendChild(a); return a;
  };
  const sec=t=>{ const d=document.createElement('div'); d.className='nav-sec'; d.textContent=t; nav.appendChild(d); };

  if(cur.book==='cross'){
    sec(CROSS_META.length>1 ? '跨书总览' : '总览');
    CROSS_META.forEach(c=> add(c.label, '#/cross/'+c.key, cur.doc===c.key?'active':''));
    sec('书籍入口');
    META.forEach(m=> add(m.title, '#/book/'+m.key+'/path'));
    updateProgress(0, CROSS_META.length>1 ? '跨书总览' : '总览');
    return;
  }
  const B=BOOKS[cur.book];
  const S=getState(cur.book);
  const man=B.manifest;
  add('学习路径','#/book/'+cur.book+'/path', cur.page==='path'?'active':'');
  sec('章节');
  (man.chapters||[]).forEach(c=>{
    const id=c.id;
    const a=add(c.title, '#/book/'+cur.book+'/chapter/'+id, cur.page==='chapter/'+id?'active':'');
    if(S.visited.includes(cur.book+'/chapter/'+id)){
      const s=document.createElement('span'); s.className='done'; s.textContent='✓'; a.appendChild(s);
    }
  });
  if((man.concepts||[]).length){
    sec('概念');
    man.concepts.forEach(c=>{
      const a=add(c.title, '#/book/'+cur.book+'/concept/'+c.id, cur.page==='concept/'+c.id?'active':'');
      if(S.visited.includes(cur.book+'/concept/'+c.id)){
        const s=document.createElement('span'); s.className='done'; s.textContent='✓'; a.appendChild(s);
      }
    });
  }
  sec('测验');
  add('全部测验','#/book/'+cur.book+'/quiz/all', cur.page==='quiz/all'?'active':'');
  (man.chapters||[]).forEach(c=>{
    if(!((B.quizCoverage||{})[c.id])) return;
    add('测验：'+c.title, '#/book/'+cur.book+'/quiz/'+c.id, cur.page==='quiz/'+c.id?'active':'');
  });
  sec('复习工具');
  add('抽认卡','#/book/'+cur.book+'/cards', cur.page==='cards'?'active':'');
  add('术语表','#/book/'+cur.book+'/glossary', cur.page==='glossary'?'active':'');
  if(B.rendered['__patterns__']) add('模式库','#/book/'+cur.book+'/patterns', cur.page==='patterns'?'active':'');
  if(B.rendered['__cheatsheet__']) add('速查表','#/book/'+cur.book+'/cheatsheet', cur.page==='cheatsheet'?'active':'');
  sec('其他');
  const m=META.find(x=>x.key===cur.book);
  if(m) add('单独打开学习伴侣 ↗', encodeURI(m.companion));

  updateProgressBook(cur.book);
}

/* ---------- 进度 ---------- */
function updateProgress(pct,label){
  $('#progress-fill').style.width=pct+'%';
  $('#progress-label').textContent=label;
}
function updateProgressBook(book){
  const B=BOOKS[book], S=getState(book);
  const chs=(B.manifest.chapters||[]).length;
  const done=(B.manifest.chapters||[]).filter(c=>S.visited.includes(book+'/chapter/'+c.id)).length;
  const pct=chs?Math.round(done/chs*100):0;
  $('#progress-fill').style.width=pct+'%';
  $('#progress-label').textContent=`《${(META.find(x=>x.key===book)||{}).title||book}》 进度 ${pct}% · 已学 ${done}/${chs} 章`;
}

/* ---------- 渲染 ---------- */
function renderCross(){
  const v=$('#view');
  const docId=cur.doc||FIRST_DOC;
  const html=CROSS[docId]||'<div class="empty">页面不存在</div>';
  let pre='';
  if(docId===FIRST_DOC){
    pre = '<h1>学习总手册</h1>'
      + '<p>本学习系统把书点化为一套可跟着走的学习内容。顶部切换书籍，或用下方卡片进入；'
      + '每本书含学习路径、章节精讲、概念页、测验、抽认卡、术语表、模式库与速查表，进度自动保存在本机浏览器。</p>'
      + '<div class="book-cards">'
      + META.map(m=>`<div class="book-card"><h3>${esc(m.title)}</h3>
          <div class="meta">${m.chapters} 章 · ${m.concepts} 概念 · ${m.quizzes} 测验 · ${m.cards} 抽认卡</div>
          <div class="enter"><a href="#/book/${m.key}/path">进入学习 →</a> &nbsp;|&nbsp;
          <a href="${encodeURI(m.companion)}" target="_blank">单独伴侣 ↗</a></div></div>`).join('')
      + '</div>';
  }
  v.innerHTML = pre + html;
  renderMermaid();
}

function renderBook(){
  const B=BOOKS[cur.book];
  if(!B){ $('#view').innerHTML='<div class="empty">书目不存在</div>'; return; }
  const pid=pageIdOf(cur.page);
  let html=B.rendered[pid];
  if(!html){ html='<div class="empty">页面不存在</div>'; }
  const S=getState(cur.book);
  if((cur.page.startsWith('chapter/')||cur.page.startsWith('concept/')) && !S.visited.includes(cur.book+'/'+cur.page)){
    S.visited.push(cur.book+'/'+cur.page);
    store.set(stKey(cur.book,'visited'), S.visited);
  }
  $('#view').innerHTML=html;
  if(cur.page==='cards') initCards();
  if(cur.page==='glossary') initGlossary();
  if(cur.page.startsWith('quiz/')) initQuizzes();
  if(pid==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 测验 ---------- */
function initQuizzes(){
  const B=BOOKS[cur.book];
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn=item.querySelector('.quiz-check');
    if(!btn||item.dataset.inited) return;
    item.dataset.inited='1';
    btn.addEventListener('click',()=>{
      const qid=item.dataset.qid, type=item.dataset.type;
      const q=(B.manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user=null, correct=false, fb='';
      if(type==='single'){
        const sel=item.querySelector('input:checked');
        user=sel?parseInt(sel.value):null;
        correct=(user===q.answer);
        fb=correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      }else if(type==='multi'){
        user=Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans=Array.isArray(q.answer)?q.answer.slice().sort():[q.answer];
        correct=user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb=correct?'✓ 正确':'✗ 错误';
      }else if(type==='blank'){
        const v=(item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        correct=(v===String(q.answer).trim().toLowerCase());
        fb=correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)?q.answer.includes(val):val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed=item.querySelector('.quiz-feedback');
      feed.className='quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent=fb;
      let ex=item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML='解析：'+esc(q.explain||'');
      const S=getState(cur.book);
      const ch=q.chapterId||'__all__';
      if(!S.quiz[ch]) S.quiz[ch]={n:0};
      S.quiz[ch].n+=1;
      store.set(stKey(cur.book,'quiz'), S.quiz);
    });
  });
}
function updatePath(){
  const B=BOOKS[cur.book], S=getState(cur.book);
  document.querySelectorAll('.path-step').forEach(el=>{
    const step=el.id.replace('path-','');
    const s=(B.manifest.learningPath||[]).find(x=>String(x.step)===step);
    if(s && (s.chapterIds||[]).every(c=>S.visited.includes(cur.book+'/chapter/'+c))){
      el.classList.add('passed');
      if(!el.querySelector('.ck')){ const sp=document.createElement('span'); sp.className='ck done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx=0, cardList=[];
function initCards(){
  const B=BOOKS[cur.book];
  const cards=B.manifest.flashcards||[];
  cardList=cards.slice(); cardIdx=0;
  if(!$('#card-done')){
    const d=document.createElement('div'); d.id='card-done'; d.className='empty';
    d.style.display='none'; d.textContent='本组卡片已全部复习完 🎉';
    const st=$('#card-stage'); if(st) st.appendChild(d);
  }
  const sel=$('#card-filter'); if(!sel) return;
  sel.innerHTML='<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c;
    const ch=(B.manifest.chapters||[]).find(x=>x.id===c);
    o.textContent=ch?ch.title:c; sel.appendChild(o);
  });
  sel.onchange=()=>{ const v=sel.value; cardList=v?cards.filter(c=>c.chapterId===v):cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick=()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick=()=>markCard(true);
  $('#card-again-btn').onclick=()=>markCard(false);
  showCard();
}
function showCard(){
  const S=getState(cur.book);
  updateCardCounts();
  const done=$('#card-done'), fc=$('#flashcard');
  if(cardIdx>=cardList.length){
    if(done) done.style.display=''; if(fc) fc.style.display='none'; return;
  }
  if(done) done.style.display='none'; if(fc) fc.style.display='';
  const c=cardList[cardIdx];
  document.querySelector('.fc-front').textContent=c.front;
  document.querySelector('.fc-back').textContent=c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const S=getState(cur.book);
  const c=cardList[cardIdx]; if(!c) return;
  S.cards[c.id]=known?'known':'again';
  store.set(stKey(cur.book,'cards'), S.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const S=getState(cur.book);
  const known=Object.values(S.cards).filter(v=>v==='known').length;
  const again=Object.values(S.cards).filter(v=>v==='again').length;
  const k=$('#card-known'), a=$('#card-again'), l=$('#card-left');
  if(k) k.textContent=known; if(a) a.textContent=again; if(l) l.textContent=Math.max(0,cardList.length-cardIdx);
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input=$('#glossary-filter');
  if(!input||input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput=()=>{
    const v=input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display=(!v||li.dataset.term.includes(v))?'':'none';
    });
  };
}

/* ---------- 全局搜索 ---------- */
let searchIdx=null;
function buildSearch(){
  if(searchIdx) return searchIdx;
  searchIdx=[];
  META.forEach(m=>{
    const B=BOOKS[m.key];
    Object.entries(B.rendered).forEach(([pid,html])=>{
      if(pid.startsWith('__')) return;
      const text=html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
      searchIdx.push({book:m.key, page:pdfToPage(pid, B), text, label:m.title});
    });
  });
  Object.entries(CROSS).forEach(([k,html])=>{
    const meta=CROSS_META.find(x=>x.key===k)||{};
    searchIdx.push({book:'cross', page:'cross/'+k, text:html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' '), label:(meta.label||'总览')});
  });
  return searchIdx;
}
function pdfToPage(pid, B){
  if(pid.startsWith('__quiz_')) return 'quiz/'+pid.replace('__quiz_','').replace('__','');
  if(pid==='__path__') return 'path';
  if(pid==='__cards__') return 'cards';
  if(pid==='__glossary__') return 'glossary';
  if(pid==='__patterns__') return 'patterns';
  if(pid==='__cheatsheet__') return 'cheatsheet';
  const ch=(B.manifest.chapters||[]).find(c=>c.id===pid);
  if(ch) return 'chapter/'+pid;
  return 'concept/'+pid;
}
$('#q').addEventListener('input', e=>{
  const v=e.target.value.trim().toLowerCase();
  if(!v){ route(); return; }
  const hits=buildSearch().filter(p=>p.text.toLowerCase().includes(v)).slice(0,40);
  $('#view').innerHTML='<h1>搜索结果：'+esc(v)+'</h1>'+
    (hits.length? hits.map(h=>{
      const href=h.book==='cross'?('#/cross/'+(h.page.split('/')[1]||FIRST_DOC)):('#/book/'+h.book+'/'+h.page);
      return `<div class="search-hit"><a href="${href}">${esc(h.label)}</a><br><span style="color:var(--muted);font-size:13px">${esc(h.text.slice(0,200))}</span></div>`;
    }).join('') : '<div class="empty">未找到相关内容，试试章节名 / 概念名 / 术语。</div>');
});

/* ---------- Mermaid ---------- */
let mermaidState='idle';
function attachMermaidHint(){document.querySelectorAll('.mermaid').forEach(el=>{if(el.dataset.hinted)return;el.dataset.hinted='1';const h=document.createElement('p');h.className='mermaid-hint';h.textContent='（未能加载绘图脚本：当前显示的是图示源码，联网后刷新即为图形）';el.after(h);});}
function renderMermaid(){
  const els=Array.from(document.querySelectorAll('.mermaid')).filter(el=>!el.dataset.rendered);
  if(!els.length) return;
  if(mermaidState==='failed'){ attachMermaidHint(); return; }
  const run=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme:document.body.dataset.theme==='dark'?'dark':'default'});
    els.forEach((el,idx)=>{ try{
      const out=mermaid.render('mm'+Date.now()+idx, el.textContent);
      if(out && typeof out.then==='function'){
        out.then(r=>{ el.innerHTML=r.svg; el.dataset.rendered='1'; }).catch(()=>{ el.dataset.rendered='0'; });
      } else { el.innerHTML=out; el.dataset.rendered='1'; }
    } catch(e){ el.dataset.rendered='0'; } });
  }catch(e){} };
  if(window.mermaid){ run(); return; }
  if(mermaidState==='loading') return;
  mermaidState='loading';
  const srcs=['https://registry.npmmirror.com/mermaid/10.9.1/files/dist/mermaid.min.js',
              'https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js',
              'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js'];
  let si=0;
  const tryNext=()=>{
    if(si>=srcs.length){ mermaidState='failed'; attachMermaidHint(); return; }
    const s=document.createElement('script');
    s.src=srcs[si++];
    s.onload=()=>{ mermaidState='loaded'; run(); };
    s.onerror=tryNext;
    document.head.appendChild(s);
  };
  tryNext();
}

/* ---------- 主题 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d=document.body.dataset.theme==='dark';
  document.body.dataset.theme=d?'':'dark';
  themeBtn.textContent=d?'🌙 深色':'☀️ 浅色';
};

/* ---------- 启动 ---------- */
function route(){
  cur=parseHash();
  renderTabs();
  renderNav();
  if(cur.book==='cross') renderCross(); else renderBook();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=820) sb.classList.remove('open'); });
})();
route();
</script>
