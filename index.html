<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学习总手册</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--border);padding:10px 18px}
.brand{font-size:17px;font-weight:700;display:inline-block;margin-right:18px}
.brand span{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
.tabs{display:inline-flex;gap:6px;flex-wrap:wrap;vertical-align:middle}
.tab{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:999px;padding:4px 14px;cursor:pointer;font-size:13px}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.hdr-right{float:right;display:flex;gap:8px;align-items:center;margin-top:2px}
#q{width:260px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.layout{display:flex;min-height:calc(100vh - 60px)}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:6px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
#progress-label{font-size:12px;color:var(--muted);margin-bottom:8px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.book-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin:16px 0}
.book-card{border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--panel)}
.book-card h3{margin:0 0 6px;font-size:16px}
.book-card .meta{font-size:13px;color:var(--muted);margin-bottom:10px}
.book-card .enter{font-size:13px}
.empty{color:var(--muted);padding:20px 0}
@media print{header,.sidebar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:820px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none}.sidebar.open #nav{display:block}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:16px}
  .hdr-right{float:none;margin-top:8px}#q{width:100%}}
</style>
</head>
<body>
<header>
  <span class="brand">学习总手册<span>点化学习系统 · 统一入口</span></span>
  <span class="tabs" id="tabs"></span>
  <span class="hdr-right">
    <input id="q" type="search" placeholder="全书搜索…">
    <button id="theme-btn">🌙 深色</button>
  </span>
</header>
<div class="layout">
  <aside class="sidebar">
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="progress-label">进度 0%</div>
    <nav id="nav"></nav>
  </aside>
  <main><div id="view" class="page"></div></main>
</div>
<script>
const BOOKS = {"start":{"manifest": {"slug": "start", "title": "零基础起步：数学建模的第一本书", "subtitle": "把问题翻成式子，再把结果翻回人话", "book": {"title": "数学建模入门讲义（自编）", "author": "点化整理", "source": ["数学建模算法与应用（第3版）", "数学建模算法与应用习题解答（第3版）"]}, "audience": "零基础，大二理工科", "goal": "能独立走完建模五步并写出带数字的论文摘要", "learningPath": [{"step": "01", "title": "先弄清建模是什么", "chapterIds": ["ch01"], "checkpoint": "能不看笔记讲出五步流程与三把检验尺"}, {"step": "02", "title": "补齐够用的数学", "chapterIds": ["ch02"], "checkpoint": "能把一个新问题归到变化/累积/线性/随机四类之一"}, {"step": "03", "title": "跑通第一个求解器", "chapterIds": ["ch03"], "checkpoint": "本地跑出 (2, 6) 与 26，并能读 status"}, {"step": "04", "title": "学会写论文骨架", "chapterIds": ["ch04"], "checkpoint": "把一段空话摘要改写成带数字的四段"}, {"step": "05", "title": "排出作战流程", "chapterIds": ["ch05"], "checkpoint": "写出自己队 72 小时时间表与交卷清单"}], "chapters": [{"id": "ch01", "title": "第 1 章：数学建模到底在做什么", "file": "chapters/ch01-what-is-modeling.md", "difficulty": 1}, {"id": "ch02", "title": "第 2 章：够用的数学预备", "file": "chapters/ch02-math-prep.md", "difficulty": 1}, {"id": "ch03", "title": "第 3 章：计算工具与求解器", "file": "chapters/ch03-tools.md", "difficulty": 1}, {"id": "ch04", "title": "第 4 章：论文的骨架", "file": "chapters/ch04-paper-skeleton.md", "difficulty": 2}, {"id": "ch05", "title": "第 5 章：72 小时作战流程", "file": "chapters/ch05-72h-workflow.md", "difficulty": 1}], "concepts": [{"id": "c01", "title": "假设", "file": "concepts/jia-she.md", "chapterIds": ["ch01", "ch04"]}, {"id": "c02", "title": "灵敏度分析", "file": "concepts/ling-min-du.md", "chapterIds": ["ch04", "ch03"]}, {"id": "c03", "title": "三要素", "file": "concepts/san-yao-su.md", "chapterIds": ["ch01", "ch05"]}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "glossary": [{"term": "数学模型", "def": "用数学符号描述现实对象的一部分关系，是简化过的地图", "chapterId": "ch01"}, {"term": "决策变量", "def": "建模者能拍板的量，用字母表示", "chapterId": "ch01"}, {"term": "目标函数", "def": "把想要的结果写成决策变量的表达式", "chapterId": "ch01"}, {"term": "约束条件", "def": "决策变量必须满足的等式或不等式边界", "chapterId": "ch01"}, {"term": "假设", "def": "明确写下被忽略的因素，决定模型适用范围", "chapterId": "ch01"}, {"term": "灵敏度分析", "def": "改变参数看结论变化幅度，判断模型是否脆弱", "chapterId": "ch04"}, {"term": "导数", "def": "函数在某点的瞬时变化率，位移求导得速度", "chapterId": "ch02"}, {"term": "定积分", "def": "把连续变化累加成总量的运算，与导数互逆", "chapterId": "ch02"}, {"term": "最小二乘", "def": "方程多于未知数时，求误差平方和最小的解", "chapterId": "ch02"}, {"term": "特征值", "def": "矩阵作用于某向量时只把它按比例拉伸的倍数", "chapterId": "ch02"}, {"term": "期望", "def": "随机变量按概率加权的平均值", "chapterId": "ch02"}, {"term": "方差", "def": "随机变量偏离期望的平均平方距离", "chapterId": "ch02"}, {"term": "总体与样本", "def": "想研究的全部对象与实际拿到的部分，推断永远带误差", "chapterId": "ch02"}, {"term": "求解器", "def": "把模型按矩阵格式喂进去、直接返回数值解的软件函数", "chapterId": "ch03"}, {"term": "不可行", "def": "求解器 status=2，约束互相矛盾，无解", "chapterId": "ch03"}, {"term": "无界", "def": "求解器 status=3，目标值可以无限优化下去，通常是漏了上界约束", "chapterId": "ch03"}, {"term": "摘要四段式", "def": "任务、方法、数字结果、结论与推广", "chapterId": "ch04"}, {"term": "符号说明", "def": "覆盖全文符号的表，缺一行就会让推导失去可信度", "chapterId": "ch04"}], "quizzes": [{"id": "ch01-q0101", "chapterId": "ch01", "type": "single", "question": "下列哪一项不属于数学模型的三要素？", "options": ["决策变量", "目标函数", "计算软件", "约束条件"], "answer": 2, "explain": "软件只是求解工具，换成手算或别的语言，模型本身不变。三要素是变量、目标、约束。"}, {"id": "ch01-q0102", "chapterId": "ch01", "type": "single", "question": "某模型算出「每天利润 26 小时」，最先应该怀疑的是？", "options": ["求解程序写错了", "目标函数的量纲搞错了", "约束条件太少", "数据年份太旧"], "answer": 1, "explain": "利润的单位不可能是小时。单位对不上，说明目标函数把某个量当成了别的东西，这是量纲检验的典型信号。"}, {"id": "ch01-q0103", "chapterId": "ch01", "type": "blank", "question": "建模流程中，检验发现结果与现实不符时，应当退回的步骤是________。", "options": [], "answer": "假设（或模型建立）", "explain": "结果荒谬通常源于假设脱离现实，比如把「机器每天可用 10 小时」写成「每台机器 10 小时」。退回改假设，比在错误假设上硬调参数有效。"}, {"id": "ch02-q0201", "chapterId": "ch02", "type": "single", "question": "题目问「污染物浓度每小时下降多少」，模型里最可能出现的是？", "options": ["积分", "导数", "矩阵特征值", "方差"], "answer": 1, "explain": "「每小时下降多少」问的是变化率，对应导数；写成微分方程就是 dc/dt = −kc 这一类。"}, {"id": "ch02-q0202", "chapterId": "ch02", "type": "single", "question": "方程个数多于未知数时，最小二乘在做什么？", "options": ["随便挑一个方程求解", "找使整体误差平方和最小的解", "把多余方程删掉", "求矩阵的特征值"], "answer": 1, "explain": "方程多于未知数通常无精确解，最小二乘转而在所有候选解里挑总误差平方和最小的那个，这正是拟合与回归的共同底座。"}, {"id": "ch02-q0203", "chapterId": "ch02", "type": "blank", "question": "判断系数矩阵是否可逆，最直接的办法是看它的________是否为零。", "options": [], "answer": "行列式", "explain": "行列式非零则矩阵可逆、方程组有唯一解；为零则可能无解或有无穷多解，需要看秩。"}, {"id": "ch03-q0301", "chapterId": "ch03", "type": "single", "question": "用 scipy 求最大化问题，目标函数系数应该怎么写？", "options": ["原样写正数", "全部取负", "取倒数", "加一个常数"], "answer": 1, "explain": "`linprog` 只做最小化，最大化 z 等价于最小化 −z，所以系数取负，最后把 `res.fun` 再取负还原。"}, {"id": "ch03-q0302", "chapterId": "ch03", "type": "single", "question": "下列哪件事适合自己写循环，而不是调现成函数？", "options": ["解线性方程组", "三次样条插值", "模拟退火搜索最优参数", "计算协方差矩阵"], "answer": 2, "explain": "模拟退火的降温策略、邻域生成、接受概率都要你自己定，没有通用函数可套。"}, {"id": "ch03-q0303", "chapterId": "ch03", "type": "blank", "question": "求解器返回 `status=2`，含义是问题________。", "options": [], "answer": "不可行", "explain": "2 表示找不到满足全部约束的解，通常是约束写矛盾了，比如同时要求 x ≥ 5 和 x ≤ 3。"}, {"id": "ch04-q0401", "chapterId": "ch04", "type": "single", "question": "摘要里最不该出现的是？", "options": ["具体的最优方案数值", "所用模型名称", "「本文运用先进算法取得良好效果」", "关键误差指标"], "answer": 2, "explain": "这句话不含任何可核查信息，删掉不影响理解，属于典型的凑字数。"}, {"id": "ch04-q0402", "chapterId": "ch04", "type": "single", "question": "灵敏度分析的目的是？", "options": ["让论文看起来更复杂", "检验结论对参数扰动的稳健性", "提高模型的拟合精度", "减少计算量"], "answer": 1, "explain": "改参数看结论变化幅度，判断模型是否脆弱，这是灵敏度分析唯一的用途。"}, {"id": "ch04-q0403", "chapterId": "ch04", "type": "blank", "question": "论文中图题应放在图的________方，表题应放在表的________方。", "options": [], "answer": "下；上", "explain": "这是排版规范，也是评委会一眼看出的格式分。LaTeX 里 `\\caption` 位置放错就会颠倒，第 03 册会讲怎么调。"}, {"id": "ch05-q0501", "chapterId": "ch05", "type": "single", "question": "时间不够时，最先应该砍掉的是？", "options": ["摘要", "第三问的精细度", "模型检验", "图表编号"], "answer": 1, "explain": "第三问做浅一点仍能得分，摘要和检验缺失是结构性失分，图表编号错是格式硬伤。"}, {"id": "ch05-q0502", "chapterId": "ch05", "type": "single", "question": "三人分工中，对模型有最终解释权的应该是？", "options": ["编程手", "写作手", "建模手", "谁有空谁定"], "answer": 2, "explain": "两套模型打架时必须有一个人拍板，否则正文和代码会各说各话。"}, {"id": "ch05-q0503", "chapterId": "ch05", "type": "blank", "question": "交卷前必须核对：摘要里的每个数字都要能在________找到出处。", "options": [], "answer": "正文", "explain": "摘要数字与正文不一致，是评委最容易发现的硬伤，通常意味着后期改过结果但没同步摘要。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "数学模型的三要素是哪三个？", "back": "决策变量、目标函数、约束条件", "tags": ["基础", "建模流程"]}, {"id": "f02", "chapterId": "ch01", "front": "模型和现实是什么关系？", "back": "模型是简化过的地图，有用恰恰因为它不全；丢掉哪些细节是要主动决定的", "tags": ["基础", "心智模型"]}, {"id": "f03", "chapterId": "ch01", "front": "建模五步的顺序？", "back": "提出问题 → 做出假设 → 建立模型 → 求解 → 检验，检验不通过退回改假设", "tags": ["基础", "流程"]}, {"id": "f04", "chapterId": "ch01", "front": "检验结果的三把尺？", "back": "量纲是否一致、量级是否合理、极端值下公式是否还成立", "tags": ["检验"]}, {"id": "f05", "chapterId": "ch02", "front": "导数在建模里负责什么？", "back": "变化率与极值；极值点处导数为零，是非线性规划的理论起点", "tags": ["数学预备"]}, {"id": "f06", "chapterId": "ch02", "front": "积分在建模里负责什么？", "back": "把连续变化累加成总量，是导数的逆操作", "tags": ["数学预备"]}, {"id": "f07", "chapterId": "ch02", "front": "方程数多于未知数时怎么办？", "back": "用最小二乘，求使误差平方和最小的解", "tags": ["数学预备", "拟合"]}, {"id": "f08", "chapterId": "ch02", "front": "特征值在建模里的两个用处？", "back": "判断差分方程或微分方程系统是否稳定；主成分分析里决定保留几个成分", "tags": ["数学预备"]}, {"id": "f09", "chapterId": "ch02", "front": "相关与因果的区别？", "back": "相关只说两个量一起变，因果要求排除第三变量与反向影响，需实验或领域知识支撑", "tags": ["统计", "常见错误"]}, {"id": "f10", "chapterId": "ch03", "front": "scipy 求最大化问题怎么处理？", "back": "目标系数全部取负转成最小化，结果再取负还原", "tags": ["工具"]}, {"id": "f11", "chapterId": "ch03", "front": "求解器 status=2 表示什么？", "back": "不可行，约束互相矛盾，找不到满足全部约束的解", "tags": ["工具", "排错"]}, {"id": "f12", "chapterId": "ch03", "front": "哪类计算必须自己写循环？", "back": "算法本身要迭代（退火、遗传）、中间过程要存数据、结果要逐参数解释的三类", "tags": ["工具"]}, {"id": "f13", "chapterId": "ch04", "front": "摘要四段式？", "back": "任务背景、方法、带数字的结果、结论与推广", "tags": ["写作"]}, {"id": "f14", "chapterId": "ch04", "front": "灵敏度分析写什么？", "back": "把参数上下调 10% 或扫一个区间，说明结论变不变、拐点在哪", "tags": ["写作", "检验"]}, {"id": "f15", "chapterId": "ch04", "front": "论文里图题和表题的位置？", "back": "图题在图下方，表题在表上方", "tags": ["写作", "排版"]}, {"id": "f16", "chapterId": "ch05", "front": "72 小时里最先砍哪块？", "back": "第三问的精细度，其次灵敏度；摘要、检验、格式不能砍", "tags": ["竞赛流程"]}, {"id": "f17", "chapterId": "ch05", "front": "三人分工的核心要求？", "back": "建模手有最终解释权，写作手第一天就动笔，每天两次对齐", "tags": ["竞赛流程"]}, {"id": "f18", "chapterId": "ch05", "front": "交卷前六条检查？", "back": "摘要数字有出处、符号表全覆盖、图表编号与单位、代码可跑、PDF 无乱码、文件名与压缩包合规", "tags": ["竞赛流程", "检查清单"]}], "companion": "start学习伴侣.html"}, "rendered": {"ch01": "<h1>第 1 章：数学建模到底在做什么<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用「三要素」说清一个实际问题该建什么模型；\n<\/li><li>\n自己独立走完「问题 → 假设 → 模型 → 求解 → 检验」五步，并说出每步最容易错的地方；\n<\/li><li>\n分清数学题和建模题，知道为什么后者没有标准答案。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>建模是把一句人话问题翻译成一组带字母的式子，再用算出来的数字反过来回答那句人话。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：数学模型（难度：基础）<\/h3>\n<p><strong>数学模型<\/strong>：用数学符号描述现实对象的一部分关系。它不是现实本身，是一张简化过的地图。<\/p>\n<p>地图和地面的关系，就是模型和现实的关系：地图有用，恰恰因为它不全。一张 1:1 的地图没人看得懂。建模的第一件手艺，是决定哪些细节丢掉。<\/p>\n<p>这个类比有个失效边界：地图的简化是空间上的，模型的简化可能丢掉的是因果关系。地面上的近路地图上看不出来，模型里漏掉的一个变量也可能让结论全错。<\/p>\n<h3>概念 2：三要素（难度：基础）<\/h3>\n<p>任何一个模型都能拆成三块：<\/p>\n<ol><li>\n<strong>决策变量<\/strong>：你能拍板的东西，用字母表示。比如每天生产甲机床 x₁ 台、乙机床 x₂ 台。\n<\/li><li>\n<strong>目标函数<\/strong>：你想要的结果，写成变量的表达式。比如利润 z = 4x₁ + 3x₂，单位千元。\n<\/li><li>\n<strong>约束条件<\/strong>：你不能越过的边界，写成含变量的等式或不等式。比如 A 机器每天只有 10 小时，2x₁ + x₂ ≤ 10。\n<\/ol>\n<p>三块凑齐，模型才闭合。缺目标函数，你不知道往哪优化；缺约束，答案会跑到无穷大；缺变量的正负范围，会算出「生产 −3 台机床」。<\/p>\n<h3>概念 3：五步流程（难度：基础）<\/h3>\n<ol><li>\n<strong>提出问题<\/strong>：把口语问题改写成「在什么条件下，让什么量达到什么」。\n<\/li><li>\n<strong>做出假设<\/strong>：明确写下你忽略了什么。假设不是免责声明，它决定了模型能用到哪。\n<\/li><li>\n<strong>建立模型<\/strong>：定变量、写目标、列约束。\n<\/li><li>\n<strong>求解<\/strong>：手算小例子，或用程序算大例子。\n<\/li><li>\n<strong>检验<\/strong>：拿结果回到现实，看它荒不荒谬。\n<\/ol>\n<p>这五步不是一个方向走到底的流水线。检验发现结果荒唐，要退回第 2 步改假设。建模的时间，大半花在这条回路上。<\/p>\n<h3>概念 4：检验的三把尺（难度：基础）<\/h3>\n<ul><li>\n<strong>量纲<\/strong>：等号两边单位必须一样。算出「利润 26 小时」，一定错了。\n<\/li><li>\n<strong>量级<\/strong>：结果要落在常识范围内。算出某城市一年用水 3 亿吨，先查这个城市多少人。\n<\/li><li>\n<strong>极端值<\/strong>：把变量推到边界看公式还合不合理。产量为 0 时利润该是 0，如果你算出负数固定成本以外的怪值，说明假设漏了项。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[现实问题] --&gt; B[抽象与假设]\n    B --&gt; C[建立模型]\n    C --&gt; D[求解计算]\n    D --&gt; E[结果检验]\n    E --&gt;|不合理| B\n    E --&gt;|合理| F[给出结论与建议]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：注意只有一条回头箭头。真实建模里，回头可能发生在任意两步：求解失败要回模型，数据不够要回假设。图里画成一条，是为了让你记住检验不是走过场，它可以推翻前面所有工作。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：建模像给陌生人画路线图。你不能把每条小巷都画上，要问对方「你骑车还是开车」，再决定画哪几条路。类比失效处：路线图不会骗人，模型会因为假设错误给出看似精确的错答案。\n<\/li><li>\n<strong>实例（可自己核算）<\/strong>：估算一间长 12 米、宽 8 米的教室能坐多少人。面积 96 平方米。设每人座位加桌面占 1.2 平方米，走道与讲台占掉三成面积，可用面积 96 × 0.7 = 67.2 平方米，人数 67.2 ÷ 1.2 = 56 人。若改成报告厅式连排座，每人 0.6 平方米，则 112 人。同一个房间，换个假设，答案差一倍——这就是假设的份量。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为建模就是套公式——实际上公式是最后一步。前面决定「算什么问题」的功夫，占七成时间，也决定成败。\n<\/li><li>\n别以为模型越复杂越高分——实际上评委先看模型能不能解释现象。加进十个变量却说不清哪个在起作用，比三个变量讲透更差。\n<\/li><li>\n别以为算出的数就是答案——实际上答案要翻译成人话：「建议每天生产甲 2 台、乙 6 台，日利润 2.6 万元」。只丢一个 26 上去，等于没回答。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】下列哪一项不属于数学模型的三要素？<\/h3>\n<ul><li>\nA. 决策变量\n<\/li><li>\nB. 目标函数\n<\/li><li>\nC. 计算软件\n<\/li><li>\nD. 约束条件\n<p><strong>答案<\/strong>：C <strong>解析<\/strong>：软件只是求解工具，换成手算或别的语言，模型本身不变。三要素是变量、目标、约束。<\/p>\n<\/ul>\n<h3>Q2 【单选】某模型算出「每天利润 26 小时」，最先应该怀疑的是？<\/h3>\n<ul><li>\nA. 求解程序写错了\n<\/li><li>\nB. 目标函数的量纲搞错了\n<\/li><li>\nC. 约束条件太少\n<\/li><li>\nD. 数据年份太旧\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：利润的单位不可能是小时。单位对不上，说明目标函数把某个量当成了别的东西，这是量纲检验的典型信号。<\/p>\n<\/ul>\n<h3>Q3 【填空】建模流程中，检验发现结果与现实不符时，应当退回的步骤是________。<\/h3>\n<p><strong>答案<\/strong>：假设（或模型建立） <strong>解析<\/strong>：结果荒谬通常源于假设脱离现实，比如把「机器每天可用 10 小时」写成「每台机器 10 小时」。退回改假设，比在错误假设上硬调参数有效。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n模型是简化过的地图，有用是因为它不全。\n<\/li><li>\n变量、目标、约束三块缺一块，模型就不闭合。\n<\/li><li>\n检验看三样：量纲、量级、极端值。\n<\/ul>", "ch02": "<h1>第 2 章：够用的数学预备<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说出导数、积分、矩阵、特征值、期望、方差在建模里各自负责什么；\n<\/li><li>\n遇到一个新问题，判断它大概归到「变化率」「累积」「线性关系」「随机性」哪一类；\n<\/li><li>\n不再因为看不懂某个算法里的符号而卡住，知道该补哪一块。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>建模用到的数学只有四件事：算变化、算累积、解线性关系、处理不确定性。后面十几章的算法，都是这四件事的组合。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：导数——变化有多快（难度：基础）<\/h3>\n<p><strong>导数<\/strong>：函数在某一点的瞬时变化率。位移对时间求导是速度，速度再求导是加速度。<\/p>\n<p>建模里它出现的地方很固定：只要题目里有「增长率」「传播速度」「边际成本」「温度下降快慢」，模型里就有导数，通常是微分方程。<\/p>\n<p>一个必须记住的结论：函数在极值点处导数为零。所以求最优解时，先让导数为零，再判断是最大还是最小。第 3 章非线性规划的全部理论，都从这句话长出来。<\/p>\n<p>类比：导数像汽车仪表盘上的瞬时车速。里程表显示的是总路程，看不出你此刻多快。失效边界：仪表盘永远有个读数，而有些函数在某些点根本不可导，比如绝对值函数在 0 点。<\/p>\n<h3>概念 2：积分——累积成总量（难度：基础）<\/h3>\n<p><strong>定积分<\/strong>：把连续变化的东西一点点累加起来。已知流入速度求总水量，已知人口出生率求总人口增量，都是积分。<\/p>\n<p>建模里的用法：微分方程解出来常带积分；概率里求区间概率也是对密度函数积分。<\/p>\n<p>它和导数是反操作。记住了这个互逆关系，看到「已知速率求总量」就不慌。<\/p>\n<h3>概念 3：矩阵与线性方程组（难度：基础）<\/h3>\n<p><strong>矩阵<\/strong>：把一堆数按行列排好。它在建模里干三件事：表示线性方程组、表示变换、存数据。<\/p>\n<ul><li>\n线性方程组 Ax = b：n 个未知数 n 个方程，解唯一当且仅当系数矩阵可逆。判断可逆看行列式是否为零。\n<\/li><li>\n最小二乘：方程数多于未知数时无精确解，转而求使 ‖Ax − b‖ 最小的 x。第 5 章拟合、第 7 章回归都用它。\n<\/li><li>\n特征值：矩阵 A 作用在向量 v 上，若结果只是把 v 拉长 λ 倍，λ 就是特征值。第 8 章差分方程稳不稳定、第 10 章主成分分析取几个主成分，都靠它。\n<\/ul>\n<h3>概念 4：概率与统计——处理不确定性（难度：基础）<\/h3>\n<p><strong>期望<\/strong>：随机变量按概率加权的平均值，记 E(X)。<strong>方差<\/strong>：偏离期望的平均平方距离，记 Var(X)，开方是标准差。<\/p>\n<p>三个必须分清的东西：<\/p>\n<ul><li>\n<strong>总体与样本<\/strong>：总体是你想研究的全部对象，样本是你实际拿到的部分。所有统计推断都是从样本猜总体，因此永远带误差。\n<\/li><li>\n<strong>参数与估计<\/strong>：总体均值 μ 是参数，样本均值 x̄ 是估计。x̄ 会随抽样变，所以它本身也是随机变量。\n<\/li><li>\n<strong>相关与因果<\/strong>：两个量一起变，不代表一个引起另一个。第 7 章回归给出的是相关关系，因果要靠实验设计或领域知识。\n<\/ul>\n<p>建模里最常被误用的就是最后一条。竞赛论文里写「因为相关系数 0.8，所以 A 导致 B」，是硬伤。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">mindmap\n  root((建模用到的数学))\n    变化\n      导数\n      微分方程\n    累积\n      积分\n      总量核算\n    线性\n      矩阵\n      最小二乘\n      特征值\n    随机\n      期望方差\n      参数估计\n      假设检验<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：四条主干对应四类问题。做题时先判断问题落在哪条枝上，再去找对应章节，比从第一章顺序啃效率高得多。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：导数像车速表，积分像总耗油量，矩阵像一张排班表，概率像天气预报的降雨概率。四个都不精确，但都能指导决策。失效边界：天气预报给你概率，模型给你的常是一个确定的数，别把两者混着用。\n<\/li><li>\n<strong>实例（可手算）<\/strong>：某商品需求量 Q 随价格 p 变化，Q = 100 − 4p。收入 R = pQ = 100p − 4p²。求导 dR/dp = 100 − 8p，令其为零得 p = 12.5，此时 Q = 50，收入 R = 625。检验：p = 10 时 R = 600，p = 15 时 R = 600，都小于 625，说明 12.5 确实是最大值点。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为数学越好建模越强——实际上建模考的是「把问题翻译成式子」的能力，计算可以交给软件。数学功底的作用是让你翻译时不写错。\n<\/li><li>\n别以为公式越长越专业——实际上评委看的是每个符号有没有交代清楚。符号表缺一行，整段推导就白写。\n<\/li><li>\n别以为相关系数高就是找到了原因——实际上可能两者都被第三个变量推着走。第 7 章会讲怎么用控制变量和偏相关排除这种假象。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】题目问「污染物浓度每小时下降多少」，模型里最可能出现的是？<\/h3>\n<ul><li>\nA. 积分\n<\/li><li>\nB. 导数\n<\/li><li>\nC. 矩阵特征值\n<\/li><li>\nD. 方差\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：「每小时下降多少」问的是变化率，对应导数；写成微分方程就是 dc/dt = −kc 这一类。<\/p>\n<\/ul>\n<h3>Q2 【单选】方程个数多于未知数时，最小二乘在做什么？<\/h3>\n<ul><li>\nA. 随便挑一个方程求解\n<\/li><li>\nB. 找使整体误差平方和最小的解\n<\/li><li>\nC. 把多余方程删掉\n<\/li><li>\nD. 求矩阵的特征值\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：方程多于未知数通常无精确解，最小二乘转而在所有候选解里挑总误差平方和最小的那个，这正是拟合与回归的共同底座。<\/p>\n<\/ul>\n<h3>Q3 【填空】判断系数矩阵是否可逆，最直接的办法是看它的________是否为零。<\/h3>\n<p><strong>答案<\/strong>：行列式 <strong>解析<\/strong>：行列式非零则矩阵可逆、方程组有唯一解；为零则可能无解或有无穷多解，需要看秩。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n导数管变化率与极值，积分管累积，两者互逆。\n<\/li><li>\n最小二乘是「方程多了怎么办」的标准答案。\n<\/li><li>\n相关不等于因果，写论文时必须自己交代清楚。\n<\/ul>", "ch03": "<h1>第 3 章：计算工具与求解器<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 1、2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用 Python 在一台干净电脑上装好建模要用的五个库；\n<\/li><li>\n看懂教材里的 MATLAB 代码，并把它翻成 Python；\n<\/li><li>\n知道什么该用求解器，什么必须自己写循环。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>建模比赛里 90% 的计算是「把数据读进来 → 调一个求解函数 → 把结果画出来」，三行代码能解决的事，不要手推。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：两套工具的分工（难度：基础）<\/h3>\n<ul><li>\n<strong>Python<\/strong>：免费、库全、画图和数据处理顺手。建模首选。\n<\/li><li>\n<strong>MATLAB<\/strong>：教材代码几乎都是它，矩阵操作写起来短，优化工具箱成熟。学校机房常有正版。\n<\/li><li>\n<strong>LINGO<\/strong>：专做规划模型，写约束像写方程，适合第 16 章的多目标与目标规划。\n<\/ul>\n<p>不必三样都精。选定 Python 为主，遇到教材 MATLAB 代码照着翻，LINGO 只在写复杂规划时借用。<\/p>\n<h3>概念 2：五个库各管什么（难度：基础）<\/h3>\n<table><thead><tr><th>库<\/th><th>管什么<\/th><th>典型调用<\/th><\/tr><\/thead><tbody><tr><td>numpy<\/td><td>数组与矩阵运算<\/td><td><code>np.array<\/code>、<code>np.linalg.solve<\/code><\/td><\/tr><tr><td>scipy<\/td><td>优化、插值、积分、统计分布<\/td><td><code>scipy.optimize.linprog<\/code>、<code>scipy.interpolate<\/code><\/td><\/tr><tr><td>pandas<\/td><td>读写 Excel/CSV、分组统计<\/td><td><code>pd.read_excel<\/code>、<code>df.groupby<\/code><\/td><\/tr><tr><td>matplotlib<\/td><td>画折线、散点、热力图<\/td><td><code>plt.plot<\/code>、<code>plt.scatter<\/code><\/td><\/tr><tr><td>scikit-learn<\/td><td>聚类、分类、回归、降维<\/td><td><code>KMeans<\/code>、<code>SVM<\/code>、<code>PCA<\/code><\/td><\/tr><\/tbody><\/table>\n<p>装环境一条命令：<\/p>\n<pre class=\"lang-bash\"><code>pip install numpy scipy pandas matplotlib scikit-learn openpyxl<\/code><\/pre>\n<p>国内网络慢就加清华源：<code>pip install -i https://pypi.tuna.tsinghua.edu.cn/simple numpy scipy pandas matplotlib scikit-learn openpyxl<\/code>。<\/p>\n<h3>概念 3：求解器的输入格式（难度：进阶）<\/h3>\n<p>所有优化函数都要求你把模型写成矩阵形式：目标系数 c、约束矩阵 A、约束右端 b。这是第 1 章三要素的机器版本。<\/p>\n<p>线性规划例子：最大化 z = 4x₁ + 3x₂，满足 2x₁ + x₂ ≤ 10、x₁ + x₂ ≤ 8、x₂ ≤ 7、x₁,x₂ ≥ 0。<\/p>\n<pre class=\"lang-python\"><code>import numpy as np\nfrom scipy.optimize import linprog\n\n# scipy 只做最小化，最大化要取负\nc = [-4, -3]\nA = [[2, 1], [1, 1], [0, 1]]\nb = [10, 8, 7]\nres = linprog(c, A_ub=A, b_ub=b, bounds=[(0, None), (0, None)], method=&quot;highs&quot;)\nprint(res.x, -res.fun)   # [2. 6.] 26.0<\/code><\/pre>\n<p>跑出来 x = (2, 6)，利润 26 千元。这个数可以手算核对：两条前约束都恰好取等，第三条约 6 ≤ 7 未取等。<\/p>\n<p><strong>MATLAB 对照<\/strong>：<code>linprog<\/code> 名字一样，但 MATLAB 默认最小化、约束写成 <code>A*x &lt;= b<\/code>，语句是 <code>[x,fval] = linprog(c,A,b,[],[],lb)<\/code>。教材里常见的 <code>optimproblem<\/code> 写法是「基于问题」的新接口，Python 里没有对应物，翻译时改回矩阵形式即可。<\/p>\n<h3>概念 4：什么时候不能靠现成函数（难度：进阶）<\/h3>\n<p>三类活必须自己写：<\/p>\n<ul><li>\n<strong>模型本身要迭代<\/strong>：遗传算法、模拟退火、粒子群，外层循环是你的，目标函数也是你的。\n<\/li><li>\n<strong>中间步骤要存数据<\/strong>：比如逐月滚动预测，每步结果要进表，函数只给你最后答案。\n<\/li><li>\n<strong>结果要解释<\/strong>：求解器只给数值，灵敏度分析要你改参数重跑十几次，画成曲线。\n<\/ul>\n<p>判断标准很简单：如果函数返回的东西不够你写论文，就得自己搭流程。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[数据文件] --&gt; B[pandas 读入]\n    B --&gt; C{问题类型}\n    C --&gt;|规划| D[scipy optimize]\n    C --&gt;|拟合插值| E[scipy interpolate]\n    C --&gt;|聚类分类| F[scikit-learn]\n    D --&gt; G[结果表]\n    E --&gt; G\n    F --&gt; G\n    G --&gt; H[matplotlib 出图]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：数据进、图出，中间那条判断分支决定你调哪个库。比赛里卡住，通常卡在 B 或 C：数据读不进来，或者没判断清问题类型。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：求解器像自动售货机，你投进去的必须是标准硬币，即矩阵格式的模型；投一张手写纸条，它不认。失效边界：售货机不会告诉你硬币投错了面额，求解器会返回 status 码，要学会看 <code>res.status<\/code> 和 <code>res.message<\/code>。\n<\/li><li>\n<strong>实例（可复现）<\/strong>：把上面例子改成「乙机床至少生产 4 台」，加约束 −x₂ ≤ −4。重跑得到 x = (2, 6) 不变，因为 6 ≥ 4 本来就满足。再把乙的利润从 3 改成 5，c 变成 [−4, −5]，最优解变成 x = (0, 8)？手算检验：x₂ 上限 7，x₁ + x₂ ≤ 8，取 x₂ = 7 则 x₁ ≤ 1，利润 = 4×1 + 5×7 = 39；取 x₂ = 6、x₁ = 2 得 8 + 30 = 38。所以最优是 (1, 7)，39。程序会给出同样的答案，不一致就说明代码写错了。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为装了 Anaconda 就万事大吉——实际上环境一多，<code>import scipy<\/code> 会指到旧版本。一个项目一个虚拟环境，比什么都装强。\n<\/li><li>\n别以为 MATLAB 代码能直接照抄——实际上索引从 1 开始、矩阵乘法 <code><em><\/code> 与点乘 <code>.<\/em><\/code> 的差别，翻译时全是坑。\n<\/li><li>\n别以为求解器返回了数就是成功——实际上 <code>status=2<\/code> 表示不可行，<code>status=3<\/code> 表示无界。先看状态码，再看解。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】用 scipy 求最大化问题，目标函数系数应该怎么写？<\/h3>\n<ul><li>\nA. 原样写正数\n<\/li><li>\nB. 全部取负\n<\/li><li>\nC. 取倒数\n<\/li><li>\nD. 加一个常数\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：<code>linprog<\/code> 只做最小化，最大化 z 等价于最小化 −z，所以系数取负，最后把 <code>res.fun<\/code> 再取负还原。<\/p>\n<\/ul>\n<h3>Q2 【单选】下列哪件事适合自己写循环，而不是调现成函数？<\/h3>\n<ul><li>\nA. 解线性方程组\n<\/li><li>\nB. 三次样条插值\n<\/li><li>\nC. 模拟退火搜索最优参数\n<\/li><li>\nD. 计算协方差矩阵\n<p><strong>答案<\/strong>：C <strong>解析<\/strong>：模拟退火的降温策略、邻域生成、接受概率都要你自己定，没有通用函数可套。<\/p>\n<\/ul>\n<h3>Q3 【填空】求解器返回 <code>status=2<\/code>，含义是问题________。<\/h3>\n<p><strong>答案<\/strong>：不可行 <strong>解析<\/strong>：2 表示找不到满足全部约束的解，通常是约束写矛盾了，比如同时要求 x ≥ 5 和 x ≤ 3。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\nPython 为主，MATLAB 用来读教材代码，LINGO 只在复杂规划时上场。\n<\/li><li>\n优化函数只吃矩阵，模型要先翻译成 c、A、b。\n<\/li><li>\n先看 status，再看解；不可行和无界是两种完全不同的错。\n<\/ul>", "ch04": "<h1>第 4 章：论文的骨架<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n按「摘要四段式」写出带具体数字的摘要；\n<\/li><li>\n说清假设、符号说明、模型建立、求解、检验、评价六块各写什么；\n<\/li><li>\n用评委的视角给自己的稿子挑出三处硬伤。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>数模论文不是实验报告，它是一份说服文档：用一页摘要让人相信你解决了问题，用后面二十页证明你没吹牛。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：摘要四段式（难度：基础）<\/h3>\n<p>摘要占分最重，评委平均只花两三分钟看一篇。四段结构：<\/p>\n<ol><li>\n<strong>背景与任务<\/strong>：一两句，说清你面对什么、要回答哪几问。\n<\/li><li>\n<strong>方法<\/strong>：每问一句话，点出模型名和关键处理。不要写「我们建立了模型」这种空话。\n<\/li><li>\n<strong>结果<\/strong>：给数字。最优方案是多少、预测值多少、误差多少。\n<\/li><li>\n<strong>结论与推广<\/strong>：一句结论，一句模型能用到哪。\n<\/ol>\n<p>反面例子：「本文建立了科学的数学模型，运用先进算法，得到了合理结论。」这句话删掉不影响任何信息。<\/p>\n<p>正面例子：「第 1 问建立以日利润最大为目标的线性规划模型，求得甲 2 台、乙 6 台，日利润 2.6 万元；第 2 问将机器可用工时视为随机变量，用 Monte Carlo 模拟 10 万次，得期望利润 2.41 万元，90% 置信区间 [2.05, 2.77]。」<\/p>\n<h3>概念 2：六块正文（难度：基础）<\/h3>\n<table><thead><tr><th>板块<\/th><th>写什么<\/th><th>常见毛病<\/th><\/tr><\/thead><tbody><tr><td>问题重述<\/td><td>用自己的话压缩题意，标出每一问<\/td><td>整段抄题目<\/td><\/tr><tr><td>模型假设<\/td><td>每条假设附一句理由<\/td><td>写「假设数据真实」这种废话<\/td><\/tr><tr><td>符号说明<\/td><td>表格，符号、含义、单位<\/td><td>正文里冒出表里没有的符号<\/td><\/tr><tr><td>模型建立<\/td><td>从假设推到式子，一步一行<\/td><td>直接甩公式，不讲为什么这么建<\/td><\/tr><tr><td>模型求解<\/td><td>算法步骤 + 关键结果 + 图表<\/td><td>只贴代码不解释<\/td><\/tr><tr><td>检验与评价<\/td><td>灵敏度、误差、优缺点<\/td><td>只夸不批，或只批不改<\/td><\/tr><\/tbody><\/table>\n<h3>概念 3：灵敏度分析（难度：进阶）<\/h3>\n<p><strong>灵敏度分析<\/strong>：把模型里的某个参数上下改 10%，看结论变不变。变很多说明模型脆弱，变很少说明结论稳。<\/p>\n<p>写法：固定其他条件，让参数 α 从 0.005 扫到 0.05，步长 0.001，画出「参数—目标值」曲线，标出拐点。<\/p>\n<p>这一块最容易被跳过，也最容易加分。评委看到你主动承认「当原材料价格上涨 15% 时，最优产量从 6 台降到 4 台」，会认为你真懂模型，而不是跑通代码。<\/p>\n<h3>概念 4：图表的规矩（难度：基础）<\/h3>\n<ul><li>\n图要有编号和图题，图题在图下方；表题在表上方。\n<\/li><li>\n坐标轴写量和单位，别只写「值」。\n<\/li><li>\n一张图只讲一件事。把六条曲线塞进一张图，读者只会记住「很乱」。\n<\/li><li>\n正文必须提到每一张图表。「如图 3 所示」后面要跟一句结论，不能只放图。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[摘要] --&gt; B[问题重述]\n    B --&gt; C[模型假设]\n    C --&gt; D[符号说明]\n    D --&gt; E[模型建立]\n    E --&gt; F[模型求解]\n    F --&gt; G[检验与灵敏度]\n    G --&gt; H[模型评价与推广]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：顺序就是评委的阅读顺序。摘要独立成篇，正文按这个链条推进。任何一块缺失，读者会在那里停下来怀疑你。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：论文像打官司。摘要是一页诉状，假设是你的证据清单，模型是推理，结果是判决，灵敏度是「换一个法官也这么判」。失效边界：法庭要求排除一切合理怀疑，建模只要求结论在参数扰动下站得住。\n<\/li><li>\n<strong>实例（摘要改写）<\/strong>：原句「我们对数据进行了预处理，并建立了预测模型，取得了较好的效果」。改成：「对 2019—2023 年共 60 个月的数据做缺失值线性插值与异常值 3σ 剔除，保留 58 条；建立 ARIMA(1,1,1) 模型，AIC 为 412.3，样本外 6 个月预测的平均绝对百分比误差为 4.7%」。同样一段，信息量差十倍。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为字数多就分高——实际上超页会被扣分，评委也没耐心。每句话都要有信息。\n<\/li><li>\n别以为代码附录可以乱写——实际上附录是可信度的证据。变量名对不上正文，评委会怀疑结果不是跑出来的。\n<\/li><li>\n别以为模型越高级越好——实际上用对方法比用难方法重要。简单模型加严谨检验，胜过复杂模型加一堆没解释的参数。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】摘要里最不该出现的是？<\/h3>\n<ul><li>\nA. 具体的最优方案数值\n<\/li><li>\nB. 所用模型名称\n<\/li><li>\nC. 「本文运用先进算法取得良好效果」\n<\/li><li>\nD. 关键误差指标\n<p><strong>答案<\/strong>：C <strong>解析<\/strong>：这句话不含任何可核查信息，删掉不影响理解，属于典型的凑字数。<\/p>\n<\/ul>\n<h3>Q2 【单选】灵敏度分析的目的是？<\/h3>\n<ul><li>\nA. 让论文看起来更复杂\n<\/li><li>\nB. 检验结论对参数扰动的稳健性\n<\/li><li>\nC. 提高模型的拟合精度\n<\/li><li>\nD. 减少计算量\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：改参数看结论变化幅度，判断模型是否脆弱，这是灵敏度分析唯一的用途。<\/p>\n<\/ul>\n<h3>Q3 【填空】论文中图题应放在图的________方，表题应放在表的________方。<\/h3>\n<p><strong>答案<\/strong>：下；上 <strong>解析<\/strong>：这是排版规范，也是评委会一眼看出的格式分。LaTeX 里 <code>\\caption<\/code> 位置放错就会颠倒，第 03 册会讲怎么调。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n摘要是四段：任务、方法、数字结果、结论。\n<\/li><li>\n假设必须带理由，符号表必须覆盖全文。\n<\/li><li>\n灵敏度分析写「参数变了结论怎么变」，不是写「模型很好」。\n<\/ul>", "ch05": "<h1>第 5 章：72 小时作战流程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：1 小时 | <strong>前置<\/strong>：第 1、4 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n排出从开题到交卷的 72 小时时间表，并说清每个节点的交付物；\n<\/li><li>\n按三人的能力分工，避免两个人同时写同一段；\n<\/li><li>\n用一张清单在交卷前 30 分钟查出致命错误。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>72 小时里，最贵的资源不是算力，是「三个人对同一件事的理解一致」。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：时间轴（难度：基础）<\/h3>\n<table><thead><tr><th>时段<\/th><th>干什么<\/th><th>交付物<\/th><\/tr><\/thead><tbody><tr><td>第 1 天 08:00–12:00<\/td><td>读三题、查文献、定题<\/td><td>一页选题理由<\/td><\/tr><tr><td>第 1 天 13:00–22:00<\/td><td>拆问题、定假设、搭模型骨架<\/td><td>模型框架图 + 符号表<\/td><\/tr><tr><td>第 2 天 08:00–18:00<\/td><td>编程求解第一问，跑通全流程<\/td><td>能出数的脚本<\/td><\/tr><tr><td>第 2 天 19:00–24:00<\/td><td>补第二、三问，出初版图表<\/td><td>结果表 + 图<\/td><\/tr><tr><td>第 3 天 08:00–14:00<\/td><td>写正文、做灵敏度<\/td><td>论文初稿<\/td><\/tr><tr><td>第 3 天 14:00–18:00<\/td><td>通读、查数、改图<\/td><td>定稿<\/td><\/tr><tr><td>第 3 天 18:00–20:00<\/td><td>排版、生成 PDF、交卷<\/td><td>提交包<\/td><\/tr><\/tbody><\/table>\n<p>真实比赛里这张表会滑。滑了之后砍哪块要提前想好：先砍第三问的精细度，再砍灵敏度，绝不要砍摘要和检验。<\/p>\n<h3>概念 2：三人分工（难度：基础）<\/h3>\n<ul><li>\n<strong>建模手<\/strong>：定假设、推式子、判断结果合理性。必须有最终解释权，避免两套模型打架。\n<\/li><li>\n<strong>编程手<\/strong>：写求解脚本、清洗数据、出图。要求每段代码能单独跑。\n<\/li><li>\n<strong>写作手<\/strong>：从第一天就动笔，写问题重述、假设、符号表，边做边填正文。\n<\/ul>\n<p>三人不是流水线。每天至少两次对齐：中午对结果，晚上对文字。写作手要看得懂建模手的式子，否则写出来的是两套话。<\/p>\n<h3>概念 3：选题的三条判据（难度：基础）<\/h3>\n<ol><li>\n<strong>数据拿不拿得到<\/strong>：题目给的数据够不够支撑第一问。要自己找数据的题，先评估两小时内能否找到。\n<\/li><li>\n<strong>方法有没有把握<\/strong>：至少有一问你能立刻说出用什么模型。三问全陌生，换题。\n<\/li><li>\n<strong>上限有多高<\/strong>：看一眼题目，能不能想到「加分点」——比如加一个灵敏度、做一个对比模型。想不出，说明理解还不够。\n<\/ol>\n<h3>概念 4：交卷清单（难度：基础）<\/h3>\n<ul><li>\n摘要里的每个数字，正文都能找到出处；\n<\/li><li>\n符号表覆盖全文，正文没有表外符号；\n<\/li><li>\n每张图有编号、图题、坐标轴单位，正文提到过；\n<\/li><li>\n附录代码能跑通，变量名与正文一致；\n<\/li><li>\nPDF 打开无乱码，公式不溢出页面，页码连续；\n<\/li><li>\n文件名与比赛要求一致，压缩包能解压。\n<\/ul>\n<p>这六条里，任何一条出错都可能直接降档。尤其第一条和最后一条，每年都有人栽。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">gantt\n    title 72 小时节奏\n    dateFormat  HH:mm\n    axisFormat  %Hh\n    section 第一天\n    选题与文献      :a1, 08:00, 4h\n    模型骨架        :a2, 13:00, 9h\n    section 第二天\n    求解第一问      :b1, 08:00, 10h\n    二三问与图表    :b2, 19:00, 5h\n    section 第三天\n    正文与灵敏度    :c1, 08:00, 6h\n    通读与定稿      :c2, 14:00, 4h\n    排版交卷        :c3, 18:00, 2h<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：注意第一天没有「写论文」的块，但写作手其实全天在写问题重述和假设。甘特图只能画交付物，画不出并行的文字工作。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：72 小时像一场接力，但棒子要在三个人之间来回传，而不是一人跑一棒。失效边界：接力赛掉棒就输，建模掉一次信息还能补，但补的成本随时间指数上升。\n<\/li><li>\n<strong>实例（一次真实滑档）<\/strong>：某队第二天 23:00 才发现第一问的约束漏了「机器每天最多运行 8 小时」，此前所有图表都基于错误模型。补救方式：不改模型，把 8 小时作为新约束重跑，图和结论全部重画，凌晨 3 点完成。教训是假设要在第一天写死并互相签字确认。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为熬夜能多出活——实际上第三天的错误，八成是第二天没睡够造成的。\n<\/li><li>\n别以为三个人各干各的最快——实际上不对齐的分工，返工时间比省下的多。\n<\/li><li>\n别以为交卷前还能大改——实际上最后两小时只做检查，不做修改。改一处，全文数字都要跟着变。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】时间不够时，最先应该砍掉的是？<\/h3>\n<ul><li>\nA. 摘要\n<\/li><li>\nB. 第三问的精细度\n<\/li><li>\nC. 模型检验\n<\/li><li>\nD. 图表编号\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：第三问做浅一点仍能得分，摘要和检验缺失是结构性失分，图表编号错是格式硬伤。<\/p>\n<\/ul>\n<h3>Q2 【单选】三人分工中，对模型有最终解释权的应该是？<\/h3>\n<ul><li>\nA. 编程手\n<\/li><li>\nB. 写作手\n<\/li><li>\nC. 建模手\n<\/li><li>\nD. 谁有空谁定\n<p><strong>答案<\/strong>：C <strong>解析<\/strong>：两套模型打架时必须有一个人拍板，否则正文和代码会各说各话。<\/p>\n<\/ul>\n<h3>Q3 【填空】交卷前必须核对：摘要里的每个数字都要能在________找到出处。<\/h3>\n<p><strong>答案<\/strong>：正文 <strong>解析<\/strong>：摘要数字与正文不一致，是评委最容易发现的硬伤，通常意味着后期改过结果但没同步摘要。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n第一天定死假设，第二天跑通全流程，第三天只写不改模型。\n<\/li><li>\n分工要每天两次对齐，写作手从第一天就动笔。\n<\/li><li>\n最后两小时只检查，不修改。\n<\/ul>", "c01": "<h1>假设<\/h1>\n<p>&lt;!--chapters: ch01,ch04--&gt;<\/p>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1、4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>假设是你主动决定忽略的东西，它划定了模型能用的范围。<\/p>\n<h2>为什么重要<\/h2>\n<p>模型出错，九成出在假设。写清假设，等于提前告诉读者「哪些情况下我的话不算数」，这比结论本身更能体现水平。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[现实] --&gt; B[选定假设]\n    B --&gt; C[模型]\n    C --&gt; D[结论]\n    D --&gt;|超出假设范围| E[结论失效]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>好假设有两条标准：可检验、有理由。例如「假设原材料价格在三个月内不变，理由是合同锁价」；坏假设是「假设数据真实」，它既不可检验，也不约束任何东西。<\/p>\n<p>类比：假设像合同的适用范围条款。失效边界：合同条款有法律效力，假设只有说服力，评委可以质疑。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为假设写得少显得模型强——实际上不写假设，读者会默认你忽略了所有细节，反而不敢信。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 1 章<\/td><td>五步流程<\/td><td>检验失败先退回假设<\/td><\/tr><tr><td>第 4 章<\/td><td>论文六块<\/td><td>每条假设附一句理由<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：数学模型\n<\/li><li>\n后续：灵敏度分析\n<\/ul>", "c02": "<h1>灵敏度分析<\/h1>\n<p>&lt;!--chapters: ch04,ch03--&gt;<\/p>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章、第 01 册第 3 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把模型里的参数上下改动，看结论变不变、变多少。<\/p>\n<h2>为什么重要<\/h2>\n<p>它回答「这个方案靠不靠得住」。一个只在某个精确参数下成立的最优解，实际价值远不如一个参数浮动 20% 仍然可用的次优解。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[基准参数] --&gt; B[扰动参数]\n    B --&gt; C[重算模型]\n    C --&gt; D[记录结论]\n    D --&gt; E[画参数与结论曲线]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>做法固定：选一个关键参数，在合理区间内取 10–20 个值，其余不变，逐个重算，把结果画成曲线，标出拐点与失效边界。写进论文时给出区间，不要只给一句「模型稳健」。<\/p>\n<p>类比：买股票前先想「如果利率涨一个点我还赚不赚」。失效边界：金融里参数联动，单独扰动一个可能低估风险，多参数同时扰动要用情景分析。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为灵敏度分析等于误差分析——实际上误差分析看的是计算结果离真值多远，灵敏度看的是输入变化对输出的影响。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章<\/td><td>论文写作<\/td><td>灵敏度是加分块，不能只夸不扰<\/td><\/tr><tr><td>第 01 册第 3 章<\/td><td>非线性规划<\/td><td>参数扫描 + 重解，是标准做法<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：假设、模型求解\n<\/li><li>\n后续：模型评价\n<\/ul>", "c03": "<h1>三要素<\/h1>\n<p>&lt;!--chapters: ch01,ch05--&gt;<\/p>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1、5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>任何优化类模型都由决策变量、目标函数、约束条件三块拼成，缺一块模型就不闭合。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是判断「这题该建什么模型」的最快入口。三要素齐了，剩下的工作只是选算法；三要素缺，再多算法也补不上。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[决策变量] --&gt; D[模型]\n    B[目标函数] --&gt; D\n    C[约束条件] --&gt; D\n    D --&gt; E[可行解集合]\n    E --&gt; F[最优解]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n决策变量：你能控制的量。写的时候带上下标和单位，例如 x₁ 表示甲机床日产量，单位台。\n<\/li><li>\n目标函数：你要优化的量。写成变量表达式，明确最大还是最小。\n<\/li><li>\n约束条件：资源、时间、物理规律的边界。每条约束背后要有一个现实理由，写不出理由的约束通常是多余的。\n<\/ul>\n<p>类比：点菜。变量是每道菜点几份，目标是总价或总热量，约束是预算和胃口。失效边界：点菜可以中途改主意，模型一旦定下约束，求解过程不会自己松绑。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为约束越多越严谨——实际上每条约束都在缩小可行域，多余的约束可能把最优解切掉。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 1 章<\/td><td>首个例题<\/td><td>机床厂模型 max 4x₁+3x₂，最优 26 千元<\/td><\/tr><tr><td>第 5 章<\/td><td>分工<\/td><td>三要素由建模手统一口径，避免两套模型打架<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：无\n<\/li><li>\n后续：线性规划、整数规划、多目标规划\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：先弄清建模是什么<\/strong><br>阅读：<a href=\"#/book/start/chapter/ch01\">第 1 章：数学建模到底在做什么<\/a><br>检查点：能不看笔记讲出五步流程与三把检验尺<\/li><li class='path-step' id='path-02'><strong>步骤 02：补齐够用的数学<\/strong><br>阅读：<a href=\"#/book/start/chapter/ch02\">第 2 章：够用的数学预备<\/a><br>检查点：能把一个新问题归到变化/累积/线性/随机四类之一<\/li><li class='path-step' id='path-03'><strong>步骤 03：跑通第一个求解器<\/strong><br>阅读：<a href=\"#/book/start/chapter/ch03\">第 3 章：计算工具与求解器<\/a><br>检查点：本地跑出 (2, 6) 与 26，并能读 status<\/li><li class='path-step' id='path-04'><strong>步骤 04：学会写论文骨架<\/strong><br>阅读：<a href=\"#/book/start/chapter/ch04\">第 4 章：论文的骨架<\/a><br>检查点：把一段空话摘要改写成带数字的四段<\/li><li class='path-step' id='path-05'><strong>步骤 05：排出作战流程<\/strong><br>阅读：<a href=\"#/book/start/chapter/ch05\">第 5 章：72 小时作战流程<\/a><br>检查点：写出自己队 72 小时时间表与交卷清单<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：数学建模到底在做什么<\/h2><div class='quiz-item' data-qid='ch01-q0101' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 下列哪一项不属于数学模型的三要素？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q0101' value='0'> 决策变量<\/label><label class='quiz-opt'><input type='radio' name='ch01-q0101' value='1'> 目标函数<\/label><label class='quiz-opt'><input type='radio' name='ch01-q0101' value='2'> 计算软件<\/label><label class='quiz-opt'><input type='radio' name='ch01-q0101' value='3'> 约束条件<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q0102' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 某模型算出「每天利润 26 小时」，最先应该怀疑的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q0102' value='0'> 求解程序写错了<\/label><label class='quiz-opt'><input type='radio' name='ch01-q0102' value='1'> 目标函数的量纲搞错了<\/label><label class='quiz-opt'><input type='radio' name='ch01-q0102' value='2'> 约束条件太少<\/label><label class='quiz-opt'><input type='radio' name='ch01-q0102' value='3'> 数据年份太旧<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q0103' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 建模流程中，检验发现结果与现实不符时，应当退回的步骤是________。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：够用的数学预备<\/h2><div class='quiz-item' data-qid='ch02-q0201' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 题目问「污染物浓度每小时下降多少」，模型里最可能出现的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q0201' value='0'> 积分<\/label><label class='quiz-opt'><input type='radio' name='ch02-q0201' value='1'> 导数<\/label><label class='quiz-opt'><input type='radio' name='ch02-q0201' value='2'> 矩阵特征值<\/label><label class='quiz-opt'><input type='radio' name='ch02-q0201' val single'><p class='quiz-q'><b>Q2.<\/b> 下列哪件事适合自己写循环，而不是调现成函数？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q0302' value='0'> 解线性方程组<\/label><label class='quiz-opt'><input type='radio' name='ch03-q0302' value='1'> 三次样条插值<\/label><label class='quiz-opt'><input type='radio' name='ch03-q0302' value='2'> 模拟退火搜索最优参数<\/label><label class='quiz-opt'><input type='radio' name='ch03-q0302' value='3'> 计算协方差矩阵<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q0303' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 求解器返回 <code>status=2<\/code>，含义是问题________。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：论文的骨架<\/h1><div class='quiz-item' data-qid='ch04-q0401' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 摘要里最不该出现的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q0401' value='0'> 具体的最优方案数值<\/label><label class='quiz-opt'><input type='radio' name='ch04-q0401' value='1'> 所用模型名称<\/label><label class='quiz-opt'><input type='radio' name='ch04-q0401' value='2'> 「本文运用先进算法取得良好效果」<\/label><label class='quiz-opt'><input type='radio' name='ch04-q0401' value='3'> 关键误差指标<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q0402' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 灵敏度分析的目的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q0402' value='0'> 让论文看起来更复杂<\/label><label class='quiz-opt'><input type='radio' name='ch04-q0402' value='1'> 检验结论对参数扰动的稳健性<\/label><label class='quiz-opt'><input type='radio' name='ch04-q0402' value='2'> 提高模型的拟合精度<\/label><label class='quiz-opt'><input type='radio' name='ch04-q0402' value='3'> 减少计算量<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q0403' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 论文中图题应放在图的________方，表题应放在表的________方。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch05__": "<h1>测验：第 5 章：72 小时作战流程<\/h1><div class='quiz-item' data-qid='ch05-q0501' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 时间不够时，最先应该砍掉的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05-q0501' value='0'> 摘要<\/label><label class='quiz-opt'><input type='radio' name='ch05-q0501' value='1'> 第三问的精细度<\/label><label class='quiz-opt'><input type='radio' name='ch05-q0501' value='2'> 模型检验<\/label><label class='quiz-opt'><input type='radio' name='ch05-q0501' value='3'> 图表编号<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch05-q0502' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 三人分工中，对模型有最终解释权的应该是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05-q0502' value='0'> 编程手<\/label><label class='quiz-opt'><input type='radio' name='ch05-q0502' value='1'> 写作手<\/label><label class='quiz-opt'><input type='radio' name='ch05-q0502' value='2'> 建模手<\/label><label class='quiz-opt'><input type='radio' name='ch05-q0502' value='3'> 谁有空谁定<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch05-q0503' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 交卷前必须核对：摘要里的每个数字都要能在________找到出处。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='数学模型'>数学模型 — 用数学符号描述现实对象的一部分关系，是简化过的地图 <span class=glossary-ref>（第 1 章：数学建模到底在做什么）<\/span><\/li><li data-term='决策变量'>决策变量 — 建模者能拍板的量，用字母表示 <span class=glossary-ref>（第 1 章：数学建模到底在做什么）<\/span><\/li><li data-term='目标函数'>目标函数 — 把想要的结果写成决策变量的表达式 <span class=glossary-ref>（第 1 章：数学建模到底在做什么）<\/span><\/li><li data-term='约束条件'>约束条件 — 决策变量必须满足的等式或不等式边界 <span class=glossary-ref>（第 1 章：数学建模到底在做什么）<\/span><\/li><li data-term='假设'>假设 — 明确写下被忽略的因素，决定模型适用范围 <span class=glossary-ref>（第 1 章：数学建模到底在做什么）<\/span><\/li><li data-term='灵敏度分析'>灵敏度分析 — 改变参数看结论变化幅度，判断模型是否脆弱 <span class=glossary-ref>（第 4 章：论文的骨架）<\/span><\/li><li data-term='导数'>导数 — 函数在某点的瞬时变化率，位移求导得速度 <span class=glossary-ref>（第 2 章：够用的数学预备）<\/span><\/li><li data-term='定积分'>定积分 — 把连续变化累加成总量的运算，与导数互逆 <span class=glossary-ref>（第 2 章：够用的数学预备）<\/span><\/li><li data-term='最小二乘'>最小二乘 — 方程多于未知数时，求误差平方和最小的解 <span class=glossary-ref>（第 2 章：够用的数学预备）<\/span><\/li><li data-term='特征值'>特征值 — 矩阵作用于某向量时只把它按比例拉伸的倍数 <span class=glossary-ref>（第 2 章：够用的数学预备）<\/span><\/li><li data-term='期望'>期望 — 随机变量按概率加权的平均值 <span class=glossary-ref>（第 2 章：够用的数学预备）<\/span><\/li><li data-term='方差'>方差 — 随机变量偏离期望的平均平方距离 <span class=glossary-ref>（第 2 章：够用的数学预备）<\/span><\/li><li data-term='总体与样本'>总体与样本 — 想研究的全部对象与实际拿到的部分，推断永远带误差 <span class=glossary-ref>（第 2 章：够用的数学预备）<\/span><\/li><li data-term='求解器'>求解器 — 把模型按矩阵格式喂进去、直接返回数值解的软件函数 <span class=glossary-ref>（第 3 章：计算工具与求解器）<\/span><\/li><li data-term='不可行'>不可行 — 求解器 status=2，约束互相矛盾，无解 <span class=glossary-ref>（第 3 章：计算工具与求解器）<\/span><\/li><li data-term='无界'>无界 — 求解器 status=3，目标值可以无限优化下去，通常是漏了上界约束 <span class=glossary-ref>（第 3 章：计算工具与求解器）<\/span><\/li><li data-term='摘要四段式'>摘要四段式 — 任务、方法、数字结果、结论与推广 <span class=glossary-ref>（第 4 章：论文的骨架）<\/span><\/li><li data-term='符号说明'>符号说明 — 覆盖全文符号的表，缺一行就会让推导失去可信度 <span class=glossary-ref>（第 4 章：论文的骨架）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：三要素拆题<\/h2>\n<p>拿到任何一题，先问三句：要拍板的是什么，用字母写下来；想要的结果是什么，写成表达式；不能越过什么边界，写成不等式。三句答不全，说明题目还没读懂。<\/p>\n<h2>框架：五步回路<\/h2>\n<p>问题、假设、模型、求解、检验。检验不通过就退回假设，不要在原模型上硬调参数。参数是果，假设是因。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n题目里出现「最多」「最少」「最优」→ 先想规划模型，第 01 册第 1–3 章。\n<\/li><li>\n出现「预测」「趋势」→ 先想时间序列或微分方程，第 15 章。\n<\/li><li>\n出现「评价」「排序」「哪个更好」→ 先想综合评价，第 14 章。\n<\/li><li>\n出现「要自己找数据」→ 先评估两小时内能否找到，找不到就换题。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>把假设写成免责声明<\/strong>：「假设数据真实可靠」这种假设不提供任何信息，也不约束模型范围。换成「假设用户需求在预测期内不出现突变」。\n<\/li><li>\n<strong>先跑代码再想模型<\/strong>：程序能出数不代表数有意义。先手算一个小例子，再让程序算大例子。\n<\/li><li>\n<strong>灵敏度分析写成自我表扬<\/strong>：只写「模型稳健」不给扰动范围与结论变化，等于没写。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>流程<\/h2>\n<table><thead><tr><th>场景<\/th><th>动作<\/th><\/tr><\/thead><tbody><tr><td>刚拿到题<\/td><td>三要素各写一句，写不出就重读题<\/td><\/tr><tr><td>模型跑出怪结果<\/td><td>查量纲、量级、极端值<\/td><\/tr><tr><td>时间不够<\/td><td>砍第三问精细度，保摘要与检验<\/td><\/tr><tr><td>交卷前<\/td><td>摘要数字对正文、符号表全覆盖、PDF 无乱码<\/td><\/tr><\/tbody><\/table>\n<h2>常用命令<\/h2>\n<table><thead><tr><th>目的<\/th><th>命令<\/th><\/tr><\/thead><tbody><tr><td>装建模库<\/td><td><code>pip install numpy scipy pandas matplotlib scikit-learn openpyxl<\/code><\/td><\/tr><tr><td>线性规划<\/td><td><code>linprog(c, A_ub=A, b_ub=b, bounds=..., method=&quot;highs&quot;)<\/code><\/td><\/tr><tr><td>读 Excel<\/td><td><code>pd.read_excel(&quot;data.xlsx&quot;)<\/code><\/td><\/tr><tr><td>画折线<\/td><td><code>plt.plot(x, y); plt.xlabel(&quot;月份&quot;); plt.ylabel(&quot;销量/件&quot;)<\/code><\/td><\/tr><tr><td>保存图<\/td><td><code>plt.savefig(&quot;fig1.png&quot;, dpi=300, bbox_inches=&quot;tight&quot;)<\/code><\/td><\/tr><\/tbody><\/table>\n<h2>数字口径<\/h2>\n<table><thead><tr><th>指标<\/th><th>常见写法<\/th><\/tr><\/thead><tbody><tr><td>误差<\/td><td>MAPE 平均绝对百分比误差、RMSE 均方根误差<\/td><\/tr><tr><td>拟合优度<\/td><td>R²，越接近 1 越好，但要看变量个数<\/td><\/tr><tr><td>显著性<\/td><td>p &lt; 0.05 常作界线，必须说明原假设是什么<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：数学建模到底在做什么", "href": "#/chapter/ch01"}, {"label": "第 2 章：够用的数学预备", "href": "#/chapter/ch02"}, {"label": "第 3 章：计算工具与求解器", "href": "#/chapter/ch03"}, {"label": "第 4 章：论文的骨架", "href": "#/chapter/ch04"}, {"label": "第 5 章：72 小时作战流程", "href": "#/chapter/ch05"}]}, {"label": "概念", "children": [{"label": "假设", "href": "#/concept/c01"}, {"label": "灵敏度分析", "href": "#/concept/c02"}, {"label": "三要素", "href": "#/concept/c03"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：数学建模到底在做什么", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：够用的数学预备", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：计算工具与求解器", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：论文的骨架", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章：72 小时作战流程", "href": "#/quiz/ch05"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverage": {"ch01": true, "ch02": true, "ch03": true, "ch04": true, "ch05": true}},"modeling":{"manifest": {"slug": "modeling", "title": "数学建模算法与应用（第3版）精讲", "subtitle": "按题型识别，而不是按章序死磕", "book": {"title": "数学建模算法与应用（第3版）", "author": "司守奎、孙玺菁", "source": ["数学建模算法与应用第3版 (司守奎,孙玺菁).pdf"]}, "audienc  "question": "把 max z 转成 scipy 能接受的形式，需要把目标系数全部________。", "options": [], "answer": "取负", "explain": "`linprog` 只做最小化，最大化问题等价于最小化 −z，最后把结果取负还原。"}, {"id": "ch02-q0201", "chapterId": "ch02", "type": "single", "question": "线性规划松弛解为 (2.67, 0)，下列做法正确的是？", "options": ["直接四舍五入得 (3, 0)", "以松弛解为上界做分枝定界", "认为问题无解", "把约束改成等式"], "answer": 1, "explain": "松弛解给出上界，分枝定界在此之上搜索整数解；直接取整可能违反约束。"}, {"id": "ch02-q0202", "chapterId": "ch02", "type": "single", "question": "「A、B 两个项目最多上一个」应写成？", "options": ["y_A + y_B ≤ 1", "y_A + y_B ≥ 1", "y_A − y_B ≤ 1", "y_A × y_B ≤ 1"], "answer": 0, "explain": "两个 0-1 变量之和不超过 1，恰好表达「至多选一个」；乘积不是线性式，不能出现在线性约束里。"}, {"id": "ch02-q0203", "chapterId": "ch02", "type": "blank", "question": "指派问题的约束特点是每行之和为 1、每列之和为________。", "options": [], "answer": "1", "explain": "一个人只做一件事、一件事只由一个人做，两个方向都恰好为 1，这才构成合法指派。"}, {"id": "ch03-q0301", "chapterId": "ch03", "type": "single", "question": "判断多元目标函数是否凸，主要看？", "options": ["一阶导数是否为零", "海森矩阵是否半正定", "变量个数", "约束个数"], "answer": 1, "explain": "海森矩阵半正定等价于函数凸，这是一元二阶导数判据的推广。"}, {"id": "ch03-q0302", "chapterId": "ch03", "type": "single", "question": "KKT 条件中「互补松弛」的含义是？", "options": ["所有约束都必须取等号", "约束未起作用时对应乘子为零", "乘子必须为负", "目标函数必须为零"], "answer": 1, "explain": "λᵢgᵢ = 0 表示约束与乘子至少一个为零，未起作用的约束不产生「价格」。"}, {"id": "ch03-q0303", "chapterId": "ch03", "type": "blank", "question": "把 (1, 2) 投影到直线 x₁ + x₂ = 2 上，得到的点是________。", "options": [], "answer": "(0.5, 1.5)", "explain": "沿法向 (1,1) 移动 (3−2)/2 = 0.5，坐标各减 0.5。"}, {"id": "ch04-q0401", "chapterId": "ch04", "type": "single", "question": "n 个点的最小生成树有几条边？", "options": ["n", "n−1", "n+1", "不确定"], "answer": 1, "explain": "树的性质：n 个顶点、n−1 条边、无环且连通。"}, {"id": "ch04-q0402", "chapterId": "ch04", "type": "single", "question": "Dijkstra 算法不适用的情形是？", "options": ["边权为正", "存在负权边", "图是稠密图", "图是有向图"], "answer": 1, "explain": "负权会破坏「已确定点的距离不会再变小」这一前提，需要改用 Bellman-Ford。"}, {"id": "ch04-q0403", "chapterId": "ch04", "type": "blank", "question": "关键路径上任何一道工序延误，整个工期都会________。", "options": [], "answer": "延误", "explain": "关键路径的总时差为零，路径上工序没有机动时间，任一延误直接传导到总工期。"}, {"id": "ch05-q0501", "chapterId": "ch05", "type": "single", "question": "插值与拟合最根本的区别是？", "options": ["插值用多项式，拟合不用", "插值必须经过所有数据点，拟合不要求", "插值只能用于一维", "拟合需要更多数据"], "answer": 1, "explain": "是否穿过数据点，决定了误差的处理方式，也是一切方法选择的起点。"}, {"id": "ch05-q0502", "chapterId": "ch05", "type": "single", "question": "Runge 现象说明？", "options": ["节点越多，插值一定越准", "等距节点上高次多项式插值在边缘会剧烈振荡", "三次样条不收敛", "拟合不能用于函数逼近"], "answer": 1, "explain": "次数升高时边缘误差可能发散，这是等距节点的固有缺陷。"}, {"id": "ch05-q0503", "chapterId": "ch05", "type": "blank", "question": "数据 (1,2)、(2,3)、(3,5) 的最小二乘直线斜率为________。", "options": [], "answer": "1.5", "explain": "分子 3、分母 2，斜率 1.5，截距约 0.333。"}, {"id": "ch06-q0601", "chapterId": "ch06", "type": "single", "question": "R₀ = β/γ 大于 1 意味着？", "options": ["疫情必然消失", "一个感染者平均传染超过一个人，疫情可能扩散", "病毒致死率高", "康复速度过快"], "answer": 1, "explain": "R₀ 是基本再生数，大于 1 时感染链能自我维持。"}, {"id": "ch06-q0602", "chapterId": "ch06", "type": "single", "question": "Euler 法的主要缺点是？", "options": ["无法处理线性方程", "只有一阶精度，步长大时误差显著", "需要解析解", "不能处理初值问题"], "answer": 1, "explain": "用直线代替曲线，步长越大偏差越大；提高精度要用 RK4 或减小步长。"}, {"id": "ch06-q0603", "chapterId": "ch06", "type": "blank", "question": "用 Euler 法解 dy/dt = y、y(0)=1、h=0.5，两步后 y₂ = ________。", "options": [], "answer": "2.25", "explain": "y₁ = 1.5，y₂ = 1.5 + 0.5×1.5 = 2.25，与精确值 e 有约 17% 的相对误差。"}, {"id": "ch07-q0701", "chapterId": "ch07", "type": "single", "question": "p 值的正确解读是？", "options": ["H₀ 为真的概率", "H₀ 为真时出现当前或更极端结果的概率", "结论正确的概率", "效应量大小"], "answer": 1, "explain": "p 值是条件概率，条件是 H₀ 成立，它不告诉你 H₀ 本身真不真。"}, {"id": "ch07-q0702", "chapterId": "ch07", "type": "single", "question": "Bootstrap 的核心操作是？", "options": ["增加样本量", "有放回重抽样并重复计算统计量", "对数据做正态化变换", "删除异常值"], "answer": 1, "explain": "通过重抽样模拟抽样分布，避免对分布形式做强假设。"}, {"id": "ch07-q0703", "chapterId": "ch07", "type": "blank", "question": "样本 10、12、11、13、9 的标准差约为________。", "options": [], "answer": "1.58", "explain": "偏差平方和 10，除以自由度 4 得 2.5，开方约 1.581。"}, {"id": "ch08-q0801", "chapterId": "ch08", "type": "single", "question": "xₙ₊₁ = 0.8xₙ + 20 的平衡点是？", "options": ["20", "80", "100", "120"], "answer": 2, "explain": "令 x = 0.8x + 20，得 0.2x = 20，x = 100。"}, {"id": "ch08-q0802", "chapterId": "ch08", "type": "single", "question": "一阶系统稳定的条件是？", "options": ["|a| < 1", "a > 0", "b = 0", "|a| > 1"], "answer": 0, "explain": "每期误差按 a 倍缩放，|a| < 1 才会衰减到零。"}, {"id": "ch08-q0803", "chapterId": "ch08", "type": "blank", "question": "Leslie 矩阵的主特征值大于 1 表示种群长期________。", "options": [], "answer": "增长", "explain": "主特征值是每期的渐近增长倍数，大于 1 意味着规模逐年扩大。"}, {"id": "ch09-q0901", "chapterId": "ch09", "type": "single", "question": "SVM 中决定分类边界的点是？", "options": ["所有样本点", "支持向量", "离边界最远的点", "标签为 0 的点"], "answer": 1, "explain": "只有支持向量进入约束的等号，其他点删掉不影响 w 与 b。"}, {"id": "ch09-q0902", "chapterId": "ch09", "type": "single", "question": "惩罚参数 C 增大，通常会导致？", "options": ["间隔变宽，偏差增大", "间隔变窄，更容易过拟合", "模型变成线性回归", "支持向量消失"], "answer": 1, "explain": "C 大意味着不容忍越界，边界被拉紧贴住样本，方差上升。"}, {"id": "ch09-q0903", "chapterId": "ch09", "type": "blank", "question": "核函数的作用是隐式地把数据映射到________空间。", "options": [], "answer": "高维", "explain": "在高维空间更容易线性可分，核技巧避免显式计算高维坐标。"}, {"id": "ch10-q1001", "chapterId": "ch10", "type": "single", "question": "K-means 必须预先确定的是？", "options": ["距离度量", "聚类数 k", "特征个数", "样本标签"], "answer": 1, "explain": "k 是超参数，通常用肘部法或轮廓系数辅助选择。"}, {"id": "ch10-q1002", "chapterId": "ch10", "type": "single", "question": "PCA 中「贡献率」指的是？", "options": ["某个样本的解释比例", "某主成分特征值占全部特征值之和的比例", "分类准确率", "变量个数占比"], "answer": 1, "explain": "特征值代表该方向上的方差，占比即该主成分保留的信息比例。"}, {"id": "ch10-q1003", "chapterId": "ch10", "type": "blank", "question": "有标签、要给新样本归类的分析叫________分析。", "options": [], "answer": "判别", "explain": "判别分析先学类别再分类；聚类没有标签。"}, {"id": "ch11-q1101", "chapterId": "ch11", "type": "single", "question": "多重共线性的典型后果是？", "options": ["模型无法求解", "回归系数方差变大、符号可能反常", "R² 一定下降", "样本量自动减少"], "answer": 1, "explain": "共线让设计矩阵接近奇异，系数估计对数据扰动极度敏感。"}, {"id": "ch11-q1102", "chapterId": "ch11", "type": "single", "question": "PLS 与 PCA 的核心区别是？", "options": ["PLS 不做降维", "PLS 提取成分时同时考虑与 Y 的相关", "PCA 只能用于分类", "PLS 不需要数据"], "answer": 1, "explain": "PCA 只看 X 的方差，PLS 看 X 与 Y 的协方差。"}, {"id": "ch11-q1103", "chapterId": "ch11", "type": "blank", "question": "判断变量重要性常用指标是________值，通常大于 1 视为重要。", "options": [], "answer": "VIP", "explain": "VIP 综合了各成分对 Y 的解释力与变量在成分上的载荷。"}, {"id": "ch12-q1201", "chapterId": "ch12", "type": "single", "question": "模拟退火中温度 T 的主要作用是？", "options": ["控制迭代次数", "控制接受较差解的概率", "决定编码长度", "计算适应度"], "answer": 1, "explain": "P = exp(−Δ/T)，T 越大越容易接受差解，用于跳出局部最优。"}, {"id": "ch12-q1202", "chapterId": "ch12", "type": "single", "question": "TSP 使用遗传算法时，普通交叉会导致？", "options": ["收敛过快", "路径中出现重复或缺失城市", "适应度无法计算", "种群规模爆炸"], "answer": 1, "explain": "普通单点交叉会重复片段，必须用顺序交叉等保序算子。"}, {"id": "ch12-q1203", "chapterId": "ch12", "type": "blank", "question": "启发式算法论文必须报告多次独立运行的________，而不只是最好值。", "options": [], "answer": "分布（平均值与标准差）", "explain": "单次结果无法区分「算法稳定」与「运气好」。"}, {"id": "ch13-q1301", "chapterId": "ch13", "type": "single", "question": "灰度化时绿色通道权重最大的原因是？", "options": ["绿色像素最多", "人眼对绿光最敏感", "绿色通道噪声最小", "计算方便"], "answer": 1, "explain": "加权系数按人眼亮度感知设定，绿光权重 0.587 最高。"}, {"id": "ch13-q1302", "chapterId": "ch13", "type": "single", "question": "椒盐噪声最适合用哪种滤波？", "options": ["均值滤波", "中值滤波", "高通滤波", "直方图均衡"], "answer": 1, "explain": "中值滤波能剔除极端值同时保住边缘，均值会把噪声摊到整片区域。"}, {"id": "ch13-q1303", "chapterId": "ch13", "type": "blank", "question": "3×3 均值滤波窗口中，每个位置的权重是________。", "options": [], "answer": "1/9", "explain": "九个像素等权平均，总和为 1，保证整体亮度不漂移。"}, {"id": "ch14-q1401", "chapterId": "ch14", "type": "single", "question": "成本型指标标准化时应该？", "options": ["直接除以最大值", "用 (max − x)/(max − min)", "取对数", "平方后归一"], "answer": 1, "explain": "成本型越小越好，极差法要反向，使标准化后仍是越大越好。"}, {"id": "ch14-q1402", "chapterId": "ch14", "type": "single", "question": "熵权法的权重反映的是？", "options": ["指标的业务重要性", "指标在方案间的区分度", "指标间的相关性", "样本量大小"], "answer": 1, "explain": "熵小说明分布不均、区分度大，权重高；与重要性无必然关系。"}, {"id": "ch14-q1403", "chapterId": "ch14", "type": "blank", "question": "TOPSIS 通过计算方案到正理想解与负理想解的________来排序。", "options": [], "answer": "距离", "explain": "离正理想越近、离负理想越远，综合得分越高。"}, {"id": "ch15-q1501", "chapterId": "ch15", "type": "single", "question": "GM(1,1) 适合的数据特征是？", "options": ["大样本、强季节性", "小样本、近似指数趋势", "状态离散、转移稳定", "多变量非线性"], "answer": 1, "explain": "GM 通过一次累加把序列变成近似指数，适合数据点少的单调趋势。"}, {"id": "ch15-q1502", "chapterId": "ch15", "type": "single", "question": "ARIMA 中的 d 表示？", "options": ["差分次数", "自回归阶数", "移动平均阶数", "样本量"], "answer": 0, "explain": "d 是把非平稳序列差分成平稳序列所需的次数。"}, {"id": "ch15-q1503", "chapterId": "ch15", "type": "blank", "question": "评估预测精度必须做________检验，而不是只看样本内拟合。", "options": [], "answer": "样本外", "explain": "样本内拟合优度高不代表泛化能力好，留出末段数据做真实验证才有意义。"}, {"id": "ch16-q1601", "chapterId": "ch16", "type": "single", "question": "Pareto 有效解的含义是？", "options": ["所有目标都最大", "不存在全面更优的解", "加权和最大的解", "约束最少的解"], "answer": 1, "explain": "有效解指不被任何其他解全面超越，可能有很多个。"}, {"id": "ch16-q1602", "chapterId": "ch16", "type": "single", "question": "加权和法的主要局限是？", "options": ["不能处理两个以上目标", "非凸前沿上会漏掉中间解", "必须用整数规划", "权重必须相等"], "answer": 1, "explain": "加权和只能取到支撑点，非凸部分取不到，需改用 ε 约束法。"}, {"id": "ch16-q1603", "chapterId": "ch16", "type": "blank", "question": "目标规划中 d⁺ 表示实际值相对目标值的________量。", "options": [], "answer": "超出", "explain": "d⁺ 是正偏差（超出），d⁻ 是负偏差（不足），两者不能同时非零。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "线性规划的最优解一定在哪里？", "back": "可行域的顶点（或边界），只要最优解存在", "tags": ["线性规划", "几何"]}, {"id": "f02", "chapterId": "ch01", "front": "影子价格的含义？", "back": "约束右端项每增加一个单位，目标函数能增加的量，等于对偶变量", "tags": ["线性规划", "对偶"]}, {"id": "f03", "chapterId": "ch01", "front": "影子价格为 0 说明什么？", "back": "该约束未起作用，资源有闲置，追加投入不改变最优值", "tags": ["线性规划", "排错"]}, {"id": "f04", "chapterId": "ch02", "front": "为什么整数规划不能解完取整？", "back": "取整可能违反约束，也可能错过更优的格点，例：max 3x₁+4x₂, 3x₁+5x₂≤8 真正最优是 (1,1) 得 7", "tags": ["整数规划", "常见错误"]}, {"id": "f05", "chapterId": "ch02", "front": "0-1 变量怎么表达「最多选一个」？", "back": "y_A + y_B ≤ 1", "tags": ["整数规划", "建模技巧"]}, {"id": "f06", "chapterId": "ch02", "front": "分枝定界的剪枝依据？", "back": "节点的线性松弛值已不如现有整数解，该分支不可能更优", "tags": ["整数规划", "算法"]}, {"id": "f07", "chapterId": "ch03", "front": "凸规划的好处？", "back": "局部最优即全局最优，梯度类算法不会停在半山腰", "tags": ["非线性规划"]}, {"id": "f08", "chapterId": "ch03", "front": "KKT 互补松弛的含义？", "back": "约束未起作用时乘子为零，起作用时乘子可正，λᵢgᵢ = 0", "tags": ["非线性规划", "理论"]}, {"id": "f09", "chapterId": "ch04", "front": "Dijkstra 的前提条件？", "back": "边权非负；有负权要改 Bellman-Ford 或 Floyd", "tags": ["图论", "算法"]}, {"id": "f10", "chapterId": "ch04", "front": "最短路与最小生成树的区别？", "back": "前者求一对点之间路径最短，后者求连通全图的边集总权最小", "tags": ["图论"]}, {"id": "f11", "chapterId": "ch04", "front": "n 个点的生成树有几条边？", "back": "n−1 条，且无环、连通", "tags": ["图论", "基础"]}, {"id": "f12", "chapterId": "ch05", "front": "插值与拟合的根本区别？", "back": "插值必须穿过每个数据点，拟合只要求整体误差最小", "tags": ["插值拟合"]}, {"id": "f13", "chapterId": "ch05", "front": "Runge 现象说明什么？", "back": "等距节点上提高多项式次数，边缘振荡加剧，误差反而变大", "tags": ["插值拟合", "常见错误"]}, {"id": "f14", "chapterId": "ch05", "front": "三次样条比高次多项式好在哪？", "back": "分段低次、节点处一二阶导数连续，稳定且光滑", "tags": ["插值拟合"]}, {"id": "f15", "chapterId": "ch06", "front": "微分方程建模的第一步？", "back": "找出「变化率等于什么」，即把机制写成 dX/dt = f", "tags": ["微分方程"]}, {"id": "f16", "chapterId": "ch06", "front": "Euler 法与 RK4 的精度阶数？", "back": "Euler 一阶，RK4 四阶；步长减半可检验收敛性", "tags": ["微分方程", "数值解"]}, {"id": "f17", "chapterId": "ch06", "front": "R₀ 的定义与含义？", "back": "R₀ = β/γ，一个感染者平均传染的人数，大于 1 疫情扩散", "tags": ["微分方程", "传染病"]}, {"id": "f18", "chapterId": "ch07", "front": "p 值的准确含义？", "back": "H₀ 为真时，出现当前或更极端结果的概率，不是 H₀ 为真的概率", "tags": ["统计", "假设检验"]}, {"id": "f19", "chapterId": "ch07", "front": "不拒绝 H₀ 该怎么表述？", "back": "没有足够证据说明有差异，不能说「两者相等」", "tags": ["统计", "表述"]}, {"id": "f20", "chapterId": "ch07", "front": "Bootstrap 的核心操作？", "back": "有放回重抽样，重复计算统计量，用其分布代替理论抽样分布", "tags": ["统计"]}, {"id": "f21", "chapterId": "ch08", "front": "一阶差分方程 xₙ₊₁ = axₙ + b 的平衡点？", "back": "x* = b/(1−a)，稳定条件 |a| < 1", "tags": ["差分方程"]}, {"id": "f22", "chapterId": "ch08", "front": "Leslie 矩阵的结构？", "back": "首行各年龄组繁殖率，次对角线为存活率，主特征值定长期增长率", "tags": ["差分方程", "种群"]}, {"id": "f23", "chapterId": "ch09", "front": "SVM 的间隔公式？", "back": "2/‖w‖，要求支持向量处 wᵀx + b = ±1", "tags": ["SVM"]}, {"id": "f24", "chapterId": "ch09", "front": "SVM 的 C 增大意味着什么？", "back": "更不容忍越界，间隔变窄，方差上升，容易过拟合", "tags": ["SVM", "调参"]}, {"id": "f25", "chapterId": "ch09", "front": "核函数的作用？", "back": "隐式映射到高维，使线性不可分变可分，无需算高维坐标", "tags": ["SVM"]}, {"id": "f26", "chapterId": "ch10", "front": "聚类与判别的区别？", "back": "聚类无标签按相似度分组，判别有标签学分类规则", "tags": ["多元分析"]}, {"id": "f27", "chapterId": "ch10", "front": "PCA 的贡献率是什么？", "back": "某主成分特征值占全部特征值之和的比例，即保留的方差份额", "tags": ["多元分析", "降维"]}, {"id": "f28", "chapterId": "ch10", "front": "PCA 与因子分析的区别？", "back": "PCA 是线性变换无模型假设，因子分析假设潜在因子生成观测变量", "tags": ["多元分析"]}, {"id": "f29", "chapterId": "ch11", "front": "多重共线性的后果？", "back": "系数方差大、符号反常、可解释性丧失，VIF > 10 是常见判据", "tags": ["回归", "偏最小二乘"]}, {"id": "f30", "chapterId": "ch11", "front": "PLS 与 PCA 的关键差别？", "back": "PLS 提取成分时同时考虑与 Y 的协方差，PCA 只看 X 的方差", "tags": ["偏最小二乘"]}, {"id": "f31", "chapterId": "ch12", "front": "模拟退火的接受概率？", "back": "P = exp(−Δ/T)，Δ 为变差量，T 为温度，温度高更易接受差解", "tags": ["启发式算法"]}, {"id": "f32", "chapterId": "ch12", "front": "遗传算法五件套？", "back": "编码、适应度、选择、交叉、变异", "tags": ["启发式算法"]}, {"id": "f33", "chapterId": "ch12", "front": "启发式结果必须报告什么？", "back": "多次独立运行的最好值、平均值、标准差，而不只是最好值", "tags": ["启发式算法", "论文规范"]}, {"id": "f34", "chapterId": "ch13", "front": "图像在计算机里是什么？", "back": "灰度图是 m×n 矩阵，彩色图是 m×n×3 的三通道矩阵", "tags": ["图像处理"]}, {"id": "f35", "chapterId": "ch13", "front": "均值滤波与中值滤波的取舍？", "back": "均值去噪但糊边，中值保边、适合椒盐噪声", "tags": ["图像处理"]}, {"id": "f36", "chapterId": "ch14", "front": "综合评价的四步？", "back": "定指标、标准化、定权重、合成排序", "tags": ["综合评价"]}, {"id": "f37", "chapterId": "ch14", "front": "熵权法权重反映什么？", "back": "指标在方案间的区分度，不是业务重要性", "tags": ["综合评价", "权重"]}, {"id": "f38", "chapterId": "ch14", "front": "TOPSIS 的排序依据？", "back": "到正理想解与负理想解的欧氏距离，离正近、离负远者优", "tags": ["综合评价"]}, {"id": "f39", "chapterId": "ch15", "front": "GM(1,1) 适合什么数据？", "back": "小样本、近似指数趋势的单调序列，先做级比检验", "tags": ["预测"]}, {"id": "f40", "chapterId": "ch15", "front": "预测精度必须包含什么？", "back": "样本外检验指标（MAE/RMSE/MAPE）与预测区间", "tags": ["预测", "论文规范"]}, {"id": "f41", "chapterId": "ch16", "front": "Pareto 有效解？", "back": "不存在所有目标都不差且至少一个更好的解，多目标输出的是前沿", "tags": ["多目标"]}, {"id": "f42", "chapterId": "ch16", "front": "加权和法的局限？", "back": "非凸 Pareto 前沿上会漏掉中间解，只能取到支撑点", "tags": ["多目标"]}, {"id": "f43", "chapterId": "ch16", "front": "目标规划中的偏差变量？", "back": "d⁺ 为超出目标的量，d⁻ 为不足的量，两者不能同时非零", "tags": ["多目标", "目标规划"]}], "companion": "modeling学习伴侣.html"}, "rendered": {"ch01": "<h1>第 1 章：线性规划<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：起步册第 1–3 章 | <strong>原书定位<\/strong>：第 1 章 p1–17\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n把「资源有限、要最大化收益」的问题写成标准线性规划；\n<\/li><li>\n手算二元线性规划的可行域顶点并验证最优解；\n<\/li><li>\n说清影子价格的含义，并用它回答「多一小时工时值多少钱」。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>线性规划只做一件事：在凸多边形的可行域里找一个顶点，让目标函数最大。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：线性到底指什么（难度：基础）<\/h3>\n<p><strong>线性规划（LP）<\/strong>：目标函数和每条约束都是决策变量的一次式，变量之间只加减、不乘除、不平方。<\/p>\n<p>为什么这个限制重要？因为它保证可行域是凸的。凸集合有一个好性质：目标函数在边界上的最大值一定能在某个顶点取到。于是「在无穷多个可行解里找最优」变成「把有限个顶点各算一算」。<\/p>\n<h3>概念 2：标准型（难度：基础）<\/h3>\n<p>教材的统一写法是：<\/p>\n<pre class=\"lang-text\"><code>max  z = c₁x₁ + c₂x₂ + … + cₙxₙ\ns.t. a₁₁x₁ + … + a₁ₙxₙ ≤ b₁\n     ……\n     xⱼ ≥ 0<\/code><\/pre>\n<p>min 型、≥ 型、无约束变量，都能通过取负、加松弛变量、拆成两个非负变量转成标准型。软件内部做的就是这套转换，你只要按它的接口喂数。<\/p>\n<h3>概念 3：可行域与顶点（难度：基础）<\/h3>\n<p><strong>可行域<\/strong>：所有满足约束的点组成的集合。二维时画出来是一个多边形。<\/p>\n<p><strong>顶点<\/strong>：两条约束线的交点。线性规划的最优解（如果存在）一定能在顶点上找到。这也是为什么单纯形法只沿顶点走，不算内部。<\/p>\n<h3>概念 4：影子价格（难度：进阶）<\/h3>\n<p><strong>影子价格<\/strong>：某个资源约束的右端项每增加一个单位，目标函数能增加多少。<\/p>\n<p>它等于对偶变量。含义很实用：如果 A 机器工时每小时影子价格是 1 千元，而加班成本是每小时 0.6 千元，那加班划算；反之不划算。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[资源限制与收益] --&gt; B[写目标函数]\n    B --&gt; C[写约束不等式]\n    C --&gt; D[画可行域]\n    D --&gt; E[枚举顶点]\n    E --&gt; F[取目标值最大的顶点]\n    F --&gt; G[影子价格与决策建议]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：注意「枚举顶点」这一步在二维才手工可行，三维以上必须交给单纯形法或软件。图里没有「检验」这一步，因为线性规划的解一定满足约束，要检验的是模型假设是否符合现实。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：线性规划像在有限预算内点菜，菜价和预算是线性的，你要在预算线内选组合让满意度最高。失效边界：真实偏好不是线性的，点多了会腻，这时候模型算出的「全点最贵那道」并不最优。\n<\/li><li>\n<strong>实例（可手算核对）<\/strong>：某机床厂生产甲、乙两种机床，单台利润 4 千元与 3 千元。甲需 A 机器 2 h、B 机器 1 h；乙需 A、B、C 各 1 h。每天可用工时 A 10 h、B 8 h、C 7 h。\n<p>模型：max z = 4x₁ + 3x₂，s.t. 2x₁ + x₂ ≤ 10，x₁ + x₂ ≤ 8，x₂ ≤ 7，x₁,x₂ ≥ 0。 顶点：两线交点为 (2, 6)；与 x₂ 轴交 (0, 10) 越界，取 (0, 7)；(1, 7) 处 z = 25；(5, 0) 处 z = 20；(2, 6) 处 z = 26。最优 (2, 6)，日利润 2.6 万元。 影子价格核对：把 A 的可用工时从 10 改到 11，前两条约束交点变成 (3, 5)，z = 12 + 15 = 27，比 26 多 1。所以 A 的每小时影子价格为 1 千元。<\/p>\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为变量越多模型越准——实际上每加一个变量，就多一组约束要交代，没数据支撑的变量只会让解失去意义。\n<\/li><li>\n别以为最优解一定在可行域内部——实际上线性规划的最优解几乎总在边界顶点，内部点最优只发生在目标函数是常数时。\n<\/li><li>\n别以为算出「无界」是软件坏了——实际上是你漏了上界约束，比如「产量不限」这种假设，会让利润无限增大。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】线性规划的可行域一定是？<\/h3>\n<ul><li>\nA. 凸多边形或凸多面体\n<\/li><li>\nB. 圆形\n<\/li><li>\nC. 任意形状\n<\/li><li>\nD. 一条曲线\n<p><strong>答案<\/strong>：A <strong>解析<\/strong>：线性不等式组的交集是凸集，二维时表现为凸多边形，这也是顶点枚举有效的原因。<\/p>\n<\/ul>\n<h3>Q2 【单选】某约束的影子价格为 0，说明？<\/h3>\n<ul><li>\nA. 该资源完全用尽\n<\/li><li>\nB. 该资源还有剩余，再增加它不能提高目标值\n<\/li><li>\nC. 模型无解\n<\/li><li>\nD. 该约束写错了\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：影子价格为零意味着该约束不是紧约束，资源尚有闲置，追加投入不改变最优值。<\/p>\n<\/ul>\n<h3>Q3 【填空】把 max z 转成 scipy 能接受的形式，需要把目标系数全部________。<\/h3>\n<p><strong>答案<\/strong>：取负 <strong>解析<\/strong>：<code>linprog<\/code> 只做最小化，最大化问题等价于最小化 −z，最后把结果取负还原。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n线性 = 一次式，所以可行域凸，最优解在顶点。\n<\/li><li>\n标准型只有 ≤ 与非负约束，其余形式都靠转换。\n<\/li><li>\n影子价格 = 右端项加一单位带来的目标增量，用来判断资源该不该追加。\n<\/ul>", "ch02": "<h1>第 2 章：整数规划<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 1 章 | <strong>原书定位<\/strong>：第 2 章 p18–36\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n判断一个问题为什么不能直接把线性规划的解四舍五入；\n<\/li><li>\n用分枝定界的手算流程解一个二元小例子；\n<\/li><li>\n把「要么选要么不选」写成 0-1 变量，把指派问题写成 0-1 规划。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>整数规划难，不是因为约束多，而是因为可行域被切成了一堆散点，线性规划那套「沿顶点走」的几何直觉失效了。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：整数约束为什么破坏结构（难度：基础）<\/h3>\n<p>线性规划的最优解出现在顶点，顶点是连续的。要求 x 取整数后，可行点变成离散的格点，最优格点可能离原来的顶点很远。<\/p>\n<p>一个例子就够：max z = 3x₁ + 4x₂，s.t. 3x₁ + 5x₂ ≤ 8，x₁, x₂ ≥ 0。<\/p>\n<p>连续最优是 (2.667, 0)，z = 8。四舍五入到 (3, 0)，代回约束 3×3 = 9 &gt; 8，直接不可行。退一步取 (2, 0)，z = 6。真正的整数最优是 (1, 1)，z = 3 + 4 = 7，比取整结果高出一档。<\/p>\n<p>一个例子同时暴露两种病：取整可能破坏约束，取整也可能错过更优的格点。这两点就是整数规划不能用「解完取整」的全部理由。<\/p>\n<h3>概念 2：0-1 变量（难度：基础）<\/h3>\n<p><strong>0-1 变量<\/strong>：只取 0 或 1 的变量，用来表达「选或不选」。它是整数规划最常用的建模零件。<\/p>\n<p>常用写法：<\/p>\n<ul><li>\n选第 j 个方案：yⱼ ∈ {0,1}，目标里写 cⱼyⱼ。\n<\/li><li>\n最多选 k 个：∑yⱼ ≤ k。\n<\/li><li>\nA 与 B 不能同时选：y_A + y_B ≤ 1。\n<\/li><li>\n选了 A 才能选 B：y_B ≤ y_A。\n<\/ul>\n<h3>概念 3：分枝定界（难度：进阶）<\/h3>\n<p><strong>分枝定界<\/strong>：先解连续松弛，得到一个小数解；挑一个取小数的变量，把它分成「≤ 下取整」和「≥ 上取整」两支，分别再解；用已找到的整数解作为上界，剪掉不可能更好的分支。<\/p>\n<p>手算流程（以上面的 max 3x₁ + 4x₂，3x₁ + 5x₂ ≤ 8 为例）：<\/p>\n<ol><li>\n松弛解 x = (2.667, 0)，z = 8，这是上界。\n<\/li><li>\n对 x₁ 分枝：x₁ ≤ 2 与 x₁ ≥ 3。x₁ ≥ 3 时 3x₁ ≥ 9 &gt; 8，不可行，剪掉。\n<\/li><li>\nx₁ ≤ 2 分支：约束变 3x₁ + 5x₂ ≤ 8，x₁ ≤ 2，解出 x₁ = 2, x₂ = 0.4，z = 6 + 1.6 = 7.6。\n<\/li><li>\n再对 x₂ 分枝：x₂ ≤ 0 得 (2, 0)，z = 6；x₂ ≥ 1 得 x₁ ≤ 1，解 (1, 1)，z = 7。\n<\/li><li>\n比较整数解 6 与 7，取 7。上界 8 已无法再改进，停止。\n<\/ol>\n<p>分枝定界慢，但保证找到最优；启发式（如贪心）快，但不保证。比赛里题目规模小就用精确算法，规模大就用启发式并在论文里说明「近似」。<\/p>\n<h3>概念 4：指派问题（难度：进阶）<\/h3>\n<p>n 个人做 n 件事，每人做每件事的成本不同，求总成本最小的分配。模型是 0-1 规划：xᵢⱼ = 1 表示第 i 人做第 j 事，每行和为 1、每列和为 1。它的特殊结构可以用匈牙利算法在多项式时间求解，不必用通用整数规划。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[连续松弛解] --&gt; B{是否全为整数}\n    B --&gt;|是| C[得到最优整数解]\n    B --&gt;|否| D[选一个小数变量分枝]\n    D --&gt; E[左支 向下取整]\n    D --&gt; F[右支 向上取整]\n    E --&gt; G[重解并更新上界]\n    F --&gt; G\n    G --&gt; B<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这是一棵搜索树，每个节点都是一次线性规划。剪枝的依据是「这个节点的松弛上界已经不如现有整数解」，没有这个上界，树会指数爆炸。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：整数规划像在一堆整箱货物里装箱，箱子不能拆开。线性规划允许你把箱子切开凑重量，整数规划不允许。失效边界：现实里有时允许拆，比如散装货物，那就退回线性规划。\n<\/li><li>\n<strong>实例（可手算）<\/strong>：背包容量 5，三件物品重量与价值分别为 (2, 3)、(3, 4)、(4, 5)。枚举 8 种组合：只选 1 得 3；选 2 得 4；选 3 重量 4 得 5；选 1+2 重量 5 得 7；1+3 重量 6 超重；2+3 重量 7 超重；三件全选超重。最优是选第 1、2 件，价值 7。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为把线性规划解四舍五入就行——实际上可能既不可行也不是最优，必须验证约束。\n<\/li><li>\n别以为整数规划只是「加个取整」——实际上它的求解复杂度高一个量级，很多问题是 NP 难的。\n<\/li><li>\n别以为 0-1 变量只能表示选择——实际上它还能表示「启动成本」「是否开启一条产线」这类固定费用。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】线性规划松弛解为 (2.67, 0)，下列做法正确的是？<\/h3>\n<ul><li>\nA. 直接四舍五入得 (3, 0)\n<\/li><li>\nB. 以松弛解为上界做分枝定界\n<\/li><li>\nC. 认为问题无解\n<\/li><li>\nD. 把约束改成等式\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：松弛解给出上界，分枝定界在此之上搜索整数解；直接取整可能违反约束。<\/p>\n<\/ul>\n<h3>Q2 【单选】「A、B 两个项目最多上一个」应写成？<\/h3>\n<ul><li>\nA. y_A + y_B ≤ 1\n<\/li><li>\nB. y_A + y_B ≥ 1\n<\/li><li>\nC. y_A − y_B ≤ 1\n<\/li><li>\nD. y_A × y_B ≤ 1\n<p><strong>答案<\/strong>：A <strong>解析<\/strong>：两个 0-1 变量之和不超过 1，恰好表达「至多选一个」；乘积不是线性式，不能出现在线性约束里。<\/p>\n<\/ul>\n<h3>Q3 【填空】指派问题的约束特点是每行之和为 1、每列之和为________。<\/h3>\n<p><strong>答案<\/strong>：1 <strong>解析<\/strong>：一个人只做一件事、一件事只由一个人做，两个方向都恰好为 1，这才构成合法指派。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n整数约束把连续可行域切成格点，几何直觉失效。\n<\/li><li>\n0-1 变量是表达选择、互斥、依赖的标准零件。\n<\/li><li>\n分枝定界靠松弛上界剪枝，规模大时改用启发式并说明精度。\n<\/ul>", "ch03": "<h1>第 3 章：非线性规划<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 1 章、起步册第 2 章 | <strong>原书定位<\/strong>：第 3 章 p37–61\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n判断一个非线性规划是凸的还是可能有多个局部最优；\n<\/li><li>\n写出 KKT 条件，并用它手算一个带线性约束的极小值问题；\n<\/li><li>\n说清「罚函数」和「序列二次规划」分别在什么场景下用。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>线性规划只有一个最优解，非线性规划可能有一堆，算法只保证找到其中一个——所以凸性比算法更重要。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：凸函数与凸规划（难度：基础）<\/h3>\n<p><strong>凸函数<\/strong>：图像上任意两点连线都在函数图像上方（碗形）。判定方法：二阶导数（一元）或海森矩阵（多元）半正定。<\/p>\n<p><strong>凸规划<\/strong>：目标函数凸、可行域凸。它的局部最优就是全局最优，梯度类算法不会掉进坑里。<\/p>\n<p>建模时要先问一句：我的目标函数凸吗？如果凸，放心用算法；如果不凸，要么换建模方式，要么用多起点搜索。<\/p>\n<h3>概念 2：KKT 条件（难度：进阶）<\/h3>\n<p><strong>KKT 条件<\/strong>：带约束的极值点必须满足的一组条件，包括：<\/p>\n<ol><li>\n梯度平衡：∇f + ∑λᵢ∇gᵢ = 0，即目标函数的梯度被约束的梯度「抵消」；\n<\/li><li>\n可行性：所有约束满足；\n<\/li><li>\n互补松弛：λᵢgᵢ = 0，约束没起作用时乘子为零，起作用时乘子可以为正；\n<\/li><li>\n乘子非负（不等式约束）。\n<\/ol>\n<p>一句话理解：在最优点，你没法沿着任何可行方向再改善目标，因为改善方向都被约束挡住了。<\/p>\n<h3>概念 3：二次规划（难度：进阶）<\/h3>\n<p><strong>二次规划（QP）<\/strong>：目标函数是二次型，约束是线性的。它是非线性规划里最好解的一类，有成熟算法。<\/p>\n<p>判断标准：目标函数写成 ½xᵀHx + fᵀx，H 半正定则凸。投资组合、最小二乘、支持向量机都归到这里。<\/p>\n<h3>概念 4：罚函数与启发式（难度：进阶）<\/h3>\n<ul><li>\n<strong>罚函数法<\/strong>：把约束违反量加到目标里，min f(x) + M·max(0, g(x))²，M 逐渐增大。优点是简单，缺点是大 M 会让数值病态。\n<\/li><li>\n<strong>梯度法/牛顿法<\/strong>：沿负梯度方向走，牛顿法用二阶信息，收敛快但对初值敏感。\n<\/li><li>\n<strong>启发式<\/strong>：不保证最优，只求可用解。目标函数不可导、变量多、有整数约束时常用。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[非线性模型] --&gt; B{目标与可行域是否凸}\n    B --&gt;|凸| C[梯度法 牛顿法 内点法]\n    B --&gt;|非凸| D{规模大小}\n    D --&gt;|小| E[多起点搜索]\n    D --&gt;|大| F[遗传算法 退火 粒子群]\n    C --&gt; G[得到全局最优]\n    E --&gt; H[得到较优解 需报告多起点结果]\n    F --&gt; H<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：凸性判断在第二步，很多人跳过它直接调算法，结果在非凸问题上反复得到不同的局部最优，却以为是算法不稳定。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：凸规划像碗底放球，怎么滚都滚到最低点；非凸规划像山地地形，球可能停在半山腰的小坑里。失效边界：真实优化问题常有多个「小坑」，球的起点决定结果，所以要多起点。\n<\/li><li>\n<strong>实例（可手算）<\/strong>：min f = (x₁ − 1)² + (x₂ − 2)²，s.t. x₁ + x₂ ≤ 2。\n<p>无约束最优点是 (1, 2)，但 1 + 2 = 3 &gt; 2，不可行。 最优点必在边界 x₁ + x₂ = 2 上。把 (1, 2) 投影到这条线上：沿法向 (1,1) 移动，移动量 = (3 − 2)/2 = 0.5，得 (0.5, 1.5)。 代回 f = (0.5 − 1)² + (1.5 − 2)² = 0.25 + 0.25 = 0.5。 KKT 核对：∇f = (2(x₁−1), 2(x₂−2)) = (−1, −1)，约束梯度 (1, 1)，取 λ = 1 得 (−1,−1) + 1×(1,1) = 0，满足梯度平衡。<\/p>\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为软件返回「优化成功」就是全局最优——实际上局部算法只保证局部，非凸问题必须多起点或换全局算法。\n<\/li><li>\n别以为约束越多越安全——实际上新增约束可能让可行域变成空集，求解器报 status=2。\n<\/li><li>\n别以为非线性规划一定比线性规划高级——实际上能用线性模型解决的问题，用非线性只会增加不确定性。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】判断多元目标函数是否凸，主要看？<\/h3>\n<ul><li>\nA. 一阶导数是否为零\n<\/li><li>\nB. 海森矩阵是否半正定\n<\/li><li>\nC. 变量个数\n<\/li><li>\nD. 约束个数\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：海森矩阵半正定等价于函数凸，这是一元二阶导数判据的推广。<\/p>\n<\/ul>\n<h3>Q2 【单选】KKT 条件中「互补松弛」的含义是？<\/h3>\n<ul><li>\nA. 所有约束都必须取等号\n<\/li><li>\nB. 约束未起作用时对应乘子为零\n<\/li><li>\nC. 乘子必须为负\n<\/li><li>\nD. 目标函数必须为零\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：λᵢgᵢ = 0 表示约束与乘子至少一个为零，未起作用的约束不产生「价格」。<\/p>\n<\/ul>\n<h3>Q3 【填空】把 (1, 2) 投影到直线 x₁ + x₂ = 2 上，得到的点是________。<\/h3>\n<p><strong>答案<\/strong>：(0.5, 1.5) <strong>解析<\/strong>：沿法向 (1,1) 移动 (3−2)/2 = 0.5，坐标各减 0.5。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n凸性决定算法能不能信，先判凸再选方法。\n<\/li><li>\nKKT 是「无法再改善」的数学表达，互补松弛是核心。\n<\/li><li>\n非凸问题必须多起点，并在论文里报告不同起点的结果。\n<\/ul>", "ch04": "<h1>第 4 章：图与网络模型及方法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 1–3 章 | <strong>原书定位<\/strong>：第 4 章 p62–112\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n把「点与点之间有关系」的问题画成图，写出邻接矩阵；\n<\/li><li>\n手跑 Dijkstra 求最短路，手跑 Kruskal 求最小生成树；\n<\/li><li>\n分清最短路、最小生成树、最大流、TSP、关键路径五类问题各自的用途。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>图论建模的本质是选对问题类型：同一张图，问法不同，算法完全不同。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：图的三种存法（难度：基础）<\/h3>\n<p><strong>图<\/strong>：点（顶点）和边组成的结构。边有方向叫有向图，带数字叫带权图。<\/p>\n<p>三种存法各有用途：<\/p>\n<ul><li>\n<strong>邻接矩阵<\/strong> A：aᵢⱼ 表示 i 到 j 有没有边或权值。适合稠密图，矩阵运算方便。\n<\/li><li>\n<strong>邻接表<\/strong>：每个点存一个邻居列表。适合稀疏图，省空间。\n<\/li><li>\n<strong>边列表<\/strong>：只存 (起点, 终点, 权重)。适合 Kruskal 这类按边排序的算法。\n<\/ul>\n<h3>概念 2：最短路（难度：基础）<\/h3>\n<p><strong>Dijkstra 算法<\/strong>：从起点出发，每次从未确定的点里挑距离最小的，用它去更新邻居，直到所有点确定。要求边权非负。<\/p>\n<p>手算例子：5 个点，边与权值 1-2: 2、1-3: 5、2-3: 1、2-4: 4、3-4: 2、3-5: 6、4-5: 1。<\/p>\n<ol><li>\n起点 1，距离表：1=0，2=2，3=5，4=∞，5=∞。\n<\/li><li>\n选 2，更新：3 = min(5, 2+1) = 3；4 = min(∞, 2+4) = 6。\n<\/li><li>\n选 3（距离 3），更新：4 = min(6, 3+2) = 5；5 = 3+6 = 9。\n<\/li><li>\n选 4（距离 5），更新：5 = min(9, 5+1) = 6。\n<\/li><li>\n选 5，结束。最短路 1→2→3→4→5，长度 6。\n<\/ol>\n<p>若边权有负数，Dijkstra 失效，改用 Bellman-Ford 或 Floyd。<\/p>\n<h3>概念 3：最小生成树（难度：基础）<\/h3>\n<p><strong>生成树<\/strong>：连通所有点且不含环的子图，n 个点需要 n−1 条边。<strong>最小生成树<\/strong>是总权重最小的那棵。<\/p>\n<p>Kruskal：把所有边按权重从小到大排序，依次加入，若成环就跳过。上例排序为 2-3:1、4-5:1、1-2:2、3-4:2、1-3:5、3-5:6，取前四条，总权重 1+1+2+2 = 6。<\/p>\n<p>最小生成树回答「怎么连线最省」，最短路回答「从 A 到 B 怎么走最快」，两者不是一回事。<\/p>\n<h3>概念 4：最大流与关键路径（难度：进阶）<\/h3>\n<ul><li>\n<strong>最大流<\/strong>：源点到汇点最多能送多少流量，每条边有容量上限。求解用增广路算法（Ford-Fulkerson / Dinic）。\n<\/li><li>\n<strong>关键路径<\/strong>：项目管理里，从开工到完工的最长路径，路径上的工序没有机动时间，延误一天整体就延误一天。求法是对 AOE 网络做拓扑排序，算最早开始与最晚开始时间。\n<\/ul>\n<h3>概念 5：旅行商问题（难度：高难）<\/h3>\n<p><strong>TSP<\/strong>：从起点出发，遍历所有点各一次再回到起点，求最短路线。它是 NP 难的，点数超过 20 基本只能求近似解，用第 12 章的遗传算法或退火。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[一张带权图] --&gt; B{问什么}\n    B --&gt;|两点间怎么走最快| C[Dijkstra 最短路]\n    B --&gt;|全部连通最省| D[Kruskal 最小生成树]\n    B --&gt;|最多能送多少| E[最大流]\n    B --&gt;|一圈走完最短| F[TSP 启发式]\n    B --&gt;|工期最短| G[关键路径]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：同一个起点问题，五个分支给出五种完全不同的答案。建模时先把「问什么」说清，再选算法。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：最短路像导航软件算最快路线，最小生成树像给几个村子铺自来水管道总长最短。失效边界：导航考虑实时路况，静态图模型不考虑，所以结果可能和实际差很多。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：上例中，从 1 到 5 的最短路是 6；若把 3-5 的权值从 6 改成 2，则 1→3→5 长 3+2 = 5，比 6 更短，Dijkstra 第 3 步就会把 5 更新为 5。这说明算法结果依赖权值，权值错一位，结论全变。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为最短路和最小生成树可以互换——实际上它们的优化对象不同：一个是一对点的路径，一个是全图的边集。\n<\/li><li>\n别以为 Dijkstra 能处理负权——实际上负权会让「已确定」的点被再次改进，算法前提被破坏。\n<\/li><li>\n别以为 TSP 可以用最短路算法解决——实际上 TSP 要求遍历全部点，复杂度高得多。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】n 个点的最小生成树有几条边？<\/h3>\n<ul><li>\nA. n\n<\/li><li>\nB. n−1\n<\/li><li>\nC. n+1\n<\/li><li>\nD. 不确定\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：树的性质：n 个顶点、n−1 条边、无环且连通。<\/p>\n<\/ul>\n<h3>Q2 【单选】Dijkstra 算法不适用的情形是？<\/h3>\n<ul><li>\nA. 边权为正\n<\/li><li>\nB. 存在负权边\n<\/li><li>\nC. 图是稠密图\n<\/li><li>\nD. 图是有向图\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：负权会破坏「已确定点的距离不会再变小」这一前提，需要改用 Bellman-Ford。<\/p>\n<\/ul>\n<h3>Q3 【填空】关键路径上任何一道工序延误，整个工期都会________。<\/h3>\n<p><strong>答案<\/strong>：延误 <strong>解析<\/strong>：关键路径的总时差为零，路径上工序没有机动时间，任一延误直接传导到总工期。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n图有三存法：矩阵、邻接表、边列表，按算法选。\n<\/li><li>\n最短路是
