iz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch10-q1002' data-type='single'><p class='quiz-q'><b>Q2.<\/b> PCA 中「贡献率」指的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch10-q1002' value='0'> 某个样本的解释比例<\/label><label class='quiz-opt'><input type='radio' name='ch10-q1002' value='1'> 某主成分特征值占全部特征值之和的比例<\/label><label class='quiz-opt'><input type='radio' name='ch10-q1002' value='2'> 分类准确率<\/label><label class='quiz-opt'><input type='radio' name='ch10-q1002' value='3'> 变量个数占比<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch10-q1003' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 有标签、要给新样本归类的分析叫________分析。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch11__": "<h1>测验：第 11 章：偏最小二乘回归分析<\/h1><div class='quiz-item' data-qid='ch11-q1101' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 多重共线性的典型后果是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch11-q1101' value='0'> 模型无法求解<\/label><label class='quiz-opt'><input type='radio' name='ch11-q1101' value='1'> 回归系数方差变大、符号可能反常<\/label><label class='quiz-opt'><input type='radio' name='ch11-q1101' value='2'> R² 一定下降<\/label><label class='quiz-opt'><input type='radio' name='ch11-q1101' value='3'> 样本量自动减少<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch11-q1102' data-type='single'><p class='quiz-q'><b>Q2.<\/b> PLS 与 PCA 的核心区别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch11-q1102' value='0'> PLS 不做降维<\/label><label class='quiz-opt'><input type='radio' name='ch11-q1102' value='1'> PLS 提取成分时同时考虑与 Y 的相关<\/label><label class='quiz-opt'><input type='radio' name='ch11-q1102' value='2'> PCA 只能用于分类<\/label><label class='quiz-opt'><input type='radio' name='ch11-q1102' value='3'> PLS 不需要数据<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch11-q1103' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 判断变量重要性常用指标是________值，通常大于 1 视为重要。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch12__": "<h1>测验：第 12 章：现代优化算法<\/h1><div class='quiz-item' data-qid='ch12-q1201' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 模拟退火中温度 T 的主要作用是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch12-q1201' value='0'> 控制迭代次数<\/label><label class='quiz-opt'><input type='radio' name='ch12-q1201' value='1'> 控制接受较差解的概率<\/label><label class='quiz-opt'><input type='radio' name='ch12-q1201' value='2'> 决定编码长度<\/label><label class='quiz-opt'><input type='radio' name='ch12-q1201' value='3'> 计算适应度<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch12-q1202' data-type='single'><p class='quiz-q'><b>Q2.<\/b> TSP 使用遗传算法时，普通交叉会导致？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch12-q1202' value='0'> 收敛过快<\/label><label class='quiz-opt'><input type='radio' name='ch12-q1202' value='1'> 路径中出现重复或缺失城市<\/label><label class='quiz-opt'><input type='radio' name='ch12-q1202' value='2'> 适应度无法计算<\/label><label class='quiz-opt'><input type='radio' name='ch12-q1202' value='3'> 种群规模爆炸<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch12-q1203' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 启发式算法论文必须报告多次独立运行的________，而不只是最好值。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch13__": "<h1>测验：第 13 章：数字图像处理<\/h1><div class='quiz-item' data-qid='ch13-q1301' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 灰度化时绿色通道权重最大的原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch13-q1301' value='0'> 绿色像素最多<\/label><label class='quiz-opt'><input type='radio' name='ch13-q1301' value='1'> 人眼对绿光最敏感<\/label><label class='quiz-opt'><input type='radio' name='ch13-q1301' value='2'> 绿色通道噪声最小<\/label><label class='quiz-opt'><input type='radio' name='ch13-q1301' value='3'> 计算方便<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch13-q1302' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 椒盐噪声最适合用哪种滤波？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch13-q1302' value='0'> 均值滤波<\/label><label class='quiz-opt'><input type='radio' name='ch13-q1302' value='1'> 中值滤波<\/label><label class='quiz-opt'><input type='radio' name='ch13-q1302' value='2'> 高通滤波<\/label><label class='quiz-opt'><input type='radio' name='ch13-q1302' value='3'> 直方图均衡<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch13-q1303' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 3×3 均值滤波窗口中，每个位置的权重是________。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch14__": "<h1>测验：第 14 章：综合评价与决策方法<\/h1><div class='quiz-item' data-qid='ch14-q1401' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 成本型指标标准化时应该？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch14-q1401' value='0'> 直接除以最大值<\/label><label class='quiz-opt'><input type='radio' name='ch14-q1401' value='1'> 用 (max − x)/(max − min)<\/label><label class='quiz-opt'><input type='radio' name='ch14-q1401' value='2'> 取对数<\/label><label class='quiz-opt'><input type='radio' name='ch14-q1401' value='3'> 平方后归一<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch14-q1402' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 熵权法的权重反映的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch14-q1402' value='0'> 指标的业务重要性<\/label><label class='quiz-opt'><input type='radio' name='ch14-q1402' value='1'> 指标在方案间的区分度<\/label><label class='quiz-opt'><input type='radio' name='ch14-q1402' value='2'> 指标间的相关性<\/label><label class='quiz-opt'><input type='radio' name='ch14-q1402' value='3'> 样本量大小<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch14-q1403' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> TOPSIS 通过计算方案到正理想解与负理想解的________来排序。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch15__": "<h1>测验：第 15 章：预测方法<\/h1><div class='quiz-item' data-qid='ch15-q1501' data-type='single'><p class='quiz-q'><b>Q1.<\/b> GM(1,1) 适合的数据特征是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch15-q1501' value='0'> 大样本、强季节性<\/label><label class='quiz-opt'><input type='radio' name='ch15-q1501' value='1'> 小样本、近似指数趋势<\/label><label class='quiz-opt'><input type='radio' name='ch15-q1501' value='2'> 状态离散、转移稳定<\/label><label class='quiz-opt'><input type='radio' name='ch15-q1501' value='3'> 多变量非线性<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch15-q1502' data-type='single'><p class='quiz-q'><b>Q2.<\/b> ARIMA 中的 d 表示？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch15-q1502' value='0'> 差分次数<\/label><label class='quiz-opt'><input type='radio' name='ch15-q1502' value='1'> 自回归阶数<\/label><label class='quiz-opt'><input type='radio' name='ch15-q1502' value='2'> 移动平均阶数<\/label><label class='quiz-opt'><input type='radio' name='ch15-q1502' value='3'> 样本量<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch15-q1503' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 评估预测精度必须做________检验，而不是只看样本内拟合。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch16__": "<h1>测验：第 16 章：多目标规划和目标规划<\/h1><div class='quiz-item' data-qid='ch16-q1601' data-type='single'><p class='quiz-q'><b>Q1.<\/b> Pareto 有效解的含义是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch16-q1601' value='0'> 所有目标都最大<\/label><label class='quiz-opt'><input type='radio' name='ch16-q1601' value='1'> 不存在全面更优的解<\/label><label class='quiz-opt'><input type='radio' name='ch16-q1601' value='2'> 加权和最大的解<\/label><label class='quiz-opt'><input type='radio' name='ch16-q1601' value='3'> 约束最少的解<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch16-q1602' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 加权和法的主要局限是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch16-q1602' value='0'> 不能处理两个以上目标<\/label><label class='quiz-opt'><input type='radio' name='ch16-q1602' value='1'> 非凸前沿上会漏掉中间解<\/label><label class='quiz-opt'><input type='radio' name='ch16-q1602' value='2'> 必须用整数规划<\/label><label class='quiz-opt'><input type='radio' name='ch16-q1602' value='3'> 权重必须相等<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch16-q1603' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 目标规划中 d⁺ 表示实际值相对目标值的________量。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='线性规划'>线性规划 — 目标与约束都是一次式的优化问题，可行域为凸多边形 <span class=glossary-ref>（第 1 章：线性规划）<\/span><\/li><li data-term='标准型'>标准型 — 目标最大化、约束全为 ≤、变量非负的统一写法 <span class=glossary-ref>（第 1 章：线性规划）<\/span><\/li><li data-term='可行域'>可行域 — 所有满足约束的点组成的集合 <span class=glossary-ref>（第 1 章：线性规划）<\/span><\/li><li data-term='顶点'>顶点 — 两条约束线的交点，线性规划最优解的候选位置 <span class=glossary-ref>（第 1 章：线性规划）<\/span><\/li><li data-term='松弛变量'>松弛变量 — 把 ≤ 约束变成等式的非负辅助变量 <span class=glossary-ref>（第 1 章：线性规划）<\/span><\/li><li data-term='影子价格'>影子价格 — 约束右端项加一单位带来的目标增量，等于对偶变量 <span class=glossary-ref>（第 1 章：线性规划）<\/span><\/li><li data-term='整数规划'>整数规划 — 要求部分或全部变量取整数的规划问题 <span class=glossary-ref>（第 2 章：整数规划）<\/span><\/li><li data-term='0-1 变量'>0-1 变量 — 只取 0 或 1 的变量，用来表示选或不选 <span class=glossary-ref>（第 2 章：整数规划）<\/span><\/li><li data-term='分枝定界'>分枝定界 — 用线性松弛解作上界、逐变量分枝搜索整数解的方法 <span class=glossary-ref>（第 2 章：整数规划）<\/span><\/li><li data-term='指派问题'>指派问题 — n 人做 n 事、每人一事、每事一人的 0-1 规划 <span class=glossary-ref>（第 2 章：整数规划）<\/span><\/li><li data-term='非线性规划'>非线性规划 — 目标或约束含非线性项的优化问题 <span class=glossary-ref>（第 3 章：非线性规划）<\/span><\/li><li data-term='凸函数'>凸函数 — 图像呈碗形、任意两点连线在图像上方的函数 <span class=glossary-ref>（第 3 章：非线性规划）<\/span><\/li><li data-term='凸规划'>凸规划 — 目标凸且可行域凸的规划，局部最优即全局最优 <span class=glossary-ref>（第 3 章：非线性规划）<\/span><\/li><li data-term='kkt 条件'>KKT 条件 — 带约束极值点必须满足的梯度平衡与互补松弛条件 <span class=glossary-ref>（第 3 章：非线性规划）<\/span><\/li><li data-term='互补松弛'>互补松弛 — 约束未起作用时对应乘子为零的条件，λᵢgᵢ = 0 <span class=glossary-ref>（第 3 章：非线性规划）<\/span><\/li><li data-term='二次规划'>二次规划 — 二次目标加线性约束的优化问题 <span class=glossary-ref>（第 3 章：非线性规划）<\/span><\/li><li data-term='罚函数法'>罚函数法 — 把约束违反量加进目标函数、用大系数逼迫可行的办法 <span class=glossary-ref>（第 3 章：非线性规划）<\/span><\/li><li data-term='邻接矩阵'>邻接矩阵 — 用矩阵元素表示两点之间有无边或权值的存图方式 <span class=glossary-ref>（第 4 章：图与网络模型及方法）<\/span><\/li><li data-term='最短路'>最短路 — 两点之间总权值最小的路径 <span class=glossary-ref>（第 4 章：图与网络模型及方法）<\/span><\/li><li data-term='最小生成树'>最小生成树 — 连通全部点且总权值最小的无环子图 <span class=glossary-ref>（第 4 章：图与网络模型及方法）<\/span><\/li><li data-term='最大流'>最大流 — 源点到汇点在不超容量的前提下能输送的最大流量 <span class=glossary-ref>（第 4 章：图与网络模型及方法）<\/span><\/li><li data-term='关键路径'>关键路径 — 项目中总时差为零、决定总工期的工序链 <span class=glossary-ref>（第 4 章：图与网络模型及方法）<\/span><\/li><li data-term='tsp'>TSP — 遍历所有点各一次并回到起点的最短回路问题 <span class=glossary-ref>（第 4 章：图与网络模型及方法）<\/span><\/li><li data-term='插值'>插值 — 构造必须经过全部已知点的曲线 <span class=glossary-ref>（第 5 章：插值与拟合）<\/span><\/li><li data-term='拟合'>拟合 — 不要求穿过点、只要求残差平方和最小的近似 <span class=glossary-ref>（第 5 章：插值与拟合）<\/span><\/li><li data-term='runge 现象'>Runge 现象 — 等距节点上高次插值在区间边缘剧烈振荡 <span class=glossary-ref>（第 5 章：插值与拟合）<\/span><\/li><li data-term='三次样条'>三次样条 — 分段三次多项式且在节点处一二阶导数连续 <span class=glossary-ref>（第 5 章：插值与拟合）<\/span><\/li><li data-term='最小二乘'>最小二乘 — 使残差平方和最小来估计参数的准则 <span class=glossary-ref>（第 5 章：插值与拟合）<\/span><\/li><li data-term='微分方程'>微分方程 — 含未知函数及其导数的方程，描述变化机制 <span class=glossary-ref>（第 6 章：微分方程）<\/span><\/li><li data-term='初值条件'>初值条件 — 给定某时刻状态、决定落在哪条解曲线上的条件 <span class=glossary-ref>（第 6 章：微分方程）<\/span><\/li><li data-term='euler 法'>Euler 法 — 用当前斜率直线外推的一阶数值解法 <span class=glossary-ref>（第 6 章：微分方程）<\/span><\/li><li data-term='rk4'>RK4 — 每步四次求斜率再加权的四阶数值解法 <span class=glossary-ref>（第 6 章：微分方程）<\/span><\/li><li data-term='sir 模型'>SIR 模型 — 把人群分为易感、感染、康复三类的传染病模型 <span class=glossary-ref>（第 6 章：微分方程）<\/span><\/li><li data-term='基本再生数'>基本再生数 — R₀ = β/γ，一个感染者平均传染的人数 <span class=glossary-ref>（第 6 章：微分方程）<\/span><\/li><li data-term='点估计'>点估计 — 用样本统计量直接猜总体参数 <span class=glossary-ref>（第 7 章：数理统计）<\/span><\/li><li data-term='区间估计'>区间估计 — 给出覆盖真值的概率范围的估计方法 <span class=glossary-ref>（第 7 章：数理统计）<\/span><\/li><li data-term='p 值'>p 值 — H₀ 为真时出现当前或更极端结果的概率 <span class=glossary-ref>（第 7 章：数理统计）<\/span><\/li><li data-term='bootstrap'>Bootstrap — 有放回重抽样模拟抽样分布的方法 <span class=glossary-ref>（第 7 章：数理统计）<\/span><\/li><li data-term='方差分析'>方差分析 — 把总变异拆成组间与组内、用 F 检验比较均值的办法 <span class=glossary-ref>（第 7 章：数理统计）<\/span><\/li><li data-term='差分方程'>差分方程 — 描述相邻两期数值关系的方程 <span class=glossary-ref>（第 8 章：差分方程）<\/span><\/li><li data-term='平衡点'>平衡点 — 使下一期等于本期、系统不再变化的取值 <span class=glossary-ref>（第 8 章：差分方程）<\/span><\/li><li data-term='稳定性'>稳定性 — 初值小扰动会随时间消失的性质 <span class=glossary-ref>（第 8 章：差分方程）<\/span><\/li><li data-term='leslie 矩阵'>Leslie 矩阵 — 由繁殖率首行与存活率次对角线构成的种群投影矩阵 <span class=glossary-ref>（第 8 章：差分方程）<\/span><\/li><li data-term='支持向量机'>支持向量机 — 最大化分类间隔的二分类模型 <span class=glossary-ref>（第 9 章：支持向量机）<\/span><\/li><li data-term='间隔'>间隔 — 两类支持向量之间的距离，等于 2/‖w‖（规范化情形） <span class=glossary-ref>（第 9 章：支持向量机）<\/span><\/li><li data-term='支持向量'>支持向量 — 离分类超平面最近、决定边界的样本点 <span class=glossary-ref>（第 9 章：支持向量机）<\/span><\/li><li data-term='软间隔'>软间隔 — 允许个别样本越界的 SVM 形式，由 C 控制容忍度 <span class=glossary-ref>（第 9 章：支持向量机）<\/span><\/li><li data-term='核函数'>核函数 — 隐式把样本映射到高维、只需算内积的函数 <span class=glossary-ref>（第 9 章：支持向量机）<\/span><\/li><li data-term='聚类'>聚类 — 无标签、按相似度把样本分组的分析 <span class=glossary-ref>（第 10 章：多元分析）<\/span><\/li><li data-term='k-means'>K-means — 迭代更新 k 个中心、按最近中心分组的聚类算法 <span class=glossary-ref>（第 10 章：多元分析）<\/span><\/li><li data-term='主成分分析'>主成分分析 — 把变量线性组合成少数互不相关新变量的降维方法 <span class=glossary-ref>（第 10 章：多元分析）<\/span><\/li><li data-term='贡献率'>贡献率 — 某主成分特征值占特征值总和的比例 <span class=glossary-ref>（第 10 章：多元分析）<\/span><\/li><li data-term='判别分析'>判别分析 — 有标签、学习分类规则并给新样本归类的分析 <span class=glossary-ref>（第 10 章：多元分析）<\/span><\/li><li data-term='因子分析'>因子分析 — 假设少数潜在因子生成观测变量的统计模型 <span class=glossary-ref>（第 10 章：多元分析）<\/span><\/li><li data-term='典型相关分析'>典型相关分析 — 找两组变量各自线性组合使相关系数最大 <span class=glossary-ref>（第 10 章：多元分析）<\/span><\/li><li data-term='多维标度'>多维标度 — 只凭距离矩阵反推低维坐标的方法 <span class=glossary-ref>（第 10 章：多元分析）<\/span><\/li><li data-term='多重共线性'>多重共线性 — 自变量之间近似线性相关，导致系数估计不稳定 <span class=glossary-ref>（第 11 章：偏最小二乘回归分析）<\/span><\/li><li data-term='方差膨胀因子'>方差膨胀因子 — 衡量某变量被其余变量解释程度的指标，VIF &gt; 10 视为严重共线 <span class=glossary-ref>（第 11 章：偏最小二乘回归分析）<\/span><\/li><li data-term='偏最小二乘'>偏最小二乘 — 同时考虑 X 变异与 X–Y 相关来提取成分的回归方法 <span class=glossary-ref>（第 11 章：偏最小二乘回归分析）<\/span><\/li><li data-term='vip 值'>VIP 值 — 变量重要性投影，大于 1 通常视为重要变量 <span class=glossary-ref>（第 11 章：偏最小二乘回归分析）<\/span><\/li><li data-term='模拟退火'>模拟退火 — 按 exp(−Δ/T) 概率接受差解的随机搜索算法 <span class=glossary-ref>（第 12 章：现代优化算法）<\/span><\/li><li data-term='遗传算法'>遗传算法 — 用编码、适应度、选择、交叉、变异模拟进化的搜索算法 <span class=glossary-ref>（第 12 章：现代优化算法）<\/span><\/li><li data-term='精英保留'>精英保留 — 每代把最优个体直接复制到下一代，防止退化 <span class=glossary-ref>（第 12 章：现代优化算法）<\/span><\/li><li data-term='灰度化'>灰度化 — 把三通道彩色图按亮度权重合成单通道图 <span class=glossary-ref>（第 13 章：数字图像处理）<\/span><\/li><li data-term='空间滤波'>空间滤波 — 用小窗口在图上滑动做加权和的处理方式 <span class=glossary-ref>（第 13 章：数字图像处理）<\/span><\/li><li data-term='中值滤波'>中值滤波 — 取窗口内中位数作为中心像素值的非线性滤波 <span class=glossary-ref>（第 13 章：数字图像处理）<\/span><\/li><li data-term='直方图均衡'>直方图均衡 — 按累计分布重排灰度、使直方图平坦的对比度增强 <span class=glossary-ref>（第 13 章：数字图像处理）<\/span><\/li><li data-term='lsb 水印'>LSB 水印 — 把信息写入像素最低位的隐蔽水印方法 <span class=glossary-ref>（第 13 章：数字图像处理）<\/span><\/li><li data-term='综合评价'>综合评价 — 多指标标准化加权后排序的方法体系 <span class=glossary-ref>（第 14 章：综合评价与决策方法）<\/span><\/li><li data-term='极差标准化'>极差标准化 — 用 (x−min)/(max−min) 把指标压到 0–1 区间 <span class=glossary-ref>（第 14 章：综合评价与决策方法）<\/span><\/li><li data-term='熵权法'>熵权法 — 按指标区分度分配权重的客观赋权方法 <span class=glossary-ref>（第 14 章：综合评价与决策方法）<\/span><\/li><li data-term='理想解法'>理想解法 — 按到正负理想解的距离排序的 TOPSIS 方法 <span class=glossary-ref>（第 14 章：综合评价与决策方法）<\/span><\/li><li data-term='数据包络分析'>数据包络分析 — 用投入产出比评价决策单元效率的方法 <span class=glossary-ref>（第 14 章：综合评价与决策方法）<\/span><\/li><li data-term='秩和比'>秩和比 — 用秩次合成评价结果、抗异常值的方法 <span class=glossary-ref>（第 14 章：综合评价与决策方法）<\/span><\/li><li data-term='pagerank'>PageRank — 按链接关系迭代给节点打分的排序算法 <span class=glossary-ref>（第 14 章：综合评价与决策方法）<\/span><\/li><li data-term='灰色预测'>灰色预测 — 用累加生成近似指数趋势、适合小样本的预测方法 <span class=glossary-ref>（第 15 章：预测方法）<\/span><\/li><li data-term='级比检验'>级比检验 — GM(1,1) 建模前检查序列是否适合的比值判据 <span class=glossary-ref>（第 15 章：预测方法）<\/span><\/li><li data-term='马尔可夫链'>马尔可夫链 — 下一状态只依赖当前状态、按转移概率演化的过程 <span class=glossary-ref>（第 15 章：预测方法）<\/span><\/li><li data-term='arima'>ARIMA — 自回归差分移动平均模型 <span class=glossary-ref>（第 15 章：预测方法）<\/span><\/li><li data-term='样本外检验'>样本外检验 — 留出末段数据不建模、用来评估预测能力 <span class=glossary-ref>（第 15 章：预测方法）<\/span><\/li><li data-term='mape'>MAPE — 平均绝对百分比误差，衡量相对预测偏差 <span class=glossary-ref>（第 15 章：预测方法）<\/span><\/li><li data-term='多目标规划'>多目标规划 — 同时优化多个可能冲突目标的规划问题 <span class=glossary-ref>（第 16 章：多目标规划和目标规划）<\/span><\/li><li data-term='pareto 有效解'>Pareto 有效解 — 不存在全面更优解的非劣解 <span class=glossary-ref>（第 16 章：多目标规划和目标规划）<\/span><\/li><li data-term='加权和法'>加权和法 — 把多目标按权重合成单一目标求解的方法 <span class=glossary-ref>（第 16 章：多目标规划和目标规划）<\/span><\/li><li data-term='ε 约束法'>ε 约束法 — 把次要目标改成约束、扫描阈值求前沿的方法 <span class=glossary-ref>（第 16 章：多目标规划和目标规划）<\/span><\/li><li data-term='目标规划'>目标规划 — 把目标写成约束、最小化偏差变量的方法 <span class=glossary-ref>（第 16 章：多目标规划和目标规划）<\/span><\/li><li data-term='偏差变量'>偏差变量 — d⁺ 表示超出目标、d⁻ 表示不足目标的辅助变量 <span class=glossary-ref>（第 16 章：多目标规划和目标规划）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：题型识别四问<\/h2>\n<ol><li>\n要不要给出一个方案或数值？要 → 规划类，第 1–3、16 章。\n<\/li><li>\n对象之间有没有连接关系？有 → 图论，第 4 章。\n<\/li><li>\n有没有时间序列或状态演化？有 → 微分方程、差分方程、预测，第 6、8、15 章。\n<\/li><li>\n要不要从一堆对象里分组、排序、挑出重要变量？要 → 多元分析与评价，第 9–11、14 章。\n<\/ol>\n<p>四问的答案可以叠加。真实赛题常常是「先用评价排序，再对前几名做规划」。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n变量全为整数且规模小于 50 → 精确整数规划；大于 50 → 启发式 + 报告近似。\n<\/li><li>\n数据点少于 15 且单调 → 灰色预测或拟合；有明确机制 → 微分方程；长序列有季节性 → ARIMA。\n<\/li><li>\n指标超过 5 个且量纲不一 → 先标准化再评价，不要直接加权求和。\n<\/li><li>\n两个目标明显冲突 → 先画 Pareto 前沿，再让决策者选点，不要自己拍权重。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>把相关当因果<\/strong>：相关系数 0.8 只说明同向变化，写「A 导致 B」需要额外证据。\n<\/li><li>\n<strong>只报一次最好结果<\/strong>：启发式算法跑一次得 17，就宣称最优 17，无法排除运气。\n<\/li><li>\n<strong>用复杂模型掩盖假设缺失<\/strong>：神经网络拟合得再好，也说不出机制，评委要看的是解释。\n<\/li><li>\n<strong>灵敏度写成自我表扬<\/strong>：只写「模型稳健」不给扰动范围和结论变化，等于没写。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>核心公式<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>线性规划标准型<\/td><td>max z = cᵀx，s.t. Ax ≤ b，x ≥ 0<\/td><\/tr><tr><td>影子价格<\/td><td>右端项加 1 引起的最优值增量，等于对偶变量<\/td><\/tr><tr><td>整数规划松弛<\/td><td>连续解是整数解的上界，用于分枝定界剪枝<\/td><\/tr><tr><td>KKT 梯度平衡<\/td><td>∇f + ∑λᵢ∇gᵢ = 0，λᵢgᵢ = 0<\/td><\/tr><tr><td>SVM 间隔<\/td><td>2/‖w‖（支持向量处 wᵀx + b = ±1）<\/td><\/tr><tr><td>最小二乘斜率<\/td><td>∑(xᵢ−x̄)(yᵢ−ȳ) / ∑(xᵢ−x̄)²<\/td><\/tr><tr><td>一阶差分平衡点<\/td><td>x* = b/(1−a)，稳定条件<\/td><td>a<\/td><td>&lt; 1<\/td><\/tr><tr><td>SIR 基本再生数<\/td><td>R₀ = β/γ<\/td><\/tr><tr><td>极差标准化<\/td><td>效益型 (x−min)/(max−min)，成本型 (max−x)/(max−min)<\/td><\/tr><tr><td>熵权<\/td><td>wⱼ = (1−eⱼ)/∑(1−eⱼ)<\/td><\/tr><tr><td>GM(1,1)<\/td><td>x̂¹(k+1) = (x⁰(1) − b/a)e^(−ak) + b/a<\/td><\/tr><tr><td>退火接受概率<\/td><td>P = exp(−Δ/T)<\/td><\/tr><\/tbody><\/table>\n<h2>常用调用<\/h2>\n<table><thead><tr><th>目的<\/th><th>写法<\/th><\/tr><\/thead><tbody><tr><td>线性/整数规划<\/td><td><code>linprog(c, A_ub=A, b_ub=b, bounds=..., method=&quot;highs&quot;)<\/code><\/td><\/tr><tr><td>非线性规划<\/td><td><code>minimize(fun, x0, method=&quot;SLSQP&quot;, constraints=cons)<\/code><\/td><\/tr><tr><td>最短路<\/td><td><code>scipy.sparse.csgraph.dijkstra<\/code><\/td><\/tr><tr><td>最小生成树<\/td><td><code>scipy.sparse.csgraph.minimum_spanning_tree<\/code><\/td><\/tr><tr><td>插值<\/td><td><code>CubicSpline(x, y)<\/code>、<code>interp1d<\/code><\/td><\/tr><tr><td>常微分方程<\/td><td><code>solve_ivp(f, [t0, t1], y0, method=&quot;RK45&quot;)<\/code><\/td><\/tr><tr><td>聚类<\/td><td><code>KMeans(n_clusters=3).fit(X)<\/code><\/td><\/tr><tr><td>主成分<\/td><td><code>PCA(n_components=2).fit_transform(X)<\/code><\/td><\/tr><tr><td>SVM<\/td><td><code>SVC(C=1.0, kernel=&quot;rbf&quot;, gamma=&quot;scale&quot;)<\/code><\/td><\/tr><\/tbody><\/table>\n<h2>检查清单<\/h2>\n<table><thead><tr><th>检查项<\/th><th>标准<\/th><\/tr><\/thead><tbody><tr><td>单位<\/td><td>等号两边量纲一致<\/td><\/tr><tr><td>量级<\/td><td>结果落在常识范围<\/td><\/tr><tr><td>极端值<\/td><td>变量取 0 或上界时公式仍合理<\/td><\/tr><tr><td>结果复现<\/td><td>换个随机种子结果波动可接受<\/td><\/tr><tr><td>论文一致<\/td><td>摘要数字与正文、代码输出三处一致<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：线性规划", "href": "#/chapter/ch01"}, {"label": "第 2 章：整数规划", "href": "#/chapter/ch02"}, {"label": "第 3 章：非线性规划", "href": "#/chapter/ch03"}, {"label": "第 4 章：图与网络模型及方法", "href": "#/chapter/ch04"}, {"label": "第 5 章：插值与拟合", "href": "#/chapter/ch05"}, {"label": "第 6 章：微分方程", "href": "#/chapter/ch06"}, {"label": "第 7 章：数理统计", "href": "#/chapter/ch07"}, {"label": "第 8 章：差分方程" estion": "遗传算法中精英保留的作用是？", "options": ["增加种群规模", "防止最优个体在迭代中丢失", "提高变异率", "缩短编码长度"], "answer": 1, "explain": "把当代最优直接复制到下一代，避免选择与变异破坏已找到的好解。"}, {"id": "ch04-q0402", "chapterId": "ch04", "type": "single", "question": "权重从 0.4/0.35/0.25 改成 0.6/0.25/0.15，冠军变化说明？", "options": ["数据算错了", "排序对权重敏感，必须做灵敏度", "应该取平均权重", "评价方法无效"], "answer": 1, "explain": "权重代表偏好，偏好变则排序变，这是评价方法的固有性质。"}, {"id": "ch04-q0403", "chapterId": "ch04", "type": "blank", "question": "指数平滑中 α 越小，记忆长度越________。", "options": [], "answer": "长", "explain": "α 小则历史权重衰减慢，长期数据影响更大。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "列线性规划顶点要算哪三类点？", "back": "与两坐标轴的截距、约束之间的交点、原点", "tags": ["线性规划", "手算"]}, {"id": "f02", "chapterId": "ch01", "front": "整数间隙是什么？", "back": "线性松弛最优值与整数最优值之差，例 20.33 与 19", "tags": ["整数规划"]}, {"id": "f03", "chapterId": "ch01", "front": "目标规划里利润不足用哪个偏差变量？", "back": "d⁻，负偏差表示低于目标", "tags": ["目标规划"]}, {"id": "f04", "chapterId": "ch02", "front": "Dijkstra 每轮确定几个点？", "back": "一个，选当前距离最小的未确定点", "tags": ["图论"]}, {"id": "f05", "chapterId": "ch02", "front": "生成树的三要素？", "back": "连通、无环、恰好 n−1 条边", "tags": ["图论"]}, {"id": "f06", "chapterId": "ch02", "front": "差分方程 xₙ₊₁=1.2xₙ−10 的平衡点与稳定性？", "back": "平衡点 50，|1.2|>1 不稳定，数值发散", "tags": ["差分方程"]}, {"id": "f07", "chapterId": "ch03", "front": "最小二乘斜率的分母？", "back": "∑(xᵢ−x̄)²，中心化平方和", "tags": ["拟合"]}, {"id": "f08", "chapterId": "ch03", "front": "t=2.83 超过临界值 2.78 的正确结论？", "back": "在 5% 水平拒绝原假设，不能说「证明均值等于 8」", "tags": ["统计"]}, {"id": "f09", "chapterId": "ch03", "front": "共线性的三种处理？", "back": "删掉一个、合并变量、改用主成分回归或偏最小二乘", "tags": ["回归"]}, {"id": "f10", "chapterId": "ch04", "front": "TSP 遗传算法为什么不能用普通交叉？", "back": "会产生重复与缺失城市，要用顺序交叉等保序算子", "tags": ["遗传算法"]}, {"id": "f11", "chapterId": "ch04", "front": "评价排序随权重改变说明什么？", "back": "结论对偏好敏感，必须做权重灵敏度并在论文中写明", "tags": ["综合评价"]}, {"id": "f12", "chapterId": "ch04", "front": "移动平均与指数平滑的记忆差别？", "back": "移动平均只看窗口内几期，指数平滑对所有历史加权，α 越小记忆越长", "tags": ["预测"]}], "companion": "exercises学习伴侣.html"}, "rendered": {"ch01": "<h1>第 1 章：优化类训练<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：主册第 1–3、16 章 | <strong>原书题解定位<\/strong>：第 1 章 p1–11、第 2 章 p12–29、第 3 章 p30–37、第 16 章 p158–164\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n不看答案独立解一个二元线性规划，并列出全部顶点；\n<\/li><li>\n判断整数最优与松弛最优的差距，说明为什么不能取整；\n<\/li><li>\n把一段文字需求翻译成目标规划的三组约束。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>优化题的分数，八成给在「模型写对」和「顶点列全」，两成给在算对。<\/p>\n<h2>训练题与解答<\/h2>\n<h3>题 1（线性规划，手算）<\/h3>\n<p>max z = 5x₁ + 4x₂，s.t. 2x₁ + 3x₂ ≤ 12，2x₁ + x₂ ≤ 8，x₁, x₂ ≥ 0。<\/p>\n<p><strong>解<\/strong>：列顶点。<\/p>\n<ul><li>\n与 x₂ 轴交点：x₁ = 0 时 3x₂ ≤ 12 → (0, 4)，z = 16。\n<\/li><li>\n与 x₁ 轴交点：x₂ = 0 时 2x₁ ≤ 8 → (4, 0)，z = 20。\n<\/li><li>\n两约束交点：2x₁ + 3x₂ = 12 与 2x₁ + x₂ = 8 相减得 2x₂ = 4，x₂ = 2，代回 x₁ = 3，(3, 2)，z = 15 + 8 = 23。\n<\/li><li>\n还要检查交点是否满足全部约束：2×3 + 3×2 = 12 恰好取等，2×3 + 2 = 8 取等，可行。\n<\/ul>\n<p>最优 (3, 2)，z = 23。<strong>易错点<\/strong>：漏掉 (0,4) 这一顶点；或把交点算成 (3, 2) 后忘记代回验证。<\/p>\n<h3>题 2（整数规划，松弛与取整对比）<\/h3>\n<p>max z = 4x₁ + 3x₂，s.t. 2x₁ + x₂ ≤ 9，x₁ + 2x₂ ≤ 8，x₁, x₂ ≥ 0 且为整数。<\/p>\n<p><strong>解<\/strong>：先解松弛。两约束交点：第一式乘 2 得 4x₁ + 2x₂ = 18，减去第二式得 3x₁ = 10，x₁ = 3.333，x₂ = 2.333，z = 13.333 + 7 = 20.333。<\/p>\n<p>枚举附近整数点：<\/p>\n<table><thead><tr><th>点<\/th><th>约束检查<\/th><th>z<\/th><\/tr><\/thead><tbody><tr><td>(3, 2)<\/td><td>8 ≤ 9，7 ≤ 8<\/td><td>18<\/td><\/tr><tr><td>(4, 1)<\/td><td>9 ≤ 9，6 ≤ 8<\/td><td>19<\/td><\/tr><tr><td>(2, 3)<\/td><td>7 ≤ 9，8 ≤ 8<\/td><td>17<\/td><\/tr><tr><td>(3, 3)<\/td><td>9 ≤ 9，9 &gt; 8 不可行<\/td><td>—<\/td><\/tr><\/tbody><\/table>\n<p>最优 (4, 1)，z = 19。松弛值 20.333 与整数最优 19 的差叫<strong>整数间隙<\/strong>，它说明取整必然损失。<\/p>\n<h3>题 3（目标规划，只建模）<\/h3>\n<p>某厂两产品每件利润 3 千元与 2 千元，用工 2 小时与 1 小时。要求利润不低于 60 千元，用工不超过 45 小时。利润每差 1 千元罚 4 个单位，用工每超 1 小时罚 1 个单位，且利润优先级更高。<\/p>\n<p><strong>解<\/strong>：设产量 x₁、x₂，偏差变量 d₁⁻、d₁⁺、d₂⁻、d₂⁺ 全非负。<\/p>\n<pre class=\"lang-text\"><code>min P₁·4d₁⁻ + P₂·1d₂⁺\ns.t. 3x₁ + 2x₂ + d₁⁻ − d₁⁺ = 60\n     2x₁ + x₂ + d₂⁻ − d₂⁺ = 45\n     x₁, x₂ ≥ 0，d 全 ≥ 0<\/code><\/pre>\n<p><strong>易错点<\/strong>：利润不足用 d₁⁻、用工超出用 d₂⁺，两个方向写反是这类题最常见的失分。P₁ 与 P₂ 表示优先级，不是权重，写成分层求解。<\/p>\n<h2>原书习题怎么用<\/h2>\n<table><thead><tr><th>原书章节<\/th><th>题解页码<\/th><th>建议<\/th><\/tr><\/thead><tbody><tr><td>第 1 章 线性规划<\/td><td>p1–11<\/td><td>重点做投资组合与运输问题两题，练建模<\/td><\/tr><tr><td>第 2 章 整数规划<\/td><td>p12–29<\/td><td>做指派问题与背包，练 0-1 建模<\/td><\/tr><tr><td>第 3 章 非线性规划<\/td><td>p30–37<\/td><td>做二次规划题，练 KKT 验证<\/td><\/tr><tr><td>第 16 章 多目标<\/td><td>p158–164<\/td><td>做目标规划，练偏差变量方向<\/td><\/tr><\/tbody><\/table>\n<p>对答案时不要只看数字，要对照题解里的建模步骤：变量定义、约束方向、目标系数。数字对而模型错，考试照样扣分。<\/p>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】线性规划题列顶点时，最容易漏掉的是？<\/h3>\n<ul><li>\nA. 两约束交点\n<\/li><li>\nB. 与坐标轴的交点\n<\/li><li>\nC. 原点\n<\/li><li>\nD. 目标函数等值线上的点\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：很多人只算约束交点，忘记坐标轴截距也是顶点，可能正好是最优点。<\/p>\n<\/ul>\n<h3>Q2 【单选】整数间隙指的是？<\/h3>\n<ul><li>\nA. 两个整数解之间的距离\n<\/li><li>\nB. 松弛最优值与整数最优值之差\n<\/li><li>\nC. 约束个数与变量个数之差\n<\/li><li>\nD. 目标系数的最大值与最小值之差\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：松弛允许小数，整数不允许，两者最优值之差就是间隙。<\/p>\n<\/ul>\n<h3>Q3 【填空】目标规划中，若要求「利润不低于 60」，不足部分用偏差变量________表示。<\/h3>\n<p><strong>答案<\/strong>：d₁⁻ <strong>解析<\/strong>：负偏差表示实际值低于目标，正偏差表示超出。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n列顶点要算三类：轴截距、约束交点、原点。\n<\/li><li>\n整数最优必在松弛最优附近，但取整不一定可行。\n<\/li><li>\n目标规划先定方向：不足用负偏差，超出用正偏差。\n<\/ul>", "ch02": "<h1>第 2 章：图论与动态过程训练<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：主册第 4、6、8 章 | <strong>原书题解定位<\/strong>：第 4 章 p38–58、第 6 章 p68–83、第 8 章 p91–98\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n手跑 Dijkstra 与 Kruskal，并写出每步的距离表或边集；\n<\/li><li>\n判断差分方程平衡点的稳定性，并预测长期趋势；\n<\/li><li>\n把「每年更新设备」这类过程写成递推式。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>图论题的关键是建图（边和权怎么定），动态题的关键是找递推关系（这一期由上一期怎么决定）。<\/p>\n<h2>训练题与解答<\/h2>\n<h3>题 1（最短路，Dijkstra）<\/h3>\n<p>五个点 A、B、C、D、E。边权：A-B 4、A-C 2、C-B 1、B-D 5、C-D 8、D-E 2、C-E 10。求 A 到 E 的最短距离与路径。<\/p>\n<p><strong>解<\/strong>：距离表初始化 A=0，其余 ∞。<\/p>\n<ol><li>\n确定 A，更新 B=4、C=2。\n<\/li><li>\n确定 C（2），更新 B=min(4, 2+1)=3、D=min(∞, 2+8)=10、E=2+10=12。\n<\/li><li>\n确定 B（3），更新 D=min(10, 3+5)=8。\n<\/li><li>\n确定 D（8），更新 E=min(12, 8+2)=10。\n<\/li><li>\n确定 E（10），结束。\n<\/ol>\n<p>最短路 A→C→B→D→E，长度 10。<strong>易错点<\/strong>：把 A-B-D-E 算成 4+5+2=11 就收工，忘了 C-B 只有 1。<\/p>\n<h3>题 2（最小生成树，Kruskal）<\/h3>\n<p>五个点，边：A-B 1、A-C 4、B-C 2、B-D 5、C-D 3、D-E 6。求最小生成树总权。<\/p>\n<p><strong>解<\/strong>：按权排序 1、2、3、4、5、6。<\/p>\n<p>取 A-B（1）、B-C（2）、C-D（3）、D-E（6）。四条边连通五点且无环，总权 1+2+3+6 = 12。<\/p>\n<p>若取 A-C（4）替代 B-C（2），总权变 14，不是最小。<strong>易错点<\/strong>：忘记生成树需要恰好 n−1 = 4 条边，多取一条就成环。<\/p>\n<h3>题 3（差分方程，稳定性）<\/h3>\n<p>某类设备数量每年按上年的 1.2 倍扩张，同时每年淘汰 10 台，即 xₙ₊₁ = 1.2xₙ − 10，x₀ = 80。<\/p>\n<p><strong>解<\/strong>：平衡点 x* = −10/(1 − 1.2) = 50。<\/p>\n<p>递推：x₁ = 1.2×80 − 10 = 86；x₂ = 1.2×86 − 10 = 93.2；x₃ = 101.84。<\/p>\n<p>初值 80 已经高于平衡点 50，而 |1.2| &gt; 1 说明系统不稳定，于是数值继续上升、越走越远。这说明「扩张倍数大于 1」的模型没有上限约束，长期必然发散，实际建模要加容量上限或改成饱和增长。<\/p>\n<p><strong>易错点<\/strong>：只算平衡点不判稳定性，得出「长期稳定在 50 台」的错误结论。<\/p>\n<h2>原书习题怎么用<\/h2>\n<table><thead><tr><th>原书章节<\/th><th>题解页码<\/th><th>建议<\/th><\/tr><\/thead><tbody><tr><td>第 4 章 图与网络<\/td><td>p38–58<\/td><td>钢管订购与运输一题值得完整做，含建图与优化两层<\/td><\/tr><tr><td>第 6 章 微分方程<\/td><td>p68–83<\/td><td>传染病预测题要对着参数做灵敏度<\/td><\/tr><tr><td>第 8 章 差分方程<\/td><td>p91–98<\/td><td>捕鱼策略题注意 Leslie 矩阵的年龄分组<\/td><\/tr><\/tbody><\/table>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】Kruskal 算法每次加入新边前必须检查？<\/h3>\n<ul><li>\nA. 边是否最短\n<\/li><li>\nB. 是否形成环\n<\/li><li>\nC. 顶点是否用完\n<\/li><li>\nD. 权值是否为正\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：成环就跳过，这是维持「树」的结构的关键。<\/p>\n<\/ul>\n<h3>Q2 【单选】差分方程 |a| &gt; 1 时系统？<\/h3>\n<ul><li>\nA. 稳定收敛\n<\/li><li>\nB. 不稳定，偏离平衡点\n<\/li><li>\nC. 等幅振荡\n<\/li><li>\nD. 恒为常数\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：误差每期按 a 倍放大，模大于 1 时发散。<\/p>\n<\/ul>\n<h3>Q3 【填空】五点的最小生成树需要________条边。<\/h3>\n<p><strong>答案<\/strong>：4 <strong>解析<\/strong>：n 个点的树有 n−1 条边。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\nDijkstra 每步只确定一个点，距离表要逐轮更新。\n<\/li><li>\n生成树 = 连通 + 无环 + n−1 条边。\n<\/li><li>\n平衡点存在不等于稳定，先看特征根模。\n<\/ul>", "ch03": "<h1>第 3 章：数据与统计训练<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：主册第 5、7、10、11 章 | <strong>原书题解定位<\/strong>：第 5 章 p59–67、第 7 章 p84–90、第 10 章 p103–126、第 11 章 p127–132\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n手算一条最小二乘直线，并算出残差平方和；\n<\/li><li>\n完整做一次单样本 t 检验，把结论写成评审能接受的话；\n<\/li><li>\n判断一组数据是否适合直接做回归，还是先要处理共线性。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>统计题的错误很少出在算错，多半出在「假设不满足还硬做」和「结论说得比证据强」。<\/p>\n<h2>训练题与解答<\/h2>\n<h3>题 1（最小二乘拟合）<\/h3>\n<p>数据：x = 0, 1, 2, 3；y = 1, 2, 4, 5。求拟合直线并算残差平方和。<\/p>\n<p><strong>解<\/strong>：x̄ = 1.5，ȳ = 3。<\/p>\n<p>Sxy = (−1.5)(−2) + (−0.5)(−1) + (0.5)(1) + (1.5)(2) = 3 + 0.5 + 0.5 + 3 = 7。 Sxx = 2.25 + 0.25 + 0.25 + 2.25 = 4.75。 斜率 b = 7/4.75 = 1.474，截距 a = 3 − 1.474×1.5 = 0.789。<\/p>\n<p>预测值：0.789、2.263、3.737、5.211。 残差：0.211、−0.263、0.263、−0.211。 残差平方和 = 0.045 + 0.069 + 0.069 + 0.045 ≈ 0.23。<\/p>\n<p>结论：y ≈ 0.79 + 1.47x。<strong>易错点<\/strong>：把 Sxx 算成 ∑x² = 14，那是没中心化的写法，会得到错误斜率。<\/p>\n<h3>题 2（单样本 t 检验）<\/h3>\n<p>某零件标准长度 8 mm，抽 5 件测得 8、10、9、11、12，问是否显著偏离 8（α = 0.05）。<\/p>\n<p><strong>解<\/strong>：x̄ = 10，偏差 −2、0、−1、1、2，平方和 10，s² = 10/4 = 2.5，s = 1.581。 SE = 1.581/√5 = 0.707。 t = (10 − 8)/0.707 = 2.828，df = 4。 双侧 5% 临界值 t₀.₀₂₅,₄ = 2.776。2.828 &gt; 2.776，拒绝 H₀。<\/p>\n<p>结论：「在 5% 显著性水平下，样本均值与 8 mm 存在显著差异，估计均值 10 mm，95% 置信区间约 [8.04, 11.96]」。<\/p>\n<p><strong>易错点<\/strong>：算出 t 大于临界值却写「证明均值是 10」，统计只能说不拒绝或拒绝，不能说证明。<\/p>\n<h3>题 3（共线性诊断）<\/h3>\n<p>某回归有 4 个自变量，相关矩阵中 x₁ 与 x₂ 的相关系数为 0.98，x₃ 与 x₄ 为 0.15。问该怎么处理。<\/p>\n<p><strong>解<\/strong>：x₁ 与 x₂ 高度相关，直接回归会出现系数符号反常、方差膨胀。<\/p>\n<p>三种处理：<\/p>\n<ol><li>\n删掉一个：若业务上 x₂ 可由 x₁ 解释，保留更有解释力的那个。\n<\/li><li>\n合并：用 x₁ + x₂ 或均值作为一个新变量。\n<\/li><li>\n换方法：用主成分回归或偏最小二乘，把相关变量打包成成分。\n<\/ol>\n<p>处理前后都要报告 VIF。VIF &gt; 10 通常视为严重共线，计算式 VIFⱼ = 1/(1 − Rⱼ²)，Rⱼ² 是第 j 个变量被其余变量回归的解释度。<\/p>\n<h2>原书习题怎么用<\/h2>\n<table><thead><tr><th>原书章节<\/th><th>题解页码<\/th><th>建议<\/th><\/tr><\/thead><tbody><tr><td>第 5 章 插值与拟合<\/td><td>p59–67<\/td><td>黄河小浪底一题练「先拟合再优化」的两层结构<\/td><\/tr><tr><td>第 7 章 数理统计<\/td><td>p84–90<\/td><td>参数估计与假设检验各做一题，重点写结论措辞<\/td><\/tr><tr><td>第 10 章 多元分析<\/td><td>p103–126<\/td><td>聚类与主成分各一题，注意标准化<\/td><\/tr><tr><td>第 11 章 偏最小二乘<\/td><td>p127–132<\/td><td>练成分数选择与 VIP 解读<\/td><\/tr><\/tbody><\/table>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】最小二乘斜率公式的分母是？<\/h3>\n<ul><li>\nA. ∑xᵢ²\n<\/li><li>\nB. ∑(xᵢ − x̄)²\n<\/li><li>\nC. ∑yᵢ²\n<\/li><li>\nD. n\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：分母是 x 的中心化平方和，未中心化会引入截距相关项。<\/p>\n<\/ul>\n<h3>Q2 【单选】t = 2.83、临界值 2.78，正确结论是？<\/h3>\n<ul><li>\nA. 证明均值等于 8\n<\/li><li>\nB. 在 5% 水平下拒绝原假设\n<\/li><li>\nC. 样本一定有问题\n<\/li><li>\nD. 需要增大 α 才能判断\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：t 超过临界值即落入拒绝域，结论是拒绝 H₀，而非证明任何事。<\/p>\n<\/ul>\n<h3>Q3 【填空】VIF 大于________通常视为严重多重共线性。<\/h3>\n<p><strong>答案<\/strong>：10 <strong>解析<\/strong>：经验阈值，超过 10 说明该变量被其余变量解释程度过高。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n拟合先中心化，斜率 = 协方差/方差。\n<\/li><li>\n检验结论只有「拒绝」与「不拒绝」，没有「证明」。\n<\/li><li>\n共线三招：删、合并、换方法。\n<\/ul>", "ch04": "<h1>第 4 章：智能算法与综合评价训练<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：主册第 9、12、14、15 章 | <strong>原书题解定位<\/strong>：第 9 章 p99–102、第 12 章 p133–139、第 13 章 p140–143、第 14 章 p144–150、第 15 章 p151–157\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n为一个小规模 TSP 设计完整的遗传算法五件套；\n<\/li><li>\n手算一次多指标加权评价，并解释权重变化对排序的影响；\n<\/li><li>\n用移动平均与指数平滑各做一次预测，说清两者的差别。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>这类题不考公式推导，考的是「参数与口径交代得够不够清楚，别人能不能照你的描述复现」。<\/p>\n<h2>训练题与解答<\/h2>\n<h3>题 1（遗传算法设计）<\/h3>\n<p>8 个城市，坐标已知，求最短遍历回路。写出编码、适应度、选择、交叉、变异与终止条件。<\/p>\n<p><strong>解<\/strong>：<\/p>\n<ul><li>\n<strong>编码<\/strong>：整数序列，如 [3,1,5,2,8,4,7,6]，表示访问顺序。\n<\/li><li>\n<strong>适应度<\/strong>：f = 1/总路程。路程越短适应度越高。\n<\/li><li>\n<strong>选择<\/strong>：锦标赛，每次随机取 3 个个体，留最短的。\n<\/li><li>\n<strong>交叉<\/strong>：顺序交叉（OX）。父代 A = [1 2 3 4 5 6 7 8]，B = [4 5 2 1 8 7 6 3]。取 A 的片段 [3 4 5]，剩余位置按 B 的顺序补 2、1、8、7、6，得 [2 1 8 3 4 5 7 6]。\n<\/li><li>\n<strong>变异<\/strong>：随机交换两个位置，或反转一段（2-opt）。\n<\/li><li>\n<strong>终止<\/strong>：迭代 500 代，或连续 50 代最优值不改进。\n<\/ul>\n<p>参数：种群 100，交叉率 0.8，变异率 0.05，精英保留 2 个。<\/p>\n<p>报告要求：独立运行 20 次，给出最好、平均、标准差。只报一次最好值不合格。<\/p>\n<h3>题 2（综合评价）<\/h3>\n<p>四个方案，三个指标（成本、质量、交付），已标准化为 0–1 且统一为越大越好：S1 (0.9, 0.5, 0.6)、S2 (0.7, 0.8, 0.5)、S3 (0.6, 0.9, 0.7)、S4 (0.5, 0.6, 0.9)。权重 0.4、0.35、0.25，排序。<\/p>\n<p><strong>解<\/strong>：<\/p>\n<ul><li>\nS1 = 0.4×0.9 + 0.35×0.5 + 0.25×0.6 = 0.36 + 0.175 + 0.15 = 0.685\n<\/li><li>\nS2 = 0.28 + 0.28 + 0.125 = 0.685\n<\/li><li>\nS3 = 0.24 + 0.315 + 0.175 = 0.73\n<\/li><li>\nS4 = 0.20 + 0.21 + 0.225 = 0.635\n<\/ul>\n<p>排序 S3 &gt; S1 = S2 &gt; S4。S1 与 S2 并列，说明成本优势恰好被质量劣势抵消。<\/p>\n<p><strong>灵敏度<\/strong>：把成本权重从 0.4 提到 0.6（质量 0.25、交付 0.15）：<\/p>\n<ul><li>\nS1 = 0.54 + 0.125 + 0.09 = 0.755\n<\/li><li>\nS2 = 0.42 + 0.20 + 0.075 = 0.695\n<\/li><li>\nS3 = 0.36 + 0.225 + 0.105 = 0.69\n<\/ul>\n<p>排序变成 S1 &gt; S2 &gt; S3，冠军换了人。这就是为什么权重必须做灵敏度，且要在论文里写明。<\/p>\n<h3>题 3（预测对比）<\/h3>\n<p>销量序列 10、12、14、15、17，分别用 3 期移动平均与 α = 0.5 的指数平滑预测下一期。<\/p>\n<p><strong>解<\/strong>：<\/p>\n<ul><li>\n移动平均：(14 + 15 + 17)/3 = 15.33。\n<\/li><li>\n指数平滑：S₁ = 10，S₂ = 0.5×12 + 0.5×10 = 11，S₃ = 12.5，S₄ = 13.75，S₅ = 15.375。\n<\/ul>\n<p>两者接近，差别在记忆长度：移动平均只看最近 3 期，指数平滑对所有历史加权，α 越小记忆越长。数据有突变时移动平均反应更快，平稳时指数平滑更稳。<\/p>\n<h2>原书习题怎么用<\/h2>\n<table><thead><tr><th>原书章节<\/th><th>题解页码<\/th><th>建议<\/th><\/tr><\/thead><tbody><tr><td>第 9 章 SVM<\/td><td>p99–102<\/td><td>练核函数与 C 的对比实验<\/td><\/tr><tr><td>第 12 章 现代优化<\/td><td>p133–139<\/td><td>退火与遗传各做一题，记录参数表<\/td><\/tr><tr><td>第 13 章 图像处理<\/td><td>p140–143<\/td><td>做一次滤波与直方图均衡的对比<\/td><\/tr><tr><td>第 14 章 综合评价<\/td><td>p144–150<\/td><td>公务员招聘一题完整做，含权重灵敏度<\/td><\/tr><tr><td>第 15 章 预测<\/td><td>p151–157<\/td><td>灰色预测一题，写出级比检验<\/td><\/tr><\/tbody><\/table>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】遗传算法中精英保留的作用是？<\/h3>\n<ul><li>\nA. 增加种群规模\n<\/li><li>\nB. 防止最优个体在迭代中丢失\n<\/li><li>\nC. 提高变异率\n<\/li><li>\nD. 缩短编码长度\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：把当代最优直接复制到下一代，避免选择与变异破坏已找到的好解。<\/p>\n<\/ul>\n<h3>Q2 【单选】权重从 0.4/0.35/0.25 改成 0.6/0.25/0.15，冠军变化说明？<\/h3>\n<ul><li>\nA. 数据算错了\n<\/li><li>\nB. 排序对权重敏感，必须做灵敏度\n<\/li><li>\nC. 应该取平均权重\n<\/li><li>\nD. 评价方法无效\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：权重代表偏好，偏好变则排序变，这是评价方法的固有性质。<\/p>\n<\/ul>\n<h3>Q3 【填空】指数平滑中 α 越小，记忆长度越________。<\/h3>\n<p><strong>答案<\/strong>：长 <strong>解析<\/strong>：α 小则历史权重衰减慢，长期数据影响更大。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n启发式要给完整参数表与多次运行分布。\n<\/li><li>\n评价要给权重来源与灵敏度。\n<\/li><li>\n移动平均看窗口，指数平滑看 α。\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：优化类<\/strong><br>阅读：<a href=\"#/book/exercises/chapter/ch01\">第 1 章：优化类训练<\/a><br>检查点：三题全对，能说出每题的易错点<\/li><li class='path-step' id='path-02'><strong>步骤 02：图论与动态<\/strong><br>阅读：<a href=\"#/book/exercises/chapter/ch02\">第 2 章：图论与动态过程训练<\/a><br>检查点：Dijkstra 与 Kruskal 手跑无误<\/li><li class='path-step' id='path-03'><strong>步骤 03：数据与统计<\/strong><br>阅读：<a href=\"#/book/exercises/chapter/ch03\">第 3 章：数据与统计训练<\/a><br>检查点：斜率与 t 值算对，结论措辞规范<\/li><li class='path-step' id='path-04'><strong>步骤 04：算法与评价<\/strong><br>阅读：<a href=\"#/book/exercises/chapter/ch04\">第 4 章：智能算法与综合评价训练<\/a><br>检查点：完成一次权重灵敏度并解释冠军变化<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：优化类训练<\/h2><div class='quiz-item' data-qid='ch01-q0101' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 线性规划题列顶点时，最容易漏掉的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q0101' value='0'> 两约束交点<\/label><label class='quiz-opt'><input type='radio' name='ch01-q0101' value='1'> 与坐标轴的交点<\/label><label class='quiz-opt'><input type='radio' name='ch01-q0101' value='2'> 原点<\/label><label class='quiz-opt'><input type='radio' name='ch01-q0101' value='3'> 目标函数等值线上的点<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q0102' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 整数间隙指的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' nam 02' value='2'> 样本一定有问题<\/label><label class='quiz-opt'><input type='radio' name='ch03-q0302' value='3'> 需要增大 α 才能判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q0303' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> VIF 大于________通常视为严重多重共线性。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：智能算法与综合评价训练<\/h1><div class='quiz-item' data-qid='ch04-q0401' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 遗传算法中精英保留的作用是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q0401' value='0'> 增加种群规模<\/label><label class='quiz-opt'><input type='radio' name='ch04-q0401' value='1'> 防止最优个体在迭代中丢失<\/label><label class='quiz-opt'><input type='radio' name='ch04-q0401' value='2'> 提高变异率<\/label><label class='quiz-opt'><input type='radio' name='ch04-q0401' value='3'> 缩短编码长度<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q0402' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 权重从 0.4/0.35/0.25 改成 0.6/0.25/0.15，冠军变化说明？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q0402' value='0'> 数据算错了<\/label><label class='quiz-opt'><input type='radio' name='ch04-q0402' value='1'> 排序对权重敏感，必须做灵敏度<\/label><label class='quiz-opt'><input type='radio' name='ch04-q0402' value='2'> 应该取平均权重<\/label><label class='quiz-opt'><input type='radio' name='ch04-q0402' value='3'> 评价方法无效<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q0403' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 指数平滑中 α 越小，记忆长度越________。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='整数间隙'>整数间隙 — 线性松弛最优值与整数最优值之差 <span class=glossary-ref>（第 1 章：优化类训练）<\/span><\/li><li data-term='顶点枚举'>顶点枚举 — 逐个计算可行域顶点目标值找最优的办法 <span class=glossary-ref>（第 1 章：优化类训练）<\/span><\/li><li data-term='距离表'>距离表 — Dijkstra 中记录起点到各点当前最短距离的表格 <span class=glossary-ref>（第 2 章：图论与动态过程训练）<\/span><\/li><li data-term='顺序交叉'>顺序交叉 — TSP 遗传算法中保持城市不重复的交叉算子 <span class=glossary-ref>（第 4 章：智能算法与综合评价训练）<\/span><\/li><li data-term='中心化'>中心化 — 把每个观测减去均值，使数据中心落在原点 <span class=glossary-ref>（第 3 章：数据与统计训练）<\/span><\/li><li data-term='拒绝域'>拒绝域 — 检验统计量落入即拒绝原假设的区间 <span class=glossary-ref>（第 3 章：数据与统计训练）<\/span><\/li><li data-term='方差膨胀因子'>方差膨胀因子 — 变量被其余变量解释程度的指标，VIF&gt;10 视为严重共线 <span class=glossary-ref>（第 3 章：数据与统计训练）<\/span><\/li><li data-term='锦标赛选择'>锦标赛选择 — 随机取若干个体、留最优作为父代的选择方式 <span class=glossary-ref>（第 4 章：智能算法与综合评价训练）<\/span><\/li><li data-term='精英保留'>精英保留 — 每代把最优个体直接复制到下一代 <span class=glossary-ref>（第 4 章：智能算法与综合评价训练）<\/span><\/li><li data-term='指数平滑'>指数平滑 — 用 α 加权当前值与上期平滑值的预测方法 <span class=glossary-ref>（第 4 章：智能算法与综合评价训练）<\/span><\/li><li data-term='权重灵敏度'>权重灵敏度 — 改变权重看排序是否翻转的检验 <span class=glossary-ref>（第 4 章：智能算法与综合评价训练）<\/span><\/li><\/ul>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：优化类训练", "href": "#/chapter/ch01"}, {"label": "第 2 章：图论与动态过程训练", "href": "#/chapter/ch02"}, {"label": "第 3 章：数据与统计训练", "href": "#/chapter/ch03"}, {"label": "第 4 章：智能算法与综合评价训练", "href": "#/chapter/ch04"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：优化类训练", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：图论与动态过程训练", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：数据与统计训练", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：智能算法与综合评价训练", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}], "quizCoverage": {"ch01": true, "ch02": true, "ch03": true, "ch04": true}},"latex":{"manifest": {"slug": "latex", "title": "LaTeX 与论文排版", "subtitle": "从装环境到排出一份合规的竞赛论文", "book": {"title": "LaTeX 入门", "author": "刘海洋", "source": ["LaTeX入门(刘海洋) .pdf"]}, "audience": "没接触过 LaTeX 的本科生", "goal": "能独立排版一份含公式、图表、文献的中文论文", "learningPath": [{"step": "01", "title": "跑通第一份 PDF", "chapterIds": ["ch01"], "checkpoint": "xelatex 编译成功，中文不乱码"}, {"step": "02", "title": "排中文版式", "chapterIds": ["ch02"], "checkpoint": "字号、边距、页眉三项都改过一次"}, {"step": "03", "title": "写公式", "chapterIds": ["ch03"], "checkpoint": "能用 align 与 cases 各排一段"}, {"step": "04", "title": "放图表", "chapterIds": ["ch04"], "checkpoint": "三线表与子图都能正确显示图注"}, {"step": "05", "title": "做引用与文献", "chapterIds": ["ch05"], "checkpoint": "文献编号出现，无 [?]"}, {"step": "06", "title": "套论文模板", "chapterIds": ["ch06"], "checkpoint": "四级编号 1.1.1.1 正确，摘要独立成页"}], "chapters": [{"id": "ch01", "title": "第 1 章：环境与第一次编译", "file": "chapters/ch01-setup.md", "difficulty": 1}, {"id": "ch02", "title": "第 2 章：中文文档与版式", "file": "chapters/ch02-chinese-layout.md", "difficulty": 2}, {"id": "ch03", "title": "第 3 章：数学公式", "file": "chapters/ch03-math-formulas.md", "difficulty": 2}, {"id": "ch04", "title": "第 4 章：图表与浮动体", "file": "chapters/ch04-figures-tables.md", "difficulty": 2}, {"id": "ch05", "title": "第 5 章：目录、交叉引用与参考文献", "file": "chapters/ch05-automation.md", "difficulty": 2}, {"id": "ch06", "title": "第 6 章：数模论文模板实战", "file": "chapters/ch06-paper-template.md", "difficulty": 2}], "concepts": [], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "glossary": [{"term": "TeX 发行版", "def": "把编译器、宏包、字体打包的整体，如 TeX Live", "chapterId": "ch01"}, {"term": "xelatex", "def": "原生支持 UTF-8 与系统字体的编译引擎，中文首选", "chapterId": "ch01"}, {"term": "ctex 文档类", "def": "专为中文设计的文档类，自动处理字体与间距", "chapterId": "ch01"}, {"term": "aux 文件", "def": "编译时记录标签与页码的中间文件，目录与引用靠它", "chapterId": "ch01"}, {"term": "zihao", "def": "ctex 的字号参数，-4 表示小四", "chapterId": "ch02"}, {"term": "secnumdepth", "def": "控制标题编号到第几级的计数器", "chapterId": "ch02"}, {"term": "tocdepth", "def": "控制目录显示到第几级的计数器", "chapterId": "ch02"}, {"term": "fancyhdr", "def": "设置页眉页脚的宏包", "chapterId": "ch02"}, {"term": "行内公式", "def": "与文字同行的公式，用 $...$ 包裹", "chapterId": "ch03"}, {"term": "行间公式", "def": "单独成行的公式，用 \\[...\\] 或 equation 环境", "chapterId": "ch03"}, {"term": "align 环境", "def": "多行公式按 & 对齐、逐行编号的环境", "chapterId": "ch03"}, {"term": "cases 环境", "def": "排分段函数的左大括号结构", "chapterId": "ch03"}, {"term": "浮动体", "def": "figure 与 table 这类由 LaTeX 自动安排位置的对象", "chapterId": "ch04"}, {"term": "三线表", "def": "只有顶线、表头线、底线的表格，booktabs 提供", "chapterId": "ch04"}, {"term": "tabularx", "def": "支持自动换行列宽的表格式宏包", "chapterId": "ch04"}, {"term": "子图", "def": "一张图内并排多个小图，用 subcaption 实现", "chapterId": "ch04"}, {"term": "交叉引用", "def": "用 label 与 ref 自动维护编号的机制", "chapterId": "ch05"}, {"term": "BibTeX", "def": "读 bib 数据库生成文献列表的工具", "chapterId": "ch05"}, {"term": "gbt7714", "def": "符合国标 GB/T 7714 的参考文献样式宏包", "chapterId": "ch05"}, {"term": "listings", "def": "排代码的宏包，支持行号与语法高亮", "chapterId": "ch06"}, {"term": "导言区", "def": "begin document 之前的配置区，放宏包与全局参数", "chapterId": "ch06"}], "quizzes": [{"id": "ch01-q0101", "chapterId": "ch01", "type": "single", "question": "编译中文文档应使用哪个引擎？", "options": ["pdflatex", "xelatex", "latex", "bibtex"], "answer": 1, "explain": "xelatex 原生支持 UTF-8 与系统字体，配合 ctex 文档类处理中文最稳。"}, {"id": "ch01-q0102", "chapterId": "ch01", "type": "single", "question": "目录为空最可能的原因是？", "options": ["没有写 \\tableofcontents", "只编译了一遍，aux 未生成", "文档类不支持目录", "缺少 hyperref"], "answer": 1, "explain": "目录内容来自 aux 文件，需要至少两遍编译。"}, {"id": "ch01-q0103", "chapterId": "ch01", "type": "blank", "question": "TeX Live 缺宏包时，安装命令是 `tlmgr ________ 包名`。", "options": [], "answer": "install", "explain": "tlmgr 是 TeX Live 的包管理器，install 后重启编辑器即可识别。"}, {"id": "ch02-q0201", "chapterId": "ch02", "type": "single", "question": "要让第四级标题也带编号，应设置？", "options": ["\\setcounter{tocdepth}{4}", "\\setcounter{secnumdepth}{4}", "\\linespread{1.3}", "\\pagestyle{fancy}"], "answer": 1, "explain": "secnumdepth 控制编号深度，tocdepth 只控制目录显示。"}, {"id": "ch02-q0202", "chapterId": "ch02", "type": "single", "question": "页眉重复出现两遍，最可能的原因是？", "options": ["没有 \\fancyhf{}", "没有加载 ctex", "编译次数不够", "字号设置错误"], "answer": 0, "explain": "默认页眉未清空，新设置叠加上去就会重复。"}, {"id": "ch02-q0203", "chapterId": "ch02", "type": "blank", "question": "要让「10」与「mm」不被断行分开，应写成 `10~mm`，其中 `~` 表示________空格。", "options": [], "answer": "不断行", "explain": "`~` 在 LaTeX 中是不断行空格，保证两个词始终在同一行。"}, {"id": "ch03-q0301", "chapterId": "ch03", "type": "single", "question": "需要多行对齐并统一编号，应使用？", "options": ["equation", "align", "\\[ \\]", "cases"], "answer": 1, "explain": "align 提供对齐点与逐行编号，equation 只适合单行公式。"}, {"id": "ch03-q0302", "chapterId": "ch03", "type": "single", "question": "文本中写「准确率 95%」正确的是？", "options": ["95%", "95\\%", "95$\\%$", "95 percent"], "answer": 1, "explain": "% 是注释符，必须转义为 \\%。"}, {"id": "ch03-q0303", "chapterId": "ch03", "type": "blank", "question": "分段函数用________环境，矩阵用 pmatrix 或 bmatrix。", "options": [], "answer": "cases", "explain": "cases 左侧一个大括号、右侧两列条件，是标准写法。"}, {"id": "ch04-q0401", "chapterId": "ch04", "type": "single", "question": "图注要显示在图下方，`\\caption` 应放在？", "options": ["`\\includegraphics` 之前", "`\\includegraphics` 之后", "`\\label` 之前", "figure 环境之外"], "answer": 1, "explain": "caption 的位置决定图注上下，放后面才在图下。"}, {"id": "ch04-q0402", "chapterId": "ch04", "type": "single", "question": "三线表需要加载哪个宏包？", "options": ["graphicx", "booktabs", "hyperref", "listings"], "answer": 1, "explain": "booktabs 提供 \\toprule、\\midrule、\\bottomrule。"}, {"id": "ch04-q0403", "chapterId": "ch04", "type": "blank", "question": "让图片按正文宽度八成显示，应写 `width=________\\linewidth`。", "options": [], "answer": "0.8", "explain": "用相对宽度而不是绝对厘米，换版式时不用逐张改。"}, {"id": "ch05-q0501", "chapterId": "ch05", "type": "single", "question": "`\\ref{fig:risk}` 输出的是什么？", "options": ["图的文件名", "图的编号", "图的标题", "图的页码"], "answer": 1, "explain": "ref 输出编号，页码用 pageref，标题不会被引用。"}, {"id": "ch05-q0502", "chapterId": "ch05", "type": "single", "question": "文献列表显示 `[?]`，最先检查？", "options": ["图片路径", "是否跑了 bibtex、cite key 是否匹配", "字号设置", "页边距"], "answer": 1, "explain": "`[?]` 表示引用键找不到对应条目，先查编译链与 key。"}, {"id": "ch05-q0503", "chapterId": "ch05", "type": "blank", "question": "国标顺序编码制的宏包是________。", "options": [], "answer": "gbt7714", "explain": "gbt7714 提供符合 GB/T 7714 的样式，配合 BibTeX 或 biblatex 使用。"}, {"id": "ch06-q0601", "chapterId": "ch06", "type": "single", "question": "要让四级标题带编号，除设置 number 外还必须？", "options": ["改 tocdepth", "把 secnumdepth 调到 4 以上", "加载 hyperref", "用 appendix"], "answer": 1, "explain": "编号深度由 secnumdepth 控制，默认只到 3 级。"}, {"id": "ch06-q0602", "chapterId": "ch06", "type": "single", "question": "摘要页后的正文要重新从第 1 页编号，应该？", "options": ["直接 \\setcounter{page}{1}", "用 \\pagenumbering{arabic} 重置", "改 fancyhdr", "重新编译"], "answer": 1, "explain": "pagenumbering 会重置页码计数器，setcounter 只改数值不重置样式。"}, {"id": "ch06-q0603", "chapterId": "ch06", "type": "blank", "question": "代码附录应使用________环境，配合 listings 宏包。", "options": [], "answer": "lstlisting", "explain": "lstlisting 支持语法高亮、行号、自动换行，是排代码的标准环境。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "中文文档该用哪个编译引擎？", "back": "xelatex，配合 ctexart / ctexrep / ctexbook 文档类", "tags": ["编译"]}, {"id": "f02", "chapterId": "ch01", "front": "为什么目录是空的？", "back": "只编译了一遍，aux 文件还没生成目录信息，至少跑两遍", "tags": ["编译", "排错"]}, {"id": "f03", "chapterId": "ch01", "front": "TeX Live 缺宏包怎么装？", "back": "`tlmgr install 包名`", "tags": ["编译", "环境"]}, {"id": "f04", "chapterId": "ch02", "front": "控制标题编号到第几级的是哪个计数器？", "back": "secnumdepth；目录深度是 tocdepth，两者分开设", "tags": ["版式", "编号"]}, {"id": "f05", "chapterId": "ch02", "front": "页眉重复两遍的原因？", "back": "没有先 `\\fancyhf{}` 清空默认设置", "tags": ["版式", "fancyhdr"]}, {"id": "f06", "chapterId": "ch02", "front": "中文与英文之间怎么加空隙？", "back": "手写 `\\ ` 或设 `\\xeCJKsetup{CJKspace=true}`", "tags": ["版式", "中文"]}, {"id": "f07", "chapterId": "ch03", "front": "行内公式与行间公式的写法？", "back": "行内 `$...$`；行间 `\\[...\\]`；带编号 `\\begin{equation}...\\end{equation}`", "tags": ["公式"]}, {"id": "f08", "chapterId": "ch03", "front": "多行对齐带编号用哪个环境？", "back": "align；不要编号用 align*", "tags": ["公式"]}, {"id": "f09", "chapterId": "ch03", "front": "分段函数用哪个环境？", "back": "cases", "tags": ["公式"]}, {"id": "f10", "chapterId": "ch03", "front": "文本里的百分号怎么打？", "back": "`\\%`，未转义会被当注释吞掉整行", "tags": ["公式", "排错"]}, {"id": "f11", "chapterId": "ch04", "front": "图注在图下、表注在表上，caption 分别放哪？", "back": "图注放 `\\includegraphics` 之后，表注放 `\\begin{tabular}` 之前", "tags": ["图表"]}, {"id": "f12", "chapterId": "ch04", "front": "三线表用哪个宏包？", "back": "booktabs，配 \\toprule \\midrule \\bottomrule", "tags": ["图表"]}, {"id": "f13", "chapterId": "ch04", "front": "浮动体位置参数 htbp 各表示什么？", "back": "here 此处、top 页顶、bottom 页底、page 单独一页", "tags": ["图表", "浮动体"]}, {"id": "f14", "chapterId": "ch04", "front": "label 应该放在 caption 前还是后？", "back": "之后，否则引用编号会指错", "tags": ["图表", "引用"]}, {"id": "f15", "chapterId": "ch05", "front": "文献显示 [?] 怎么排查？", "back": "先查是否跑了 bibtex、cite key 是否与 bib 完全一致", "tags": ["文献"]}, {"id": "f16", "chapterId": "ch05", "front": "国标参考文献样式用哪个宏包？", "back": "gbt7714", "tags": ["文献"]}, {"id": "f17", "chapterId": "ch05", "front": "带文献的完整编译链？", "back": "xelatex → bibtex → xelatex → xelatex", "tags": ["文献", "编译"]}, {"id": "f18", "chapterId": "ch06", "front": "四级标题 6.3.2.1 需要什么设置？", "back": "secnumdepth 设为 4 以上，并给 paragraph 配 number", "tags": ["编号"]}, {"id": "f19", "chapterId": "ch06", "front": "摘要页后正文重新从第 1 页编号？", "back": "`\\pagenumbering{arabic}` 重置页码计数器", "tags": ["模板"]}, {"id": "f20", "chapterId": "ch06", "front": "代码附录用什么环境？", "back": "lstlisting，配 listings 宏包", "tags": ["模板", "代码"]}], "companion": "latex学习伴侣.html"}, "rendered": {"ch01": "<h1>第 1 章：环境与第一次编译<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：起步册第 4 章 | <strong>原书定位<\/strong>：第 1 章 p1–49\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n在本地或 Overleaf 上把一份中文文档编译成 PDF；\n<\/li><li>\n说清 xelatex、ctex、编译三遍各自解决什么问题；\n<\/li><li>\n看懂最常见的三类报错并自己修。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>LaTeX 不是排版软件，它是一套「你写源码、它排版面」的工具；第一次跑通比读十页介绍有用。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：发行版与编辑器（难度：基础）<\/h3>\n<p><strong>TeX 发行版<\/strong>：把编译器、宏包、字体打包在一起的整体。Windows 用 TeX Live 或 MiKTeX，macOS 用 MacTeX，Linux 用 TeX Live。<\/p>\n<p><strong>编辑器<\/strong>：写源码的工具，VS Code + LaTeX Workshop 最常用，TeXstudio 传统但功能全。<\/p>\n<p><strong>Overleaf<\/strong>：在线编辑器，免安装，中文支持已内置，适合比赛时多人协作——但免费版编译有时长限制。<\/p>\n<h3>概念 2：中文要考 xelatex（难度：基础）<\/h3>\n<p>老教程里的 pdflatex 加 CJK 宏包已经过时。现在中文文档的标准做法是：<\/p>\n<ul><li>\n编译器用 <code>xelatex<\/code>；\n<\/li><li>\n文档类用 <code>ctexart<\/code>（文章）、<code>ctexrep<\/code>（报告）、<code>ctexbook<\/code>（书）；\n<\/li><li>\n字体用系统字体，ctex 会自动调用。\n<\/ul>\n<h3>概念 3：最小可编译文档（难度：基础）<\/h3>\n<pre class=\"lang-latex\"><code>\\documentclass[UTF8,a4paper,12pt]{ctexart}\n\\usepackage{amsmath,amssymb}\n\\usepackage{graphicx}\n\\usepackage{geometry}\n\\geometry{margin=2.5cm}\n\n\\title{第一次编译}\n\\author{你的名字}\n\\date{\\today}\n\n\\begin{document}\n\\maketitle\n\\tableofcontents\n\n\\section{引言}\n这是一个最小的中文文档，公式：$E = mc^2$。\n\n\\end{document}<\/code><\/pre>\n<p>保存为 <code>main.tex<\/code>，命令行跑 <code>xelatex main.tex<\/code> 两到三遍，得到 <code>main.pdf<\/code>。<\/p>\n<h3>概念 4：为什么要编译两三遍（难度：进阶）<\/h3>\n<p>第一遍生成 <code>.aux<\/code> 文件记录标签与页码；第二遍读 <code>.aux<\/code> 把交叉引用和目录填进去；有参考文献时还要跑 BibTeX，再跑两遍。<\/p>\n<p>只用一遍，目录会空、引用会显示 <code>??<\/code>。这不是 bug，是机制。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[main.tex] --&gt; B[xelatex 第一遍]\n    B --&gt; C[生成 aux 记录标签]\n    C --&gt; D[xelatex 第二遍]\n    D --&gt; E[目录与引用填入]\n    E --&gt; F[main.pdf]\n    F --&gt;|有参考文献| G[bibtex 再跑两遍]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：箭头是单向的，但实际编译是循环：改一次源码，就要重跑整条链。VS Code 的 latexmk 会自动判断该跑几遍。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：LaTeX 像点菜，你写菜单，厨房按标准出菜；Word 像自己下厨，边炒边调味。失效边界：菜单写错一个字，整道菜可能出不来；Word 里改一个字最多是那一页变丑。\n<\/li><li>\n<strong>实例（可动手）<\/strong>：把上面例子里的 <code>ctexart<\/code> 改成 <code>article<\/code>，再用 xelatex 编译，中文会变成空白或方框。这说明中文支持来自文档类，不是来自编译器。改回来即可恢复。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为报错行号就是出错行——实际上 LaTeX 的报错常滞后几行，要看第一个 <code>!<\/code> 号的位置，往前找。\n<\/li><li>\n别以为缺宏包要手动装——实际上 TeX Live 缺包可用 <code>tlmgr install 包名<\/code>，Overleaf 换文档类或改用内置宏包更快。\n<\/li><li>\n别以为 PDF 出来就算成功——实际上要检查目录、引用、公式编号、图片位置四项。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】编译中文文档应使用哪个引擎？<\/h3>\n<ul><li>\nA. pdflatex\n<\/li><li>\nB. xelatex\n<\/li><li>\nC. latex\n<\/li><li>\nD. bibtex\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：xelatex 原生支持 UTF-8 与系统字体，配合 ctex 文档类处理中文最稳。<\/p>\n<\/ul>\n<h3>Q2 【单选】目录为空最可能的原因是？<\/h3>\n<ul><li>\nA. 没有写 \\tableofcontents\n<\/li><li>\nB. 只编译了一遍，aux 未生成\n<\/li><li>\nC. 文档类不支持目录\n<\/li><li>\nD. 缺少 hyperref\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：目录内容来自 aux 文件，需要至少两遍编译。<\/p>\n<\/ul>\n<h3>Q3 【填空】TeX Live 缺宏包时，安装命令是 <code>tlmgr ________ 包名<\/code>。<\/h3>\n<p><strong>答案<\/strong>：install <strong>解析<\/strong>：tlmgr 是 TeX Live 的包管理器，install 后重启编辑器即可识别。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n中文三件套：xelatex + ctex 文档类 + UTF-8。\n<\/li><li>\n编译至少两遍，有文献要加 bibtex。\n<\/li><li>\n报错看第一个 <code>!<\/code>，往前找几行。\n<\/ul>", "ch02": "<h1>第 2 章：中文文档与版式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1 章 | <strong>原书定位<\/strong>：第 2 章 p50–156\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用 geometry 改页边距，用 ctexset 改标题格式与缩进；\n<\/li><li>\n设置三级以上标题编号，并让编号出现在目录里；\n<\/li><li>\n排出一份三页以内、行距与字号都合规的中文文档。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>中文排版的所有调节都落在两处：文档类参数（管全局）和局部命令（管一处），改错了位置就是白改。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：页面与字号（难度：基础）<\/h3>\n<pre class=\"lang-latex\"><code>\\documentclass[UTF8,a4paper,zihao=-4]{ctexart}  % -4 号字，约 12pt\n\\usepackage{geometry}\n\\geometry{top=2.5cm,bottom=2.5cm,left=3cm,right=2.5cm}<\/code><\/pre>\n<p><code>zihao<\/code> 是 ctex 专有的字号参数，<code>-4<\/code> 表示小四。比赛论文常用小四正文、五号图表注。<\/p>\n<p>行距用 <code>\\linespread{1.3}<\/code> 放大到 1.3 倍。注意它必须在 <code>\\begin{document}<\/code> 之前生效。<\/p>\n<h3>概念 2：标题格式与编号深度（难度：进阶）<\/h3>\n<pre class=\"lang-latex\"><code>\\ctexset{\n  section = {format = \\Large\\bfseries\\centering},\n  subsection = {format = \\large\\bfseries},\n  subsubsection = {format = \\normalsize\\bfseries, number = \\arabic{subsubsection}}\n}\n\\setcounter{secnumdepth}{4}   % 编号到第四级\n\\setcounter{tocdepth}{3}      % 目录到第三级<\/code><\/pre>\n<p><code>secnumdepth<\/code> 决定编号到几级，<code>tocdepth<\/code> 决定目录显示到几级。两者要分开设，只设一个会出现「正文有编号、目录没有」或反过来。<\/p>\n<p>如果要求 <code>\\paragraph<\/code> 也带编号，需要 <code>\\setcounter{secnumdepth}{5}<\/code>，并给 paragraph 配 format。<\/p>\n<h3>概念 3：中英文混排（难度：基础）<\/h3>\n<ul><li>\n中文与英文之间，ctex 默认不加空格，需要手写 <code>中文\\ English<\/code> 或在导言区设 <code>\\xeCJKsetup{CJKspace=true}<\/code> 自动加空隙。\n<\/li><li>\n英文单词不要手动断行，LaTeX 自己会断。\n<\/li><li>\n数字与单位之间用不断行空格 <code>~<\/code>：<code>10~mm<\/code>，避免「10」在行末、「mm」在行首。\n<\/ul>\n<h3>概念 4：页眉页脚（难度：进阶）<\/h3>\n<pre class=\"lang-latex\"><code>\\usepackage{fancyhdr}\n\\pagestyle{fancy}\n\\fancyhf{}\n\\fancyhead[C]{数学建模论文}\n\\fancyfoot[C]{\\thepage}\n\\renewcommand{\\headrulewidth}{0.4pt}<\/code><\/pre>\n<p><code>\\fancyhf{}<\/code> 先清空默认设置，否则页眉会重复出现两遍。这是最常见的排版怪象来源。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[文档类参数] --&gt; B[字号 纸张]\n    A --&gt; C[标题格式]\n    D[局部命令] --&gt; E[某段落间距]\n    D --&gt; F[某个标题加星]\n    B --&gt; G[编译]\n    C --&gt; G\n    E --&gt; G\n    F --&gt; G\n    G --&gt; H[检查目录与页码]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边两条管全局，右边两条管局部。改全局参数会影响全文，改完必须重新检查每一页。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：文档类参数像房子的层高与墙厚，局部命令像某个房间贴的壁纸。失效边界：层高一改，所有房间的家具都要重摆，所以全局参数要一开始定好。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：A4 纸宽 21 cm，左右边距 3 cm 与 2.5 cm，正文宽 15.5 cm。小四字号约 12 pt，一行约 36 个汉字。若把左右边距都改成 2 cm，正文宽 17 cm，每行约 40 字，页数会减少约一成。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为改字号能直接改行距——实际上字号与行距是两套参数，需要分别设。\n<\/li><li>\n别以为 secnumdepth 改了目录就会跟着变——实际上目录深度由 tocdepth 控制。\n<\/li><li>\n别以为 fancyhdr 会自动清空默认页眉——实际上不清空就会出现双页眉。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】要让第四级标题也带编号，应设置？<\/h3>\n<ul><li>\nA. \\setcounter{tocdepth}{4}\n<\/li><li>\nB. \\setcounter{secnumdepth}{4}\n<\/li><li>\nC. \\linespread{1.3}\n<\/li><li>\nD. \\pagestyle{fancy}\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：secnumdepth 控制编号深度，tocdepth 只控制目录显示。<\/p>\n<\/ul>\n<h3>Q2 【单选】页眉重复出现两遍，最可能的原因是？<\/h3>\n<ul><li>\nA. 没有 \\fancyhf{}\n<\/li><li>\nB. 没有加载 ctex\n<\/li><li>\nC. 编译次数不够\n<\/li><li>\nD. 字号设置错误\n<p><strong>答案<\/strong>：A <strong>解析<\/strong>：默认页眉未清空，新设置叠加上去就会重复。<\/p>\n<\/ul>\n<h3>Q3 【填空】要让「10」与「mm」不被断行分开，应写成 <code>10~mm<\/code>，其中 <code>~<\/code> 表示________空格。<\/h3>\n<p><strong>答案<\/strong>：不断行 <strong>解析<\/strong>：<code>~<\/code> 在 LaTeX 中是不断行空格，保证两个词始终在同一行。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n全局参数在导言区定，局部调整用命令。\n<\/li><li>\n编号深度与目录深度是两个开关。\n<\/li><li>\nfancyhdr 先清空再设置。\n<\/ul>", "ch03": "<h1>第 3 章：数学公式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 2 章 | <strong>原书定位<\/strong>：第 4 章 p221–300\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n正确区分行内公式与行间公式，并按需编号；\n<\/li><li>\n用 align 排多行推导，用 cases 排分段函数，用 matrix 排矩阵；\n<\/li><li>\n修掉公式里最常见的四类报错。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>公式排版只有两个决定：放不放进独立行，给不给编号；其余都是符号命令的查表工作。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：两种模式（难度：基础）<\/h3>\n<ul><li>\n行内：<code>$E=mc^2$<\/code>，跟文字一起走，不编号。\n<\/li><li>\n行间：<code>\\[ E=mc^2 \\]<\/code>，单独成行，不编号。\n<\/li><li>\n行间带编号：<code>\\begin{equation} ... \\end{equation}<\/code>，自动编号，可用 <code>\\label<\/code> 引用。\n<\/ul>\n<p>经验规则：短式子、句中提到用行内；需要推导、需要被引用用行间带编号。<\/p>\n<h3>概念 2：多行推导（难度：进阶）<\/h3>\n<pre class=\"lang-latex\"><code>\\begin{align}\n  z &amp;= 4x_1 + 3x_2 \\label{eq:obj}\\\\\n  \\text{s.t.}\\quad &amp; 2x_1 + x_2 \\le 10 \\\\\n  &amp; x_1 + x_2 \\le 8\n\\end{align}<\/code><\/pre>\n<p><code>&amp;<\/code> 是对齐点，<code>\\\\<\/code> 换行。每个 <code>&amp;<\/code> 都要成对出现，只写一个会导致「Misplaced alignment tab」报错。<\/p>\n<p>不需要编号时用 <code>align*<\/code>。只想给某一行编号，用 <code>\\notag<\/code> 把其余行去掉编号。<\/p>\n<h3>概念 3：常见结构（难度：进阶）<\/h3>\n<p>分段函数：<\/p>\n<pre class=\"lang-latex\"><code>f(x) = \\begin{cases}\n  x^2, &amp; x \\ge 0,\\\\\n  -x,  &amp; x &lt; 0.\n\\end{cases}<\/code><\/pre>\n<p>矩阵：<\/p>\n<pre class=\"lang-latex\"><code>A = \\begin{pmatrix}\n  2 &amp; 1 \\\\\n  1 &amp; 1\n\\end{pmatrix}, \\quad\nb = \\begin{pmatrix} 10 \\\\ 8 \\end{pmatrix}<\/code><\/pre>\n<p><code>pmatrix<\/code> 用圆括号，<code>bmatrix<\/code> 用方括号，<code>vmatrix<\/code> 用竖线表示行列式。<\/p>\n<h3>概念 4：四类高频报错（难度：基础）<\/h3>\n<ol><li>\n<strong><code>&amp;<\/code> 位置错<\/strong>：在 equation 环境里用 <code>&amp;<\/code> 会报错，应该用 align。\n<\/li><li>\n<strong>下划线未转义<\/strong>：文本里的 <code>file_name<\/code> 要写成 <code>file\\_name<\/code>，公式里才用 <code>_<\/code> 表示下标。\n<\/li><li>\n<strong><code>%<\/code> 未转义<\/strong>：文本里的百分号写成 <code>\\%<\/code>，否则后面整行被当注释吞掉。\n<\/li><li>\n<strong>缺 <code>$<\/code><\/strong>：行间公式用了 <code>\\[<\/code> 却没写 <code>\\]<\/code>，后面全部内容被当成公式。\n<\/ol>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[要排的式子] --&gt; B{是否独立成行}\n    B --&gt;|否| C[行内 $...$]\n    B --&gt;|是| D{是否要编号或引用}\n    D --&gt;|否| E[方括号 或 align*]\n    D --&gt;|是| F[equation 或 align]\n    F --&gt; G[加 label 供 ref 引用]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：两个判断决定环境选择。选错环境，编号或对齐就会出问题。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：行内公式像句中的括号补充，行间公式像单独列出的算式。失效边界：太长的式子塞进行内，会把行距撑开、版面变丑，这时必须改成行间。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：把 KKT 条件排成对齐形式：\n<\/ul>\n<pre class=\"lang-latex\"><code>\\begin{align}\n  \\nabla f + \\sum_{i=1}^{m}\\lambda_i \\nabla g_i &amp;= 0,\\\\\n  \\lambda_i g_i &amp;= 0,\\\\\n  \\lambda_i &amp;\\ge 0.\n\\end{align}<\/code><\/pre>\n<p>三行共用一组编号，对齐点在等号前，这是论文里推导的标准写法。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为公式里的空格会影响排版——实际上数学模式忽略空格，间距由符号类别决定，要手动调就用 <code>\\,<\/code>、<code>\\quad<\/code>。\n<\/li><li>\n别以为 <code>\\text{}<\/code> 可以随便用——实际上它需要 amsmath，且中文要放在 <code>\\text{中文}<\/code> 里配合 ctex 才正常。\n<\/li><li>\n别以为编号会自动更新——实际上编号依赖 aux，改完要重编译两遍。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】需要多行对齐并统一编号，应使用？<\/h3>\n<ul><li>\nA. equation\n<\/li><li>\nB. align\n<\/li><li>\nC. \\[ \\]\n<\/li><li>\nD. cases\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：align 提供对齐点与逐行编号，equation 只适合单行公式。<\/p>\n<\/ul>\n<h3>Q2 【单选】文本中写「准确率 95%」正确的是？<\/h3>\n<ul><li>\nA. 95%\n<\/li><li>\nB. 95\\%\n<\/li><li>\nC. 95$\\%$\n<\/li><li>\nD. 95 percent\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：% 是注释符，必须转义为 \\%。<\/p>\n<\/ul>\n<h3>Q3 【填空】分段函数用________环境，矩阵用 pmatrix 或 bmatrix。<\/h3>\n<p><strong>答案<\/strong>：cases <strong>解析<\/strong>：cases 左侧一个大括号、右侧两列条件，是标准写法。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n行内不编号，行间按需编号，引用要配 label。\n<\/li><li>\n对齐点 <code>&amp;<\/code> 必须成对，换行用 <code>\\\\<\/code>。\n<\/li><li>\n% _ # &amp; 在文本里都要转义。\n<\/ul>", "ch04": "<h1>第 4 章：图表与浮动体<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 2 章 | <strong>原书定位<\/strong>：第 5 章插图、第 6 章表格\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n插入一张宽度合适、图注在图下的图片；\n<\/li><li>\n用 booktabs 排出规范三线表，并解决列宽溢出；\n<\/li><li>\n说清 figure 为什么「跑到下一页」，以及怎么控制。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>图表不是插进去就完事，位置、宽度、图注、正文引用四件事都要交代，缺一件评委会扣格式分。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：插图（难度：基础）<\/h3>\n<pre class=\"lang-latex\"><code>\\usepackage{graphicx}\n\\begin{figure}[htbp]\n  \\centering\n  \\includegraphics[width=0.8\\linewidth]{figs/result.png}\n  \\caption{不同风险水平下的收益曲线}\n  \\label{fig:risk}\n\\end{figure}<\/code><\/pre>\n<ul><li>\n<code>[htbp]<\/code> 是位置偏好：这里、页顶、页底、单独一页。LaTeX 会就近安排，不保证。\n<\/li><li>\n<code>width=0.8\\linewidth<\/code> 按正文宽度比例缩放，比写死厘米更稳。\n<\/li><li>\n<code>\\caption<\/code> 放 <code>\\includegraphics<\/code> 之后，图注才会在图下方。\n<\/li><li>\n<code>\\label<\/code> 放 caption 之后，否则引用会指向错误的编号。\n<\/ul>\n<h3>概念 2：浮动体为什么乱跑（难度：进阶）<\/h3>\n<p>LaTeX 把 figure 当作浮动体，按版面规则排队。图太多、太大、太靠近页底，就会被推到下一页甚至文末。<\/p>\n<p>三个应对：<\/p>\n<ol><li>\n加 <code>[htbp]<\/code> 给更多选择；\n<\/li><li>\n用 <code>\\usepackage{float}<\/code> 加 <code>[H]<\/code> 强制在此处；\n<\/li><li>\n调整图片宽度，别让一张图高过一页的 70%。\n<\/ol>\n<p><code>[H]<\/code> 的代价是可能留下大片空白，正式投稿不推荐，课设可以用。<\/p>\n<h3>概念 3：三线表（难度：基础）<\/h3>\n<pre class=\"lang-latex\"><code>\\usepackage{booktabs}\n\\begin{table}[htbp]\n  \\centering\n  \\caption{三种方案的评价结果}\n  \\label{tab:score}\n  \\begin{tabular}{lccc}\n    \\toprule\n    方案 &amp; 成本 &amp; 质量 &amp; 综合得分 \\\\\n    \\midrule\n    S1 &amp; 0.90 &amp; 0.50 &amp; 0.685 \\\\\n    S2 &amp; 0.70 &amp; 0.80 &amp; 0.685 \\\\\n    S3 &amp; 0.60 &amp; 0.90 &amp; 0.730 \\\\\n    \\bottomrule\n  \\end{tabular}\n\\end{table}<\/code><\/pre>\n<p>三线表只有顶线、表头线、底线，没有竖线。<code>lccc<\/code> 是列对齐：左对齐一列、居中三列。表格过宽时用 <code>tabularx<\/code> 的 <code>X<\/code> 列自动换行。<\/p>\n<h3>概念 4：子图（难度：进阶）<\/h3>\n<pre class=\"lang-latex\"><code>\\usepackage{subcaption}\n\\begin{figure}[htbp]\n  \\centering\n  \\begin{subfigure}{0.45\\linewidth}\n    \\includegraphics[width=\\linewidth]{a.png}\n    \\caption{去噪前}\n  \\end{subfigure}\\hfill\n  \\begin{subfigure}{0.45\\linewidth}\n    \\includegraphics[width=\\linewidth]{b.png}\n    \\caption{去噪后}\n  \\end{subfigure}\n  \\caption{均值滤波效果对比}\n\\end{figure}<\/code><\/pre>\n<p>子图编号变成 (a)、(b)，正文用 <code>\\ref{fig:...}<\/code> 引用总编号。两张图之间用 <code>\\hfill<\/code> 撑开，别用空格硬凑。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[图片文件] --&gt; B[设宽度]\n    B --&gt; C[放进 figure]\n    C --&gt; D[caption 在图下]\n    D --&gt; E[label 加引用]\n    E --&gt; F{位置不对}\n    F --&gt;|是| G[加 htbp 或 H]\n    F --&gt;|否| H[编译检查]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：顺序不能乱，label 一定要在 caption 之后，否则引用编号会错位。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：浮动体像排队的乘客，LaTeX 是调度员，它按规则安排你上哪班车，不是你说了算。失效边界：调度员可以被 <code>[H]<\/code> 强行插队，但后果是车厢留空。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：正文宽 15.5 cm，一张 3000×2000 像素的图，按 0.8 倍正文宽插入，显示宽度 12.4 cm、高度 8.27 cm。若按原尺寸插入，宽度 3000 px 直接溢出页面，这是「图跑到页面外」最常见的原因。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为写了 <code>[h]<\/code> 就一定在原位——实际上空间不够时 LaTeX 会忽略。\n<\/li><li>\n别以为表格竖线越多越清楚——实际上三线表最易读，竖线是排版陋习。\n<\/li><li>\n别以为图片放进同目录就能显示——实际上路径要相对主文件，子目录要写 <code>figs/a.png<\/code>。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】图注要显示在图下方，<code>\\caption<\/code> 应放在？<\/h3>\n<ul><li>\nA. <code>\\includegraphics<\/code> 之前\n<\/li><li>\nB. <code>\\includegraphics<\/code> 之后\n<\/li><li>\nC. <code>\\label<\/code> 之前\n<\/li><li>\nD. figure 环境之外\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：caption 的位置决定图注上下，放后面才在图下。<\/p>\n<\/ul>\n<h3>Q2 【单选】三线表需要加载哪个宏包？<\/h3>\n<ul><li>\nA. graphicx\n<\/li><li>\nB. booktabs\n<\/li><li>\nC. hyperref\n<\/li><li>\nD. listings\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：booktabs 提供 \\toprule、\\midrule、\\bottomrule。<\/p>\n<\/ul>\n<h3>Q3 【填空】让图片按正文宽度八成显示，应写 <code>width=________\\linewidth<\/code>。<\/h3>\n<p><strong>答案<\/strong>：0.8 <strong>解析<\/strong>：用相对宽度而不是绝对厘米，换版式时不用逐张改。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n图注在图下、表注在表上，label 紧跟 caption。\n<\/li><li>\n宽度用相对值，别超一页七成。\n<\/li><li>\n表格用三线表，宽了换 tabularx。\n<\/ul>", "ch05": "<h1>第 5 章：目录、交叉引用与参考文献<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 3、4 章 | <strong>原书定位<\/strong>：第 3 章 p157–219\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n让目录、图表目录、公式编号全部自动生成；\n<\/li><li>\n用 label/ref 管理交叉引用，改章节顺序不用手动改编号；\n<\/li><li>\n用 BibTeX 或 biblatex 生成符合国标的参考文献。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>自动化的意义只有一个：内容改了，编号自己跟着变；手写的编号迟早会错。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：目录与图表目录（难度：基础）<\/h3>\n<pre class=\"lang-latex\"><code>\\tableofcontents\n\\listoffigures\n\\listoftables<\/code><\/pre>\n<p>三者都读 aux 文件，所以要编译两遍。只想让某级标题进目录，用 <code>\\section*{}<\/code> 加 <code>\\addcontentsline<\/code>，或用 <code>\\setcounter{tocdepth}{2}<\/code>。<\/p>\n<h3>概念 2：交叉引用（难度：基础）<\/h3>\n<pre class=\"lang-latex\"><code>\\section{模型建立}\\label{sec:model}\n如图~\\ref{fig:risk} 所示，第~\\ref{sec:model} 节给出了目标函数。<\/code><\/pre>\n<ul><li>\n<code>\\ref<\/code> 给编号，<code>\\pageref<\/code> 给页码，<code>\\eqref<\/code> 给带括号的公式编号。\n<\/li><li>\nlabel 命名建议带前缀：<code>sec:<\/code>、<code>fig:<\/code>、<code>tab:<\/code>、<code>eq:<\/code>，方便搜索。\n<\/li><li>\n引用前加 <code>~<\/code> 防止「图」和编号被断到两行。\n<\/ul>\n<h3>概念 3：参考文献（难度：进阶）<\/h3>\n<p>传统做法用 BibTeX：<\/p>\n<pre class=\"lang-latex\"><code>\\usepackage[numbers]{gbt7714}   % 国标顺序编码制\n\\bibliographystyle{gbt7714-numerical}\n\\bibliography{refs}<\/code><\/pre>\n<p><code>refs.bib<\/code> 里每条记录：<\/p>\n<pre class=\"lang-bibtex\"><code>@article{si2020,\n  author  = {司守奎 and 孙玺菁},\n  title   = {数学建模算法与应用},\n  journal = {国防工业出版社},\n  year    = {2020},\n  pages   = {1--17}\n}<\/code><\/pre>\n<p>正文用 <code>\\cite{si2020}<\/code> 引用，编译链变成：xelatex → bibtex → xelatex → xelatex。<\/p>\n<p>用 biblatex 的话加载 <code>\\usepackage[backend=biber,style=numeric]{biblatex}<\/code>，编译用 biber。<\/p>\n<h3>概念 4：引用不出现的排查（难度：进阶）<\/h3>\n<p>按顺序查四件事：<\/p>\n<ol><li>\n<code>.bib<\/code> 文件路径对不对；\n<\/li><li>\n<code>\\cite<\/code> 的 key 与 bib 里是否完全一致（大小写敏感）；\n<\/li><li>\n有没有跑 bibtex（只跑 xelatex 不会生成文献列表）；\n<\/li><li>\n<code>.bbl<\/code> 文件是否生成，报错日志里搜 <code>I couldn&#x27;t open database<\/code>。\n<\/ol>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[xelatex] --&gt; B[aux 记录引用键]\n    B --&gt; C[bibtex 读 bib 生成 bbl]\n    C --&gt; D[xelatex 读 bbl]\n    D --&gt; E[xelatex 定页码]\n    E --&gt; F[PDF 带文献]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：四步是一条链，少一步文献就显示 <code>[?]<\/code>。latexmk 会自动跑完整条链，所以推荐用它。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：交叉引用像 Excel 的单元格引用，改一处全表更新；手写编号像手抄公式，改一次要抄十处。失效边界：Excel 引用错了会报 <code>#REF!<\/code>，LaTeX 引用错了只显示 <code>??<\/code>，不一定会提醒你。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：论文有 6 章、18 图、9 表，手写编号在插入一章后需要改 30 多处；用 label/ref 只需重编译两遍。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 <code>\\ref<\/code> 会自动带「图」字——实际上只输出编号，前缀要自己写。\n<\/li><li>\n别以为 bib 里的条目顺序影响输出——实际上顺序由样式决定，与文件顺序无关。\n<\/li><li>\n别以为中文文献不用管格式——实际上国标要求作者、题名、文献类型标识齐全，gbt7714 样式帮你补齐。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】<code>\\ref{fig:risk}<\/code> 输出的是什么？<\/h3>\n<ul><li>\nA. 图的文件名\n<\/li><li>\nB. 图的编号\n<\/li><li>\nC. 图的标题\n<\/li><li>\nD. 图的页码\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：ref 输出编号，页码用 pageref，标题不会被引用。<\/p>\n<\/ul>\n<h3>Q2 【单选】文献列表显示 <code>[?]<\/code>，最先检查？<\/h3>\n<ul><li>\nA. 图片路径\n<\/li><li>\nB. 是否跑了 bibtex、cite key 是否匹配\n<\/li><li>\nC. 字号设置\n<\/li><li>\nD. 页边距\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：<code>[?]<\/code> 表示引用键找不到对应条目，先查编译链与 key。<\/p>\n<\/ul>\n<h3>Q3 【填空】国标顺序编码制的宏包是________。<\/h3>\n<p><strong>答案<\/strong>：gbt7714 <strong>解析<\/strong>：gbt7714 提供符合 GB/T 7714 的样式，配合 BibTeX 或 biblatex 使用。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n目录、图表目录都靠 aux，编译至少两遍。\n<\/li><li>\nlabel 带前缀，ref 前加 <code>~<\/code>。\n<\/li><li>\n文献链：xelatex → bibtex → xelatex → xelatex。\n<\/ul>", "ch06": "<h1>第 6 章：数模论文模板实战<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1–5 章 | <strong>原书定位<\/strong>：综合第 2–6 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用一份导言区搭出可直接写正文的论文骨架；\n<\/li><li>\n排出三层以上、编号连续的标题体系，并把「：」后的分论点也编号；\n<\/li><li>\n用 listings 排代码附录，交卷前按清单查出格式硬伤。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>模板的价值不在好看，在于它把「格式」这件事一次性定死，让你后面只操心内容。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：可直接复制的导言区（难度：基础）<\/h3>\n<pre class=\"lang-latex\"><code>\\documentclass[UTF8,a4paper,zihao=-4]{ctexart}\n\\usepackage{amsmath,amssymb,amsthm}\n\\usepackage{graphicx,booktabs,tabularx}\n\\usepackage{geometry}\n\\geometry{top=2.5cm,bottom=2.5cm,left=3cm,right=2.5cm}\n\\usepackage{fancyhdr}\n\\usepackage{caption}\n\\captionsetup{font=small,labelsep=quad}\n\\usepackage[numbers]{gbt7714}\n\\usepackage{listings}\n\\usepackage[hidelinks]{hyperref}\n\n\\linespread{1.3}\n\\setcounter{secnumdepth}{4}\n\\setcounter{tocdepth}{3}\n\n\\pagestyle{fancy}\n\\fancyhf{}\n\\fancyhead[C]{2026 年全国大学生数学建模竞赛}\n\\fancyfoot[C]{\\thepage}\n\\renewcommand{\\headrulewidth}{0.4pt}\n\n\\newtheorem{definition}{定义}[section]\n\\newtheorem{theorem}{定理}[section]\n\n\\lstset{\n  basicstyle=\\ttfamily\\small,\n  numbers=left,\n  numberstyle=\\tiny,\n  frame=single,\n  breaklines=true,\n  showstringspaces=false\n}<\/code><\/pre>\n<p>这段直接贴到新建的 <code>main.tex<\/code> 里，下面接 <code>\\begin{document}<\/code> 就能写。<\/p>\n<h3>概念 2：标题编号体系（难度：进阶）<\/h3>\n<p>竞赛论文常见要求：一级标题用「一、二、三」，二级用「3.1」，三级用「3.1.2」，四级用「6.3.2.1」。<\/p>\n<pre class=\"lang-latex\"><code>\\ctexset{\n  section = {\n    name = {,、},\n    number = \\chinese{section},\n    format = \\Large\\bfseries\n  },\n  subsection = {number = \\arabic{section}.\\arabic{subsection}},\n  subsubsection = {number = \\arabic{section}.\\arabic{subsection}.\\arabic{subsubsection}}\n}<\/code><\/pre>\n<p>要更深的层级（如 6.3.2.1），必须把 <code>secnumdepth<\/code> 设为 4 或 5，否则 <code>\\paragraph<\/code> 只有标题没有编号。<\/p>\n<p>正文里「：」后面跟的分论点也要编号时，别用无序列表，直接排成带编号的段落：<\/p>\n<pre class=\"lang-latex\"><code>\\noindent （1）模型假设：\\\\\n\\indent （1.1）原材料价格在三个月内不变；\\\\\n\\indent （1.2）机器每天最多运行 8 小时。<\/code><\/pre>\n<p>或者定义一个计数器命令，避免手写编号错乱：<\/p>\n<pre class=\"lang-latex\"><code>\\newcounter{subpoint}[subsection]\n\\newcommand{\\pt}[1]{\\stepcounter{subpoint}\\noindent（\\thesubsection.\\thesubpoint）~#1\\par}<\/code><\/pre>\n<h3>概念 3：摘要页（难度：基础）<\/h3>\n<pre class=\"lang-latex\"><code>\\begin{center}\n  {\\LARGE\\bfseries 基于线性规划与灵敏度分析的机床生产优化}\\\\[6pt]\n  {\\large 摘\\quad 要}\n\\end{center}\n\\vspace{6pt}\n本文针对……建立……模型，求得最优方案为……，日利润 2.6 万元。\n第三问用 Monte Carlo 模拟 10 万次，得期望利润 2.41 万元，90\\% 置信区间 [2.05, 2.77]。\n\\vspace{6pt}\\par\\noindent\\textbf{关键词：}线性规划；灵敏度分析；Monte Carlo\n\\newpage<\/code><\/pre>\n<p>摘要独立一页，不编页码或用罗马数字，正文从第一页重新编号。<\/p>\n<h3>概念 4：代码附录（难度：基础）<\/h3>\n<pre class=\"lang-latex\"><code>\\appendix\n\\section{程序代码}\n\\begin{lstlisting}[language=Python]\nimport numpy as np\nfrom scipy.optimize import linprog\nres = linprog([-4, -3], A_ub=[[2, 1], [1, 1], [0, 1]],\n              b_ub=[10, 8, 7], bounds=[(0, None), (0, None)],\n              method=&quot;highs&quot;)\nprint(res.x, -res.fun)\n\\end{lstlisting}<\/code><\/pre>\n<p>中文注释在 listings 里可能乱码，需要设 <code>extendedchars=true<\/code> 或改用 <code>\\lstinputlisting<\/code> 读外部文件。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[导言区定格式] --&gt; B[标题与摘要页]\n    B --&gt; C[正文分章]\n    C --&gt; D[公式图表编号]\n    D --&gt; E[交叉引用与文献]\n    E --&gt; F[代码附录]\n    F --&gt; G[编译三遍]\n    G --&gt; H[提交前清单]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：格式在第一步定死，后面每一步都依赖它。中途改导言区，整篇的编号与分页都要重查。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：模板像盖房子的图纸，先定层高与承重，后面砌墙才有依据。失效边界：图纸能改，但改完要重新验收；模板改字号，全文页数会变，摘要可能挤到第二页。\n<\/li><li>\n<strong>实例（可核算）<\/strong>：正文小四、1.3 倍行距，A4 纸每页约 32 行、每行 36 字，一页约 1150 字。20 页正文约 2.3 万字，加图表与公式实际约 1.8 万字。字数估算能帮你判断内容够不够。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为套模板就能拿格式分——实际上模板只保证不扣分，图表规范、编号连续仍要自己查。\n<\/li><li>\n别以为改字号只影响美观——实际上它改变每页容量，进而影响页数与摘要位置。\n<\/li><li>\n别以为代码附录可以随便截——实际上变量名要与正文一致，否则评委会怀疑结果来源。\n<\/ul>\n<h2>自测题（答案与解析）<\/h2>\n<h3>Q1 【单选】要让四级标题带编号，除设置 number 外还必须？<\/h3>\n<ul><li>\nA. 改 tocdepth\n<\/li><li>\nB. 把 secnumdepth 调到 4 以上\n<\/li><li>\nC. 加载 hyperref\n<\/li><li>\nD. 用 appendix\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：编号深度由 secnumdepth 控制，默认只到 3 级。<\/p>\n<\/ul>\n<h3>Q2 【单选】摘要页后的正文要重新从第 1 页编号，应该？<\/h3>\n<ul><li>\nA. 直接 \\setcounter{page}{1}\n<\/li><li>\nB. 用 \\pagenumbering{arabic} 重置\n<\/li><li>\nC. 改 fancyhdr\n<\/li><li>\nD. 重新编译\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：pagenumbering 会重置页码计数器，setcounter 只改数值不重置样式。<\/p>\n<\/ul>\n<h3>Q3 【填空】代码附录应使用________环境，配合 listings 宏包。<\/h3>\n<p><strong>答案<\/strong>：lstlisting <strong>解析<\/strong>：lstlisting 支持语法高亮、行号、自动换行，是排代码的标准环境。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n导言区一次性定死字号、边距、编号深度。\n<\/li><li>\n「一、」与「3.1.2」混排靠 ctexset 的 number 参数。\n<\/li><li>\n交卷前查：编号连续、图表有注、文献不缺、PDF 无溢出。\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：跑通第一份 PDF<\/strong><br>阅读：<a href=\"#/book/latex/chapter/ch01\">第 1 章：环境与第一次编译<\/a><br>检查点：xelatex 编译成功，中文不乱码<\/li><li class='path-step' id='path-02'><strong>步骤 02：排中文版式<\/strong><br>阅读：<a href=\"#/book/latex/chapter/ch02\">第 2 章：中文文档与版式<\/a><br>检查点：字号、边距、页眉三项都改过一次<\/li><li class='path-step' id='path-03'><strong>步骤 03：写公式<\/strong><br>阅读：<a href=\"#/book/latex/chapter/ch03\">第 3 章：数学公式<\/a><br>检查点：能用 align 与 cases 各排一段<\/li><li class='path-step' id='path-04'><strong>步骤 04：放图表<\/strong><br>阅读：<a href=\"#/book/latex/chapter/ch04\">第 4 章：图表与浮动体<\/a><br>检查点：三线表与子图都能正确显示图注<\/li><li class='path-step' id='path-05'><strong>步骤 05：做引用与文献<\/strong><br>阅读：<a href=\"#/book/latex/chapter/ch05\">第 5 章：目录、交叉引用与参考文献<\/a><br>检查点：文献编号出现，无 [?]<\/li><li class='path-step' id='path-06'><strong>步骤 06：套论文模板<\/strong><br>阅读：<a href=\"#/book/latex/chapter/ch06\">第 6 章：数模论文模板实战<\/a><br>检查点：四级编号 1.1.1.1 正确，摘要独立成页<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：环境与第一次编译<\/h2><div class='quiz-item' data-qid='ch01-q0101' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 编译中文文档应使用哪个引擎？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q0101' value='0'> pdflatex<\/label><label class='quiz-opt'><input type='radio' name='ch01-q0101' value='1'> xelatex<\/label><label class='quiz-opt'><input type='radio' name='ch01-q0101' value='2'> latex<\/label><label class='quiz-opt'><input type='radio' name='ch01-q0101' value='3'> bibtex<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class=
