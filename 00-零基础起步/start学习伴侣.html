.<\/b> 求解器返回 <code>status=2<\/code>，含义是问题________。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：论文的骨架<\/h1><div class='quiz-item' data-qid='q0401' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 摘要里最不该出现的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0401' value='0'> 具体的最优方案数值<\/label><label class='quiz-opt'><input type='radio' name='q0401' value='1'> 所用模型名称<\/label><label class='quiz-opt'><input type='radio' name='q0401' value='2'> 「本文运用先进算法取得良好效果」<\/label><label class='quiz-opt'><input type='radio' name='q0401' value='3'> 关键误差指标<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0402' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 灵敏度分析的目的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0402' value='0'> 让论文看起来更复杂<\/label><label class='quiz-opt'><input type='radio' name='q0402' value='1'> 检验结论对参数扰动的稳健性<\/label><label class='quiz-opt'><input type='radio' name='q0402' value='2'> 提高模型的拟合精度<\/label><label class='quiz-opt'><input type='radio' name='q0402' value='3'> 减少计算量<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0403' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 论文中图题应放在图的________方，表题应放在表的________方。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch05__": "<h1>测验：第 5 章：72 小时作战流程<\/h1><div class='quiz-item' data-qid='q0501' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 时间不够时，最先应该砍掉的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0501' value='0'> 摘要<\/label><label class='quiz-opt'><input type='radio' name='q0501' value='1'> 第三问的精细度<\/label><label class='quiz-opt'><input type='radio' name='q0501' value='2'> 模型检验<\/label><label class='quiz-opt'><input type='radio' name='q0501' value='3'> 图表编号<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0502' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 三人分工中，对模型有最终解释权的应该是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q0502' value='0'> 编程手<\/label><label class='quiz-opt'><input type='radio' name='q0502' value='1'> 写作手<\/label><label class='quiz-opt'><input type='radio' name='q0502' value='2'> 建模手<\/label><label class='quiz-opt'><input type='radio' name='q0502' value='3'> 谁有空谁定<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q0503' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 交卷前必须核对：摘要里的每个数字都要能在________找到出处。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='数学模型'>数学模型 — 用数学符号描述现实对象的一部分关系，是简化过的地图 <span class=glossary-ref>（第 1 章：数学建模到底在做什么）<\/span><\/li><li data-term='决策变量'>决策变量 — 建模者能拍板的量，用字母表示 <span class=glossary-ref>（第 1 章：数学建模到底在做什么）<\/span><\/li><li data-term='目标函数'>目标函数 — 把想要的结果写成决策变量的表达式 <span class=glossary-ref>（第 1 章：数学建模到底在做什么）<\/span><\/li><li data-term='约束条件'>约束条件 — 决策变量必须满足的等式或不等式边界 <span class=glossary-ref>（第 1 章：数学建模到底在做什么）<\/span><\/li><li data-term='假设'>假设 — 明确写下被忽略的因素，决定模型适用范围 <span class=glossary-ref>（第 1 章：数学建模到底在做什么）<\/span><\/li><li data-term='灵敏度分析'>灵敏度分析 — 改变参数看结论变化幅度，判断模型是否脆弱 <span class=glossary-ref>（第 4 章：论文的骨架）<\/span><\/li><li data-term='导数'>导数 — 函数在某点的瞬时变化率，位移求导得速度 <span class=glossary-ref>（第 2 章：够用的数学预备）<\/span><\/li><li data-term='定积分'>定积分 — 把连续变化累加成总量的运算，与导数互逆 <span class=glossary-ref>（第 2 章：够用的数学预备）<\/span><\/li><li data-term='最小二乘'>最小二乘 — 方程多于未知数时，求误差平方和最小的解 <span class=glossary-ref>（第 2 章：够用的数学预备）<\/span><\/li><li data-term='特征值'>特征值 — 矩阵作用于某向量时只把它按比例拉伸的倍数 <span class=glossary-ref>（第 2 章：够用的数学预备）<\/span><\/li><li data-term='期望'>期望 — 随机变量按概率加权的平均值 <span class=glossary-ref>（第 2 章：够用的数学预备）<\/span><\/li><li data-term='方差'>方差 — 随机变量偏离期望的平均平方距离 <span class=glossary-ref>（第 2 章：够用的数学预备）<\/span><\/li><li data-term='总体与样本'>总体与样本 — 想研究的全部对象与实际拿到的部分，推断永远带误差 <span class=glossary-ref>（第 2 章：够用的数学预备）<\/span><\/li><li data-term='求解器'>求解器 — 把模型按矩阵格式喂进去、直接返回数值解的软件函数 <span class=glossary-ref>（第 3 章：计算工具与求解器）<\/span><\/li><li data-term='不可行'>不可行 — 求解器 status=2，约束互相矛盾，无解 <span class=glossary-ref>（第 3 章：计算工具与求解器）<\/span><\/li><li data-term='无界'>无界 — 求解器 status=3，目标值可以无限优化下去，通常是漏了上界约束 <span class=glossary-ref>（第 3 章：计算工具与求解器）<\/span><\/li><li data-term='摘要四段式'>摘要四段式 — 任务、方法、数字结果、结论与推广 <span class=glossary-ref>（第 4 章：论文的骨架）<\/span><\/li><li data-term='符号说明'>符号说明 — 覆盖全文符号的表，缺一行就会让推导失去可信度 <span class=glossary-ref>（第 4 章：论文的骨架）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：三要素拆题<\/h2>\n<p>拿到任何一题，先问三句：要拍板的是什么，用字母写下来；想要的结果是什么，写成表达式；不能越过什么边界，写成不等式。三句答不全，说明题目还没读懂。<\/p>\n<h2>框架：五步回路<\/h2>\n<p>问题、假设、模型、求解、检验。检验不通过就退回假设，不要在原模型上硬调参数。参数是果，假设是因。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n题目里出现「最多」「最少」「最优」→ 先想规划模型，第 01 册第 1–3 章。\n<\/li><li>\n出现「预测」「趋势」→ 先想时间序列或微分方程，第 15 章。\n<\/li><li>\n出现「评价」「排序」「哪个更好」→ 先想综合评价，第 14 章。\n<\/li><li>\n出现「要自己找数据」→ 先评估两小时内能否找到，找不到就换题。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>把假设写成免责声明<\/strong>：「假设数据真实可靠」这种假设不提供任何信息，也不约束模型范围。换成「假设用户需求在预测期内不出现突变」。\n<\/li><li>\n<strong>先跑代码再想模型<\/strong>：程序能出数不代表数有意义。先手算一个小例子，再让程序算大例子。\n<\/li><li>\n<strong>灵敏度分析写成自我表扬<\/strong>：只写「模型稳健」不给扰动范围与结论变化，等于没写。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>流程<\/h2>\n<table><thead><tr><th>场景<\/th><th>动作<\/th><\/tr><\/thead><tbody><tr><td>刚拿到题<\/td><td>三要素各写一句，写不出就重读题<\/td><\/tr><tr><td>模型跑出怪结果<\/td><td>查量纲、量级、极端值<\/td><\/tr><tr><td>时间不够<\/td><td>砍第三问精细度，保摘要与检验<\/td><\/tr><tr><td>交卷前<\/td><td>摘要数字对正文、符号表全覆盖、PDF 无乱码<\/td><\/tr><\/tbody><\/table>\n<h2>常用命令<\/h2>\n<table><thead><tr><th>目的<\/th><th>命令<\/th><\/tr><\/thead><tbody><tr><td>装建模库<\/td><td><code>pip install numpy scipy pandas matplotlib scikit-learn openpyxl<\/code><\/td><\/tr><tr><td>线性规划<\/td><td><code>linprog(c, A_ub=A, b_ub=b, bounds=..., method=&quot;highs&quot;)<\/code><\/td><\/tr><tr><td>读 Excel<\/td><td><code>pd.read_excel(&quot;data.xlsx&quot;)<\/code><\/td><\/tr><tr><td>画折线<\/td><td><code>plt.plot(x, y); plt.xlabel(&quot;月份&quot;); plt.ylabel(&quot;销量/件&quot;)<\/code><\/td><\/tr><tr><td>保存图<\/td><td><code>plt.savefig(&quot;fig1.png&quot;, dpi=300, bbox_inches=&quot;tight&quot;)<\/code><\/td><\/tr><\/tbody><\/table>\n<h2>数字口径<\/h2>\n<table><thead><tr><th>指标<\/th><th>常见写法<\/th><\/tr><\/thead><tbody><tr><td>误差<\/td><td>MAPE 平均绝对百分比误差、RMSE 均方根误差<\/td><\/tr><tr><td>拟合优度<\/td><td>R²，越接近 1 越好，但要看变量个数<\/td><\/tr><tr><td>显著性<\/td><td>p &lt; 0.05 常作界线，必须说明原假设是什么<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function attachMermaidHint(){document.querySelectorAll('.mermaid').forEach(el=>{if(el.dataset.hinted)return;el.dataset.hinted='1';const h=document.createElement('p');h.className='mermaid-hint';h.textContent='（未能加载绘图脚本：当前显示的是图示源码，联网后刷新即为图形）';el.after(h);});}
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  if(window.__mmFailed){attachMermaidHint();return;}
  const doRender=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      if(el.dataset.rendered) return;
      const code=el.dataset.src||el.textContent;
      el.dataset.src=code;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; el.dataset.rendered='1'; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  if(window.mermaid){ doRender(); return; }
  const srcs=['https://registry.npmmirror.com/mermaid/10.9.1/files/dist/mermaid.min.js',
              'https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js',
              'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js'];
  let si=0;
  const tryNext=()=>{
    if(si>=srcs.length){ window.__mmFailed=1; attachMermaidHint(); return; }
    const s=document.createElement('script');
    s.src=srcs[si++];
    s.onload=doRender;
    s.onerror=tryNext;
    document.head.appendChild(s);
  };
  tryNext();
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
